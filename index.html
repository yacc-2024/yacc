<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="apple-mobile-web-app-title" content="yacc" />
    <meta name="description" content="YACC 创作组 · 反对校园霸凌公益短片" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>yacc · YACC 创作组</title>
    <style>
      /* 开屏：React 起来之前先画个品牌画面，避免白屏和硬切 */
      #yacc-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: radial-gradient(120% 120% at 50% 0%, #232329 0%, #101014 60%);
        transition: opacity 420ms cubic-bezier(0.4, 0, 0.2, 1);
      }
      #yacc-splash.is-hiding {
        opacity: 0;
        pointer-events: none;
      }
      #yacc-splash svg {
        width: 76px;
        height: 76px;
        animation: yacc-splash-in 700ms cubic-bezier(0.22, 1, 0.36, 1) both;
      }
      @keyframes yacc-splash-in {
        from {
          opacity: 0;
          transform: translateY(10px) scale(0.88);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #yacc-splash svg {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="yacc-splash" aria-hidden="true">
      <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
        <g fill="#ffffff">
          <rect x="140" y="96" width="44" height="156"/>
          <rect x="328" y="96" width="44" height="156"/>
          <rect x="140" y="208" width="232" height="44"/>
          <rect x="234" y="252" width="44" height="160"/>
        </g>
      </svg>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
