{id:'s6-4', lesson:6, diff:3, stem:'"条条大路通罗马"与"罗马不是一天建成的"两句谚语共同体现的罗马历史信息是（ ）', opts:['罗马帝国疆域广大、历史漫长', '罗马帝国的经济发展十分落后', '罗马帝国从来没有发生过战争', '罗马帝国的文化十分单一贫乏'], ans:0, explain:'谚语折射罗马疆域广阔、统治持久、文明影响深远。', src:'教材知识点'},
{id:'b6-1', lesson:6, diff:5, stem:'罗马法"从习惯法到成文法、从公民法到万民法"的发展过程，本质上反映（ ）', opts:['皇帝个人一时的喜好取向', '罗马社会矛盾推动法律不断调整完善', '外来文化入侵', '战争胜负的偶然结果'], ans:1, explain:'平民与贵族的斗争、帝国扩张推动罗马法不断丰富完善，适应统治需要。', src:'教材知识点·能力提升'},
{id:'e6-1', lesson:6, diff:6, stem:'古罗马的《十二铜表法》、儒略历、大竞技场与"罗马法体系"，最能共同体现的罗马文明特征是（ ）', opts:['充满想象力的浪漫主义艺术风格', '注重内心体验的神秘主义倾向', '法治传统与实用主义精神', '崇尚武力和强权压迫的传统'], ans:2, explain:'罗马文明长于法律（法治）、建筑、历法等实用成就，体现务实精神。', src:'教材知识点·能力提升'},
/* ==== 第7课 法兰克王国 ==== */
{id:'t7-1', lesson:7, diff:2, stem:'法兰克王国的建立者是（ ）', opts:['查理曼', '丕平', '奥托', '克洛维'], ans:3, explain:'481年前后，克洛维建立法兰克王国。', src:'教材知识点'},
{id:'t7-2', lesson:7, diff:2, stem:'克洛维皈依基督教的主要目的是（ ）', opts:['获得教会和部下的支持以巩固统治', '对基督教信仰十分虔诚', '发展本国文化事业', '对外扩张'], ans:0, explain:'克洛维接受基督教，换取教会与高卢罗马人支持，巩固统治。', src:'教材知识点'},
{id:'t7-3', lesson:7, diff:2, stem:'西欧封建制度以土地为纽带，其基础是（ ）', opts:['庄园制', '封君封臣制', '采邑制', '行会制'], ans:1, explain:'封君封臣制以土地（封地）为纽带形成权利义务关系，是西欧封建制度的基础。', src:'教材知识点'},
{id:'t7-4', lesson:7, diff:2, stem:'封君封臣制中，封臣对封君的义务不包括（ ）', opts:['无偿服兵役', '提供金钱', '提供保护', '忠诚'], ans:2, explain:'封臣义务是忠诚、服兵役、提供金钱；提供保护是封君的义务。', src:'教材知识点'},
{id:'t7-5', lesson:7, diff:2, stem:'"我的附庸的附庸，不是我的附庸"反映的西欧封建等级特点是（ ）', opts:['封建等级之下人人享有平等地位', '王权强大的中央集权体制', '国王权力至高无上的体制', '层层分封、等级严格'], ans:3, explain:'西欧封建等级层层分封，每个封主只对其直接封臣有支配权。', src:'教材知识点'},
{id:'t7-6', lesson:7, diff:2, stem:'查理曼帝国建立者查理大帝，其加冕于（ ）', opts:['800年', '843年', '751年', '962年'], ans:0, explain:'800年，教皇为查理加冕，称"罗马人的皇帝"，史称查理曼帝国。', src:'教材知识点'},
{id:'t7-7', lesson:7, diff:2, stem:'查理曼帝国分裂的时间与条约是（ ）', opts:['800年加冕', '843年《凡尔登条约》', '751年丕平献土', '962年奥托加冕'], ans:1, explain:'843年查理曼帝国一分为三，即后来法兰西、德意志、意大利雏形。', src:'教材知识点'},
{id:'t7-8', lesson:7, diff:2, stem:'"丕平献土"是教皇国建立的关键事件，其内容是（ ）', opts:['丕平向教会缴纳大量赋税', '教皇将土地献给丕平', '丕平把意大利中部土地献给教皇', '查理曼分裂法兰克国土'], ans:2, explain:'751年丕平把征服的意大利中部地区献给教皇，教皇国由此奠定基础。', src:'教材知识点'},
{id:'t7-9', lesson:7, diff:2, stem:'法兰克王国实行封君封臣制的根本原因是（ ）', opts:['法兰克王国商品经济发达，迫切需要建立统一的国内大市场', '法兰克王国民主传统深厚，各阶层共同参与国家管理', '宗教改革运动的推动，使教会主导了国家制度建设', '社会动荡、王权衰弱，需以土地为纽带建立依附关系'], ans:3, explain:'西罗马灭亡后西欧长期动荡，为生存以土地换取军事保护，形成封君封臣制。', src:'教材知识点'},
{id:'t7-10', lesson:7, diff:2, stem:'教皇为查理加冕一事说明当时（ ）', opts:['教会与王权相互利用', '教会已统一欧洲', '王权完全服从教会', '查理信奉多神教'], ans:0, explain:'教皇借查理获得保护，查理借教皇强化合法性，二者相互利用。', src:'教材知识点'},
{id:'t7-11', lesson:7, diff:2, stem:'查理大帝鼓励基督教发展，其"虔诚者"之名说明（ ）', opts:['查理信奉伊斯兰教', '教会地位重要', '查理反对教会', '查理推行民主'], ans:1, explain:'查理大力扶持基督教，说明教会势力在西欧社会地位重要。', src:'教材知识点'},
{id:'t7-12', lesson:7, diff:2, stem:'西欧封建社会"骑士精神"强调忠诚、勇敢，其形成的制度背景是（ ）', opts:['庄园制度', '行会制度', '封君封臣制度', '教会制度'], ans:2, explain:'骑士作为封臣，其忠诚勇敢观念源于封君封臣制的契约义务。', src:'教材知识点'},
{id:'t7-13', lesson:7, diff:2, stem:'法兰克王国后期，王权衰弱的表现是（ ）', opts:['法兰克的中央集权不断强化', '法兰克的民主政治制度确立', '教会势力逐渐走向衰落不振', '地方贵族势力坐大、王国分裂'], ans:3, explain:'查理曼帝国分裂后西欧分裂割据，王权衰弱。', src:'教材知识点'},
{id:'t7-14', lesson:7, diff:2, stem:'西欧封建制度下，土地所有权与使用权的关系是（ ）', opts:['层层分封，使用权层层转让', '土地由全国民众平均分配使用', '土地可以在市场上自由买卖', '全国土地一律收归国家所有'], ans:0, explain:'封主把土地作为封地分封，封臣再分封，形成层层土地关系。', src:'教材知识点'},
{id:'t7-15', lesson:7, diff:2, stem:'法兰克王国与罗马教会的关系实质是（ ）', opts:['完全对立', '相互利用、互相支持', '王国消灭教会', '教会控制一切'], ans:1, explain:'王国借教会神化王权，教会借王国获得保护与土地，互相支持。', src:'教材知识点'},
{id:'t7-16', lesson:7, diff:2, stem:'下列事件按时间先后排序正确的是（ ）', opts:['克洛维建法兰克—查理曼加冕—丕平献土成教皇国', '丕平献土—克洛维建法兰克—查理曼加冕称帝', '克洛维建法兰克—丕平献土—查理曼加冕—凡尔登条约', '凡尔登条约—克洛维建法兰克—查理曼加冕称帝'], ans:2, explain:'顺序：481克洛维建国→751丕平献土→800查理加冕→843凡尔登分裂。', src:'教材知识点'},
{id:'s7-1', lesson:7, diff:3, stem:'有学者认为法兰克王国"用土地换忠诚，用忠诚换秩序"，这反映了（ ）', opts:['教会控制一切', '民主政治制度全面确立', '民主政治确立', '封君封臣制以土地为纽带维系封建秩序'], ans:3, explain:'封君封臣制以土地换取军事忠诚，形成等级秩序。', src:'教材知识点'},
{id:'s7-2', lesson:7, diff:3, stem:'查理大帝时期推动"加洛林文艺复兴"，其影响是（ ）', opts:['保存和传播了古典文化，促进教育发展', '导致帝国迅速走向灭亡瓦解', '确立了民主制', '推动了伊斯兰教的广泛传播'], ans:0, explain:'查理鼓励学术，教士抄录古典文献，保存了文化火种。', src:'教材知识点'},
{id:'s7-3', lesson:7, diff:3, stem:'西欧封君封臣制与中国的分封制相比，二者的共同点是（ ）', opts:['都实行广泛而直接的民主政治', '以血缘或土地为纽带形成等级关系', '都实行高度中央集权制度', '都实行世袭王权制度'], ans:1, explain:'两者都以（土地）为纽带形成层层等级隶属关系。', src:'教材知识点'},
{id:'s7-4', lesson:7, diff:3, stem:'克洛维皈依基督教与查理曼接受加冕，二者共同体现（ ）', opts:['教会始终反对王权的扩张', '西欧普遍推行宗教信仰自由', '王权与教权结合巩固统治', '西欧实现政治上的统一'], ans:2, explain:'法兰克君主借教会神化王权，教会借王权扩张势力，政教结合。', src:'教材知识点'},
{id:'b7-1', lesson:7, diff:5, stem:'"封建"一词在西欧语境中指"以土地为纽带的封君封臣关系"，与中国的"封建社会"含义不同。这种差异说明（ ）', opts:['西方制度更先进', '中国没有封建', '史学没有标准', '历史概念须结合具体时空理解'], ans:3, explain:'同一概念在不同文明语境含义不同，研究历史须具体问题具体分析。', src:'教材知识点·能力提升'},
{id:'e7-1', lesson:7, diff:6, stem:'西欧封建等级制度"我的附庸的附庸，不是我的附庸"，从根本上反映了（ ）', opts:['王权衰弱、地方割据，封建关系层层隶属而非全国统一', '西欧实行民主分权，各等级共同分享国家的政治权力', '西欧教会权威至上，教权完全凌驾于王权之上', '西欧经济繁荣，国家统一与中央集权不断巩固'], ans:0, explain:'该谚语揭示西欧封建关系只存于直接封君封臣间，王权难以直达底层，导致割据。', src:'教材知识点·能力提升'},
/* ==== 第8课 西欧庄园 ==== */
{id:'t8-1', lesson:8, diff:2, stem:'西欧庄园是中世纪西欧农业社会的基本单位，其经济特点是（ ）', opts:['商品交换频繁', '自给自足', '雇佣劳动', '对外贸易发达'], ans:1, explain:'庄园一切生活所需基本自给，很少对外交换，是自给自足的经济单位。', src:'教材知识点'},
{id:'t8-2', lesson:8, diff:2, stem:'西欧庄园的土地分为（ ）', opts:['国有地和私有地', '耕地和牧场', '自营地和份地', '领主地和教会地'], ans:2, explain:'庄园土地分两部分：领主直接经营的自营地与农民使用的份地。', src:'教材知识点'},
{id:'t8-3', lesson:8, diff:2, stem:'庄园中农民向领主缴纳的沉重负担不包括（ ）', opts:['无偿耕种自营地', '缴纳捐税', '负担劳役', '自由迁徙'], ans:3, explain:'庄园农民被束缚在土地上，无迁徙自由。', src:'教材知识点'},
{id:'t8-4', lesson:8, diff:2, stem:'庄园法庭的审理依据是（ ）', opts:['习惯法和村规', '国王命令', '成文法典', '教皇谕旨'], ans:0, explain:'庄园法庭依据传统习惯法或村法审理纠纷。', src:'教材知识点'},
{id:'t8-5', lesson:8, diff:2, stem:'庄园法庭的作用是（ ）', opts:['废除整个封建制度体系', '维护庄园公共秩序、限制领主特权', '发展文化教育事业', '推行民主'], ans:1, explain:'庄园法庭既维护庄园秩序，也在一定程度上约束领主行为。', src:'教材知识点'},
{id:'t8-6', lesson:8, diff:2, stem:'庄园中的"份地"归谁使用（ ）', opts:['庄园的领主本人', '教会的神职人员', '农奴和自由农民', '往来庄园的商人'], ans:2, explain:'份地由庄园中的农奴与自由农民使用，须为领主服务役。', src:'教材知识点'},
{id:'t8-7', lesson:8, diff:2, stem:'西欧庄园中农奴与领主的关系是（ ）', opts:['平等关系', '合作关系', '雇佣关系', '人身依附关系'], ans:3, explain:'农奴人身依附于领主，承担劳役与捐税。', src:'教材知识点'},
{id:'t8-8', lesson:8, diff:2, stem:'庄园法庭开庭审理的时间一般为（ ）', opts:['每隔一段时间定期开庭', '庄园法庭每日开庭审理', '庄园法庭只在农忙之后开庭', '开庭时间由国王决定'], ans:0, explain:'庄园法庭一般每隔一段时间开庭一次，无固定规律。', src:'教材知识点'},
{id:'t8-9', lesson:8, diff:2, stem:'西欧庄园出现于（ ）', opts:['4世纪', '9世纪', '12世纪', '14世纪'], ans:1, explain:'9世纪起，庄园在西欧逐渐流行，成为社会基本单位。', src:'教材知识点'},
{id:'t8-10', lesson:8, diff:2, stem:'"中世纪的花朵"常被用来比喻（ ）', opts:['西欧城市', '庄园', '大学', '骑士'], ans:2, explain:'大学常被誉为"中世纪最美好的花朵"；城市被称为"中世纪的曙光"。', src:'教材知识点'},
{id:'t8-11', lesson:8, diff:2, stem:'庄园制度瓦解的主要原因是（ ）', opts:['频繁发生的自然灾害所致', '长期战争的结束所致', '教会势力的衰落所致', '商品经济发展、城市兴起'], ans:3, explain:'商品货币关系发展冲击庄园自给自足经济，城市兴起吸引农奴逃亡，庄园渐趋瓦解。', src:'教材知识点'},
{id:'t8-12', lesson:8, diff:2, stem:'庄园中负责维护庄园公共秩序、审理纠纷的机构是（ ）', opts:['庄园法庭', '国王法院', '教会法庭', '城市法庭'], ans:0, explain:'庄园法庭审理庄园内部纠纷，维护公共秩序。', src:'教材知识点'},
{id:'t8-13', lesson:8, diff:2, stem:'庄园法庭审判时，罚金一般归（ ）', opts:['国王', '领主', '原告', '教会'], ans:1, explain:'法庭罚金通常归领主所有，成为领主收入来源之一。', src:'教材知识点'},
{id:'t8-14', lesson:8, diff:2, stem:'西欧庄园的"公地"主要用于（ ）', opts:['庄园的领主私有专有', '对外出售给市场', '公共放牧、砍柴等', '用于军事训练活动'], ans:2, explain:'公地供庄园居民共同使用（放牧、取柴）。', src:'教材知识点'},
{id:'t8-15', lesson:8, diff:2, stem:'庄园法庭的判决具有（ ）', opts:['随意性', '参考价值', '无约束力', '法律效力'], ans:3, explain:'庄园法庭判决依据习惯法，具有法律约束力。', src:'教材知识点'},
{id:'t8-16', lesson:8, diff:2, stem:'下列关于西欧庄园的表述正确的是（ ）', opts:['是一个独立的自给自足的经济和政治单位', '庄园人人平等自由，没有阶级差别与压迫', '庄园以雇佣劳动为主，实行商品化生产', '庄园对外贸易主导，与外界联系十分紧密'], ans:0, explain:'庄园既是经济单位（自给自足）也是政治单位（拥有法庭）。', src:'教材知识点'},
{id:'s8-1', lesson:8, diff:3, stem:'庄园法庭审理中"领主滥用公共土地被佃户告上法庭并受处罚"的案例说明（ ）', opts:['庄园法庭完全保护佃户，领主无权管理庄园', '庄园法庭有助于限制领主特权、维护公共秩序', '佃户完全不受剥削，与领主地位完全平等', '庄园法庭审判不公，从不维护庄园的公共秩序'], ans:1, explain:'案例显示庄园法庭可约束领主，维护庄园公共秩序。', src:'教材知识点'},
{id:'s8-2', lesson:8, diff:3, stem:'中世纪西欧"城市的空气使人自由"，其深层含义是（ ）', opts:['城市没有法律', '城市里没有法律约束', '逃离庄园的农奴在城市可获自由身份', '城市人口稀少'], ans:2, explain:'城市自治使农奴摆脱人身依附获得自由，故有此谚语。', src:'教材知识点'},
{id:'s8-3', lesson:8, diff:3, stem:'庄园经济"自给自足"与城市经济"商品交换"相比，反映了（ ）', opts:['二者没有联系', '城市经济更落后', '二者之间没有联系', '生产力发展推动经济形态演进'], ans:3, explain:'生产力提高、剩余产品增加推动商品交换与城市兴起，经济形态由封闭走向开放。', src:'教材知识点'},
{id:'s8-4', lesson:8, diff:3, stem:'西欧庄园法庭与雅典公民大会相比，二者共同点是（ ）', opts:['都是特定群体行使权力的机构', '两者都实行人人平等的原则', '两者都废除了私有制度', '两者都实行君主制度'], ans:0, explain:'庄园法庭由领主及佃户参与行使司法权，公民大会是公民行使主权，都是群体性权力机构。', src:'教材知识点'},
{id:'b8-1', lesson:8, diff:5, stem:'马克思说"中世纪的城市是现代的摇篮"，对此理解最准确的是（ ）', opts:['中世纪城市是封建堡垒，维护封建统治秩序', '城市孕育了市民阶层与近代资本主义萌芽', '中世纪城市没有历史意义，很快便衰落了', '中世纪城市完全取代了庄园，成为唯一组织形式'], ans:1, explain:'中世纪城市兴起产生市民阶层、行会与自治传统，孕育近代文明要素。', src:'教材知识点·能力提升'},

/* ==== 第9课 中世纪城市和大学的兴起 ==== */

/* ==== 第10课 拜占庭帝国和《查士丁尼法典》 ==== */

{id:'t10-4', lesson:10, diff:2, stem:'《罗马民法大全》的历史地位是（ ）', opts:['奠定了欧洲民法的基础', '是世界上第一部法典', '确立了民主制度', '废除了奴隶制'], ans:0, explain:'《罗马民法大全》对后世欧洲民法影响深远，奠定欧洲民法基础。', src:'教材知识点'},

{id:'s10-4', lesson:10, diff:3, stem:'拜占庭帝国兴衰给我们的启示是（ ）', opts:['封闭保守、固步自封会导致衰落', '只有不断对外扩张才能强大', '文化融合必然导致亡国灭种', '民主制度决定国家的兴衰'], ans:0, explain:'拜占庭后期固守传统、不与时俱进，最终衰落，启示开放包容、改革创新。', src:'教材知识点'},
{id:'b10-1', lesson:10, diff:5, stem:'有史家评价拜占庭帝国"它既是一个古老的罗马帝国的延续，又是连接古代与近代文明的桥梁"。对此理解正确的是（ ）', opts:['拜占庭是当时唯一的文明', '拜占庭保存古典文化并承上启下，影响深远', '拜占庭完全复制了罗马的一切', '拜占庭与近代文明毫无关联'], ans:1, explain:'拜占庭继承罗马法制与希腊文化，又将其传播给后世，起承上启下作用。', src:'教材知识点·能力提升'},
{id:'e10-1', lesson:10, diff:6, stem:'西罗马帝国灭亡（476年）后，西欧进入中世纪，而东罗马（拜占庭）延续至1453年。造成这一差异的根本原因是（ ）', opts:['拜占庭军队比西罗马强大得多，所以得以延续', '西罗马推行民主制度，导致国家迅速走向灭亡', '拜占庭政治相对稳定、经济发达、地理位置优越', '东罗马率先实行民主政治，维持了长久的统治'], ans:2, explain:'拜占庭工商业繁荣、地处交通要冲、中央集权稳固，支撑其长期延续。', src:'教材知识点·能力提升'},
/* ==== 第10课 古代日本 ==== */
{id:'t10a-1', lesson:10, diff:2, stem:'大化改新发生于（ ）', opts:['645年', '1868年', '1192年', '646年'], ans:3, explain:'646年，日本孝德天皇颁布改新诏书，史称"大化改新"。', src:'教材知识点'},

{id:'t10a-3', lesson:10, diff:2, stem:'大化改新在经济方面的措施是（ ）', opts:['土地完全私有化发展', '土地收归国有、实行班田收授法', '实行重商主义', '大力发展海外贸易'], ans:1, explain:'改新将土地和人民收归国有，实行班田收授法与租庸调制。', src:'教材知识点'},

{id:'t10a-5', lesson:10, diff:2, stem:'大化改新前，日本社会的主要矛盾是（ ）', opts:['天皇与百姓之间的矛盾', '武士与农民之间的矛盾', '宗教派别之间的冲突', '奴隶主贵族与部民（奴隶）的矛盾'], ans:3, explain:'改新前日本贵族兼并土地、奴役部民，社会矛盾尖锐。', src:'教材知识点'},

{id:'t10a-8', lesson:10, diff:2, stem:'鉴真东渡日本传播的主要是（ ）', opts:['伊斯兰教的教义及其传播', '基督教的基本教义思想体系', '佛教与建筑医药等文化', '中国的儒学经典著作'], ans:2, explain:'唐代高僧鉴真六次东渡，传播佛教、建筑、医药等，影响日本文化。', src:'教材知识点'},

{id:'t10a-11', lesson:10, diff:2, stem:'日本镰仓幕府建立于（ ）', opts:['646年', '1192年', '1868年', '1333年'], ans:1, explain:'1192年源赖朝建立镰仓幕府，日本进入幕府统治时期。', src:'教材知识点'},
{id:'t10a-12', lesson:10, diff:2, stem:'幕府统治时期，日本的实权掌握在（ ）', opts:['天皇', '贵族', '幕府将军', '武士集团头领（将军）'], ans:2, explain:'幕府时期天皇成为傀儡，实权掌握在幕府将军手中。', src:'教材知识点'},
{id:'t10a-13', lesson:10, diff:2, stem:'武士道的核心精神是（ ）', opts:['平等、自由', '民主、法治', '孝悌、仁爱', '忠诚、勇武、名誉'], ans:3, explain:'武士道强调对主君忠诚与尚武精神，是日本武士的行为准则。', src:'教材知识点'},
{id:'t10a-14', lesson:10, diff:2, stem:'大化改新后日本长期存在的双重统治结构是（ ）', opts:['天皇朝廷与幕府并存', '皇帝与议会', '国王与教会', '元首与元老院'], ans:0, explain:'幕府时期日本形成天皇（名义）与幕府将军（实权）并存的二元统治。', src:'教材知识点'},

{id:'s10a-4', lesson:10, diff:3, stem:'日本文化深受中华文化影响，下列最能说明这一点的史实是（ ）', opts:['日本全面采用拉丁字母书写', '日本全民信奉伊斯兰教信仰', '平城京仿唐长安、假名借鉴汉字', '日本实行民主共和的政治制度'], ans:2, explain:'平城京布局、日本假名均源于汉字文化，体现中华文化深刻影响。', src:'教材知识点'},
{id:'b10a-1', lesson:10, diff:5, stem:'从大化改新到幕府统治，日本政治权力的演变轨迹是（ ）', opts:['日本政治沿着民主—专制—共和的轨迹不断演变', '日本由奴隶社会进入封建社会，再进入资本主义', '日本经历了由天皇、议会到首相掌权的演变过程', '中央集权强化—地方豪强崛起—幕府将军掌权'], ans:3, explain:'改新强化中央集权，后庄园武士势力崛起，最终幕府将军掌握实权。', src:'教材知识点·能力提升'},
{id:'e10a-1', lesson:10, diff:6, stem:'日本大化改新与中国商鞅变法相比，二者共同之处是（ ）', opts:['都确立了中央集权或君主专制体制、推动社会转型', '两者都推行民主政治，限制君主专制权力', '两者都废除了封建制度，走向资本主义社会', '两者都实行土地私有制，承认土地自由买卖'], ans:0, explain:'大化改新建立中央集权封建国家，商鞅变法确立君主专制中央集权，都促进社会转型。', src:'教材知识点·能力提升'},

{id:'t11-14', lesson:11, diff:2, stem:'阿拉伯帝国灭亡于（ ）', opts:['750年', '1453年', '1258年', '632年'], ans:2, explain:'1258年蒙古军攻陷巴格达，阿拉伯帝国灭亡。', src:'教材知识点'},

{id:'s11-1', lesson:11, diff:3, stem:'阿拉伯帝国"政教合一"体制的影响是（ ）', opts:['政教合一导致阿拉伯文化全面走向衰落', '有利于巩固统一与推动伊斯兰文化传播', '政教合一否定宗教，动摇了统治的根基', '政教合一阻碍了阿拉伯商业贸易的发展'], ans:1, explain:'政教合一使哈里发集权统一，宗教凝聚民众，利于帝国稳定与文明传播。', src:'教材知识点'},
{id:'s11-2', lesson:11, diff:3, stem:'阿拉伯人翻译保存古希腊典籍并加以发展，其历史作用是（ ）', opts:['建立了民主政治制度', '创立了基督教教义体系', '为欧洲文艺复兴提供了思想材料', '建立了民主制'], ans:2, explain:'阿拉伯保存发展的希腊典籍传回欧洲，助推文艺复兴。', src:'教材知识点'},
{id:'s11-3', lesson:11, diff:3, stem:'伊斯兰教、基督教、佛教并称世界三大宗教，其中创立最晚的是（ ）', opts:['佛教', '基督教', '道教', '伊斯兰教'], ans:3, explain:'佛教前6世纪、基督教1世纪、伊斯兰教7世纪，伊斯兰教最晚。', src:'教材知识点'},
{id:'s11-4', lesson:11, diff:3, stem:'阿拉伯帝国的繁荣与拜占庭帝国相比，二者的共同点是（ ）', opts:['地处交通要冲、工商业繁荣、文化兼收并蓄', '两者都实行民主制度，由公民共同管理国家', '两者都信奉佛教，宗教文化高度繁荣', '两者都只重视农业，轻视商业贸易的发展'], ans:0, explain:'两者都处东西方交通枢纽，经济繁荣、文化多元交融。', src:'教材知识点'},
{id:'b11-1', lesson:11, diff:5, stem:'有学者称阿拉伯人为"沟通东西方文明的使者"，最能佐证的是（ ）', opts:['阿拉伯人发动十字军东征，占领了欧洲的大部分领土地区', '阿拉伯人把中国火药、指南针、造纸术和印度数字传入西方', '阿拉伯人发现了新大陆，开启了世界近代史的进程', '阿拉伯人统一了世界，建立起了世界性的大帝国'], ans:1, explain:'阿拉伯人充当东西方技术、文化传播的中介，是"文明使者"。', src:'教材知识点·能力提升'},
{id:'e11-1', lesson:11, diff:6, stem:'穆罕默德"既是宗教领袖又是政治军事领袖"，这一身份的深层作用是（ ）', opts:['政治身份使阿拉伯陷入长期分裂割据状态', '宗教身份阻碍了阿拉伯社会的发展与进步', '以宗教统一凝聚力量，建立并扩张了阿拉伯帝国', '军事身份否定宗教，使帝国很快土崩瓦解'], ans:2, explain:'政教合一身份使穆罕默德能以共同信仰整合部落、发动统一战争，建立帝国。', src:'教材知识点·能力提升'},
/* ==== 第12课 中古时期的非洲与美洲 ==== */
{id:'t12-1', lesson:12, diff:2, stem:'西非古国加纳、马里、桑海的主要贸易商品是（ ）', opts:['象牙和木材', '丝绸和瓷器', '香料和宝石', '黄金和盐'], ans:3, explain:'西非盛产黄金，与北非贸易黄金与盐，经济繁荣。', src:'教材知识点'},
{id:'t12-2', lesson:12, diff:2, stem:'马里王国鼎盛时期著名的国王是（ ）', opts:['曼萨·穆萨', '汉谟拉比', '查士丁尼', '阿育王'], ans:0, explain:'曼萨·穆萨（14世纪）使马里达到鼎盛，其朝觐麦加闻名欧洲。', src:'教材知识点'},
{id:'t12-3', lesson:12, diff:2, stem:'西非著名的文化中心与学术城市是（ ）', opts:['开罗', '廷巴克图', '孟买', '君士坦丁堡'], ans:1, explain:'廷巴克图是西非重要学术文化中心，藏书丰富。', src:'教材知识点'},
{id:'t12-4', lesson:12, diff:2, stem:'东非埃塞俄比亚等古国深受哪一宗教文化影响（ ）', opts:['伊斯兰教', '佛教', '基督教', '印度教'], ans:2, explain:'东非阿克苏姆等古国受基督教影响，保留独特文化传统。', src:'教材知识点'},
{id:'t12-5', lesson:12, diff:2, stem:'美洲印第安人文明中，最先创造文明的是（ ）', opts:['阿兹特克人', '印加人', '爱斯基摩人', '玛雅人'], ans:3, explain:'玛雅人创造了美洲最早的文明，尤卡坦半岛是其中心。', src:'教材知识点'},
{id:'t12-6', lesson:12, diff:2, stem:'玛雅文明的主要成就不包括（ ）', opts:['发明0—9计数法', '20进制计数', '象形文字', '精确历法'], ans:0, explain:'0—9计数法是古印度人发明；玛雅人使用20进制、创象形文字与历法。', src:'教材知识点'},
{id:'t12-7', lesson:12, diff:2, stem:'阿兹特克人建立的都城是（ ）', opts:['马丘比丘', '特诺奇蒂特兰', '奇琴伊察', '库斯科'], ans:1, explain:'阿兹特克人建都特诺奇蒂特兰（今墨西哥城），被誉为"水上城市"。', src:'教材知识点'},
{id:'t12-8', lesson:12, diff:2, stem:'印加帝国建立于安第斯山区，其行政中心是（ ）', opts:['特诺奇蒂特兰', '廷巴克图', '库斯科', '巴格达'], ans:2, explain:'印加帝国以库斯科为首都，疆域纵贯安第斯山区。', src:'教材知识点'},
{id:'t12-9', lesson:12, diff:2, stem:'印加人记录信息的方式是（ ）', opts:['竹简', '羊皮纸', '泥板', '结绳记事'], ans:3, explain:'印加人没有文字，用"结绳记事"（基普）记录信息。', src:'教材知识点'},
{id:'t12-10', lesson:12, diff:2, stem:'玛雅人种植的主要农作物是（ ）', opts:['玉米', '小麦', '棉花', '水稻'], ans:0, explain:'玉米是玛雅等美洲文明的主要农作物，后传遍世界。', src:'教材知识点'},
{id:'t12-11', lesson:12, diff:2, stem:'美洲文明中建造了马丘比丘遗址的文明是（ ）', opts:['玛雅文明', '印加文明', '奥尔梅克文明', '阿兹特克文明'], ans:1, explain:'马丘比丘是印加文明的代表性遗址，位于秘鲁安第斯山。', src:'教材知识点'},
{id:'t12-12', lesson:12, diff:2, stem:'玛雅文明突然衰落，学界一般认为与下列哪项无关（ ）', opts:['人口激增与资源紧张', '气候变化', '马匹普及', '内部战争'], ans:2, explain:'玛雅衰落原因众说纷纭，马匹在美洲文明中并不存在（无马），与衰落无关。', src:'教材知识点'},
{id:'t12-13', lesson:12, diff:2, stem:'美洲三大文明（玛雅、阿兹特克、印加）的共同特点是（ ）', opts:['三大文明工业发达，生产力水平世界领先', '三大文明都使用拼音文字，文字系统成熟', '三大文明都信奉伊斯兰教，宗教文化繁荣', '农业发达、崇拜太阳神、金字塔建筑'], ans:3, explain:'三大文明都农业发达、崇拜太阳、建造金字塔式建筑（庙宇）。', src:'教材知识点'},
{id:'t12-14', lesson:12, diff:2, stem:'中古时期非洲与美洲文明发展的共同背景是（ ）', opts:['相对孤立发展，形成独特文明', '已被欧洲人殖民', '各洲之间广泛交流', '工业化'], ans:0, explain:'非洲、美洲文明相对独立发展，形成各具特色的古代文明。', src:'教材知识点'},
{id:'t12-15', lesson:12, diff:2, stem:'黄金在加纳、马里王国政治中的作用是（ ）', opts:['黄金完全没有作用', '国王垄断黄金贸易、以此控制经济', '黄金全部来自中国', '黄金来自中国'], ans:1, explain:'国王控制黄金产地与贸易，黄金成为王权经济基础。', src:'教材知识点'},
{id:'t12-16', lesson:12, diff:2, stem:'阿兹特克人修建的太阳金字塔位于今（ ）', opts:['埃及', '秘鲁', '墨西哥', '巴西'], ans:2, explain:'阿兹特克太阳金字塔位于墨西哥城附近。', src:'教材知识点'},
{id:'s12-1', lesson:12, diff:3, stem:'美洲印第安文明在天文历法上的突出成就是（ ）', opts:['最早发明了太阳历法体系', '创制了儒略历法体系', '制定通行世界的公历体系', '玛雅历法精确度很高'], ans:3, explain:'玛雅历法精于计算，显示美洲文明较高的天文数学水平。', src:'教材知识点'},
{id:'s12-2', lesson:12, diff:3, stem:'16世纪美洲三大文明先后被西班牙殖民者征服，根本原因是（ ）', opts:['文明发展水平与军事技术差距悬殊', '当地气候环境恶劣', '部落间的宗教冲突', '宗教冲突'], ans:0, explain:'欧洲拥有金属武器、火器、马匹等军事技术优势，美洲文明相对落后被征服。', src:'教材知识点'},
{id:'s12-3', lesson:12, diff:3, stem:'西非古国黄金贸易兴盛的原因不包括（ ）', opts:['盛产黄金', '本地工业发达', '地处跨撒哈拉贸易路线', '北非商人需求'], ans:1, explain:'西非因盛产黄金并处贸易要道而繁荣，与工业无关。', src:'教材知识点'},
{id:'s12-4', lesson:12, diff:3, stem:'玛雅、阿兹特克、印加文明的共同遗产对世界的影响是（ ）', opts:['最早发明了造纸术技术', '创立了完整的字母文字书写体系', '玉米、马铃薯等作物传播世界', '建立了完善的民主政治制度'], ans:2, explain:'美洲作物（玉米、马铃薯、番茄等）传向世界，改变全球农业格局。', src:'教材知识点'},
{id:'b12-1', lesson:12, diff:5, stem:'"新航路开辟前，美洲与欧亚大陆长期隔绝"，这种隔绝对美洲文明的影响是（ ）', opts:['隔绝加速了美洲工业革命时代的到来', '隔绝使美洲文明免受干扰，得以持续繁荣发展', '隔绝促进了美洲与欧亚文明的频繁交流往来', '既孕育了独特文明，也使其缺乏抵抗外敌的技术而覆灭'], ans:3, explain:'隔绝使美洲独立发展出独特文明，但也缺乏马匹、火器等，最终难以抵御殖民者。', src:'教材知识点·能力提升'},
{id:'e12-1', lesson:12, diff:6, stem:'印加帝国"结绳记事"与古埃及"象形文字"的差异，本质上反映（ ）', opts:['不同文明发展路径与条件不同', '印加人的文明更加落后', '埃及人的智慧更加出众', '所有文明的文字必然相同'], ans:0, explain:'文明形态受地理、社会发展阶段影响，结绳与象形是不同文明各自的记录方式。', src:'教材知识点·能力提升'},
/* ==== 第13课 文艺复兴 ==== */
{id:'t13-1', lesson:13, diff:2, stem:'文艺复兴首先兴起于（ ）', opts:['法国', '意大利', '英国', '德国'], ans:1, explain:'14世纪文艺复兴兴起于意大利，因资本主义萌芽最早出现。', src:'教材知识点'},
{id:'t13-2', lesson:13, diff:2, stem:'文艺复兴的核心思想是（ ）', opts:['理性主义', '禁欲主义', '人文主义', '唯物主义'], ans:2, explain:'文艺复兴以"人文主义"为核心，强调人的价值与现世幸福。', src:'教材知识点'},
{id:'t13-3', lesson:13, diff:2, stem:'文艺复兴的实质是（ ）', opts:['单纯的复兴古典文化的运动', '反对天主教的宗教改革运动', '推动科学技术进步的革命', '资产阶级思想解放运动'], ans:3, explain:'文艺复兴借复兴古希腊罗马文化宣传资产阶级思想，本质是思想解放运动。', src:'教材知识点'},
{id:'t13-4', lesson:13, diff:2, stem:'文艺复兴的先驱是（ ）', opts:['但丁', '莎士比亚', '彼特拉克', '达·芬奇'], ans:0, explain:'但丁被誉为"文艺复兴的先驱"，代表作《神曲》。', src:'教材知识点'},
{id:'t13-5', lesson:13, diff:2, stem:'但丁的代表作是（ ）', opts:['《哈姆雷特》', '《神曲》', '《蒙娜丽莎》', '《十日谈》'], ans:1, explain:'但丁的长诗《神曲》猛烈抨击教会，歌颂人的理性。', src:'教材知识点'},
{id:'t13-6', lesson:13, diff:2, stem:'达·芬奇的代表作是（ ）', opts:['雕塑作品《大卫》', '壁画《创世纪》', '《蒙娜丽莎》《最后的晚餐》', '《西斯廷圣母》'], ans:2, explain:'达·芬奇以《蒙娜丽莎》《最后的晚餐》闻名，是"美术三杰"之一。', src:'教材知识点'},
{id:'t13-7', lesson:13, diff:2, stem:'文艺复兴"美术三杰"不包括（ ）', opts:['拉斐尔', '达·芬奇', '米开朗琪罗', '莎士比亚'], ans:3, explain:'美术三杰为达·芬奇、米开朗琪罗、拉斐尔；莎士比亚是文学巨匠。', src:'教材知识点'},
{id:'t13-8', lesson:13, diff:2, stem:'英国文艺复兴的代表是（ ）', opts:['莎士比亚', '但丁', '达·芬奇', '拉斐尔'], ans:0, explain:'莎士比亚（《哈姆雷特》《罗密欧与朱丽叶》）是英国文艺复兴巨匠。', src:'教材知识点'},
{id:'t13-9', lesson:13, diff:2, stem:'文艺复兴运动的根本原因是（ ）', opts:['天主教会的腐败堕落现象', '意大利资本主义萌芽', '外族对意大利的入侵侵略', '欧洲黑死病的广泛流行蔓延'], ans:1, explain:'资本主义萌芽（资产阶级形成）是文艺复兴兴起的根本原因。', src:'教材知识点'},
{id:'t13-10', lesson:13, diff:2, stem:'文艺复兴反对的主要对象是（ ）', opts:['世俗国王的专制势力', '新兴的市民阶层', '教会的神权统治与封建束缚', '农民'], ans:2, explain:'文艺复兴批判封建神学，反对教会对人性的压抑。', src:'教材知识点'},
{id:'t13-11', lesson:13, diff:2, stem:'"走自己的路，让别人说去吧"出自（ ）', opts:['莎士比亚', '卢梭', '伏尔泰', '但丁'], ans:3, explain:'此名言出自但丁《神曲》，体现肯定自我的人文主义精神。', src:'教材知识点'},
{id:'t13-12', lesson:13, diff:2, stem:'文艺复兴时期文学艺术作品的主题特点是（ ）', opts:['歌颂人性、关注现世', '热衷于描写战争场景场面', '继续歌颂神圣的神性权威', '如实记录历史事件发展'], ans:0, explain:'文艺复兴作品从"神"转向"人"，歌颂人的情感与现世生活。', src:'教材知识点'},
{id:'t13-13', lesson:13, diff:2, stem:'文艺复兴对欧洲历史发展的影响是（ ）', opts:['文艺复兴导致欧洲各国陷入长期分裂', '为欧洲资本主义的产生发展奠定思想文化基础', '文艺复兴引发大规模战争，破坏社会秩序', '文艺复兴废除了宗教，欧洲走向彻底世俗化'], ans:1, explain:'文艺复兴解放了人们思想，推动文学艺术与科学发展，为资本主义发展奠定基础。', src:'教材知识点'},
{id:'t13-14', lesson:13, diff:2, stem:'文艺复兴运动持续的时间约为（ ）', opts:['8—10世纪', '18—19世纪', '14—17世纪', '12—13世纪'], ans:2, explain:'文艺复兴大致从14世纪持续到17世纪初。', src:'教材知识点'},
{id:'t13-15', lesson:13, diff:2, stem:'文艺复兴时期，意大利诗人彼特拉克被誉为（ ）', opts:['"诗圣"', '"科学巨匠"', '"启蒙之父"', '"人文主义之父"'], ans:3, explain:'彼特拉克最早系统阐述人文主义，被称为"人文主义之父"。', src:'教材知识点'},
{id:'t13-16', lesson:13, diff:2, stem:'文艺复兴借"复兴古希腊罗马文化"之名，其真实目的是（ ）', opts:['宣传资产阶级新思想', '企图恢复古代的奴隶制度', '企图复辟罗马帝国统治', '试图复兴基督教神权统治'], ans:0, explain:'借古典文化之名，行批判教会、宣传人文主义之实。', src:'教材知识点'},
{id:'s13-1', lesson:13, diff:3, stem:'"文艺复兴是复兴还是创新"的争论中，史学界主流观点是（ ）', opts:['文艺复兴纯属复古，是对古希腊罗马文化的复制', '本质是资产阶级新文化运动，创新大于复兴', '文艺复兴纯属创新，与古典文化没有任何关联', '文艺复兴的性质无法判断，史学界争议很大'], ans:1, explain:'文艺复兴借古之名，创立资产阶级人文主义新文化。', src:'教材知识点'},
{id:'s13-2', lesson:13, diff:3, stem:'文艺复兴与古希腊文化的共同点是（ ）', opts:['禁欲主义', '神权至上', '重视人的价值', '宗教主导'], ans:2, explain:'古希腊文化肯定人的价值与智慧，文艺复兴人文主义与其一脉相承。', src:'教材知识点'},
{id:'s13-3', lesson:13, diff:3, stem:'文艺复兴推动了近代自然科学的兴起，主要原因是（ ）', opts:['文艺复兴是宗教改革的结果，促进科学进步', '文艺复兴时期教会大力支持自然科学研究', '文艺复兴源于战争需要，推动军事技术发展', '人文主义鼓励探索求真、冲破神学束缚'], ans:3, explain:'人文主义把人从神学束缚中解放，鼓励观察实验，促进科学兴起。', src:'教材知识点'},
{id:'s13-4', lesson:13, diff:3, stem:'文艺复兴、新航路开辟、宗教改革被称为"西欧走出中世纪的三部曲"，其共同动力是（ ）', opts:['资本主义的发展', '教会推动', '国王支持', '农民起义'], ans:0, explain:'资本主义萌芽发展是三者共同的深层动力，推动西欧迈向近代。', src:'教材知识点'},
{id:'b13-1', lesson:13, diff:5, stem:'恩格斯评价文艺复兴"这是一次人类从来没有经历过的最伟大的、进步的变革"，其"伟大"主要在于（ ）', opts:['文艺复兴全面恢复了古希腊罗马时期的城邦政治制度', '把人与人性从神学束缚中解放，奠定近代文明基础', '文艺复兴扩大了欧洲各国的疆域版图', '文艺复兴提高了欧洲各国的经济产出'], ans:1, explain:'文艺复兴解放人性、推动科学与艺术繁荣，是近代文明的先声。', src:'教材知识点·能力提升'},
{id:'e13-1', lesson:13, diff:6, stem:'文艺复兴"美术三杰"的作品（《蒙娜丽莎》《大卫》《西斯廷圣母》）共同折射的时代精神是（ ）', opts:['文艺复兴美术三杰的作品体现禁欲主义精神', '文艺复兴美术三杰的作品表达神性崇拜主题', '人文主义：人性美、现世美成为讴歌对象', '文艺复兴美术三杰的作品充满战争狂热情绪'], ans:2, explain:'三杰作品塑造健美人体、刻画人物内心，体现文艺复兴讴歌人性美。', src:'教材知识点·能力提升'},
/* ==== 第14课 新航路的开辟 ==== */
{id:'t14-1', lesson:14, diff:2, stem:'迪亚士航海到达的最南端是（ ）', opts:['印度', '麦哲伦海峡', '美洲', '好望角'], ans:3, explain:'1487年迪亚士到达非洲南端好望角。', src:'教材知识点'},
{id:'t14-2', lesson:14, diff:2, stem:'第一个到达印度的欧洲航海家是（ ）', opts:['达·伽马', '迪亚士', '麦哲伦', '哥伦布'], ans:0, explain:'1498年达·伽马绕过好望角到达印度，开辟通往东方新航路。', src:'教材知识点'},
{id:'t14-3', lesson:14, diff:2, stem:'哥伦布1492年航行的目的地原计划是（ ）', opts:['中国', '印度', '美洲', '日本'], ans:1, explain:'哥伦布坚信地圆说，西航计划到达印度，却"发现"了美洲。', src:'教材知识点'},
{id:'t14-4', lesson:14, diff:2, stem:'哥伦布"发现"新大陆是在（ ）', opts:['1487年', '1498年', '1492年', '1519年'], ans:2, explain:'1492年哥伦布横渡大西洋，到达美洲巴哈马群岛。', src:'教材知识点'},
{id:'t14-5', lesson:14, diff:2, stem:'人类历史上第一次环球航行的是（ ）', opts:['哥伦布船队', '达·伽马船队', '迪亚士船队', '麦哲伦船队'], ans:3, explain:'1519—1522年麦哲伦船队完成首次环球航行，证明地圆学说。', src:'教材知识点'},
{id:'t14-6', lesson:14, diff:2, stem:'新航路开辟的根本原因是（ ）', opts:['欧洲商品经济发展、资本主义萌芽需要市场与黄金', '传播基督教是新航路开辟的根本原因', '奥斯曼帝国阻断商路是新航路开辟的根本原因', '技术革命是新航路开辟的根本原因'], ans:0, explain:'资本主义萌芽发展渴求黄金与市场，是开辟新航路的根本动因。', src:'教材知识点'},
{id:'t14-7', lesson:14, diff:2, stem:'新航路开辟的直接原因是（ ）', opts:['地圆学说在欧洲的流行和传播', '奥斯曼帝国控制东西方传统商路', '欧洲造船航海技术的进步发展', '罗盘指南针技术的广泛使用'], ans:1, explain:'15世纪奥斯曼帝国阻断传统商路，欧洲急需寻找新航路，是直接原因。', src:'教材知识点'},
{id:'t14-8', lesson:14, diff:2, stem:'新航路开辟的技术条件不包括（ ）', opts:['罗盘（指南针）', '地圆学说', '蒸汽机', '造船技术改进'], ans:2, explain:'罗盘、地圆说、多桅帆船是新航路条件；蒸汽机是工业革命产物。', src:'教材知识点'},
{id:'t14-9', lesson:14, diff:2, stem:'新航路开辟的世界历史意义是（ ）', opts:['新航路开辟使世界从此隔绝封闭', '新航路开辟导致欧洲从此走向衰落', '新航路开辟使亚洲迅速崛起', '世界开始连为一个整体，促进世界市场雏形出现'], ans:3, explain:'新航路开辟使世界联为一体，人类历史进入全球化时代。', src:'教材知识点'},
{id:'t14-10', lesson:14, diff:2, stem:'新航路开辟后，欧洲商业中心转移至（ ）', opts:['大西洋沿岸', '波罗的海沿岸', '地中海沿岸', '北海沿岸'], ans:0, explain:'商路和贸易中心由地中海转移到大西洋沿岸（如葡萄牙、西班牙、荷兰、英国）。', src:'教材知识点'},
{id:'t14-11', lesson:14, diff:2, stem:'欧洲人开辟新航路的直接经济诱因是（ ）', opts:['对土地的渴望', '对黄金的渴求', '对劳动力的需求', '对宗教的追求'], ans:1, explain:'《马可·波罗行纪》刺激欧洲人对东方黄金的渴望，是直接经济诱因。', src:'教材知识点'},
{id:'t14-12', lesson:14, diff:2, stem:'支持哥伦布航海的国家是（ ）', opts:['葡萄牙', '英国', '西班牙', '荷兰'], ans:2, explain:'哥伦布得到西班牙王室资助，其发现成为西班牙殖民扩张开端。', src:'教材知识点'},
{id:'t14-13', lesson:14, diff:2, stem:'新航路开辟的消极影响是（ ）', opts:['新航路开辟传播了瘟疫，影响很小', '新航路开辟阻碍了国际贸易的发展', '新航路开辟导致世界分裂成若干部分', '开始了殖民掠夺，给亚非拉人民带来灾难'], ans:3, explain:'新航路开辟后欧洲殖民掠夺开始，亚非拉人民遭受灾难。', src:'教材知识点'},
{id:'t14-14', lesson:14, diff:2, stem:'麦哲伦船队环球航行证实了（ ）', opts:['地圆学说', '日心说', '万有引力', '进化论'], ans:0, explain:'麦哲伦船队首次环球航行，用实践证明了地球是圆的。', src:'教材知识点'},
{id:'t14-15', lesson:14, diff:2, stem:'"美洲的发现、绕过非洲的航行，给新兴的资产阶级开辟了新天地"出自（ ）', opts:['《独立宣言》', '《共产党宣言》', '《人权宣言》', '《神曲》'], ans:1, explain:'马克思、恩格斯在《共产党宣言》中评价新航路开辟为资产阶级开辟新天地。', src:'教材知识点'},
{id:'t14-16', lesson:14, diff:2, stem:'新航路开辟后，原产美洲的作物传入欧洲和中国，其中不包括（ ）', opts:['玉米', '马铃薯', '小麦', '番茄'], ans:2, explain:'小麦原产西亚传入中国；玉米、马铃薯、番茄原产美洲。', src:'教材知识点'},
{id:'s14-1', lesson:14, diff:3, stem:'比较郑和下西洋与新航路开辟，正确的认识是（ ）', opts:['郑和下西洋与新航路开辟性质完全相同没有任何区别', '郑和的远航比新航路开辟更加先进文明发达', '新航路开辟在世界历史上毫无任何意义可言之处', '郑和远航以宣扬国威为主，新航路开辟以追求商业利益为主'], ans:3, explain:'郑和远航和平交往、宣扬国威；欧洲远航追求黄金市场、殖民扩张。', src:'教材知识点'},
{id:'s14-2', lesson:14, diff:3, stem:'哥伦布至死都认为到达的是"印度"，这一"美丽的错误"的历史影响是（ ）', opts:['客观上促成了新旧大陆的"哥伦布大交换"', '哥伦布的错误对历史毫无影响', '哥伦布的错误阻碍了各地交流', '哥伦布的错误导致地图绘制全面出错'], ans:0, explain:'误认美洲为印度促使欧洲持续殖民美洲，美洲作物、人口、物种大交换改变世界。', src:'教材知识点'},
{id:'s14-3', lesson:14, diff:3, stem:'新航路开辟后"商业革命"的表现是（ ）', opts:['新航路开辟之后欧洲各国的物价水平普遍持续下跌', '世界市场雏形出现、商品种类增多、商路转移', '新航路开辟后欧洲贸易不断萎缩', '新航路开辟后各国纷纷闭关锁国'], ans:1, explain:'新航路使世界贸易范围扩大、商品流通增多，欧洲商业格局巨变。', src:'教材知识点'},
{id:'s14-4', lesson:14, diff:3, stem:'新航路开辟、文艺复兴、殖民扩张三者之间的关系是（ ）', opts:['三者相互排斥，先后取代对方并最终走向消亡终结', '文艺复兴、新航路开辟、殖民扩张互不相关毫无任何联系可言', '文艺复兴提供思想动力，新航路开辟创造条件，殖民扩张积累资本', '三者同时消亡，没有留下任何历史影响可言之处了'], ans:2, explain:'文艺复兴解放思想→新航路开辟扩展市场→殖民掠夺积累资本，共同推动资本主义发展。', src:'教材知识点'},
{id:'b14-1', lesson:14, diff:5, stem:'"哥伦布大交换"使旧大陆获得玉米、马铃薯、烟草，新大陆获得马匹、牛、小麦与疾病。这一交换的本质是（ ）', opts:['哥伦布大交换是单向性的掠夺行为，完全谈不上双向的交流过程', '哥伦布大交换没有任何历史意义可言之处了', '哥伦布大交换纯属偶然发生，影响十分有限很小', '全球物种、人口、疾病大交流，深刻改变世界生态与社会'], ans:3, explain:'新旧大陆生物与疾病双向流动，重构全球人口分布与生态格局。', src:'教材知识点·能力提升'},
{id:'e14-1', lesson:14, diff:6, stem:'新航路开辟"既扩大了世界市场，又开始了世界范围的殖民掠夺"，这一双重性的根源在于（ ）', opts:['欧洲资本主义的扩张本性', '地理环境条件的差异所决定', '各地宗教冲突矛盾所决定', '航海家个人的道德品质所决定'], ans:0, explain:'资本主义追求市场与原始积累的本质，决定新航路开辟的双重历史影响。', src:'教材知识点·能力提升'},
/* ==== 第15课 早期殖民掠夺 ==== */
{id:'t15-1', lesson:15, diff:2, stem:'最早走上殖民扩张道路的国家是（ ）', opts:['英国和法国', '葡萄牙和西班牙', '荷兰和英国', '意大利和德国'], ans:1, explain:'葡、西最早开始海外殖民扩张（15—16世纪）。', src:'教材知识点'},
{id:'t15-2', lesson:15, diff:2, stem:'"三角贸易"中程运输的主要是（ ）', opts:['黄金', '丝绸', '黑奴', '香料'], ans:2, explain:'中程：欧洲武器纺织品→非洲换取黑奴→运往美洲贩卖，是三角贸易最黑暗的环节。', src:'教材知识点'},
{id:'t15-3', lesson:15, diff:2, stem:'三角贸易对非洲的影响是（ ）', opts:['人口增加', '非洲获得了快速发展', '非洲人口大量增加', '造成非洲人口锐减、灾难深重'], ans:3, explain:'黑奴贸易使非洲损失大量人口，社会长期落后。', src:'教材知识点'},
{id:'t15-4', lesson:15, diff:2, stem:'三角贸易对欧洲的影响是（ ）', opts:['为欧洲资本主义发展积累了大量资本', '三角贸易导致欧洲走向衰落', '三角贸易使欧洲人口大量减少', '三角贸易使欧洲农业严重衰退'], ans:0, explain:'贩卖黑奴所得利润转化为资本，加速欧洲资本原始积累。', src:'教材知识点'},
{id:'t15-5', lesson:15, diff:2, stem:'1588年打败西班牙"无敌舰队"的国家是（ ）', opts:['法国', '英国', '荷兰', '葡萄牙'], ans:1, explain:'1588年英国打败西班牙无敌舰队，开始建立海上霸权。', src:'教材知识点'},
{id:'t15-6', lesson:15, diff:2, stem:'英国先后打败的海上竞争对手不包括（ ）', opts:['荷兰', '法国', '奥斯曼帝国', '西班牙'], ans:2, explain:'英国先后打败西班牙、荷兰、法国，确立海上霸权，奥斯曼不在其列。', src:'教材知识点'},
{id:'t15-7', lesson:15, diff:2, stem:'18世纪中期，英国成为（ ）', opts:['"海上马车夫"', '"太阳帝国"', '"世界工厂"', '"日不落帝国"'], ans:3, explain:'18世纪中期英国殖民势力遍及全球，号称"日不落帝国"。', src:'教材知识点'},
{id:'t15-8', lesson:15, diff:2, stem:'"海上马车夫"指的是（ ）', opts:['荷兰', '英国', '西班牙', '法国'], ans:0, explain:'17世纪荷兰商船遍布世界，称"海上马车夫"。', src:'教材知识点'},
{id:'t15-9', lesson:15, diff:2, stem:'早期殖民掠夺对殖民地的影响是（ ）', opts:['殖民掠夺促进了殖民地工业化进程', '造成殖民地长期贫困落后', '使殖民地的文化事业繁荣', '使殖民地人口快速增长'], ans:1, explain:'殖民掠夺、屠杀、奴役使亚非拉地区长期贫困落后。', src:'教材知识点'},
{id:'t15-10', lesson:15, diff:2, stem:'早期殖民掠夺客观上带来的积极作用是（ ）', opts:['早期殖民掠夺彻底消灭了当地的文明成果与文化传统', '早期殖民掠夺导致世界分裂', '传播了先进生产方式，冲击旧的社会结构', '早期殖民掠夺阻碍了各地交流'], ans:2, explain:'殖民活动客观上传播先进生产方式，冲击殖民地落后的社会结构。', src:'教材知识点'},
{id:'t15-11', lesson:15, diff:2, stem:'黑奴贸易中"出程"运往非洲的主要商品是（ ）', opts:['黄金和白银', '鸦片和瓷器', '香料和茶叶', '武器和纺织品'], ans:3, explain:'出程以欧洲火器、纺织品换取非洲黑奴。', src:'教材知识点'},
{id:'t15-12', lesson:15, diff:2, stem:'英国在北美的殖民据点之一是（ ）', opts:['弗吉尼亚', '果阿', '澳门', '马六甲'], ans:0, explain:'英国在北美建立弗吉尼亚等殖民地，从事种植园与贸易。', src:'教材知识点'},
{id:'t15-13', lesson:15, diff:2, stem:'早期殖民扩张的根本动力是（ ）', opts:['传播宗教信仰的热情所驱动', '资本原始积累的需要', '国内人口过剩问题的推动', '气候环境变化的因素所致'], ans:1, explain:'资本主义发展需要原料、市场与资本，是殖民扩张根本动力。', src:'教材知识点'},
{id:'t15-14', lesson:15, diff:2, stem:'殖民掠夺对世界市场形成的作用是（ ）', opts:['大大缩小了世界市场的范围与规模', '与世界市场的形成发展毫无关系', '促进了世界市场（雏形）进一步扩大', '严重阻碍了全球化的历史进程发展'], ans:2, explain:'殖民贸易把更多地区卷入世界市场，推动市场扩大。', src:'教材知识点'},
{id:'t15-15', lesson:15, diff:2, stem:'三角贸易的完整路线是（ ）', opts:['非洲—欧洲—美洲', '欧洲—美洲—非洲', '美洲—非洲—欧洲', '欧洲—非洲—美洲—欧洲'], ans:3, explain:'出程欧洲→非洲，中程非洲→美洲，归程美洲→欧洲，形成三角。', src:'教材知识点'},
{id:'t15-16', lesson:15, diff:2, stem:'下列关于殖民掠夺的评价，正确的是（ ）', opts:['既给殖民地带来灾难，又客观上促进世界联系，应辩证看待', '殖民掠夺对世界历史进程来说全是坏事一无是处', '殖民掠夺的影响无法评价，众说纷纭没有定论', '殖民掠夺对世界历史的进程来说全部是好事，无可挑剔之处'], ans:0, explain:'殖民掠夺双重影响：灾难与客观进步作用并存。', src:'教材知识点'},
{id:'s15-1', lesson:15, diff:3, stem:'三角贸易中"归程"美洲运回欧洲的主要是（ ）', opts:['被贩卖的非洲黑奴', '金银、蔗糖、烟草', '欧洲生产的武器装备', '欧洲种植的粮食作物'], ans:1, explain:'归程把美洲金银、蔗糖、烟草等运回欧洲，完成资本循环。', src:'教材知识点'},
{id:'s15-2', lesson:15, diff:3, stem:'英国打败西班牙、荷兰、法国并成为"日不落帝国"，其根本优势在于（ ）', opts:['实行宗教改革', '国土面积广大', '资本主义经济发达、制度先进', '宗教改革'], ans:2, explain:'英国资产阶级革命后制度先进、工商业发达，实力超越对手。', src:'教材知识点'},
{id:'s15-3', lesson:15, diff:3, stem:'"资本来到世间，从头到脚每个毛孔都滴着血和肮脏的东西"，最能印证这一论断的是（ ）', opts:['启蒙运动的思想传播活动', '文艺复兴运动中的人文精神', '新航路开辟的探险活动本身', '三角贸易与殖民掠夺'], ans:3, explain:'马克思批判资本主义原始积累的血腥，黑奴贸易与殖民掠夺即是明证。', src:'教材知识点'},
{id:'s15-4', lesson:15, diff:3, stem:'早期殖民扩张对世界历史进程的总体影响是（ ）', opts:['推动世界市场形成与资本主义发展，同时造成亚非拉落后', '早期殖民扩张的后果只对欧洲国家有利无害', '早期殖民扩张只给亚非拉殖民地带来了巨大的损害与灾难', '早期殖民扩张对世界历史没有任何影响可言'], ans:0, explain:'殖民扩张加速欧洲资本主义与全球化，也使亚非拉长期落后，影响双重。', src:'教材知识点'},
{id:'b15-1', lesson:15, diff:5, stem:'葡萄牙、西班牙最早殖民却迅速衰落，英国后来居上，这一历史现象说明（ ）', opts:['先行开展殖民扩张的国家就必然能够取得最终的胜利', '殖民扩张的持久优势取决于本国资本主义的制度与实力', '宗教信仰的不同决定殖民国家的兴衰命运', '人口数量的多少决定殖民扩张的成败得失'], ans:1, explain:'英国以先进制度与工商业实力长期称霸，说明综合实力决定殖民竞争成败。', src:'教材知识点·能力提升'},
{id:'e15-1', lesson:15, diff:6, stem:'马克思说"美洲金银产地发现……对土著居民进行剿灭，是原始积累的主要因素"，这段话论证的是（ ）', opts:['马克思的话说明美洲开发十分有利', '马克思的话说明土著居民自愿合作', '殖民掠夺是资本主义原始积累的重要手段', '马克思的话说明金银毫无价值'], ans:2, explain:'殖民者对美洲的掠夺屠杀为欧洲积累资本，是原始积累的血腥来源。', src:'教材知识点·能力提升'},
/* ==== 第16课 英国资产阶级革命 ==== */
{id:'t16-1', lesson:16, diff:2, stem:'英国资产阶级革命爆发于（ ）', opts:['1688年', '1649年', '1689年', '1640年'], ans:3, explain:'1640年议会重新召开，标志英国资产阶级革命开始。', src:'教材知识点'},
{id:'t16-2', lesson:16, diff:2, stem:'英国资产阶级革命的根本原因是（ ）', opts:['斯图亚特王朝专制统治阻碍资本主义发展', '宗教冲突是英国革命的根本原因', '议会与国王的矛盾是英国革命的根本原因', '农民起义是英国革命的根本原因'], ans:0, explain:'封建专制统治严重阻碍英国资本主义发展，是革命根本原因。', src:'教材知识点'},
{id:'t16-3', lesson:16, diff:2, stem:'1649年，英国处死的国王是（ ）', opts:['查理二世', '查理一世', '詹姆士二世', '詹姆士一世'], ans:1, explain:'1649年查理一世被推上断头台，英国宣布为共和国。', src:'教材知识点'},
{id:'t16-4', lesson:16, diff:2, stem:'1660年，英国封建王朝复辟，复辟的国王是（ ）', opts:['克伦威尔', '查理一世', '查理二世', '威廉三世'], ans:2, explain:'1660年斯图亚特王朝复辟，查理二世即位。', src:'教材知识点'},
{id:'t16-5', lesson:16, diff:2, stem:'英国"光荣革命"发生于（ ）', opts:['1689年', '1640年', '1660年', '1688年'], ans:3, explain:'1688年资产阶级新贵族发动宫廷政变推翻詹姆士二世，史称"光荣革命"。', src:'教材知识点'},
{id:'t16-6', lesson:16, diff:2, stem:'《权利法案》颁布于（ ）', opts:['1689年', '1688年', '1640年', '1701年'], ans:0, explain:'1689年英国议会通过《权利法案》。', src:'教材知识点'},
{id:'t16-7', lesson:16, diff:2, stem:'《权利法案》的核心内容是（ ）', opts:['彻底废除了王权', '限制国王权力、确立议会主权', '不断扩大国王权力', '确立了共和制度'], ans:1, explain:'《权利法案》以法律限制王权，议会权力高于王权。', src:'教材知识点'},
{id:'t16-8', lesson:16, diff:2, stem:'《权利法案》规定国王无权（ ）', opts:['召集议会', '加冕', '废止法律', '发布命令'], ans:2, explain:'法案规定国王无权废止法律、不得侵犯征税权、未经议会同意不得组常备军。', src:'教材知识点'},
{id:'t16-9', lesson:16, diff:2, stem:'英国革命后确立的政治体制是（ ）', opts:['民主共和制', '联邦制', '总统制', '君主立宪制'], ans:3, explain:'1689年后英国逐渐确立君主立宪制，国王"统而不治"。', src:'教材知识点'},
{id:'t16-10', lesson:16, diff:2, stem:'英国革命结束后，国家权力的中心是（ ）', opts:['议会', '首相', '法院', '国王'], ans:0, explain:'君主立宪制下议会是国家权力中心。', src:'教材知识点'},
{id:'t16-11', lesson:16, diff:2, stem:'英国资产阶级革命中领导议会军打败王军的是（ ）', opts:['华盛顿', '克伦威尔', '拿破仑', '查理二世'], ans:1, explain:'克伦威尔率议会军（新模范军）击败王军，后任护国主。', src:'教材知识点'},
{id:'t16-12', lesson:16, diff:2, stem:'英国革命的意义是（ ）', opts:['英国革命彻底废除了私有财产制度，实现了生产资料公有制', '英国革命确立了民主共和制的政治体制框架', '推翻封建专制、确立君主立宪，为资本主义发展扫清障碍', '英国革命使英国实现了国家工业化进程目标'], ans:2, explain:'革命推翻封建统治，确立君主立宪制，推动资本主义发展，影响世界。', src:'教材知识点'},
{id:'t16-13', lesson:16, diff:2, stem:'1215年英国签署的、确立"王权有限"原则的文件是（ ）', opts:['《权利法案》', '《独立宣言》', '《人权宣言》', '《大宪章》'], ans:3, explain:'1215年英王约翰签署《大宪章》，确立"王权有限"原则。', src:'教材知识点'},
{id:'t16-14', lesson:16, diff:2, stem:'"光荣革命"之所以"光荣"，是因为它（ ）', opts:['不流血完成了政权更替', '推翻了此前的共和国体制', '彻底废除了议会制度', '确立了共和制的政体'], ans:0, explain:'光荣革命以宫廷政变方式不流血实现政权更迭，故称"光荣"。', src:'教材知识点'},
{id:'t16-15', lesson:16, diff:2, stem:'英国资产阶级革命反复曲折的根本原因是（ ）', opts:['国王查理一世的个人能力十分出众', '资产阶级力量弱小、封建势力强大', '议会软弱无能的不断妥协与退让', '宗教纷争导致英国政局长期动荡不安'], ans:1, explain:'资产阶级、新贵族力量相对弱小，封建势力顽固，导致革命反复。', src:'教材知识点'},
{id:'t16-16', lesson:16, diff:2, stem:'《权利法案》颁布后，英国国王的权力变化是（ ）', opts:['国王权力扩大', '彻底废除国王', '由君主专制变为"统而不治"', '废除国王'], ans:2, explain:'《权利法案》后国王权力受法律限制，逐渐"统而不治"。', src:'教材知识点'},
{id:'s16-1', lesson:16, diff:3, stem:'英国议会与国王围绕征税权斗争的实质是（ ）', opts:['英国议会与国王之间的斗争仅仅只是税收多少的财政之争', '英国议会与国王之争是宗教之争', '英国议会与国王之争是国王与贵族之争', '资产阶级（议会）与封建王权争夺统治权的斗争'], ans:3, explain:'征税权之争实质是新兴资产阶级要求限制王权、掌握统治权。', src:'教材知识点'},
{id:'s16-2', lesson:16, diff:3, stem:'"光荣革命"后议会颁布《权利法案》，其历史地位是（ ）', opts:['为君主立宪制确立提供了法律依据', '宣告美国独立建国', '确立三权分立', '废除奴隶制'], ans:0, explain:'《权利法案》以法律形式限制王权、保障议会主权，确立君主立宪制基础。', src:'教材知识点'},
{id:'s16-3', lesson:16, diff:3, stem:'英国革命与法国大革命相比，英国革命的特点是（ ）', opts:['英国革命彻底推翻了封建制度的一切', '资产阶级与新贵族结盟、革命具有妥协性渐进性', '英国革命废除了宗教，建立世俗国家', '英国革命建立了民主共和制度'], ans:1, explain:'英国资产阶级联合新贵族，革命过程曲折、成果以妥协方式（君主立宪）巩固。', src:'教材知识点'},
{id:'s16-4', lesson:16, diff:3, stem:'从《大宪章》到《权利法案》，英国政治发展的主线是（ ）', opts:['从大宪章到权利法案，议会逐渐消亡', '从大宪章到权利法案，王权不断加强', '王权不断削弱、议会（法律）权威不断上升', '从大宪章到权利法案，君主专制成型'], ans:2, explain:'1215年《大宪章》确立王权有限，1689年《权利法案》确立议会主权，主线清晰。', src:'教材知识点'},
{id:'b16-1', lesson:16, diff:5, stem:'"1688年光荣革命后，英国国王成为议会的仆从"，这一变化的制度保障是（ ）', opts:['《大宪章》的签署与颁布实施', '首相制度的建立与逐步完善', '国王自觉自愿地让渡权力', '《权利法案》确立了议会至上原则'], ans:3, explain:'《权利法案》以法律形式确立议会主权，保障"王在法下"。', src:'教材知识点·能力提升'},
{id:'e16-1', lesson:16, diff:6, stem:'英国君主立宪制与古希腊雅典民主制相比，根本区别是（ ）', opts:['近代代议制（间接民主）vs 古代直接民主', '两者都排斥公民参与政治生活', '两者都废除了君主制度的存在', '两者都实行民主制度，本质上完全一致'], ans:0, explain:'英国是近代代议制（议会代表制），雅典是古代直接民主（公民大会），形式与性质不同。', src:'教材知识点·能力提升'},
/* ==== 第17课 美国独立战争 ==== */
{id:'t17-1', lesson:17, diff:2, stem:'美国独立战争开始于（ ）', opts:['1776年', '1775年', '1777年', '1783年'], ans:1, explain:'1775年莱克星顿枪声打响，独立战争开始。', src:'教材知识点'},
{id:'t17-2', lesson:17, diff:2, stem:'《独立宣言》发表的时间是（ ）', opts:['1775年北美独立战争爆发之时', '1777年萨拉托加大捷之时', '1776年7月4日', '1787年美国制宪会议召开之时'], ans:2, explain:'1776年7月4日大陆会议发表《独立宣言》，宣告美国诞生。', src:'教材知识点'},
{id:'t17-3', lesson:17, diff:2, stem:'独立战争的转折点是（ ）', opts:['莱克星顿枪声', '约克镇战役', '波士顿倾茶事件', '萨拉托加大捷'], ans:3, explain:'1777年萨拉托加大捷是美国独立战争的转折点。', src:'教材知识点'},
{id:'t17-4', lesson:17, diff:2, stem:'英国承认美国独立是在（ ）', opts:['1783年', '1781年', '1787年', '1776年'], ans:0, explain:'1783年英国承认美国独立。', src:'教材知识点'},
{id:'t17-5', lesson:17, diff:2, stem:'《独立宣言》宣称的基本原则是（ ）', opts:['国王权力至上的原则', '人人生而平等、天赋人权', '宗教信仰自由的原则', '维护殖民统治的原则'], ans:1, explain:'《独立宣言》宣告人人生而平等，享有生命、自由和追求幸福的权利。', src:'教材知识点'},
{id:'t17-6', lesson:17, diff:2, stem:'《独立宣言》被称为（ ）', opts:['"第一部宪法"', '"人权宣言"', '"第一个人权宣言"', '"解放宣言"'], ans:2, explain:'《独立宣言》首次以政治纲领形式宣布人权原则，马克思称其为"第一个人权宣言"。', src:'教材知识点'},
{id:'t17-7', lesson:17, diff:2, stem:'美国独立战争的领导人、大陆军总司令是（ ）', opts:['杰斐逊', '林肯', '富兰克林', '华盛顿'], ans:3, explain:'华盛顿任大陆军总司令，领导独立战争获胜。', src:'教材知识点'},
{id:'t17-8', lesson:17, diff:2, stem:'1787年美国宪法的原则是（ ）', opts:['三权分立、联邦制', '君主立宪', '中央集权', '民主共和制'], ans:0, explain:'1787年宪法确立联邦制与三权分立（立法、行政、司法相互制衡）。', src:'教材知识点'},
{id:'t17-9', lesson:17, diff:2, stem:'1787年宪法规定的国家元首是（ ）', opts:['国王', '总统', '首相', '总督'], ans:1, explain:'宪法规定总统为国家元首兼行政首脑，由选举产生。', src:'教材知识点'},
{id:'t17-10', lesson:17, diff:2, stem:'美国独立战争的性质是（ ）', opts:['美国独立战争只不过是一场农民起义运动', '美国独立战争只不过是一场奴隶起义运动', '既是民族解放战争，又是资产阶级革命', '美国独立战争只不过是一场宗教战争冲突'], ans:2, explain:'独立战争既摆脱英国殖民统治（民族独立），又建立资产阶级政体（资产阶级革命）。', src:'教材知识点'},
{id:'t17-11', lesson:17, diff:2, stem:'美国独立战争爆发的根本原因是（ ）', opts:['奴隶问题美国独立战争的根本原因', '波士顿倾茶事件是美国独立战争的根本原因', '法国支援是美国独立战争的根本原因', '英国殖民统治阻碍北美资本主义发展'], ans:3, explain:'英国殖民统治严重阻碍北美资本主义发展与民族独立，是战争根本原因。', src:'教材知识点'},
{id:'t17-12', lesson:17, diff:2, stem:'华盛顿的历史地位是（ ）', opts:['美国"国父"、首任总统', '大陆会议的主席职务', '美国最高法院的法官职务', '英国式的首任首相职务'], ans:0, explain:'华盛顿领导独立战争、主持制宪、就任首任总统，被尊为"美国国父"。', src:'教材知识点'},
{id:'t17-13', lesson:17, diff:2, stem:'《独立宣言》的局限性是（ ）', opts:['《独立宣言》没有宣称人人平等', '没有废除奴隶制，种族歧视依然存在', '《独立宣言》支持殖民统治', '《独立宣言》否定了天赋人权'], ans:1, explain:'《独立宣言》宣称人人平等却未废除奴隶制，存在局限。', src:'教材知识点'},
{id:'t17-14', lesson:17, diff:2, stem:'1787年宪法是世界上（ ）', opts:['人类历史上的第一部宪法', '人类历史上最完善的宪法文件', '第一部资产阶级成文宪法', '人类历史上的第一部共和宪法'], ans:2, explain:'1787年宪法是世界上第一部资产阶级成文宪法。', src:'教材知识点'},
{id:'t17-15', lesson:17, diff:2, stem:'三权分立中，掌握行政权的是（ ）', opts:['参议院', '国会', '最高法院', '总统'], ans:3, explain:'行政权归总统，立法权归国会，司法权归最高法院。', src:'教材知识点'},
{id:'t17-16', lesson:17, diff:2, stem:'美国独立战争中得到的外援国家是（ ）', opts:['法国', '荷兰', '英国', '俄国'], ans:0, explain:'法国为对抗英国，援助美国（如约克镇战役中法军参战）。', src:'教材知识点'},
{id:'s17-1', lesson:17, diff:3, stem:'《独立宣言》"人人平等"与现实中"奴隶制合法"的矛盾说明（ ）', opts:['宣言完全没有价值意义', '资产阶级宣言的局限性与阶级本质', '美国早已废除奴隶', '平等不适用于美国'], ans:1, explain:'宣言的"平等"服务于资产阶级利益，未涵盖黑奴与原住民，暴露阶级局限。', src:'教材知识点'},
{id:'s17-2', lesson:17, diff:3, stem:'1787年宪法确立三权分立的目的是（ ）', opts:['进一步强化总统的行政权力', '彻底废除国会的一切权力', '防止权力集中、保障民主制衡', '恢复君主专制的政治制度'], ans:2, explain:'分权制衡防止专制暴政，保障民主制度运行。', src:'教材知识点'},
{id:'s17-3', lesson:17, diff:3, stem:'美国独立战争对法国大革命的影响是（ ）', opts:['对法国大革命没有任何影响', '最终导致了法国的亡国灭种', '反而阻碍了法国革命的进程', '提供了成功范例，鼓舞法国人民'], ans:3, explain:'美国独立战争与《独立宣言》鼓舞法国启蒙思想传播，推动法国大革命。', src:'教材知识点'},

{id:'s21-2', lesson:21, diff:3, stem:'巴黎公社失败的教训对后来社会主义运动的主要启示是（ ）', opts:['必须依赖个别英雄人物的个人力量', '必须彻底放弃一切武装斗争形式', '必须有马克思主义政党领导', '必须依靠宗教团体的支持力量'], ans:2, explain:'公社因缺乏政党领导而败，启示无产阶级革命需科学理论指导的政党。', src:'教材知识点'},
{id:'s21-3', lesson:21, diff:3, stem:'《国际歌》"英特纳雄耐尔就一定要实现"，表达的是（ ）', opts:['表达了对资本主义制度的赞美与颂扬', '表达了某种宗教理想与信仰追求', '表达了狭隘的民族主义情绪诉求', '对社会主义必胜的信念'], ans:3, explain:'"英特纳雄耐尔"指国际共产主义理想，表达无产阶级必胜信念。', src:'教材知识点'},
{id:'s21-4', lesson:21, diff:3, stem:'第一国际与巴黎公社的关系是（ ）', opts:['第一国际支持推动了巴黎公社起义', '两者相互对立冲突', '巴黎公社早于第一国际成立', '第一国际镇压了巴黎公社'], ans:0, explain:'第一国际宣传马克思主义、组织工人，为巴黎公社提供思想与组织基础。', src:'教材知识点'},
{id:'b21-1', lesson:21, diff:5, stem:'"巴黎公社的原则是永存的、不可磨灭的"，这些"原则"主要指（ ）', opts:['巴黎公社的原则是暴力恐怖与阶级斗争', '人民当家作主、公仆制、打碎旧国家机器', '巴黎公社的原则是君主立宪与议会制度', '巴黎公社的原则是资本主义的自由竞争'], ans:1, explain:'公社的民主选举、人民主权、打碎旧机器等原则具有永恒价值。', src:'教材知识点·能力提升'},
{id:'e21-1', lesson:21, diff:6, stem:'从文艺复兴→启蒙运动→马克思主义，欧洲思想解放运动演进的主线是（ ）', opts:['思想演进主线是宗教改革到封建到神权', '思想演进主线从未进步', '人的解放→理性解放→无产阶级解放', '思想演进主线是直线倒退'], ans:2, explain:'思想解放由人文主义（人）到理性主义（公民）再到马克思主义（无产者），解放主体不断下移扩大。', src:'教材知识点·能力提升'},
{id:'u1-61', lesson:1, diff:3, stem:'恩格斯说："劳动创造了人本身"。考古证实人类从猿到人的转变过程中，劳动起了决定作用。这一论断强调的是（ ）', opts:['古猿因觅食困难被迫直立行走', '自然环境的变化促成了人类进化', '人类进化是漫长自然选择的结果', '劳动使古猿开始使用工具并直立行走'], ans:3, explain:'劳动在从猿到人的转变中起决定作用：劳动促进古猿学会制造和使用工具、直立行走，最终演化为人类。', src:'综合提升·模拟训练'},
{id:'u1-62', lesson:1, diff:3, stem:'原始社会"没有私有制、没有阶级、没有国家"，生产资料公有、共同劳动、平均分配。出现这一状况的根本原因是（ ）', opts:['生产力水平极端低下', '部落首领大公无私', '人口稀少且资源充足', '原始人思想道德觉悟高'], ans:0, explain:'原始社会生产力水平极端低下，没有剩余产品，因而只能公有、平均分配，这是由生产力决定的，而非道德因素。', src:'综合提升·模拟训练'},
{id:'d1-61', lesson:1, diff:4, stem:'旧石器时代人类以打制石器为工具，过着采集狩猎生活；新石器时代出现磨制石器和原始农业，人类开始定居。这一变化的根本意义在于（ ）', opts:['人类开始掌握和使用火', '生产力显著提高，人类进入农耕定居时代', '原始宗教和图腾崇拜开始出现', '私有制和阶级由此产生'], ans:1, explain:'从打制到磨制石器、从采集狩猎到农耕定居，标志着生产力显著提高，人类从依赖自然走向改造自然，是文明产生的前提。', src:'综合提升·模拟训练'},
{id:'d1-62', lesson:1, diff:4, stem:'有学者指出："私有制、阶级和国家的产生，不是哪个英雄人物的意志，而是生产力发展到一定阶段的必然结果。"对此理解最准确的是（ ）', opts:['任何社会都会自动产生私有制', '国家是阶级斗争不可调和的产物', '人类社会形态演进的根本动力是生产力', '英雄人物能够决定历史发展方向'], ans:2, explain:'私有制、阶级和国家都是生产力发展到出现剩余产品、贫富分化后的产物，其产生根源是生产力发展，不以人的意志为转移。', src:'综合提升·模拟训练'},
{id:'d1-63', lesson:1, diff:4, stem:'考古学家在世界各地发现早期人类遗址后指出：人类从"旧石器"到"新石器"、从"采集狩猎"到"农耕定居"的转变，是人类历史上第一次伟大的社会变革。这次变革（ ）', opts:['由人类自觉规划推动，与生产力发展没有直接关系', '完全依靠自然环境的变化，是外部力量塑造的结果', '只改变了生产方式，对社会组织没有产生影响', '是人类生产力进步的体现，为文明产生奠定基础'], ans:3, explain:'由旧石器到新石器、采集狩猎到农耕定居的转变，本质是生产力进步，它提供了稳定的食物来源和剩余产品，为私有制、国家等文明要素的产生奠定基础。', src:'综合提升·模拟训练'},
{id:'f1-61', lesson:1, diff:5, stem:'世界上有三大人种：黄色人种、白色人种、黑色人种。他们分布广泛，外貌特征各异。关于人种差异的正确认识是（ ）', opts:['人种差异是长期自然环境影响的结果，各人种无优劣之分', '人种差异自人类出现起就已固定不变、永不改变', '白色人种智力更高，是先进文明的创造者', '人种优劣决定社会发展水平高低'], ans:0, explain:'人种差异是各人群长期适应不同自然环境的结果，属于生物学范畴，各人种无优劣之分，人类文明是各人种共同创造的。', src:'综合提升·模拟训练'},
{id:'f1-62', lesson:1, diff:5, stem:'有人认为："人类从原始社会进入奴隶社会，出现了阶级压迫，是历史的倒退。"也有人认为"这是历史的巨大进步"。最符合历史唯物主义的认识是（ ）', opts:['奴隶社会的进步与倒退相互并存，其进步程度与倒退程度大体相当', '奴隶社会虽然存在压迫，但生产力大为提高，是历史的进步', '奴隶社会由少数英雄推动，与普通群众的关系不大', '阶级压迫严重束缚生产力发展，奴隶社会的生产水平远低于原始社会'], ans:1, explain:'奴隶社会虽有阶级压迫，但生产力较原始社会大幅提高，促进农业、手工业分工和脑体分工，为文明发展创造条件，从历史发展看是进步。', src:'综合提升·模拟训练'},
{id:'z1-61', lesson:1, diff:6, stem:'史学界一般认为：私有制、阶级、国家、文字、城市等是文明产生的重要标志。据此判断，人类最早的文明诞生于（ ）', opts:['约公元前3000年，人类开始普遍使用磨制石器并出现氏族制度之时', '约公元前2000年，青铜器在欧亚大陆范围内得到广泛使用之时', '约公元前3500年两河流域和尼罗河流域出现奴隶制小国之时', '约公元前8世纪，希腊城邦的民主政治全面确立并走向成熟之时'], ans:2, explain:'约公元前3500年，两河流域南部和尼罗河流域出现最早的奴隶制小国，具备了私有制、阶级、国家等文明要素，标志着人类文明诞生。', src:'综合提升·模拟训练'},
{id:'z1-62', lesson:1, diff:6, stem:'我国考古发现的元谋人、北京人，与非洲发现的"露西"化石，都是人类进化早期的代表。三者在人类起源问题上反映的共同规律是（ ）', opts:['人类文明起源于多个中心，互不影响', '人类进化过程在欧洲完成', '各大陆人类是独立起源、毫无关联的', '劳动在从猿到人的转变中起决定作用'], ans:3, explain:'元谋人、北京人、"露西"化石都是人类进化早期的代表，恩格斯指出劳动在从猿到人的转变中起决定作用，这是人类起源的共同规律。', src:'综合提升·模拟训练'},
{id:'u2-61', lesson:2, diff:3, stem:'《汉谟拉比法典》中记载："如果一个人开挖沟渠浇灌田地，却不小心淹没了邻居的田地，他应当赔偿邻居的损失。"这一条文反映了（ ）', opts:['古巴比伦重视水利灌溉和农业经济', '古巴比伦法律只保护奴隶主利益', '两河流域经常发生洪水灾害', '古巴比伦实行严格的土地国有制'], ans:0, explain:'条文涉及灌溉纠纷的赔偿，反映两河流域农业依赖水利灌溉，法律重视维护农业生产秩序。', src:'综合提升·模拟训练'},
{id:'u2-62', lesson:2, diff:3, stem:'两河流域的苏美尔人创制了楔形文字，还发明了以60为基数的计数法，并对天象进行记录。这些成就表明（ ）', opts:['苏美尔人已进入封建社会', '两河流域文明对世界文明影响深远', '楔形文字是世界上唯一的古老文字', '两河流域文明比埃及文明更早产生'], ans:1, explain:'楔形文字是最早的文字之一，60进制至今应用于时间与角度计算，其天文历法成就也影响后世，体现两河流域文明对世界文明的深远贡献。', src:'综合提升·模拟训练'},
{id:'d2-61', lesson:2, diff:4, stem:'《汉谟拉比法典》规定："如果贵族打伤同等地位的贵族，应受相应处罚；如果贵族打伤奴隶，只需赔偿一定钱财即可。"这说明法典（ ）', opts:['法典的各项规定只保护奴隶阶层的切身利益', '法典体现了法律面前人人平等的原则精神', '公开维护奴隶主贵族的等级特权', '法典的颁布彻底废除了当时的奴隶制度'], ans:2, explain:'法典对不同等级的人实行不同处罚标准，公开维护奴隶主贵族的特权，体现了鲜明的阶级性，而非人人平等。', src:'综合提升·模拟训练'},
{id:'d2-62', lesson:2, diff:4, stem:'《汉谟拉比法典》是"迄今已知世界上第一部较为完整的成文法典"。这里强调"较为完整"主要是因为（ ）', opts:['它首次把习惯法整理成册，废除了不成文的传统', '它是世界上唯一完整保存至今的古代法典', '它规定了完整的民主制度，保障公民参与立法', '它把法律条文公开刻写，内容系统涉及社会各个方面'], ans:3, explain:'法典将法律条文公开成文并系统刻于石柱，内容涵盖社会结构、婚姻、债务、奴隶买卖等方方面面，因此被称为第一部较为完整的成文法典。', src:'综合提升·模拟训练'},
{id:'d2-63', lesson:2, diff:4, stem:'据《汉谟拉比法典》记载，古巴比伦社会可分为拥有公民权的自由民、无公民权的自由民和奴隶三大等级，且法律对三者的保护程度不同。由此可知古巴比伦（ ）', opts:['社会等级分明，法律维护等级秩序', '奴隶拥有较多公民权利', '已建立起人人平等的法制社会', '自由民之间没有任何差别'], ans:0, explain:'法典将社会划分为不同等级并区别对待，说明古巴比伦社会等级分明，法律公开维护等级秩序。', src:'综合提升·模拟训练'},
{id:'f2-61', lesson:2, diff:5, stem:'《汉谟拉比法典》一方面"以眼还眼、以牙还牙"的惩罚原则体现了同态复仇的原始习惯，另一方面又规定奴隶犯罪受罚更重。对法典最恰当的评价是（ ）', opts:['它是纯粹维护奴隶主阶级利益的野蛮残酷的法律', '它既有历史进步性，又带有鲜明的阶级性', '它完全废除了原始社会流传下来的各种习惯法', '法典充分体现了古代社会民主法治的精神理念'], ans:1, explain:'法典公开成文、结束随意量刑，具有历史进步性；但内容公开维护奴隶主利益，带有鲜明的阶级性，应一分为二评价。', src:'综合提升·模拟训练'},
{id:'f2-62', lesson:2, diff:5, stem:'汉谟拉比统一两河流域后，自称"巴比伦之太阳"，集行政、军事、立法大权于一身。这一现象表明古巴比伦王国（ ）', opts:['古巴比伦实行民主共和的政治制度体制', '古巴比伦实行由贵族寡头把持的政治体制', '确立中央集权的君主专制统治', '国家的实际权力掌握在祭司集团手中'], ans:2, explain:'汉谟拉比集军政大权于一身、自称"巴比伦之太阳"，体现了中央集权的君主专制统治特征。', src:'综合提升·模拟训练'},
{id:'z2-61', lesson:2, diff:6, stem:'两河流域文明对世界文明作出了多方面贡献，下列属于其影响至今的成就是（ ）', opts:['创造了今天通用的阿拉伯数字', '创制了世界上最古老的太阳历', '制定了近代欧洲民法的基础', '发明了沿用到今天的60进制计时法'], ans:3, explain:'两河流域苏美尔人发明的60进制至今仍用于时间（1小时60分）和角度计量；阿拉伯数字源自印度，太阳历源自埃及，欧洲民法基础是罗马法。', src:'综合提升·模拟训练'},
{id:'z2-62', lesson:2, diff:6, stem:'《汉谟拉比法典》中"以眼还眼、以牙还牙"的规定，与《圣经》中"同态复仇"原则十分相似。有学者认为后者可能受到前者影响。这说明（ ）', opts:['两河流域文明与希伯来文化存在传承联系', '古代法律都是野蛮的', '两河流域文明是西方文明唯一源头', '《圣经》抄袭了《汉谟拉比法典》'], ans:0, explain:'《圣经》中的同态复仇原则与《汉谟拉比法典》相似，反映两河流域法律文化对周边地区的影响与传承，说明古代文明之间存在交流联系。', src:'综合提升·模拟训练'},
{id:'u3-61', lesson:3, diff:3, stem:'希罗多德曾说："埃及是尼罗河的赠礼。"对这句话理解正确的是（ ）', opts:['尼罗河洪灾频繁，古埃及文明是在抗灾中形成的', '尼罗河定期泛滥留下肥沃土壤，孕育了古埃及农业文明', '尼罗河提供了充足降水，古埃及不需要发展灌溉', '尼罗河是古埃及唯一的水源，其他河流没有影响'], ans:1, explain:'尼罗河定期泛滥留下肥沃的黑土，利于农业发展，古埃及文明在此基础上发展起来，故称"尼罗河的赠礼"。', src:'综合提升·模拟训练'},
{id:'u3-62', lesson:3, diff:3, stem:'金字塔是古埃及文明的象征。关于金字塔的表述，正确的是（ ）', opts:['金字塔是古埃及普通民众死后安葬的陵墓', '金字塔完全是由奴隶们独立建造完成的工程', '金字塔是法老的陵墓，也是古埃及人智慧的结晶', '胡夫金字塔是世界上最高大的建筑物之一'], ans:2, explain:'金字塔是法老的陵墓，其建造技术体现了古埃及人的智慧和高度发达的建筑水平，是古埃及文明的象征。', src:'综合提升·模拟训练'},
{id:'d3-61', lesson:3, diff:4, stem:'古埃及人创制的象形文字影响了后来的腓尼基字母，而腓尼基字母又成为希腊字母、拉丁字母的源头。据此可知（ ）', opts:['埃及象形文字是世界上唯一保存至今的古老文字体系', '腓尼基字母直接来源于罗马，与埃及文字无关', '字母文字完全取代了象形文字，两者没有联系', '文字的发展具有传承性，古埃及文字对字母文字影响深远'], ans:3, explain:'象形文字→腓尼基字母→希腊/拉丁字母，体现文字发展的传承脉络，古埃及象形文字对后世字母文字的形成有重要影响。', src:'综合提升·模拟训练'},
{id:'d3-62', lesson:3, diff:4, stem:'古埃及人发现，当太阳和天狼星在地平线上同时升起时，尼罗河开始涨水，于是据此创制了太阳历。后来罗马人以太阳历为基础制定了儒略历。这表明（ ）', opts:['古埃及历法建立在观察自然规律的基础上并影响后世', '古埃及太阳历直接来源于罗马的儒略历法', '天狼星决定了尼罗河的涨落', '儒略历完全照搬了埃及太阳历'], ans:0, explain:'古埃及人根据对尼罗河涨落和天狼星出现的长期观察创制太阳历，其成为后世儒略历的蓝本，体现了古埃及人对自然规律的观察智慧。', src:'综合提升·模拟训练'},
{id:'d3-63', lesson:3, diff:4, stem:'法老自称"太阳神之子"，集军、政、财、神权于一身；金字塔和狮身人面像也高耸威严。这些现象共同反映了（ ）', opts:['古埃及实行的是人人平等的民主政治制度', '法老权力神圣化，实行君主专制统治', '古埃及实行由神职人员主持的共和政治制度', '法老是由全体人民共同选举产生的'], ans:1, explain:'法老集大权于一身并神化自身权力，金字塔等建筑象征其威严，反映古埃及实行君权神授的君主专制统治。', src:'综合提升·模拟训练'},
{id:'f3-61', lesson:3, diff:5, stem:'对于金字塔，有人认为它是"古代世界七大奇迹之一"，也有人称它是"法老奴役人民的见证"。对金字塔最客观的历史认识是（ ）', opts:['金字塔只具有建筑艺术价值，与社会压迫无关', '应完全否定金字塔，因为它给人民带来沉重负担', '金字塔是劳动人民智慧的结晶，同时反映了法老的残暴统治', '金字塔是神力的显现，与古埃及人民的辛勤劳动没有任何关系'], ans:2, explain:'金字塔建造技术体现古埃及劳动人民的智慧和才能，是古埃及文明的象征；同时其修建也耗费大量人力物力，反映了法老的专制压迫，应一分为二看待。', src:'综合提升·模拟训练'},
{id:'f3-62', lesson:3, diff:5, stem:'现代科学家测算，胡夫金字塔每块巨石平均重约2.5吨，共约230万块，其建造技术至今仍有"未解之谜"。这主要说明（ ）', opts:['金字塔是外星文明建造留下的遗迹', '金字塔的建造在当时没有任何实际意义可言', '古埃及的文明发展水平已经全面超越现代文明', '古埃及人掌握了惊人的数学和工程学知识'], ans:3, explain:'金字塔的精准测量、巨石运输和垒砌需要高度发达的数学、几何和工程学知识，反映古埃及文明的辉煌成就。', src:'综合提升·模拟训练'},
{id:'z3-61', lesson:3, diff:6, stem:'古埃及象形文字后来失传，直到19世纪法国学者借助"罗塞塔石碑"（同一内容分别用希腊文、象形文字和世俗体文字刻写）才得以解读。这一事件说明（ ）', opts:['文字失传导致文明记忆断裂，多语对照是破解古文字的方法', '希腊文是古埃及的官方文字，象形文字从未真正通用过', '古埃及文字失传后，其文明成果也随之全部消失', '罗塞塔石碑的发现标志着古埃及的文明从此走向了灭亡'], ans:0, explain:'罗塞塔石碑用三种文字对照刻写，为解读失传的象形文字提供了钥匙，说明文字失传会造成文明记忆的断裂，对照解读是研究古文字的重要途径。', src:'综合提升·模拟训练'},
{id:'z3-62', lesson:3, diff:6, stem:'古埃及文明、两河流域文明、古印度文明和中国文明都发源于大河流域。它们共同的历史特征是（ ）', opts:['四大文明都是海洋文明，以海外贸易为主要经济形态', '都发源于大河流域，以农业为基础，形成中央集权', '四大文明都创造了字母文字，文字系统彼此相同', '四大文明都建立了城邦民主制度，实行公民自治'], ans:1, explain:'四大文明古国都发源于大河流域，依托大河灌溉发展农业，在此基础上形成奴隶制国家与中央集权统治，属于典型的农业文明。', src:'综合提升·模拟训练'},
{id:'u4-61', lesson:4, diff:3, stem:'古印度种姓制度把社会成员划分为婆罗门、刹帝利、吠舍、首陀罗四个等级。其中负责掌管宗教祭祀的是（ ）', opts:['刹帝利', '吠舍', '婆罗门', '首陀罗'], ans:2, explain:'种姓制度中，婆罗门掌管宗教祭祀，刹帝利掌管军事与行政，吠舍从事农牧工商，首陀罗是被征服者和奴隶。', src:'综合提升·模拟训练'},
{id:'u4-62', lesson:4, diff:3, stem:'佛教宣扬"众生平等"，反对婆罗门的特权。佛教创立的历史背景是（ ）', opts:['古印度实行民主共和制度，民众享有广泛政治权利', '古印度已进入封建社会，种姓制度的束缚日渐瓦解', '佛教由婆罗门创立，是婆罗门教的高级发展阶段', '种姓制度激化了社会矛盾，刹帝利等阶层不满婆罗门特权'], ans:3, explain:'公元前6世纪，种姓制度下的等级压迫激化社会矛盾，刹帝利、吠舍等阶层对婆罗门特权不满，乔达摩·悉达多据此创立反对特权的佛教。', src:'综合提升·模拟训练'},
{id:'d4-61', lesson:4, diff:4, stem:'种姓制度规定各等级世代相袭、贵贱分明、不得通婚，低等级者备受压迫。对这一制度的实质认识正确的是（ ）', opts:['它维护奴隶主贵族的等级特权，严重阻碍印度社会发展', '它促进了各等级之间的流动，推动印度社会进步', '它废除了阶级差别，实现了人人平等的社会理想', '它使印度成为统一国家，加强了中央集权统治'], ans:0, explain:'种姓制度以等级世袭和宗教外衣维护奴隶主贵族特权，使低等级世代受压迫，严重阻碍了印度社会的进步发展。', src:'综合提升·模拟训练'},
{id:'d4-62', lesson:4, diff:4, stem:'今天我们使用的"阿拉伯数字"实际上并不是阿拉伯人发明的。对这一说法理解正确的是（ ）', opts:['0—9计数法由阿拉伯人发明，经欧洲人传播到印度', '印度人发明了0—9计数法，经阿拉伯人改造并传播到欧洲', '阿拉伯人从未使用过这套数字，名称纯属误会', '0—9计数法起源于中国，经丝绸之路传入印度'], ans:1, explain:'0—9计数法由古代印度人发明，阿拉伯人将其加以改造并传播到欧洲，欧洲人误以为来自阿拉伯，故称"阿拉伯数字"。', src:'综合提升·模拟训练'},
{id:'d4-63', lesson:4, diff:4, stem:'印度河流域的哈拉帕和摩亨佐·达罗遗址规划整齐，街道纵横，建有完善的地下排水系统。这表明（ ）', opts:['哈拉帕文明此时已经进入高度发达的铁器时代', '古印度文明是典型的海洋商业文明的代表', '古印度早期文明已具有较高的城市规划水平', '摩亨佐·达罗是佛教徒朝圣的重要圣地'], ans:2, explain:'遗址整齐的规划与完善的排水系统，说明古印度早期城市文明已达到较高水平，是古印度文明发端的见证。', src:'综合提升·模拟训练'},
{id:'f4-61', lesson:4, diff:5, stem:'古印度的种姓制度与我国西周的分封制都以等级划分为特征。二者最根本的区别在于（ ）', opts:['两者都以出身划分等级，本质完全相同，没有区别', '分封制下完全没有奴隶存在，与种姓制度存在本质上的区别', '种姓制度远比分封制先进，促进了印度社会发展进步', '种姓按血缘职业世袭且宗教色彩浓厚，分封制按宗法血缘分封土地'], ans:3, explain:'种姓制度以宗教外衣和职业世袭固定等级，分封制以宗法血缘为纽带分封土地建立等级，二者都是维护统治的等级制度但基础不同。', src:'综合提升·模拟训练'},
{id:'f4-62', lesson:4, diff:5, stem:'佛教创立后向亚洲各国广泛传播：北传经中亚进入中国，再传至朝鲜、日本；南传经斯里兰卡传入东南亚。这说明（ ）', opts:['佛教传播促进了亚洲各国文化交流', '佛教只在印度境内传播', '佛教是政治制度而非宗教', '佛教传播导致印度文明灭亡'], ans:0, explain:'佛教向亚洲各地的广泛传播，在促进宗教传播的同时也带动了文化、艺术交流，深刻影响了亚洲各国的文化面貌。', src:'综合提升·模拟训练'},
{id:'z4-61', lesson:4, diff:6, stem:'佛教宣扬"众生平等"，但种姓制度却壁垒森严。佛教的"平等"主张实质上（ ）', opts:['佛教彻底废除了种姓制度，实现了社会完全平等', '对种姓制度既有冲击作用，又并未从根本上否定其存在', '佛教主张政治绝对平均，与种姓制度没有关联', '佛教完全维护婆罗门特权，是种姓制度的守护者'], ans:1, explain:'佛教"众生平等"冲击了婆罗门特权，吸引民众皈依；但佛教并不主张废除等级制度，只是淡化种姓差别，因此既有冲击又有所妥协。', src:'综合提升·模拟训练'},
{id:'z4-62', lesson:4, diff:6, stem:'古代印度人发明了包括“0”在内的十进制计数法，这是人类数学史上的重大突破。其深远意义在于（ ）', opts:['“0”的发明使计数法更加繁琐，运算反而困难', '“0”最早由阿拉伯人发明，经印度人传入欧洲', '“0”的发明使位置计数法得以完善，大大方便了计算', '“0”只在印度国内使用，没有传播到其他地区'], ans:2, explain:'“0”的发明使位置计数体系完备，极大简化了算术运算，并经阿拉伯人传播到欧洲和全世界，深刻影响人类数学发展。', src:'综合提升·模拟训练'},
{id:'u5-61', lesson:5, diff:3, stem:'伯里克利时期，雅典公民可以通过抽签担任公职，公民大会是最高权力机关。这表明当时雅典（ ）', opts:['城邦所有居民都享有充分的民主权利', '国家大权完全由国王一人独揽', '雅典的民主政治模式已推广到全希腊', '实行奴隶主阶级的民主政治'], ans:3, explain:'雅典民主仅限于成年男性公民，妇女、外邦人、奴隶被排除在外，实质是奴隶主阶级的民主。', src:'综合提升·模拟训练'},
{id:'u5-62', lesson:5, diff:3, stem:'希腊城邦的特点是"小国寡民"，各城邦独立自治。形成这一特点的重要原因是（ ）', opts:['希腊地区多山、海岸曲折，被分割成众多小区域', '希腊各邦曾制定法律禁止建立统一的大国', '希腊城邦是被罗马征服之后才各自独立的', '希腊人天生热爱独立分裂，厌恶统一的大国'], ans:0, explain:'希腊多山环海、地形破碎，自然条件将希腊分割为众多独立小区域，这是城邦"小国寡民"形成的重要原因。', src:'综合提升·模拟训练'},
{id:'d5-61', lesson:5, diff:4, stem:'伯里克利宣称："我们的制度被称为民主政治，因为政权在全体公民手中。"但当时雅典人口约40万，享有公民权的仅约4万。这说明雅典民主（ ）', opts:['实现了真正的全民民主参与', '是少数人享有的民主，具有明显的局限性', '赋予了外邦人同等政治权利', '赋予外邦人同等权利'], ans:1, explain:'雅典民主仅限于约4万成年男性公民，占人口多数的奴隶、妇女、外邦人被排除在外，说明其民主是少数人的民主，具有明显局限性。', src:'综合提升·模拟训练'},
{id:'d5-62', lesson:5, diff:4, stem:'雅典设有公民大会、五百人议事会，官职抽签产生；罗马共和国设有执政官、元老院、公民大会和保民官。两者的共同点是（ ）', opts:['两者都实行君主专制统治，国家权力高度集中于君主一人之手', '两者都废除了奴隶制度，实现了全体公民平等', '都具有一定的民主制因素，但实权掌握在贵族或公民上层手中', '两者都实行完全的现代民主制度，无阶级差别'], ans:2, explain:'雅典和罗马共和国都设有公民大会等机构，具有民主制因素，但实权分别掌握在公民上层和贵族元老手中，都是奴隶主阶级的统治。', src:'综合提升·模拟训练'},
{id:'d5-63', lesson:5, diff:4, stem:'亚历山大东征建立地跨欧亚非三洲的大帝国，客观上促进了东西方文化交流，但也伴随暴力征服与掠夺。对亚历山大东征最恰当的评价是（ ）', opts:['它建立了永久统一的文明世界，消除了各国界限', '它使希腊文明彻底消亡，东方文明从此在世界范围内独领风骚', '它只有破坏性，没有任何积极的历史意义可言', '它既有促进文化交流的积极影响，又给被征服地区带来灾难'], ans:3, explain:'亚历山大东征一方面带来战争破坏，另一方面推动希腊文化与东方文化交融，如希腊化时代，应一分为二地评价。', src:'综合提升·模拟训练'},
{id:'f5-61', lesson:5, diff:5, stem:'古埃及、巴比伦、古印度文明发源于大河流域，而古希腊文明则依托海洋发展工商业。对这两种文明类型的认识正确的是（ ）', opts:['文明的形态深受地理环境影响，各有特色', '海洋文明一定优于大河文明', '大河文明没有城市', '海洋文明不需要农业发展'], ans:0, explain:'大河文明依托灌溉农业形成中央集权，海洋文明依托工商业与航海形成城邦民主，地理环境影响文明形态，但并无优劣之分。', src:'综合提升·模拟训练'},
{id:'f5-62', lesson:5, diff:5, stem:'伯里克利在悼念阵亡将士的演说中说："我们的制度不是从我们邻人的制度中模仿得来的……是别人的模范。"但雅典民主与现代民主有本质区别，其根本原因在于（ ）', opts:['雅典城邦人口太多，无法实行有效的民主管理', '雅典民主建立在奴隶制基础上，是少数人的直接民主', '雅典没有成文法律，民主缺乏制度上的保障', '现代民主国家的人口太少，不具有代表性'], ans:1, explain:'雅典民主建立在奴隶制基础之上，只是少数男性公民的直接民主；现代民主建立在公民权利平等基础上，因此两者有本质区别。', src:'综合提升·模拟训练'},
{id:'z5-61', lesson:5, diff:6, stem:'古希腊文化成就辉煌：《荷马史诗》、戏剧、哲学、帕特农神庙、奥林匹克运动会等。这些成就的共同历史价值是（ ）', opts:['这些成就只属于希腊本国，与他国文明无关', '这些成就都是宗教祭祀活动的产物', '奠定了西方文明的基础，影响深远', '这些成就证明希腊文明强于一切东方文明'], ans:2, explain:'古希腊在文学、哲学、艺术、体育等方面的成就深远影响了西方乃至世界文明，是西方文明的重要源头。', src:'综合提升·模拟训练'},
{id:'z5-62', lesson:5, diff:6, stem:'有学者指出：雅典民主是"直接民主"的典型，而近代西方民主是"代议制民主"。两者最根本的区别在于（ ）', opts:['直接民主适用于大国，代议制民主适用于小国城邦的治理实践之中', '直接民主本质上就是君主制的另一种表现形式而已了', '代议制民主缺乏法律保障，因此根本无法有效正常地运转起来运作', '直接民主由全体公民直接决策，代议制民主由公民选举代表行使权力'], ans:3, explain:'雅典直接民主由公民大会直接决策，仅适用于小国寡民；近代代议制民主通过选举代表组成议会行使权力，适应了现代国家治理需要。', src:'综合提升·模拟训练'},
{id:'u6-61', lesson:6, diff:3, stem:'公元前450年左右，罗马颁布了《十二铜表法》，将法律条文刻在铜表上公之于众。其重大意义在于（ ）', opts:['它是罗马第一部成文法，限制了贵族随意解释法律', '它确立了君主专制，加强了国王的统治权力', '它废除了奴隶制度，实现了法律面前人人平等', '它完全保护平民利益，贵族从此失去特权'], ans:0, explain:'《十二铜表法》是罗马第一部成文法，使量刑定罪有了文字依据，限制了贵族对法律的随意解释，是罗马法制建设的第一步。', src:'综合提升·模拟训练'},
{id:'u6-62', lesson:6, diff:3, stem:'公元前27年，屋大维首创"元首制"，独揽大权。这一事件标志着（ ）', opts:['罗马共和国在这一年宣告建立', '罗马由共和国进入帝国时代', '罗马帝国从此走向分裂瓦解', '西罗马帝国从此走向灭亡'], ans:1, explain:'屋大维建立元首制，表面保留共和国形式，实际独揽大权，罗马进入帝国时代。', src:'综合提升·模拟训练'},
{id:'d6-61', lesson:6, diff:4, stem:'公元前3世纪至前2世纪，罗马通过三次布匿战争击败地中海强国迦太基，夺取其海外殖民地。这使罗马（ ）', opts:['统一了意大利半岛', '建立了共和国', '控制了整个地中海地区', '与希腊结盟'], ans:2, explain:'布匿战争使罗马打败迦太基，夺取西地中海霸权，进而扩张为地中海霸主，为罗马帝国形成奠定基础。', src:'综合提升·模拟训练'},
{id:'d6-62', lesson:6, diff:4, stem:'随着罗马对外扩张，外来人口增多，罗马法从只适用于罗马公民的"公民法"发展为适用于帝国境内自由民的"万民法"。这一变化说明（ ）', opts:['罗马法开始维护奴隶利益', '罗马取消了法律', '万民法废除了公民法', '法律的调整适应了统治范围扩大的需要'], ans:3, explain:'罗马由城邦共和国发展为地跨三洲的帝国，原有公民法不再适用，万民法适应了帝国统治境内各族自由民的需要，是法律与时俱进的表现。', src:'综合提升·模拟训练'},
{id:'d6-63', lesson:6, diff:4, stem:'凯撒命人以太阳历为蓝本编制新的历法，称为"儒略历"。后来儒略历经改进成为今天世界通用的（ ）', opts:['公历', '农历', '伊斯兰历', '太阴历'], ans:0, explain:'凯撒编制的儒略历是太阳历的改进，后来经教皇格里高利修订为格里高利历（公历），成为今天世界通用的历法。', src:'综合提升·模拟训练'},
{id:'f6-61', lesson:6, diff:5, stem:'罗马人征服希腊后，有谚语称："被征服的希腊人征服了征服者。"对这句话理解正确的是（ ）', opts:['希腊凭借强大的武力征服了罗马，使罗马沦为它的附庸', '罗马在文化上被希腊文化深刻影响，大量吸收希腊文化', '罗马人始终排斥希腊文化，从不加以吸收借鉴', '希腊文明从此消亡，罗马文明完全取而代之'], ans:1, explain:'罗马虽在武力上征服希腊，但在文化上却深受希腊影响，广泛吸收希腊哲学、文学、艺术，故称"被征服的希腊人征服了征服者"。', src:'综合提升·模拟训练'},
{id:'f6-62', lesson:6, diff:5, stem:'近代《拿破仑法典》等多部欧洲法律都深受罗马法影响。罗马法对近代世界影响深远，主要在于它（ ）', opts:['罗马法确立了民主共和制度体系，是近代民主制度的来源', '罗马法废除了奴隶制度，保障了所有人的权利', '奠定了欧洲民法的基础，提出了许多影响深远的法律原则', '罗马法确立了君主立宪制度，为英国所借鉴'], ans:2, explain:'罗马法中关于所有权、债权、契约等原则成为近代欧洲民法的蓝本，奠定了欧洲民法的基础，影响延续至今。', src:'综合提升·模拟训练'},
{id:'z6-61', lesson:6, diff:6, stem:'西罗马帝国灭亡的原因包括：奴隶制经济危机、政治腐败、日耳曼人入侵等。对此理解最准确的是（ ）', opts:['罗马帝国是被日耳曼人一次进攻灭亡的', '奴隶制经济比封建经济先进', '西罗马灭亡后西欧立即进入近代', '罗马的衰亡是内外因素共同作用的结果'], ans:3, explain:'西罗马帝国灭亡是奴隶制危机、政治腐败等内部因素与蛮族入侵等外部因素共同作用的结果，标志西欧进入中世纪。', src:'综合提升·模拟训练'},
{id:'z6-62', lesson:6, diff:6, stem:'《汉谟拉比法典》与《十二铜表法》都刻于石/铜表公布于世。比较二者，下列认识正确的是（ ）', opts:['都维护奴隶主利益，但十二铜表法对自由民较平等', '两者都确立了民主政治，充分保障了公民的权利', '《汉谟拉比法典》比《十二铜表法》更加民主进步', '两者都废除了奴隶制度，实现了法律面前人人平等'], ans:0, explain:'两法都维护奴隶主利益，但《汉谟拉比法典》对不同等级区别对待，《十二铜表法》限制贵族随意解释法律，在自由民内部具有一定平等色彩，体现了进步。', src:'综合提升·模拟训练'},
{id:'u7-61', lesson:7, diff:3, stem:'封君封臣制下，封臣宣誓效忠、为封君服兵役，封君则授予封臣土地。这种关系的纽带是（ ）', opts:['血缘关系', '土地', '宗教信仰', '货币'], ans:1, explain:'封君封臣制以土地为纽带：封君赐地，封臣效忠服役，形成层层分封的封建等级关系。', src:'综合提升·模拟训练'},
{id:'u7-62', lesson:7, diff:3, stem:'481年，克洛维建立法兰克王国并皈依基督教，取得教会支持。这产生的重要影响是（ ）', opts:['克洛维随即废除了封建等级制度', '法兰克王国立即强大成为罗马帝国那样的国家', '基督教成为西欧封建社会的精神支柱', '教会从此彻底失去对整个社会的影响力'], ans:2, explain:'克洛维皈依基督教使教会与王权结合，基督教逐渐成为西欧封建社会的精神支柱，深刻影响西欧历史。', src:'综合提升·模拟训练'},
{id:'d7-61', lesson:7, diff:4, stem:'"我的附庸的附庸不是我的附庸"反映了西欧封君封臣制的特点是（ ）', opts:['国王拥有至高无上的权力，可以直接号令全国', '所有附庸都直接效忠国王，根本不存在中间领主等级一说', '西欧实行中央集权，地方事务由国王直接管理', '封臣只对自己的直接封君负责，封建等级关系具有松弛性'], ans:3, explain:'西欧封君封臣制层层分封，每一级封臣只对自己的直接封君效忠，国王未必能号令所有封臣，体现了封建关系的特点。', src:'综合提升·模拟训练'},
{id:'d7-62', lesson:7, diff:4, stem:'800年，教皇为查理曼加冕称帝，查理曼也以基督教保护者自居。这一事件反映了（ ）', opts:['教权与王权相互利用、彼此扶持', '查理曼宣布废除基督教信仰', '教皇已经完全控制了西欧的世俗政权', '西欧的政教关系完全分离'], ans:0, explain:'教皇为王加冕提高王权合法性，王权庇护教会扩张势力，二者相互利用，反映了中世纪教权与王权的结合。', src:'综合提升·模拟训练'},
{id:'d7-63', lesson:7, diff:4, stem:'843年，查理曼帝国一分为三。这一分裂的重要历史影响是（ ）', opts:['分裂直接导致罗马帝国灭亡，加速帝国崩溃', '形成了日后德意志、法兰西、意大利三个国家的雏形', '分裂消灭了西欧封建制度，进入资本主义社会', '分裂使基督教随之分裂，欧洲宗教长期对立'], ans:1, explain:'《凡尔登条约》三分帝国，奠定了近代德意志、法兰西、意大利三国的雏形，深刻影响欧洲政治版图。', src:'综合提升·模拟训练'},
{id:'f7-61', lesson:7, diff:5, stem:'西欧的封君封臣制与我国西周分封制都通过分封土地建立等级关系。二者最本质的差异在于（ ）', opts:['西周分封制下没有等级差别，人人地位平等', '两者完全一样，都是以血缘为纽带的等级制度', '分封制重宗法血缘，封君封臣制重土地契约关系', '封君封臣制废除了土地私有，全面实行公有制'], ans:2, explain:'西周分封制以宗法血缘为纽带层层分封；西欧封君封臣制以土地授受和契约效忠为纽带，封臣只效忠直接封君，二者本质不同。', src:'综合提升·模拟训练'},
{id:'f7-62', lesson:7, diff:5, stem:'有学者指出：西欧封建制度是建立在"土地"与"人身依附"双重基础上的等级体系。对此理解正确的是（ ）', opts:['封建等级完全依靠武力维持，与经济没有关联', '封建关系纯粹是经济契约关系，并不带有任何政治色彩可言', '西欧不存在人身依附，农奴可自由迁徙流动', '土地是封建等级的物质基础，人身依附将农奴固定在土地上'], ans:3, explain:'西欧封建制度中，土地是等级关系的物质基础，农奴与领主之间的人身依附关系使其束缚在土地上，二者共同构成封建制度基础。', src:'综合提升·模拟训练'},
{id:'z7-61', lesson:7, diff:6, stem:'中世纪西欧的骑士以忠诚、尚武、保护弱者为信条，同时也深受基督教影响，参加宗教战争。这说明（ ）', opts:['骑士阶层融合了封建忠君观念与基督教信仰', '骑士完全不受封君约束', '骑士精神是纯粹的世俗文化传统', '骑士是现代军队的前身'], ans:0, explain:'骑士既效忠封君、崇尚武力，又受基督教文化浸润，其精神兼具封建忠诚与宗教信仰，是中世纪封建等级与基督教文化结合的产物。', src:'综合提升·模拟训练'},
{id:'z7-62', lesson:7, diff:6, stem:'有学者把西欧封建等级比作"金字塔"：国王在塔尖，各级封建主在中层，农奴在底层。这一结构的物质基础是（ ）', opts:['商业贸易', '庄园经济', '海外殖民', '奴隶劳动'], ans:1, explain:'西欧封建等级金字塔以庄园经济为基础：庄园是自给自足的经济单位，领主依靠庄园剥削农奴维持等级地位，故庄园经济是封建制度的基础。', src:'综合提升·模拟训练'},
{id:'u8-61', lesson:8, diff:3, stem:'西欧中世纪庄园内，耕地、林地、牧场一应俱全，粮食、衣物大多在庄园内生产，很少对外交换。这表明庄园经济（ ）', opts:['高度开放', '商品繁荣', '自给自足', '完全封闭'], ans:2, explain:'庄园内自产自用、很少对外交换，是自给自足的经济单位，成为西欧中世纪社会的基础。', src:'综合提升·模拟训练'},
{id:'u8-62', lesson:8, diff:3, stem:'10世纪起，西欧城市重新兴起，以手工业和商业为中心。推动城市兴起的主要原因是（ ）', opts:['国王主动下令建造新城', '罗马帝国的城市政策推动', '基督教在城市中的广泛传播与影响', '农业技术进步与商品经济发展'], ans:3, explain:'农业技术进步提高产量，手工业分工扩大，商品经济发展，使以工商业为中心的城市得以复兴。', src:'综合提升·模拟训练'},
{id:'d8-61', lesson:8, diff:4, stem:'庄园法庭负责审理庄园内的纠纷，维护公共秩序。但法庭的审判往往偏袒领主利益，罚金也大多归领主所有。这说明庄园法庭（ ）', opts:['既维护庄园秩序，又成为领主压迫农民的工具', '庄园法庭独立于封建制度之外，始终保持中立', '庄园法庭废除了农奴制度，农民从此获得自由', '庄园法庭完全代表农民利益，与领主直接对立'], ans:0, explain:'庄园法庭一方面维护庄园秩序，另一方面受领主控制，偏袒领主利益，是封建统治工具与秩序维护者的统一。', src:'综合提升·模拟训练'},
{id:'d8-62', lesson:8, diff:4, stem:'中世纪西欧城市通过金钱赎买或武装斗争争取自治权，如琅城起义。城市自治斗争的意义在于（ ）', opts:['城市自治彻底推翻了封建制度，建立起民主政权', '有利于城市工商业发展，为市民阶层成长创造条件', '城市自治立即建立了共和国，全面实行民主管理', '城市自治使国王失去统治，全国陷入混乱之中'], ans:1, explain:'城市争取自治权的斗争削弱了封建领主对城市的控制，促进工商业发展，市民阶层逐渐形成，为近代资产阶级的产生奠定基础。', src:'综合提升·模拟训练'},
{id:'d8-63', lesson:8, diff:4, stem:'12世纪，博洛尼亚大学因商业纠纷和诉讼增多而兴起，以法律研究著称；巴黎大学以神学与哲学闻名。大学的兴起主要源于（ ）', opts:['国王强制要求设立大学', '教皇颁布的行政命令所致', '城市经济与社会发展的需要', '继承古希腊的文化遗产'], ans:2, explain:'城市工商业发展需要专门人才，商业诉讼需要法律知识，大学应社会发展需要而生，被誉为"中世纪最美丽的花朵"。', src:'综合提升·模拟训练'},
{id:'f8-61', lesson:8, diff:5, stem:'有学者认为：西欧城市的兴起"不仅打破了庄园的自给自足，还孕育了一个新的社会力量"。这里的"新的社会力量"是指（ ）', opts:['封建领主', '农奴', '骑士', '市民阶层'], ans:3, explain:'城市工商业者形成市民阶层，他们追求自由与自治，后来成为资产阶级的前身，是瓦解封建制度的新兴力量。', src:'综合提升·模拟训练'},
{id:'f8-62', lesson:8, diff:5, stem:'中世纪大学拥有一定的自治权，如巴黎大学可自主管理内部事务、颁发学位。这种"大学自治"传统对近代的影响是（ ）', opts:['为近代大学学术自由与自主办学传统奠定基础', '大学自治使大学脱离社会，失去实际作用', '大学自治导致神学垄断一切，科学无从发展', '大学自治阻碍了教育发展，学术日益僵化'], ans:0, explain:'中世纪大学争取到一定自治权，形成学术自由与自主办学的传统，为近代大学的独立发展奠定了基础。', src:'综合提升·模拟训练'},
{id:'z8-61', lesson:8, diff:6, stem:'中世纪城市市民与封建领主的斗争，以及庄园制度的瓦解，对西欧历史进程的深远意义在于（ ）', opts:['市民与领主的斗争直接建立了资本主义制度', '为资本主义萌芽和近代资产阶级的产生准备了条件', '这些斗争使西欧退回原始社会，文明发生倒退', '城市的发展消灭了基督教，欧洲走向彻底世俗化'], ans:1, explain:'城市工商业发展、市民阶层壮大、庄园瓦解，为资本主义萌芽的产生和资产阶级的形成准备了社会经济条件，是西欧向近代转型的重要环节。', src:'综合提升·模拟训练'},
{id:'z8-62', lesson:8, diff:6, stem:'比较中世纪西欧城市与古代中国城市，下列认识正确的是（ ）', opts:['两者都以工商业为主，经济结构完全相同，没有差异', '两者都实行民主自治，由城市居民共同管理公共事务', '西欧城市重工商业并争取自治，中国城市为政治军事中心', '两者都独立于王权之外，完全不受国家政权的管辖'], ans:2, explain:'中世纪西欧城市以工商业为中心并争取自治；古代中国城市主要是政治和军事中心，经济上依附于中央集权，两者性质不同。', src:'综合提升·模拟训练'},
{id:'u9-61', lesson:9, diff:3, stem:'拜占庭帝国又称东罗马帝国，定都君士坦丁堡，地跨欧亚非三洲，1453年被奥斯曼帝国所灭。下列说法正确的是（ ）', opts:['拜占庭帝国从未受到过外族的入侵', '君士坦丁堡现在就是希腊的雅典', '拜占庭帝国与基督教毫无关联', '拜占庭帝国保存了古希腊罗马文化'], ans:3, explain:'拜占庭帝国继承并保存了大量希腊罗马古典文化，为文艺复兴提供了精神养料；1453年君士坦丁堡被奥斯曼攻陷，帝国灭亡。', src:'综合提升·模拟训练'},
{id:'u9-62', lesson:9, diff:3, stem:'查士丁尼统治时期，组织编撰了《罗马民法大全》，包括《查士丁尼法典》《法学汇纂》《法理概要》《新法典》。它的历史地位是（ ）', opts:['罗马法的集大成者，奠定了欧洲民法的基础', '《罗马民法大全》是世界上第一部成文法典', '《罗马民法大全》是最早的民主法典，保障民权', '《罗马民法大全》是近代宪法的蓝本，确立分权'], ans:0, explain:'《罗马民法大全》系统整理了罗马法，是罗马法的集大成者，奠定了欧洲民法的基础，对后世影响深远。', src:'综合提升·模拟训练'},
{id:'d9-61', lesson:9, diff:4, stem:'《罗马民法大全》规定了许多法律原则，如保护私有财产等。它被称为"欧洲民法的基础"，主要是因为（ ）', opts:['它废除了奴隶制度，使法律平等适用于当时的一切人', '它的法律原则被近代欧洲各国立法广泛继承和借鉴', '它只适用于拜占庭，与欧洲其他国家无关', '它是欧洲历史上第一部完整的成文法典'], ans:1, explain:'《罗马民法大全》确立的原则如私有财产神圣、契约自由等被近代欧洲立法继承借鉴，成为欧洲民法的基础。', src:'综合提升·模拟训练'},
{id:'d9-62', lesson:9, diff:4, stem:'拜占庭帝国对基督教、希腊罗马古典文化以及西亚北非的东方文化兼收并蓄，保存了大量典籍。这对欧洲历史最重要的贡献是（ ）', opts:['拜占庭统一了欧洲，建立起跨欧亚的庞大帝国', '拜占庭保存的文化直接引发了工业革命，开启近代化', '保存了古典文化，为后来的文艺复兴提供了丰富的精神养料', '拜占庭消灭了异教文化，保持了文化的纯粹性'], ans:2, explain:'拜占庭保存的希腊罗马典籍和东方文化，在西欧文艺复兴时期传入，成为文艺复兴的重要思想素材。', src:'综合提升·模拟训练'},
{id:'d9-63', lesson:9, diff:4, stem:'拜占庭帝国灭亡的原因包括：长期对外战争消耗国力、十字军东征的洗劫、奥斯曼帝国的进攻等。这些因素说明（ ）', opts:['拜占庭灭亡完全因为奥斯曼', '十字军帮助了拜占庭', '拜占庭过于强大', '拜占庭灭亡是内外因素共同作用的结果'], ans:3, explain:'长期战争、十字军洗劫等内部削弱与奥斯曼进攻等外部压力共同导致拜占庭灭亡，是多种因素综合作用的结果。', src:'综合提升·模拟训练'},
{id:'f9-61', lesson:9, diff:5, stem:'有学者评价拜占庭帝国"犹如一个文化的保存者"，其保存的古典文化"照亮了欧洲的黑暗时代"。对此理解正确的是（ ）', opts:['拜占庭保存的古典文化为西欧文艺复兴准备了条件', '拜占庭的文化完全来自奥斯曼帝国的影响', '拜占庭文化长期封闭，从未向欧洲传播过', '拜占庭文化封闭保守，对欧洲没有任何实际影响'], ans:0, explain:'拜占庭保存的希腊罗马典籍在欧洲中世纪后期传回西欧，为文艺复兴提供了思想文化素材，促进了欧洲的文明复兴。', src:'综合提升·模拟训练'},
{id:'f9-62', lesson:9, diff:5, stem:'《汉谟拉比法典》和《罗马民法大全》都是古代重要法典。比较二者，下列说法正确的是（ ）', opts:['两者都是近代宪法，确立了分权制衡的根本原则与体系', '汉谟拉比法典维护等级特权，罗马民法大全体系完备、是欧洲民法基础', '两者都确立了完善的民主制度，充分保障了公民的一切政治权利', '《罗马民法大全》直接源于《汉谟拉比法典》的继承发展'], ans:1, explain:'《汉谟拉比法典》公开维护等级特权，是古代西亚早期法典；《罗马民法大全》体系完备、原则先进，成为欧洲民法的基础，二者地位不同。', src:'综合提升·模拟训练'},
{id:'z9-61', lesson:9, diff:6, stem:'圣索菲亚大教堂是拜占庭建筑艺术的代表，将穹顶技术与基督教艺术完美结合。这一建筑成就说明（ ）', opts:['拜占庭建筑完全模仿希腊，没有自身特色', '拜占庭不重视宗教，建筑纯为世俗生活服务', '拜占庭文化融合了多种文化元素，具有独特风格', '圣索菲亚大教堂位于罗马，是罗马建筑的典范'], ans:2, explain:'圣索菲亚大教堂融合罗马穹顶技术、希腊建筑艺术与基督教文化，体现拜占庭文化兼收并蓄、独具特色的特点。', src:'综合提升·模拟训练'},
{id:'z9-62', lesson:9, diff:6, stem:'拜占庭帝国早期强大繁荣，后期却封闭保守、固步自封，最终走向衰亡。其兴衰给我们的历史启示是（ ）', opts:['帝国灭亡是历史必然规律，任何国家都无法避免', '封闭保守才能使国家保持长久的稳定与强大', '文化保存不重要，武力才是国家的根本所在', '一个国家必须开放包容、与时俱进才能保持活力'], ans:3, explain:'拜占庭由盛转衰的历史说明：唯有开放包容、与时俱进才能保持国家活力，封闭保守、固步自封必然导致衰落。', src:'综合提升·模拟训练'},
{id:'u10-61', lesson:10, diff:3, stem:'7世纪中期，日本仿效唐朝制度进行大化改新：土地收归国有、实行班田收授法、建立中央集权。大化改新的意义是（ ）', opts:['使日本从奴隶社会向封建社会过渡', '使日本成为世界霸主', '废除了天皇制度', '使日本进入资本主义社会'], ans:0, explain:'大化改新仿唐建立中央集权、土地国有等制度，使日本从奴隶社会向封建社会过渡，推动日本社会发展。', src:'综合提升·模拟训练'},
{id:'u10-62', lesson:10, diff:3, stem:'12世纪末，源赖朝建立镰仓幕府，将军掌握实权，天皇成为名义上的最高统治者。日本进入（ ）', opts:['大化改新时期', '幕府统治时期', '法西斯时期', '明治维新时期'], ans:1, explain:'镰仓幕府建立后，国家实权落入武士阶层（幕府）手中，日本进入幕府统治时期，天皇形同虚设。', src:'综合提升·模拟训练'},
{id:'d10-61', lesson:10, diff:4, stem:'日本先后进行大化改新（7世纪）和明治维新（19世纪）。两次改革的共同点是（ ）', opts:['都保留了幕府统治体制', '都建立了共和政体形式', '都通过学习外来先进制度推动社会发展', '都废除了土地私有'], ans:2, explain:'大化改新学习唐朝制度，明治维新学习西方制度，都是通过借鉴外来先进文明推动日本社会变革与发展的改革。', src:'综合提升·模拟训练'},
{id:'d10-62', lesson:10, diff:4, stem:'大化改新规定：废除豪强私地私民，土地和人民收归国有，再按人头分配土地。其直接目的是（ ）', opts:['全面实行民主政治制度', '推动资本主义经济迅速发展', '不断扩大对外经济贸易往来', '削弱豪强势力，加强中央集权'], ans:3, explain:'大化改新没收豪强私地、实行班田收授，旨在削弱地方豪强势力，加强天皇中央集权。', src:'综合提升·模拟训练'},
{id:'d10-63', lesson:10, diff:4, stem:'日本武士以"忠君为主、崇尚勇武"为信条，逐渐形成武士道。武士道的实质是（ ）', opts:['封建忠君思想，服务于幕府统治', '民主平等的思想观念意识', '现代军队制定的纪律规范体系', '佛教教义学说的体系内容本身'], ans:0, explain:'武士道强调为主君效忠、尚武轻生，本质是维护封建幕府统治的忠君思想。', src:'综合提升·模拟训练'},
{id:'f10-61', lesson:10, diff:5, stem:'大化改新大量吸收唐朝制度，但并未照搬全部，而是结合日本国情加以改造。这反映古代日本文明的特点是（ ）', opts:['完全拒绝学习和吸收一切外来文化', '善于学习借鉴外来文明并结合自身实际', '长期封闭自守，完全隔绝外界交流', '文化发展长期落后于亚洲其他国家'], ans:1, explain:'日本在吸收唐朝制度时结合本国实际改造创新，形成独具特色的日本文化，体现其善于学习、兼容并蓄的特点。', src:'综合提升·模拟训练'},
{id:'f10-62', lesson:10, diff:5, stem:'有学者评价大化改新"是日本历史上划时代的变革"。作出这一评价的主要依据是（ ）', opts:['它废除了天皇', '它使日本征服了中国', '它推动了日本社会制度的根本转型', '它建立了民主国家'], ans:2, explain:'大化改新确立中央集权与封建土地制度，使日本由奴隶社会进入封建社会，实现社会制度的根本转型，故称划时代的变革。', src:'综合提升·模拟训练'},
{id:'z10-61', lesson:10, diff:6, stem:'比较日本大化改新与法兰克王国封建化进程，下列说法正确的是（ ）', opts:['两者都学习唐朝制度，改革的内容完全相同', '两者都建立了强大统一的中央集权大帝国', '法兰克的改革是在学习日本的基础上进行的', '日本仿唐改革建立中央集权，法兰克土地分封形成封建等级'], ans:3, explain:'大化改新是日本天皇学习唐朝制度自上而下改革，确立中央集权；法兰克王国则通过采邑分封形成层层依附的封建等级制，二者路径不同。', src:'综合提升·模拟训练'},
{id:'z10-62', lesson:10, diff:6, stem:'日本幕府统治时期，天皇名义上是最高统治者，实权掌握在将军手中。这一政治格局说明（ ）', opts:['日本政权形式具有“名实分离”的特点', '将军完全服从天皇领导', '幕府统治促进了民主发展', '幕府统治促进了民主'], ans:0, explain:'幕府时期天皇有虚名而无实权，将军掌握实权，形成"名实分离"的二元政治格局，是日本封建政治的独特现象。', src:'综合提升·模拟训练'},
{id:'u11-61', lesson:11, diff:3, stem:'7世纪初，穆罕默德在阿拉伯半岛创立伊斯兰教，宣扬信仰唯一的神安拉。穆罕默德统一阿拉伯半岛后，建立了（ ）', opts:['共和制国家', '政教合一的国家', '封建割据国家', '基督教国家'], ans:1, explain:'穆罕默德创立伊斯兰教并借宗教力量统一半岛，建立政教合一的阿拉伯国家，宗教与政治紧密结合。', src:'综合提升·模拟训练'},
{id:'u11-62', lesson:11, diff:3, stem:'阿拉伯帝国在数学、医学、文学等方面成就突出，如《天方夜谭》（《一千零一夜》）享誉世界。阿拉伯文化的特点是（ ）', opts:['完全排斥一切外来文化', '只注重发展宗教文化', '融合吸收东西方文化，并加以创新', '文化源于中国'], ans:2, explain:'阿拉伯人在吸收希腊、印度、波斯等文化基础上融合创新，形成辉煌的阿拉伯文化，对世界文明作出重要贡献。', src:'综合提升·模拟训练'},
{id:'d11-61', lesson:11, diff:4, stem:'阿拉伯商人在东西方贸易中往来穿梭，把中国的指南针、火药、造纸术等传入西方，又把阿拉伯数字等介绍到欧洲。这表明阿拉伯人是（ ）', opts:['最早的殖民者', '军事征服者', '孤立的海岛民族', '东西方文化交流的桥梁'], ans:3, explain:'阿拉伯人活跃于东西方商路，传播技术、知识与文化，是东西方文化交流的重要桥梁。', src:'综合提升·模拟训练'},
{id:'d11-62', lesson:11, diff:4, stem:'伊斯兰教主张"安拉是唯一的神，穆罕默德是安拉的使者"，并要求信徒服从其领导。这一教义对阿拉伯统一的作用在于（ ）', opts:['促进了阿拉伯半岛的统一', '在半岛上建立了民主国家政体', '彻底废除了半岛上的宗教信仰', '导致阿拉伯半岛走向分裂割据'], ans:0, explain:'伊斯兰教以共同信仰凝聚各部族，穆罕默德借宗教与政治力量统一半岛，宗教成为阿拉伯统一的纽带。', src:'综合提升·模拟训练'},
{id:'d11-63', lesson:11, diff:4, stem:'阿拉伯帝国在巴格达设立"智慧宫"，组织大规模翻译运动，将希腊、波斯、印度的典籍译成阿拉伯文。这一措施的意义在于（ ）', opts:['翻译运动只传播了阿拉伯民族自身的文化成果而已', '保存并传承了东西方文化，为欧洲文艺复兴准备了条件', '翻译运动消灭了外来文化，保持文化纯粹性', '翻译运动阻碍了科学进步，浪费了大量人力'], ans:1, explain:'翻译运动保存了大量古典典籍，阿拉伯人加以研究创新，这些知识后来传入欧洲，为文艺复兴和近代科学准备了条件。', src:'综合提升·模拟训练'},
{id:'f11-61', lesson:11, diff:5, stem:'阿拉伯帝国幅员辽阔、文化繁荣，与唐朝有过密切交往。材料：唐朝杜环在《经行记》中记载了大食（阿拉伯）的繁荣景象。这说明（ ）', opts:['阿拉伯与唐朝之间毫无往来', '阿拉伯文明完全独立发展起来', '中阿两大文明之间存在交流互鉴', '杜环本人是阿拉伯人'], ans:2, explain:'《经行记》等文献记载表明，唐朝与阿拉伯帝国交往频繁，两大文明通过丝绸之路交流互鉴。', src:'综合提升·模拟训练'},
{id:'f11-62', lesson:11, diff:5, stem:'拜占庭帝国和阿拉伯帝国都曾地跨欧亚非三洲，都对世界文化作出贡献。比较二者，下列说法正确的是（ ）', opts:['两者都完全封闭，拒绝一切外来文化、固守本土传统', '阿拉伯文化完全来自中国，没有自己的创造', '拜占庭比阿拉伯更加开放包容', '拜占庭保存传播古典文化，阿拉伯融合创新东西方文化'], ans:3, explain:'拜占庭侧重保存希腊罗马古典文化，阿拉伯在吸收东西方文化基础上融合创新并广泛传播，两者都以不同方式推动了文明发展。', src:'综合提升·模拟训练'},
{id:'z11-61', lesson:11, diff:6, stem:'《天方夜谭》中商人远航、集市贸易、宫廷生活等故事生动展现了阿拉伯帝国社会风貌。这主要说明（ ）', opts:['文学是认识当时社会历史的重要窗口', '阿拉伯人从来不从事商业活动', '阿拉伯文化缺乏历史文献记载', '《天方夜谭》是一部官方史书'], ans:0, explain:'文学作品反映社会现实，《天方夜谭》中的商业、航海、城市生活等内容，是了解阿拉伯帝国社会经济的重要材料。', src:'综合提升·模拟训练'},
{id:'z11-62', lesson:11, diff:6, stem:'"阿拉伯数字"实际由印度人发明、经阿拉伯人传播而得名。这一史实说明（ ）', opts:['阿拉伯人完全剽窃了印度的数学成果，并没有任何创新之处', '文化传播与创新密不可分，阿拉伯人改造推广了这套数字', '印度数字没有价值，全靠阿拉伯人改造提升', '这套数字由欧洲人独立发明，与印度无关'], ans:1, explain:'印度发明0—9计数法，阿拉伯人改造完善并传播到欧洲，命名"阿拉伯数字"正体现文明在交流传播中被改造创新的过程。', src:'综合提升·模拟训练'},
{id:'u12-61', lesson:12, diff:3, stem:'西非的加纳、马里、桑海等帝国因黄金贸易而繁荣。关于这些帝国，下列说法正确的是（ ）', opts:['它们位于美洲', '它们与欧洲完全隔绝', '它们因控制黄金贸易和商路而兴盛', '它们发明了楔形文字'], ans:2, explain:'西非三大帝国凭借撒哈拉商路的黄金与食盐贸易积累财富、兴盛一时。', src:'综合提升·模拟训练'},
{id:'u12-62', lesson:12, diff:3, stem:'美洲的玛雅、阿兹特克、印加文明创造了灿烂成就。下列属于美洲文明成就的是（ ）', opts:['楔形文字、六十进制', '佛教、种姓制度', '甲骨文、青铜器', '金字塔、历法、玉米种植'], ans:3, explain:'美洲文明创造了独特金字塔建筑、精确历法和玉米等农作物，是世界文明的重要组成部分。', src:'综合提升·模拟训练'},
{id:'d12-61', lesson:12, diff:4, stem:'玛雅人发明了象形文字和精确的历法，并创造了“0”的概念，修建了金字塔。这说明（ ）', opts:['玛雅文明已高度发展', '玛雅人来自欧洲', '玛雅文明毫无成就', '玛雅文明比现代文明先进'], ans:0, explain:'象形文字、精确历法、“0”概念和金字塔建筑，表明玛雅文明已达到较高发展水平，是世界古代文明的重要一支。', src:'综合提升·模拟训练'},
{id:'d12-62', lesson:12, diff:4, stem:'阿兹特克人建造了宏伟的特诺奇蒂特兰城，修建灌溉系统，实行严格的等级统治。其文明特点是（ ）', opts:['以海上贸易为主要经济', '农业发达、城市宏伟、中央集权统治', '完全民主平等', '没有宗教信仰'], ans:1, explain:'阿兹特克文明依托灌溉农业发展，建有宏伟都城，实行中央集权与宗教统治，是美洲农业文明的典型。', src:'综合提升·模拟训练'},
{id:'d12-63', lesson:12, diff:4, stem:'印加帝国修建了贯穿全境的道路网，使用结绳记事，崇拜太阳神。这些成就说明（ ）', opts:['印加人发明了系统文字', '印加帝国是海洋文明', '印加文明具有较强组织能力和独特文化', '印加人不会建筑'], ans:2, explain:'庞大道路网需要强大的组织动员能力，结绳记事与太阳崇拜体现独特文化，说明印加文明组织性强、成就独特。', src:'综合提升·模拟训练'},
{id:'f12-61', lesson:12, diff:5, stem:'美洲文明长期与欧亚大陆隔绝，独立发展出独特的玉米文化、金字塔建筑等。这说明（ ）', opts:['文明的传播是单向的不可逆过程', '美洲文明完全是抄袭埃及文明的结果', '文明的传播是单向的、不可逆的过程', '人类文明具有多元性，各地文明独立发展、各具特色'], ans:3, explain:'美洲文明独立发展出独特成就，说明人类文明是多元的，各区域文明在不同环境下独立发展、各有特色。', src:'综合提升·模拟训练'},
{id:'f12-62', lesson:12, diff:5, stem:'16世纪起，欧洲殖民者入侵美洲，大肆掠夺财富，玛雅、阿兹特克、印加文明遭到毁灭性打击。对此正确的历史认识是（ ）', opts:['殖民掠夺破坏美洲原生文明，给美洲人民带来深重灾难', '美洲文明是自己逐渐衰亡的，与殖民无关', '殖民活动促进了美洲文明进步', '殖民者传播了先进文化，功大于过'], ans:0, explain:'欧洲殖民入侵对美洲文明造成毁灭性破坏，给美洲原住民带来深重灾难，是美洲文明衰落的重要原因。', src:'综合提升·模拟训练'},
{id:'z12-61', lesson:12, diff:6, stem:'比较玛雅、阿兹特克、印加三大美洲文明，其共同点是（ ）', opts:['三大文明都创造了相当成熟的文字系统与体系', '都以农业为基础，崇拜神灵，取得突出建筑成就', '三大文明都位于南美洲地区发展', '三大文明都建立了完备的民主制度'], ans:1, explain:'三大文明都以玉米等农业为基础，信奉多神/太阳神，修建金字塔等宏伟建筑，创造了独特的农业文明成就。', src:'综合提升·模拟训练'},
{id:'z12-62', lesson:12, diff:6, stem:'美洲文明的衰落既有内部因素（如农业危机、内乱），更有欧洲殖民入侵的外部因素。这给我们最重要的历史启示是（ ）', opts:['文明的发展完全无法抵抗外来冲击', '封闭自守是保护文明最好的方式', '文明延续需要稳定发展，并抵御外部破坏', '美洲文明的发展水平本来就十分落后'], ans:2, explain:'美洲文明因内外因素走向衰落的历史说明，文明的延续既需要内部稳定发展，也需要抵御外部破坏，应重视保护文明成果。', src:'综合提升·模拟训练'},
{id:'u13-61', lesson:13, diff:3, stem:'文艺复兴运动的核心思想是人文主义，主张以"人"为中心而不是以"神"为中心。其实质是（ ）', opts:['恢复古希腊罗马文化的运动', '宗教改革运动', '封建文化的复兴', '资产阶级的思想解放运动'], ans:3, explain:'文艺复兴表面复兴古典文化，实质是新兴资产阶级借复兴古典文化宣传人文主义、反对封建神学的思想解放运动。', src:'综合提升·模拟训练'},
{id:'u13-62', lesson:13, diff:3, stem:'文艺复兴时期的代表人物及作品对应正确的是（ ）', opts:['但丁——《神曲》', '达·芬奇——《哈姆雷特》', '莎士比亚——《蒙娜丽莎》', '彼特拉克——《最后的晚餐》'], ans:0, explain:'但丁创作《神曲》，是文艺复兴的先驱；达·芬奇有《蒙娜丽莎》《最后的晚餐》；莎士比亚有《哈姆雷特》等四大悲剧。', src:'综合提升·模拟训练'},
{id:'d13-61', lesson:13, diff:4, stem:'有学者说，文艺复兴"并不是对古典文化的简单复兴，而是借复古之名，行创新之实"。其"创新"主要体现在（ ）', opts:['文艺复兴的创新在于照搬古希腊罗马时期的政治制度体系', '宣扬人文主义，冲击封建神学，为近代科学文化发展奠基', '文艺复兴创新在于恢复基督教的绝对权威', '文艺复兴创新在于反对一切文化传统和既有成果'], ans:1, explain:'文艺复兴借复兴古典文化之名，实则宣扬人文主义精神，挑战教会神学权威，推动文学艺术和近代自然科学的产生，本质是创新。', src:'综合提升·模拟训练'},
{id:'d13-62', lesson:13, diff:4, stem:'材料：文艺复兴时期，艺术家们一改中世纪呆板的宗教画风，作品中的圣母开始具有凡人母亲的温柔。这一变化反映的核心思想是（ ）', opts:['圣母形象的变化体现神权至上的思想', '圣母形象的变化体现禁欲主义的主张', '人文主义：肯定人的价值和现世生活', '圣母形象的变化体现理性主义的追求'], ans:2, explain:'艺术作品中人的形象逐渐丰满、贴近生活，体现文艺复兴肯定人的价值和现世生活的人文主义精神。', src:'综合提升·模拟训练'},
{id:'d13-63', lesson:13, diff:4, stem:'文艺复兴运动兴起于意大利并扩展到欧洲各地，其影响是（ ）', opts:['文艺复兴运动只影响意大利本土，未扩展至欧洲', '文艺复兴导致了教会势力的彻底消亡以及宗教的全面衰落', '文艺复兴使欧洲重新进入封建社会而倒退回中世纪', '推动欧洲思想文化繁荣，为资本主义发展奠定思想文化基础'], ans:3, explain:'文艺复兴促进了思想解放和文化繁荣，冲击封建神学，为欧洲资本主义的产生发展奠定了思想文化基础。', src:'综合提升·模拟训练'},
{id:'f13-61', lesson:13, diff:5, stem:'文艺复兴的核心是人文主义，启蒙运动的核心是理性主义。两者的区别在于（ ）', opts:['人文主义肯定人的现世价值，理性主义反对专制、倡导科学民主', '理性主义否定人的价值，主张彻底回归神学统治', '人文主义与理性主义两者完全相同，没有任何区别可言之处', '人文主义主张进一步强化君主专制的统治权力地位'], ans:0, explain:'文艺复兴的人文主义主要反对神学、肯定人性；启蒙运动进一步用理性批判封建专制和等级制度，提出自由平等、三权分立等政治构想。', src:'综合提升·模拟训练'},
{id:'f13-62', lesson:13, diff:5, stem:'文艺复兴首先兴起于意大利的主要原因是（ ）', opts:['意大利被法国占领，带来了先进的异国文化成果', '意大利最早出现资本主义萌芽，工商业繁荣，城市文化发达', '意大利实行民主共和制度，人民享有充分的政治自由权利', '意大利教皇大力支持文艺复兴运动的开展进行'], ans:1, explain:'14世纪意大利工商业发达，最早出现资本主义萌芽，新兴资产阶级需要新的思想文化，加之城市文化繁荣，故文艺复兴首先在意大利兴起。', src:'综合提升·模拟训练'},
{id:'z13-61', lesson:13, diff:6, stem:'中世纪艺术作品围绕宗教教义，人物呆板神圣；文艺复兴时期的艺术作品则注重表现人的现实生活与情感。这一变化的根本原因是（ ）', opts:['艺术风格的转变源于教皇下令进行改革', '艺术风格的转变源于绘画技术上的偶然进步与突破创新', '资本主义萌芽发展，新兴资产阶级要求肯定人的价值', '艺术风格的转变源于人们突然厌倦了宗教生活'], ans:2, explain:'资本主义萌芽推动新兴资产阶级崛起，他们要求摆脱神学束缚、肯定人的价值，反映到艺术上便是人文主义风格的流行。', src:'综合提升·模拟训练'},
{id:'z13-62', lesson:13, diff:6, stem:'文艺复兴对欧洲近代化的深远影响包括：促进思想解放、催生近代自然科学、推动宗教改革等。这体现了（ ）', opts:['文艺复兴只影响艺术', '近代化与思想无关', '宗教改革先于文艺复兴', '思想解放是社会变革的先导'], ans:3, explain:'文艺复兴所倡导的人文主义和理性精神，为近代科学、宗教改革和资产阶级革命奠定了思想基础，说明思想解放是社会变革的先导。', src:'综合提升·模拟训练'},
{id:'u14-61', lesson:14, diff:3, stem:'15世纪末，欧洲人开辟新航路的直接原因是（ ）', opts:['欧洲人对东方商品的需求，奥斯曼帝国阻断了传统商路', '欧洲农业歉收是新航路开辟的直接原因', '中国开放海禁是新航路开辟的直接原因', '美洲大陆发现大量黄金才是新航路开辟的直接原因所在'], ans:0, explain:'欧洲对香料、丝绸等东方商品需求旺盛，而奥斯曼帝国控制传统商路，西欧人迫切寻找通往东方的新航路。', src:'综合提升·模拟训练'},
{id:'u14-62', lesson:14, diff:3, stem:'下列航海家与航线对应正确的是（ ）', opts:['迪亚士——绕过好望角到达印度', '哥伦布——横渡大西洋到达美洲', '达·伽马——完成环球航行', '麦哲伦——到达非洲南端'], ans:1, explain:'哥伦布1492年横渡大西洋"发现"美洲；迪亚士到达好望角，达·伽马到达印度，麦哲伦船队完成环球航行。', src:'综合提升·模拟训练'},
{id:'d14-61', lesson:14, diff:4, stem:'新航路开辟后，欧洲大西洋沿岸工商业繁荣，世界开始连为一个整体。其深远影响不包括（ ）', opts:['促进了欧洲资本主义发展', '世界市场开始形成', '消除了欧洲的阶级对立', '引发了早期的殖民扩张'], ans:2, explain:'新航路开辟促进了欧洲资本主义发展、世界市场雏形出现和殖民扩张，但并未消除阶级对立，反而加剧了社会矛盾。', src:'综合提升·模拟训练'},
{id:'d14-62', lesson:14, diff:4, stem:'麦哲伦船队从欧洲出发，横渡大西洋、太平洋、印度洋，最终回到欧洲，完成人类历史上第一次环球航行。这一壮举直接证明了（ ）', opts:['美洲盛产黄金', '奥斯曼帝国强大', '世界市场形成', '地球是圆的'], ans:3, explain:'麦哲伦船队环球航行以实践证明了地圆学说，是世界航海史上伟大的壮举。', src:'综合提升·模拟训练'},
{id:'d14-63', lesson:14, diff:4, stem:'哥伦布到达美洲后，欧洲人称之为"发现新大陆"，而美洲原住民却视之为灾难的开端。对"发现新大陆"最客观的评价是（ ）', opts:['新航路开辟促进世界联系，也伴随殖民掠夺，具有双重影响', '哥伦布给美洲带来了先进的欧洲文明成果成就', '美洲的原住民应当感谢哥伦布给他们带来了先进的文明进步发展', '哥伦布当时并没有真正到达美洲大陆地区本土'], ans:0, explain:'新航路开辟促进世界连为一体和文明交流，但也开启了对美洲原住民的血腥殖民掠夺，应一分为二地评价。', src:'综合提升·模拟训练'},
{id:'f14-61', lesson:14, diff:5, stem:'明朝郑和下西洋与欧洲新航路开辟几乎同时进行。两者的根本区别在于（ ）', opts:['郑和的船队规模比哥伦布的船队更加庞大宏伟', '郑和远航宣扬国威不图经济利益，欧洲航海追求黄金商业利益', '欧洲国家在远洋航海方面完全没有能力可言之处', '郑和远航与新航路开辟的根本目的完全相同没有任何区别'], ans:1, explain:'郑和下西洋以宣扬国威、发展朝贡关系为目的；欧洲开辟新航路以追求黄金、市场和商业利益为根本动力，性质与影响截然不同。', src:'综合提升·模拟训练'},
{id:'f14-62', lesson:14, diff:5, stem:'材料：哥伦布日记记载："黄金是一个令人惊叹的东西！谁有了它，谁就能支配他想要的一切。"这反映了欧洲开辟新航路的重要动因是（ ）', opts:['传播基督教', '探索科学', '追求黄金财富', '躲避战乱'], ans:2, explain:'对黄金的狂热追求是欧洲人开辟新航路的重要经济动因，反映了资本主义萌芽时期对货币财富的渴求。', src:'综合提升·模拟训练'},
{id:'z14-61', lesson:14, diff:6, stem:'文艺复兴解放了人们的思想，为新航路开辟提供了精神动力；新航路开辟又为资本主义发展积累财富。两者的关系是（ ）', opts:['文艺复兴与新航路开辟相互独立互不产生影响作用', '文艺复兴阻碍了新航路的开辟进程步伐', '新航路开辟在时间上先于文艺复兴发生进行', '思想解放与经济活动相互促进，共同推动欧洲近代化'], ans:3, explain:'文艺复兴传播的地圆说等科学知识和人文精神为新航路开辟创造条件，新航路开辟的财富又滋养资本主义发展，二者相互促进。', src:'综合提升·模拟训练'},
{id:'z14-62', lesson:14, diff:6, stem:'新航路开辟前，世界文明基本处于分散状态；新航路开辟后，世界各地的联系日益密切，世界市场开始形成。这说明（ ）', opts:['新航路开辟使世界从分散走向整体', '新航路开辟并没有产生实际影响', '世界市场在古代时期就已经形成', '全球化在新航路开辟之前就已经完成'], ans:0, explain:'新航路开辟打破了各大洲的相对隔绝，使世界开始连为一个整体，全球联系日益密切，是世界市场形成的开端。', src:'综合提升·模拟训练'},
{id:'u15-61', lesson:15, diff:3, stem:'16世纪起，葡萄牙、西班牙率先走上殖民扩张道路，在亚非拉地区建立殖民据点。早期殖民掠夺的实质是（ ）', opts:['早期殖民掠夺的实质是传播先进文化', '掠夺财富、抢占殖民地，进行资本原始积累', '早期殖民掠夺的实质是促进世界和平', '早期殖民掠夺的实质是帮助落后地区发展'], ans:1, explain:'早期殖民掠夺通过武力征服、抢劫财富、奴役当地人民进行资本原始积累，是资本主义发展初期的血腥扩张。', src:'综合提升·模拟训练'},
{id:'u15-62', lesson:15, diff:3, stem:'"三角贸易"中，欧洲殖民者从非洲贩运大量黑奴到美洲，获取巨额利润。这一贸易对非洲的影响是（ ）', opts:['三角贸易促进了非洲经济发展', '三角贸易向非洲传播了先进的生产技术与发展经验', '使非洲丧失大量人口，造成长期贫困落后', '三角贸易帮助非洲实现统一'], ans:2, explain:'三角贸易使非洲损失约上亿人口，社会生产力遭到严重破坏，是非洲长期落后的重要历史原因。', src:'综合提升·模拟训练'},
{id:'d15-61', lesson:15, diff:4, stem:'三角贸易中，欧洲商人将非洲黑奴贩卖到美洲，再将美洲的蔗糖、烟草等运回欧洲。这一贸易对欧洲的影响是（ ）', opts:['三角贸易使欧洲沦为殖民地地区', '三角贸易使欧洲地区的人口数量出现大量减少的局面', '三角贸易使欧洲的农业走向衰落', '欧洲资本原始积累加快，促进资本主义发展'], ans:3, explain:'三角贸易为欧洲提供巨额利润和原料，加速了欧洲的资本原始积累，促进了欧洲资本主义的发展。', src:'综合提升·模拟训练'},
{id:'d15-62', lesson:15, diff:4, stem:'17—18世纪，英国先后打败西班牙"无敌舰队"、荷兰和法国，最终确立了世界殖民霸权。英国能够取胜的根本原因是（ ）', opts:['英国资本主义经济发达、海军力量强大', '荷兰主动认输投降', '英国地理位置非常优越', '英国地理位置优越'], ans:0, explain:'英国资本主义工商业发达，为争霸战争提供了雄厚的经济基础和强大海军，最终击败对手确立殖民霸权。', src:'综合提升·模拟训练'},
{id:'d15-63', lesson:15, diff:4, stem:'马克思指出："资本来到人间，从头到脚，每个毛孔都滴着血和肮脏的东西。"最能体现这一论断的史实是（ ）', opts:['文艺复兴运动的人文主义精神', '三角贸易和殖民掠夺', '新航路开辟的地理探险活动', '工业革命的技术革新过程'], ans:1, explain:'三角贸易与殖民掠夺以血腥手段攫取财富进行资本原始积累，深刻印证了资本原始积累的血腥本质。', src:'综合提升·模拟训练'},
{id:'f15-61', lesson:15, diff:5, stem:'对早期殖民掠夺的历史作用，下列说法最全面的是（ ）', opts:['殖民掠夺只有破坏性的作用，没有任何积极的意义可言之处', '殖民掠夺促进了世界各国的和平共处交往', '殖民掠夺加速欧洲发展，却给殖民地人民带来深重灾难', '殖民地人民因殖民掠夺而走向富裕强盛'], ans:2, explain:'殖民掠夺加速欧洲资本原始积累，推动其资本主义发展；同时使亚非拉地区长期贫困落后，应一分为二、分清主次地评价。', src:'综合提升·模拟训练'},
{id:'f15-62', lesson:15, diff:5, stem:'葡萄牙、西班牙的殖民扩张以暴力掠夺为主，英国的殖民扩张则带有更多的商业性。造成这种差异的根本原因是（ ）', opts:['两国国力强弱的差异造成了殖民扩张方式的明显不同', '英国拥有比葡萄牙更多的人口数量', '葡萄牙的殖民方式比英国更加文明进步', '两国资本主义发展水平不同，经济利益诉求不同'], ans:3, explain:'葡西封建王权色彩浓厚、以掠夺金银为主，英国资本主义发展水平更高、以商业殖民为主，经济基础决定殖民方式差异。', src:'综合提升·模拟训练'},
{id:'z15-61', lesson:15, diff:6, stem:'早期殖民掠夺给欧洲带来财富，却使非洲丧失人口、美洲文明毁灭、亚洲财富流失。对这段历史的总体评价是（ ）', opts:['欧洲发展建立在殖民地人民苦难之上，具有双重性', '殖民掠夺促进了全球的共同富裕发展', '殖民掠夺是当时完全正义正当的合理行为，应当予以肯定', '殖民掠夺没有任何历史影响可言之处了'], ans:0, explain:'欧洲的资本原始积累建立在殖民地人民的深重苦难之上，历史评价应既看到其对欧洲资本主义的推动，更看到其给殖民地带来的灾难。', src:'综合提升·模拟训练'},
{id:'z15-62', lesson:15, diff:6, stem:'据估计，16—19世纪三角贸易使非洲损失了约上亿人口。这一数据对理解"三角贸易的影响"最重要的意义是（ ）', opts:['非洲人口的大量减少说明欧洲在这一贸易中获得了巨额利润', '非洲人口结构被严重破坏，社会长期动荡落后', '非洲人口减少说明美洲获得劳动力', '非洲人口减少说明世界市场形成'], ans:1, explain:'上亿人口的损失使非洲劳动力锐减、社会结构遭到破坏，是非洲长期贫困落后的重要原因，也说明三角贸易对非洲的灾难性影响。', src:'综合提升·模拟训练'},
{id:'u16-61', lesson:16, diff:3, stem:'17世纪英国资产阶级革命爆发的根本原因是（ ）', opts:['国王查理一世被议会送上了断头台', '法国大革命的影响推动所致', '封建专制统治阻碍了资本主义发展', '殖民地人民的反抗斗争所导致'], ans:2, explain:'斯图亚特王朝的封建专制统治严重阻碍了英国资本主义发展，议会与王权的矛盾激化，最终引发革命。', src:'综合提升·模拟训练'},
{id:'u16-62', lesson:16, diff:3, stem:'1689年英国议会通过《权利法案》，规定国王无权废止法律、征税须经议会同意。这标志着英国确立（ ）', opts:['联邦制', '民主共和制', '总统制', '君主立宪制'], ans:3, explain:'《权利法案》以法律形式限制王权、确立议会主权，英国逐步确立君主立宪制政体。', src:'综合提升·模拟训练'},
{id:'d16-61', lesson:16, diff:4, stem:'1688年英国"光荣革命"后，议会邀请威廉和玛丽共同执政，保留国王但限制其权力。这一事件的实质是（ ）', opts:['资产阶级与封建势力妥协，以和平方式确立资产阶级统治', '光荣革命的实质是国王战胜了议会势力集团', '光荣革命的实质是封建势力完全复辟，并且取得了最终的胜利', '光荣革命的实质是法国干涉英国的内政事务'], ans:0, explain:'光荣革命以不流血方式更换国王，是资产阶级与新贵族同封建势力妥协的结果，确立了资产阶级统治，有利于社会稳定。', src:'综合提升·模拟训练'},
{id:'d16-62', lesson:16, diff:4, stem:'《权利法案》规定：国王不经议会同意不得征税、不得随意废止法律，议会定期召开。这些规定体现的核心原则是（ ）', opts:['国王拥有至上的权力', '议会主权、王权受限', '实行三权分立的体制', '国王实行君主独裁统治'], ans:1, explain:'《权利法案》以法律限制王权、确立议会主权，为英国君主立宪制奠定法律基础。', src:'综合提升·模拟训练'},
{id:'d16-63', lesson:16, diff:4, stem:'英国资产阶级革命是世界近代史上划时代的事件，它推翻了封建君主专制，确立了君主立宪制。其深远影响是（ ）', opts:['英国革命完全恢复了封建专制制度统治秩序', '英国革命的影响范围仅仅限于英国本土之内，并未扩散到海外', '为英国资本主义发展开辟道路，也深刻影响世界历史进程', '英国革命使英国成为民主共和国的政体形式'], ans:2, explain:'英国革命确立的制度优势推动其资本主义快速发展，其革命理念与制度创新对欧美各国资产阶级革命产生深远影响。', src:'综合提升·模拟训练'},
{id:'f16-61', lesson:16, diff:5, stem:'英国确立君主立宪制，美国确立民主共和制（总统制），法国几经反复最终确立共和制。三国政体差异的根源在于（ ）', opts:['三国领导人的个人喜好有所不同', '三国国土面积的大小有所差异', '三国拥有相同的殖民历史背景', '各国国情和阶级力量对比不同'], ans:3, explain:'政体选择由各国历史传统、阶级力量对比和革命进程决定：英国妥协传统深厚选君主立宪，美国没有封建传统选共和，法国阶级斗争激烈反复摇摆。', src:'综合提升·模拟训练'},
{id:'f16-62', lesson:16, diff:5, stem:'克伦威尔在内战胜利后担任"护国主"，实行军事独裁。这一现象说明（ ）', opts:['资产阶级革命具有曲折性、反复性', '英国的革命进程一帆风顺', '克伦威尔完全恢复了封建制度', '议会从此完全失去了作用'], ans:0, explain:'克伦威尔独裁说明资产阶级革命并非一帆风顺，在推翻专制后可能出现新的专制，革命道路具有曲折性和反复性。', src:'综合提升·模拟训练'},
{id:'z16-61', lesson:16, diff:6, stem:'英国革命以"光荣革命"的和平方式收官，确立了君主立宪制。有学者认为英国走的是"渐进式改革"道路。对此理解正确的是（ ）', opts:['光荣革命的结局说明英国资产阶级革命已经彻底失败告终完结', '妥协与制度创新相结合，为资本主义发展提供了稳定的制度环境', '光荣革命说明英国从未发生真正的革命运动历程', '渐进式改革道路比一切革命方式都更优越完善先进'], ans:1, explain:'光荣革命以妥协方式实现制度创新，避免大规模流血，为英国资本主义发展创造了稳定制度环境，这是英国道路的特点而非失败。', src:'综合提升·模拟训练'},
{id:'z16-62', lesson:16, diff:6, stem:'从1215年《大宪章》限制王权，到1689年《权利法案》确立议会主权，英国"王在法下"的传统一脉相承。这说明（ ）', opts:['《大宪章》的颁布直接确立了英国的君主立宪制度', '英国的法律传统完全中断消失', '英国政治制度具有历史延续性和渐进改良特点', '议会与王权之间从未发生斗争'], ans:2, explain:'从《大宪章》到《权利法案》，英国"限制王权、法律至上"的传统延续发展，体现其制度演进的历史连续性。', src:'综合提升·模拟训练'},
{id:'u17-61', lesson:17, diff:3, stem:'美国独立战争爆发的根本原因是（ ）', opts:['波士顿倾茶事件的爆发发生', '法国大革命的影响与推动', '华盛顿当选美国首任总统所造成', '英国殖民统治阻碍了北美资本主义发展'], ans:3, explain:'英国对北美的殖民压榨和经济控制阻碍了北美资本主义发展，殖民地人民与宗主国的矛盾激化，最终爆发独立战争。', src:'综合提升·模拟训练'},
{id:'u17-62', lesson:17, diff:3, stem:'1776年，《独立宣言》发表，宣告北美13个殖民地脱离英国独立。它的进步意义在于（ ）', opts:['宣告了天赋人权、人人生而平等，是资产阶级革命纲领性文件', '《独立宣言》保留了奴隶制，维护殖民统治秩序', '《独立宣言》宣布北美十三州继续作为英国的殖民地长期存在', '《独立宣言》主张废除一切私有财产的制度体系'], ans:0, explain:'《独立宣言》宣告人人生而平等、天赋人权不可侵犯，是资产阶级革命的纲领性文件，但也保留了奴隶制等局限。', src:'综合提升·模拟训练'},
{id:'d17-61', lesson:17, diff:4, stem:'1787年美国宪法规定：国会行使立法权，总统行使行政权，最高法院行使司法权。这体现了（ ）', opts:['确立君主立宪的基本原则', '三权分立、分权制衡原则', '确立中央集权的基本原则', '确立直接民主的基本原则'], ans:1, explain:'1787年宪法确立立法、行政、司法三权分立并相互制衡，是近代第一部比较完善的资产阶级成文宪法。', src:'综合提升·模拟训练'},
{id:'d17-62', lesson:17, diff:4, stem:'《独立宣言》宣称"人人生而平等"，但1787年宪法却默认奴隶制存在，并规定黑人、印第安人按比例折算计入人口。这反映了（ ）', opts:['美国宪法完全平等', '黑人在美国地位很高', '资产阶级民主的阶级局限性', '美国宪法废除了奴隶制'], ans:2, explain:'《独立宣言》的平等理想与宪法保留奴隶制的现实形成反差，说明美国早期民主具有鲜明的阶级局限性，是奴隶主与资产阶级妥协的结果。', src:'综合提升·模拟训练'},
{id:'d17-63', lesson:17, diff:4, stem:'华盛顿领导美国独立战争取得胜利，主持制定1787年宪法，担任美国首任总统。他的主要历史贡献是（ ）', opts:['华盛顿在任期内废除了美国的奴隶制度以及相关的法律体系', '华盛顿建立了君主立宪的制度体制框架', '华盛顿征服了整个美洲大陆地区领土', '实现了美国统一与制度初创，被誉为“美国国父”'], ans:3, explain:'华盛顿领导独立战争、主持制宪、担任首任总统，为美国的建立和制度初创作出奠基性贡献，被誉为"美国国父"。', src:'综合提升·模拟训练'},
{id:'f17-61', lesson:17, diff:5, stem:'英国资产阶级革命、美国独立战争、法国大革命是早期三大资产阶级革命。它们的共同点是（ ）', opts:['都促进了资本主义发展，具有进步意义', '三者都推翻了殖民统治的压迫', '三者都建立了君主立宪制的政体', '三者都废除了封建等级制度体系'], ans:0, explain:'三大革命都以不同方式扫除资本主义发展障碍，促进本国资本主义发展，推动了世界历史进程。', src:'综合提升·模拟训练'},
{id:'f17-62', lesson:17, diff:5, stem:'1787年宪法"三权分立"的设计深受启蒙思想家孟德斯鸠"分权制衡"学说的影响。这说明（ ）', opts:['美国宪法完全照搬了法国的制度', '思想理论对社会制度建构具有指导作用', '孟德斯鸠亲自参与制定了美国宪法', '三权分立原则源于英国的政治传统'], ans:1, explain:'启蒙思想为美国制宪提供了理论武器，说明先进思想对社会制度设计具有重要的指导作用。', src:'综合提升·模拟训练'},
{id:'z17-61', lesson:17, diff:6, stem:'1787年宪法在制宪会议上经过多方妥协：大州与小州按人口/等额分配国会席位、南方与北方在奴隶制问题上的妥协等。这说明（ ）', opts:['美国宪法完美无缺，完全无需修改', '制宪会议上各方没有任何意见分歧', '宪法的制定是各方利益博弈与妥协的结果', '美国宪法完全废除了奴隶制度'], ans:2, explain:'1787年宪法是各方利益妥协的产物，既体现制宪智慧，也保留了奴隶制等局限，是平衡与妥协的结果。', src:'综合提升·模拟训练'},
{id:'z17-62', lesson:17, diff:6, stem:'美国独立战争既是一场民族解放战争，也是一场资产阶级革命。对其"双重性质"理解正确的是（ ）', opts:['美国独立战争仅仅只是一场争取民族解放的战争而已', '美国独立战争只是一场资产阶级的革命', '美国独立战争与英国革命完全相同无异', '它既摆脱殖民压迫实现独立，又扫除资本主义发展障碍'], ans:3, explain:'独立战争既使美国摆脱英国殖民统治、实现民族独立，又确立了资产阶级民主制度，故具有民族解放与资产阶级革命的双重性质。', src:'综合提升·模拟训练'},
{id:'u18-61', lesson:18, diff:3, stem:'1789年7月14日，巴黎人民攻占巴士底狱，法国大革命爆发。大革命爆发的根本原因是（ ）', opts:['封建专制统治与等级制度严重阻碍了资本主义发展', '启蒙思想家的号召是法国大革命的根本原因', '路易十六逃跑是法国大革命的根本原因', '英国支持是法国大革命的根本原因'], ans:0, explain:'法国封建专制和等级制度严重阻碍资本主义发展，第三等级与特权等级矛盾尖锐，加上启蒙思想的影响，最终引发大革命。', src:'综合提升·模拟训练'},
{id:'u18-62', lesson:18, diff:3, stem:'拿破仑于1804年建立法兰西第一帝国，颁布《拿破仑法典》，多次打败反法联盟。对拿破仑最恰当的评价是（ ）', opts:['他是法国大革命事业的掘墓人之一', '他既巩固了大革命成果，又有侵略扩张的一面', '他完全恢复了封建制度的体系与秩序', '他建立了民主共和制的国家政体形式'], ans:1, explain:'拿破仑对内颁布法典巩固大革命成果，对外战争传播革命思想但带有侵略性质，应一分为二评价。', src:'综合提升·模拟训练'},
{id:'d18-61', lesson:18, diff:4, stem:'1789年《人权宣言》宣称：人生来是自由的，权利平等；法律是公共意志的体现；私有财产神圣不可侵犯。其进步意义在于（ ）', opts:['《人权宣言》充分保障了工人的切身利益权益保障', '《人权宣言》彻底废除了私有制制度体系', '否定封建等级制度，宣扬自由平等，是法国大革命纲领', '《人权宣言》重新确立了君主专制的制度体制'], ans:2, explain:'《人权宣言》以法律形式否定封建等级制度，宣扬天赋人权、自由平等，是法国大革命的纲领性文件，具有重大进步意义。', src:'综合提升·模拟训练'},
{id:'d18-62', lesson:18, diff:4, stem:'《拿破仑法典》确认了自由平等、私有财产神圣不可侵犯等原则，被各国广泛借鉴。它的历史地位是（ ）', opts:['《拿破仑法典》是近代世界上颁布的第一部成文宪法', '《拿破仑法典》是法国第一部封建法典', '《拿破仑法典》是世界上最早的法典', '资本主义世界第一部民法典，巩固了法国大革命成果'], ans:3, explain:'《拿破仑法典》以法律形式巩固法国大革命成果，确立资本主义民法原则，是资本主义世界第一部民法典，影响深远。', src:'综合提升·模拟训练'},
{id:'d18-63', lesson:18, diff:4, stem:'法国大革命推翻了封建专制统治，传播了自由平等思想，动摇了欧洲封建制度的基础。它的历史意义是（ ）', opts:['法国历史上规模最大、最彻底的资产阶级革命', '法国大革命仅仅只是法国国内的内部事件而已，影响有限', '法国大革命阻碍了世界历史进程发展', '法国大革命恢复了封建统治秩序'], ans:0, explain:'法国大革命规模宏大、影响深远，彻底摧毁封建制度，传播资产阶级思想，是当时最彻底的资产阶级革命，对世界历史影响深远。', src:'综合提升·模拟训练'},
{id:'f18-61', lesson:18, diff:5, stem:'比较英、美、法三大资产阶级革命，下列说法正确的是（ ）', opts:['三国革命都彻底推翻了本国的封建专制统治', '美国革命具民族独立性质，英国君主立宪，法国最彻底', '三国革命都废除了本国存在的奴隶制度', '三国革命都建立了资产阶级性质的民主共和制度政体'], ans:1, explain:'美国独立战争兼具民族解放性质，英国以妥协确立君主立宪制，法国大革命最彻底地扫荡了封建制度，三国革命各有特点。', src:'综合提升·模拟训练'},
