{id:'f18-62', lesson:18, diff:5, stem:'法国大革命前，伏尔泰、卢梭、孟德斯鸠等启蒙思想家宣扬自由平等、主权在民、三权分立。这些思想对大革命的直接影响是（ ）', opts:['启蒙思想的传播最终导致了法国大革命走向失败', '启蒙思想使大革命失去群众支持', '提供了思想理论武器，为革命作了舆论准备', '启蒙思想对大革命只有消极影响'], ans:2, explain:'启蒙思想批判封建专制、倡导理性与自由，为法国大革命提供了理论武器和舆论准备，是革命的"先导"。', src:'综合提升·模拟训练'},
{id:'z18-61', lesson:18, diff:6, stem:'拿破仑战争一方面传播了大革命思想和《拿破仑法典》，另一方面又进行侵略扩张。对此最全面的评价是（ ）', opts:['拿破仑战争对欧洲只有破坏作用而言罢了', '拿破仑战争与世界历史的发展进程之间毫无任何关系可言之处', '拿破仑只是一个穷兵黩武的战争狂人罢了而已', '它既有传播革命思想的进步性，又有侵略掠夺的破坏性'], ans:3, explain:'拿破仑战争在摧毁欧洲封建秩序、传播大革命思想方面具有进步性，但后期侵略扩张给被占领国人民带来灾难，应辩证评价。', src:'综合提升·模拟训练'},
{id:'z18-62', lesson:18, diff:6, stem:'法国大革命比英国革命更为彻底，其重要原因是（ ）', opts:['法国阶级矛盾尖锐、启蒙思想深入、第三等级力量强大', '英国革命本身没有任何意义可言之处罢了', '法国国内没有任何封建传统的束缚羁绊所在', '法国的人口数量更多，因此革命才进行得更加彻底全面深入'], ans:0, explain:'法国封建等级制度盘根错节、阶级矛盾极为尖锐，启蒙思想为革命提供了彻底的理论指导，使法国大革命成为最彻底的资产阶级革命。', src:'综合提升·模拟训练'},
{id:'u19-61', lesson:19, diff:3, stem:'18世纪60年代，工业革命首先在英国开始，其标志性成就是（ ）', opts:['工业革命的标志性成就是电灯发明', '瓦特改良蒸汽机，成为工业革命的主要标志', '工业革命的标志性成就是汽车诞生', '工业革命的标志性成就是计算机问世'], ans:1, explain:'瓦特改良的蒸汽机解决了动力问题，使人类进入"蒸汽时代"，是工业革命最显著的标志。', src:'综合提升·模拟训练'},
{id:'u19-62', lesson:19, diff:3, stem:'第一次工业革命中，英国工程师史蒂芬孙利用蒸汽机发明了（ ）', opts:['以内燃机为动力的飞机', '以内燃机为动力的汽车', '火车（蒸汽机车）', '以蒸汽机为动力的轮船'], ans:2, explain:'史蒂芬孙1825年试制蒸汽机车成功，开创了铁路时代，推动了交通运输的革命。', src:'综合提升·模拟训练'},
{id:'d19-61', lesson:19, diff:4, stem:'工业革命首先发生在英国的原因包括：资产阶级统治确立、殖民掠夺积累资本、圈地运动提供劳动力、手工工场技术积累等。这说明（ ）', opts:['工业革命的发生仅仅依靠瓦特一人独自完成，与他人无关', '英国科学技术远超世界其他国家', '殖民掠夺是工业革命的唯一原因', '工业革命的发生是多种条件综合作用的结果'], ans:3, explain:'英国率先具备政治前提、资本、劳动力、市场和技术等条件，工业革命是其内部多种因素共同作用的结果。', src:'综合提升·模拟训练'},
{id:'d19-62', lesson:19, diff:4, stem:'瓦特改良蒸汽机后，工厂不再依赖河流水力，可以设在任何地方，机器大生产取代手工工场。这说明蒸汽机的应用（ ）', opts:['推动了工厂制度的确立和生产力的飞跃', '导致大量工人失业并流离失所', '使英国的农业发展走向衰退衰落', '阻碍了工业革命的进一步推进'], ans:0, explain:'蒸汽机提供稳定动力，使工厂摆脱地理限制，推动工厂制度确立，极大地提高了生产力。', src:'综合提升·模拟训练'},
{id:'d19-63', lesson:19, diff:4, stem:'工业革命创造了巨大生产力，但也带来环境污染、贫富分化、工人贫困等问题。对此最恰当的认识是（ ）', opts:['工业革命给人类带来的只有好处，没有任何的坏处与弊端', '工业革命是双刃剑，既有巨大进步又带来社会问题', '应当完全否定工业革命的作用价值意义', '环境污染比社会进步更加重要紧要关键'], ans:1, explain:'工业革命极大推动生产力发展和社会进步，同时带来环境与社会问题，应一分为二地评价，其历史进步性是主要的。', src:'综合提升·模拟训练'},
{id:'f19-61', lesson:19, diff:5, stem:'第一次工业革命以蒸汽动力为主，第二次工业革命以电力为主；前者主要在英国进行，后者美德领先。两次工业革命的共同影响是（ ）', opts:['两次工业革命都只影响了欧洲地区', '两次工业革命都使人类社会进入了电气时代的发展阶段', '都促进了生产力飞跃和资本主义世界市场发展', '两次工业革命都消灭了工人阶级力量'], ans:2, explain:'两次工业革命都以科技进步推动生产力大发展，促使资本主义世界市场最终形成，深刻改变世界面貌。', src:'综合提升·模拟训练'},
{id:'f19-62', lesson:19, diff:5, stem:'材料：工业革命后"资产阶级在它的不到一百年的阶级统治中所创造的生产力，比过去一切世代创造的全部生产力还要多"。这说明（ ）', opts:['工业革命使社会倒退', '资产阶级统治比封建制度落后', '生产力发展无关紧要', '工业革命极大推动了生产力发展'], ans:3, explain:'工业革命使生产力得到空前发展，是历史上生产力的巨大飞跃，也印证了先进制度对生产力发展的促进作用。', src:'综合提升·模拟训练'},
{id:'z19-61', lesson:19, diff:6, stem:'工业革命后，英国凭借强大工业实力，凭借商品和炮舰对外扩张，印度沦为殖民地，中国也被打开国门。这说明（ ）', opts:['工业革命加剧西方对东方的殖民掠夺，东方国家危机加深', '殖民扩张与工业革命这两者之间毫无关联、各自独立发展可言之处可言', '工业革命给世界带来了持久的和平与安宁稳定', '中国与工业革命没有任何关系可言之处了'], ans:0, explain:'工业革命增强了西方列强实力，推动其以商品输出和武力扩张侵略东方，给亚非拉国家带来深重灾难，同时传播先进生产方式。', src:'综合提升·模拟训练'},
{id:'z19-62', lesson:19, diff:6, stem:'工业革命后英国成为"世界工厂"，凭借工业优势主导世界市场。这一地位确立的根本原因是（ ）', opts:['英国国土面积最大是其主导世界市场的原因', '英国率先完成工业革命，生产能力世界领先', '英国人口最多是其主导世界市场的原因', '英国文化发达是其主导世界市场的原因'], ans:1, explain:'英国率先完成工业革命，机器大生产使其工业品成本低、产量大，从而确立世界工厂地位并主导世界市场。', src:'综合提升·模拟训练'},
{id:'u20-61', lesson:20, diff:3, stem:'1848年，马克思、恩格斯发表《共产党宣言》，标志着（ ）', opts:['巴黎公社建立', '第一国际成立', '马克思主义的诞生', '工业革命开始'], ans:2, explain:'《共产党宣言》系统阐述了马克思主义基本原理，它的发表标志着马克思主义的诞生。', src:'综合提升·模拟训练'},
{id:'u20-62', lesson:20, diff:3, stem:'马克思主义由马克思主义哲学、政治经济学和科学社会主义三部分组成。其创始人马克思、恩格斯创立的这一理论诞生的前提是（ ）', opts:['新航路开辟的深远影响与作用', '法国大革命的影响与推动作用', '美国独立战争的推动与影响作用', '工业革命的发展和工人运动的兴起'], ans:3, explain:'工业革命使工人阶级壮大、工人运动兴起，为马克思主义诞生提供了阶级基础和实践条件。', src:'综合提升·模拟训练'},
{id:'d20-61', lesson:20, diff:4, stem:'《共产党宣言》阐述了阶级和阶级斗争学说，指出无产阶级是资本主义的"掘墓人"，并号召"全世界无产者联合起来"。这说明（ ）', opts:['马克思主义为无产阶级革命提供了理论武器', '马克思主义主张阶级间的调和与妥协', '《共产党宣言》全力维护资产阶级的利益', '工人阶级无需组织起来进行斗争反抗'], ans:0, explain:'《共产党宣言》论证无产阶级的历史使命，为工人运动提供了科学的理论指导，是无产阶级革命的行动纲领。', src:'综合提升·模拟训练'},
{id:'d20-62', lesson:20, diff:4, stem:'材料：《共产党宣言》指出，资本主义必然灭亡，共产主义必然胜利。这一论断的依据是（ ）', opts:['这一论断依据的是资本家突然破产倒闭的事实', '生产关系必须适应生产力发展的规律', '这一论断依据的是战争彻底毁灭资本主义的事实', '这一论断依据的是工人数量不断减少的结果'], ans:1, explain:'马克思主义依据生产力与生产关系矛盾运动规律，论证了资本主义被共产主义取代的历史必然性，具有科学性。', src:'综合提升·模拟训练'},
{id:'d20-63', lesson:20, diff:4, stem:'马克思主义诞生后，国际工人运动有了科学理论的指导，进入了新阶段。其意义在于（ ）', opts:['马克思主义诞生结束了工人运动的发展', '马克思主义使工人运动与科学毫无关系可言', '使工人运动从自发斗争发展到自觉斗争的新阶段', '马克思主义只影响了英国工人运动'], ans:2, explain:'马克思主义为工人运动提供科学理论，使其由自发走向自觉，从此国际工人运动蓬勃发展，深刻影响世界历史。', src:'综合提升·模拟训练'},
{id:'f20-61', lesson:20, diff:5, stem:'空想社会主义者主张和平改造社会，马克思则主张通过无产阶级革命推翻资本主义。二者最根本的区别在于（ ）', opts:['空想社会主义的思想体系比马克思主义更加科学进步先进', '马克思主义与空想社会主义没有任何区别', '马克思反对一切形式的暴力革命运动', '马克思主义揭示社会发展规律，主张无产阶级革命'], ans:3, explain:'空想社会主义脱离实际、寄望于道德劝诫；马克思主义基于社会发展规律，主张无产阶级革命和无产阶级专政，实现了从空想到科学的飞跃。', src:'综合提升·模拟训练'},
{id:'f20-62', lesson:20, diff:5, stem:'有学者称马克思主义是"科学理论"，其"科学性"主要体现在（ ）', opts:['揭示了人类社会发展的客观规律', '依赖宗教教义', '凭主观愿望设计未来', '完全否定资本主义生产力'], ans:0, explain:'马克思主义立足社会现实，揭示了生产力与生产关系、经济基础与上层建筑矛盾运动的规律，科学论证了社会发展方向。', src:'综合提升·模拟训练'},
{id:'z20-61', lesson:20, diff:6, stem:'马克思主义诞生后，对国际共产主义运动、俄国十月革命和中国特色社会主义实践都产生了深远影响。这说明（ ）', opts:['马克思主义的适用性只限于欧洲国家', '科学理论指导实践，并在实践中不断发展', '理论与实践之间没有任何的关系可言', '马克思主义的理论在当今已经过时失效'], ans:1, explain:'马克思主义指导了世界无产阶级革命和社会主义建设，并在实践中不断丰富发展，体现了科学理论的强大生命力。', src:'综合提升·模拟训练'},
{id:'z20-62', lesson:20, diff:6, stem:'《共产党宣言》代表无产阶级利益，《人权宣言》代表资产阶级利益。比较二者，正确的是（ ）', opts:['两个宣言都主张消灭私有制度体系本身', '两个宣言的内容完全一致没有任何区别差异', '共产党宣言主张革命和公有，人权宣言维护私有财产', '《人权宣言》比《共产党宣言》更进步先进一些'], ans:2, explain:'《共产党宣言》主张无产阶级革命、消灭私有制；《人权宣言》保护私有财产、维护资产阶级利益，二者立场根本对立。', src:'综合提升·模拟训练'},
{id:'u21-61', lesson:21, diff:3, stem:'1864年，"国际工人协会"（第一国际）成立，马克思是创始人之一并领导其工作。第一国际的成立反映了（ ）', opts:['说明社会主义制度已经建立', '说明资本主义的发展十分顺利', '说明工人阶级已经放弃了斗争反抗', '国际工人运动进入联合斗争的新阶段'], ans:3, explain:'第一国际推动各国工人联合斗争，标志着国际工人运动进入有组织、有联合的新阶段。', src:'综合提升·模拟训练'},
{id:'u21-62', lesson:21, diff:3, stem:'1871年，巴黎公社成立，它是无产阶级建立政权的第一次伟大尝试。其最重要的历史意义是（ ）', opts:['它是无产阶级建立政权的第一次伟大尝试', '巴黎公社恢复了旧的封建制度', '巴黎公社只是法国的一次普通起义', '巴黎公社成功建立了社会主义国家'], ans:0, explain:'巴黎公社虽仅存在72天，但它是无产阶级建立政权的第一次伟大尝试，其经验和教训丰富了马克思主义。', src:'综合提升·模拟训练'},
{id:'d21-61', lesson:21, diff:4, stem:'巴黎公社成立后，采取了一系列措施：废除旧军队、旧警察，由选举产生公社委员，公职人员薪金与工人相当等。这些措施表明巴黎公社（ ）', opts:['这表明巴黎公社是资产阶级改良运动', '是无产阶级性质的新型政权', '这表明巴黎公社只是经济领域的改革', '这表明巴黎公社恢复了封建等级秩序'], ans:1, explain:'巴黎公社打碎旧的国家机器，建立由人民选举产生的新型政权，是无产阶级性质的国家政权雏形。', src:'综合提升·模拟训练'},
{id:'d21-62', lesson:21, diff:4, stem:'巴黎公社仅存在72天便遭镇压。其失败的根本原因是（ ）', opts:['工人战斗力太弱是巴黎公社失败的根本原因', '法国人民不支持是巴黎公社失败的根本原因', '缺乏马克思主义政党的领导，客观条件不成熟', '马克思领导不力是巴黎公社失败的根本原因'], ans:2, explain:'巴黎公社失败的根本原因是当时法国资本主义尚处于上升期，无产阶级力量弱小，且缺乏马克思主义政党的正确领导。', src:'综合提升·模拟训练'},
{id:'d21-63', lesson:21, diff:4, stem:'《国际歌》由巴黎公社诗人欧仁·鲍狄埃创作，成为全世界无产阶级的战歌。它诞生的背景是（ ）', opts:['《国际歌》是在工业革命完成之时诞生的', '《国际歌》是在第一国际成立之时诞生的', '《国际歌》是在十月革命胜利之时诞生的', '巴黎公社失败后，鲍狄埃以诗歌抒发无产阶级的斗志'], ans:3, explain:'巴黎公社失败后，鲍狄埃创作《国际歌》歌词，表达无产阶级不屈的斗争精神，后经谱曲传遍世界。', src:'综合提升·模拟训练'},
{id:'f21-61', lesson:21, diff:5, stem:'比较巴黎公社与俄国十月革命，正确的是（ ）', opts:['巴黎公社缺乏马克思主义指导而失败，十月革命则取得了胜利', '巴黎公社与十月革命都取得了最终的胜利成功结局', '巴黎公社与十月革命都建立了社会主义性质的国家政权', '十月革命爆发时没有任何理论上的指导可言之处'], ans:0, explain:'巴黎公社缺乏马克思主义政党领导、客观条件不成熟而失败；十月革命有列宁和布尔什维克党领导，依据马克思主义成功建立社会主义国家。', src:'综合提升·模拟训练'},
{id:'f21-62', lesson:21, diff:5, stem:'巴黎公社失败的教训包括：缺乏统一的马克思主义政党领导、未建立工农联盟、未掌握银行等。这些教训说明（ ）', opts:['巴黎公社的失败说明公社本身毫无价值可言之处', '无产阶级革命要坚持以马克思主义为指导并讲求战略策略', '巴黎公社的失败说明革命不需要科学理论指导', '巴黎公社的失败说明工人起义注定会走向失败'], ans:1, explain:'巴黎公社的经验教训证明，无产阶级革命必须有马克思主义政党领导、联合农民、掌握经济命脉，这些认识丰富和发展了马克思主义。', src:'综合提升·模拟训练'},
{id:'z21-61', lesson:21, diff:6, stem:'马克思曾总结巴黎公社"是终于发现的、可以使劳动在经济上获得解放的政治形式"。这说明（ ）', opts:['巴黎公社完全照搬了马克思主义', '公社制度完美无缺', '巴黎公社的实践验证和发展了马克思主义', '马克思主义拒绝实践检验'], ans:2, explain:'巴黎公社的实践为马克思主义提供了经验，马克思从中总结无产阶级专政的形式，体现了理论与实践的相互作用。', src:'综合提升·模拟训练'},
{id:'z21-62', lesson:21, diff:6, stem:'从早期工人捣毁机器的"卢德运动"，到英国宪章运动争取普选权，再到巴黎公社建立政权，工人运动发展的轨迹说明（ ）', opts:['工人运动的发展方向一直在不断地倒退退化', '工人完全不需要组织起来进行斗争反抗', '工人运动与任何理论都没有关系可言之处', '工人运动从自发走向自觉，从经济斗争上升到政治斗争'], ans:3, explain:'工人运动由捣毁机器的自发斗争，发展到争取政治权利，再到建立政权的自觉斗争，体现了阶级觉悟和组织程度的不断提高。', src:'综合提升·模拟训练'},
{id:'z1-63', lesson:1, diff:6, stem:'恩格斯说：“国家是社会在一定发展阶段上的产物……是承认这个社会陷入了不可解决的自我矛盾。”据此理解，国家产生的根本原因是（ ）', opts:['阶级矛盾不可调和', '部落联盟的瓦解', '文字和城市的出现', '私有制的萌芽'], ans:0, explain:'恩格斯指出国家是阶级矛盾不可调和的产物。私有制发展导致贫富分化与阶级对立，国家作为维护阶级统治的暴力机器应运而生；文字、城市是文明标志而非国家产生的根本原因。', src:'综合提升·模拟训练'},
{id:'z1-64', lesson:1, diff:6, stem:'史料实证是历史学习的基本方法。要研究“原始社会”时期人类的生产生活状况，下列史料价值最高的是（ ）', opts:['后世史学家撰写的通史著作', '考古发掘的原始人遗骨与石器', '神话传说中关于造人的故事', '近代学者对原始社会的想象复原图'], ans:1, explain:'原始社会没有文字记载，考古发掘的地下遗存（遗骨、工具、遗迹）是第一手实物史料，可信度最高；后世著作、神话传说和想象复原都属间接或口述性资料，价值低于实物证据。', src:'综合提升·模拟训练'},
{id:'z2-63', lesson:2, diff:6, stem:'《汉谟拉比法典》规定：自由民伤害同等地位自由民之眼，应“以眼还眼”；但伤害奴隶之眼，仅赔偿一定白银。这一规定直接说明法典（ ）', opts:['体现同态复仇原则，说明法律对所有人一律平等', '保护自由民利益，奴隶的权益也得到同等保障', '维护奴隶主阶级利益，法律面前存在等级差异', '废除奴隶制度，确立了人人平等的法律原则'], ans:2, explain:'法典对自由民与奴隶采用不同处罚标准，明显维护奴隶主和自由民的利益，反映法律在阶级社会中带有强烈的等级性与阶级性；所谓“以眼还眼”只适用于同等地位者之间。', src:'综合提升·模拟训练'},
{id:'z2-64', lesson:2, diff:6, stem:'楔形文字与甲骨文都是人类早期文字。比较二者，下列说法正确的是（ ）', opts:['两种文字都源于古埃及象形文字', '甲骨文早于楔形文字，是世界上最早的文字', '两种文字都发展成了拼音文字', '楔形文字早于甲骨文出现，且均由图画符号发展而来'], ans:3, explain:'楔形文字由苏美尔人创造于约公元前3500年，甲骨文约出现于商朝（前1600年左右），楔形文字更早；两者都由图画符号逐步演变为表意符号，是研究各自文明的第一手史料。', src:'综合提升·模拟训练'},
{id:'z3-63', lesson:3, diff:6, stem:'古埃及人修建金字塔前后历时千年，动用人力数十万。对金字塔的历史评价，下列认识最全面的是（ ）', opts:['它是古埃及奴隶制经济发展的产物，凝结了古埃及人民的智慧', '它是外星文明留下的遗迹，与古埃及的社会发展没有任何关系', '它纯粹是劳民伤财的工程，对古埃及文明毫无贡献', '它只是法老的陵墓，与古埃及的文化成就不相干涉'], ans:0, explain:'金字塔是法老权力的象征，其修建以强大的中央集权和奴隶制经济为基础，同时反映古埃及在天文、数学、建筑等方面的杰出成就，应辩证看待其压迫性与文明贡献。', src:'综合提升·模拟训练'},
{id:'z3-64', lesson:3, diff:6, stem:'古埃及文明发源于尼罗河流域，古希腊历史学家希罗多德说“埃及是尼罗河的赠礼”。对这句话的理解最准确的是（ ）', opts:['古埃及文明完全依赖尼罗河，埃及人自身没有任何创造', '尼罗河定期泛滥带来肥沃土壤，为古埃及文明诞生发展提供了物质基础', '尼罗河文明晚于两河流域文明，在产生过程中受到其直接影响', '尼罗河是古埃及唯一的河流，其他条件无足轻重'], ans:1, explain:'尼罗河每年定期泛滥形成肥沃淤泥，滋养农业、统一经济和集权国家，是古埃及文明产生的重要自然条件；但文明成就仍由古埃及人创造，并非“纯自然赠予”。', src:'综合提升·模拟训练'},
{id:'z4-63', lesson:4, diff:6, stem:'种姓制度下，吠舍须“纳税供养”婆罗门和刹帝利，首陀罗则“不得积累财富”。这说明种姓制度（ ）', opts:['它促进了社会各阶层的自由流动和公平竞争', '它废除了奴隶制度，保障了全体成员平等权利', '以职业世袭和等级隔离维系奴隶制社会的统治秩序', '它消除了等级差异，使印度实现长期稳定统一'], ans:2, explain:'种姓制度把社会成员固定在不同等级，各等级权利义务悬殊、世代相袭、互不通婚往来，实质是奴隶主阶级维护统治的工具，严重阻碍社会进步与阶层流动。', src:'综合提升·模拟训练'},
{id:'z4-64', lesson:4, diff:6, stem:'有学者认为：“0”的概念对数学和科学的贡献，不亚于轮子的发明。对此理解正确的是（ ）', opts:['“0”由中国古人最早发明，后经丝绸之路传入印度并被广泛使用', '“0”长期只在印度本土使用，直到近代才被欧洲人重新发现', '“0”的出现使计数体系更加繁琐，算术运算的效率反而下降', '古印度人发明十进位计数法（含0），经阿拉伯人传到欧洲，影响世界'], ans:3, explain:'古代印度人创造十进位计数法并发明“0”的符号，阿拉伯人将其传播到世界各地，欧洲人称之为“阿拉伯数字”。这套计数法至今通行全球，是人类数学史上里程碑式的贡献。', src:'综合提升·模拟训练'},
{id:'z5-63', lesson:5, diff:6, stem:'伯里克利时期，雅典公民大会是最高权力机构，但只有成年男性公民有权参加，妇女、外邦人、奴隶被排除在外。这表明雅典民主的实质是（ ）', opts:['少数人的民主，具有明显的局限性', '这是所有雅典居民都能享有的普遍民主', '这是人类历史上最完善的直接民主形式', '这是全体雅典人都能享有的真正民主'], ans:0, explain:'雅典民主是建立在奴隶制基础上的直接民主，公民仅限成年男性本邦人，妇女、外邦人、奴隶无任何政治权利，因此它只是少数人的民主，有其时代局限。', src:'综合提升·模拟训练'},
{id:'z5-64', lesson:5, diff:6, stem:'亚历山大东征使希腊文化传播到东方，同时也吸收了东方文化。从文明交流的视角看，亚历山大东征（ ）', opts:['亚历山大东征完全摧毁了东方文明，希腊文明从此独霸世界', '客观上促进了东西方文化的交流与融合，但也伴随着战争破坏', '东征使东西方文明长期隔绝，各自独立封闭发展', '东征使希腊文化消亡，东方文化彻底取代了希腊'], ans:1, explain:'亚历山大东征具有侵略性，给被征服地区带来灾难；但客观上使希腊文明与东方文明接触碰撞，开启“希腊化时代”，促进了文化交流，应辩证评价其双重影响。', src:'综合提升·模拟训练'},
{id:'z6-63', lesson:6, diff:6, stem:'罗马由共和国发展为帝国，屋大维获得“奥古斯都”尊号，罗马进入帝国时代。对此历史演变的合理解释是（ ）', opts:['帝国时期罗马不再有任何法律条文，法治传统也就彻底中断殆尽', '帝国建立就标志着罗马文明完全衰落，从此便一蹶不振了下去', '罗马共和国后期社会矛盾尖锐，军事独裁者掌权，政体演变为元首制', '共和制彻底废除了奴隶制，帝国是民主发展的必然产物'], ans:2, explain:'罗马共和国后期，奴隶起义（如斯巴达克起义）、贵族争权加剧社会动荡，凯撒、屋大维等军事强人崛起，屋大维确立元首制，实质是披着共和外衣的君主专制，罗马进入帝国时期。', src:'综合提升·模拟训练'},
{id:'z6-64', lesson:6, diff:6, stem:'罗马法学家说：“皇帝的威严光荣不但依靠兵器，而且须用法律来巩固。”这一观点说明（ ）', opts:['罗马帝国的强大完全依赖武力，法律无足轻重可言', '罗马法只保护奴隶主利益，对平民没有任何保障', '皇帝可以任意废止法律，法律在帝国形同虚设', '罗马以法律维护统治秩序，罗马法是帝国治理的重要工具'], ans:3, explain:'罗马帝国重视立法，《十二铜表法》《罗马民法大全》等法律体系成为调整社会关系、巩固统治的有力工具，其“法治”传统对后世影响深远。', src:'综合提升·模拟训练'},
{id:'z7-63', lesson:7, diff:6, stem:'查理曼帝国分裂为法兰西、德意志、意大利三个国家的雏形。这一分裂的直接原因是（ ）', opts:['查理曼死后，其子孙依据习俗将帝国三分', '农民起义推翻了整个帝国', '基督教会的分裂导致帝国瓦解', '基督教会分裂帝国'], ans:0, explain:'843年，查理曼的三个孙子签订《凡尔登条约》三分帝国，奠定近代法兰西、德意志、意大利三国疆域雏形。这是中世纪西欧封建制度下“封土分封”惯例的体现。', src:'综合提升·模拟训练'},
{id:'z7-64', lesson:7, diff:6, stem:'西欧封建社会流行“我的附庸的附庸，不是我的附庸”。这句话反映的制度特点是（ ）', opts:['国王的权力在国家中至高无上', '层层分封，各级领主只对直接封主负责', '所有附庸都直接效忠于国王一人', '封建等级制度内部平等而有序'], ans:1, explain:'西欧封建等级制度以土地为纽带层层分封，封臣只向直接封君效忠并承担义务，国王难以直接控制“附庸的附庸”，导致王权式微、地方割据，这与中央集权体制形成鲜明对比。', src:'综合提升·模拟训练'},
{id:'z8-63', lesson:8, diff:6, stem:'中世纪西欧城市通过“金钱赎买”或“武力斗争”获得自治权，出现“城市的空气使人自由”的说法。其历史意义在于（ ）', opts:['市民获得自治后不再需要国王，王权从此名存实亡', '城市自治导致封建制度彻底瓦解，直接进入近代社会', '城市自治促进工商业与市民阶层发展，孕育资本主义萌芽', '城市完全摆脱了经济联系，成为独立的政治实体'], ans:2, explain:'城市自治使市民摆脱封建领主的直接控制，工商业繁荣，市民阶层逐步形成并成为新兴资产阶级前身，为文艺复兴和资本主义发展准备了社会条件。', src:'综合提升·模拟训练'},
{id:'z8-64', lesson:8, diff:6, stem:'中世纪欧洲大学的兴起被誉为“黑暗中的曙光”。其根本原因是（ ）', opts:['国王的强制命令推动了大学在全国的普遍建立', '教会的慈善活动资助了当时所有大学的创办', '战争促进了文化交流，带动各地大学纷纷设立', '城市繁荣与市民壮大需要专业人才，促成了大学的诞生'], ans:3, explain:'随着城市复兴和工商业发展，社会需要法律、医学、神学等专业人才，师生行会逐步发展为大学；大学自治与学术自由传统为近代科学文化奠基，根源于经济发展与社会需求。', src:'综合提升·模拟训练'},
{id:'z9-63', lesson:9, diff:6, stem:'《罗马民法大全》的编纂，使罗马法系统化、法典化。它对后世最重要的影响是（ ）', opts:['成为近代欧洲各国立法的重要蓝本，奠定了欧洲民法的基础', '《罗马民法大全》只在拜占庭帝国境内使用', '《罗马民法大全》的编纂直接导致了文艺复兴运动的兴起', '《罗马民法大全》的颁布彻底废除了奴隶制度'], ans:0, explain:'《罗马民法大全》对罗马法进行系统总结，其关于私有财产、契约、侵权等原则被近代《拿破仑法典》等继承，成为欧洲民法体系的重要渊源，影响延续至今。', src:'综合提升·模拟训练'},
{id:'z9-64', lesson:9, diff:6, stem:'拜占庭帝国保存了大量希腊罗马古典文化，并传给后世。对这一文化传承的历史评价最恰当的是（ ）', opts:['拜占庭文化完全是独创的，与古希腊罗马文化没有任何关系', '拜占庭文化延续古希腊罗马文化，为文艺复兴提供丰富素材', '拜占庭文化的传承毫无价值，应当完全否定', '拜占庭帝国灭亡后，其文化成果彻底断绝失传'], ans:1, explain:'拜占庭帝国继承并保存了古典文化典籍，1453年被奥斯曼帝国灭亡后，大量学者携带典籍西迁意大利，客观上推动了文艺复兴运动；其建筑（圣索菲亚大教堂）、法典（民法大全）也是文化宝库。', src:'综合提升·模拟训练'},
{id:'z10-63', lesson:10, diff:6, stem:'大化改新仿照隋唐制度，实行“班田收授法”和“租庸调制”，中央集权。其历史意义在于（ ）', opts:['使日本摆脱了中华文化的影响，走向独立发展', '使日本进入资本主义社会，实现了近代化转型', '使日本进入封建社会，确立中央集权，促进经济发展', '使日本迅速实现近代化，跻身世界强国之列'], ans:2, explain:'大化改新学习唐朝制度，废部民私有，土地收归国有并班田授民，确立天皇为首的中央集权体制，推动日本由奴隶制向封建制过渡，是日本历史上划时代的改革。', src:'综合提升·模拟训练'},
{id:'z10-64', lesson:10, diff:6, stem:'日本幕府统治时期，天皇大权旁落，实权由将军掌握。造成这一局面的根源是（ ）', opts:['天皇主动禅位，自愿交出国家的一切权力', '宗教教权凌驾于皇权之上，控制着朝政', '外国势力的强力干预，导致天皇大权旁落', '庄园盛行、武士兴起，中央集权逐步瓦解消失'], ans:3, explain:'10世纪以后日本庄园经济盛行，庄园主蓄养武士以对抗中央；源赖朝建立镰仓幕府后，将军掌实权、天皇形同虚设，形成武家政权，根源于封建庄园经济的分散性。', src:'综合提升·模拟训练'},
{id:'z11-63', lesson:11, diff:6, stem:'阿拉伯帝国的文化成就斐然：翻译保存希腊典籍、改进“阿拉伯数字”、编撰《天方夜谭》。其文化繁荣的根本原因是（ ）', opts:['地跨三洲，融合各文明成果，且重视学术文化', '帝国禁止外来文化，文化成果完全是自创的', '阿拉伯人天生聪慧，文化成就全靠天赋才能', '阿拉伯帝国灭亡后，其文化也随之消亡殆尽'], ans:0, explain:'阿拉伯帝国横跨亚非欧，地处东西方交通枢纽，广泛吸收希腊、波斯、印度等文明成果并加以创新发展，境内城市设智慧宫翻译典籍，因而文化高度繁荣，成为东西方文化交流的桥梁。', src:'综合提升·模拟训练'},
{id:'z11-64', lesson:11, diff:6, stem:'“阿拉伯数字”的传播过程最能说明（ ）', opts:['阿拉伯数字由阿拉伯人首先发明，然后传遍世界', '阿拉伯是东西方交流桥梁，印度计数法经其传至欧洲', '数字传播与文明交流无关，是独立发明的巧合', '欧洲人独立发明了阿拉伯数字，与外人无关'], ans:1, explain:'“0-9”计数法由古代印度人发明，阿拉伯人吸收后传入欧洲，欧洲误称为“阿拉伯数字”。这一过程深刻说明阿拉伯帝国在东西方文化传播中的桥梁与纽带作用。', src:'综合提升·模拟训练'},
{id:'z12-63', lesson:12, diff:6, stem:'古代美洲玛雅人创造了独特的象形文字、精确的太阳历和金字塔建筑。这主要说明（ ）', opts:['美洲文明完全照搬了非洲文明', '玛雅文明至今仍然延续并不断发展壮大', '美洲文明独立发展、成就辉煌，是世界文明的一部分', '玛雅文明至今仍然延续并不断发展'], ans:2, explain:'玛雅等美洲文明在几乎与外界隔绝的条件下独立创造出文字、历法、建筑等辉煌成就，证明世界文明具有多元性与独立性，是人类文明宝库的重要部分。', src:'综合提升·模拟训练'},
{id:'z12-64', lesson:12, diff:6, stem:'西非马里王国以盛产黄金闻名，其君主曼萨·穆萨朝觐麦加时沿途撒金，使开罗金价暴跌。这反映了（ ）', opts:['非洲文明与外部世界完全隔绝', '黄金是马里唯一的财富来源和支柱', '马里是当时世界上最发达的国家', '中世纪非洲商业繁荣，与外部世界有联系'], ans:3, explain:'马里王国黄金贸易发达，与北非、西亚有密切的商业往来，曼萨·穆萨的豪奢朝觐反映其国力雄厚，说明中世纪非洲并非“黑暗大陆”，而是发展着繁荣的商业文明。', src:'综合提升·模拟训练'},
{id:'z13-63', lesson:13, diff:6, stem:'文艺复兴时期，但丁在《神曲》中把教皇置于地狱，莎士比亚赞美人的尊严。二者共同体现的核心思想是（ ）', opts:['人文主义：以人为中心，肯定人的价值和尊严，反对封建神学束缚', '但丁和莎士比亚的作品体现禁欲主义的宗教思想传统', '但丁和莎士比亚的作品体现宗教改革的激进思想主张', '但丁和莎士比亚的作品体现了神权至上的中世纪传统思想观念'], ans:0, explain:'文艺复兴的核心是人文主义，主张以人为中心而非以神为中心，肯定人的现世生活与理性尊严；但丁、莎士比亚等大师的创作正是人文主义精神的集中体现。', src:'综合提升·模拟训练'},
{id:'z13-64', lesson:13, diff:6, stem:'文艺复兴运动兴起于意大利的根本原因是（ ）', opts:['意大利是罗马帝国的政治中心，文化底蕴十分深厚悠久', '意大利资本主义萌芽最早，新兴资产阶级要求冲破教会束缚', '意大利国王大力提倡发展文化艺术各项事业', '意大利保留了大量珍贵的历史文物和古代遗迹'], ans:1, explain:'14世纪意大利城市工商业发达，最早产生资本主义萌芽，新兴资产阶级追求财富与现世幸福，与教会的禁欲主义和神权统治发生冲突，因而率先掀起文艺复兴运动。', src:'综合提升·模拟训练'},
{id:'z14-63', lesson:14, diff:6, stem:'哥伦布始终认为自己到达的是印度，并把当地居民称为“印第安人”。这一史实说明（ ）', opts:['哥伦布准确无误地到达了印度', '哥伦布是第一个到达美洲的欧洲人但无任何影响', '哥伦布虽有认知错误，但其发现对世界联系意义重大', '印第安人是印度移民的后裔'], ans:2, explain:'受当时地理知识局限，哥伦布误以为抵达东方的印度，但其四次航行开辟了欧洲到达美洲的航路，使世界开始连为一个整体，尽管认知有误，历史意义依然深远。', src:'综合提升·模拟训练'},
{id:'z14-64', lesson:14, diff:6, stem:'新航路开辟对世界历史进程最深远的影响是（ ）', opts:['欧洲各国的粮食产量在这一时期得到了大幅度的提高', '亚洲从此成为世界经济的中心地带', '美洲文明得到了进一步的发展壮大', '世界开始连为一个整体，人类历史从分散走向整体'], ans:3, explain:'新航路开辟打破各大洲相对隔绝状态，世界市场雏形出现，历史真正成为世界史；同时欧洲殖民者随之入侵美洲、非洲，给当地带来深重灾难，应全面辩证看待。', src:'综合提升·模拟训练'},
{id:'z15-63', lesson:15, diff:6, stem:'“三角贸易”中，欧洲商人在非洲大量掳掠黑奴运往美洲。这一贸易的本质是（ ）', opts:['血腥掠夺式的资本原始积累，给非洲带来巨大灾难', '促进非洲经济发展的贸易往来活动', '这是平等互利的商品交换关系模式，完全谈不上掠夺性质', '欧洲与美洲之间的文化交流活动过程'], ans:0, explain:'三角贸易是欧洲殖民者以贩卖黑奴为核心的血腥贸易，是资本原始积累的重要途径，却使非洲丧失大量人口、长期贫困落后，其本质是掠夺与奴役。', src:'综合提升·模拟训练'},
{id:'z15-64', lesson:15, diff:6, stem:'英国东印度公司是17世纪英国殖民扩张的重要工具。对它评价正确的是（ ）', opts:['它始终坚持公平公正的原则与亚洲国家开展贸易往来活动', '它凭国家支持垄断亚洲贸易并殖民掠夺，加速英国资本积累', '它与亚洲各国公平公正地开展贸易活动往来', '它是亚洲国家联合创办的商业公司机构组织'], ans:1, explain:'东印度公司获英王特许，垄断东方贸易，通过殖民战争、压榨当地民众获取巨额财富，为英国工业革命积累资本，同时给印度等殖民地带来深重灾难。', src:'综合提升·模拟训练'},
{id:'z16-63', lesson:16, diff:6, stem:'1688年“光荣革命”后，英国议会通过《权利法案》限制王权。这场“不流血”政变的意义在于（ ）', opts:['光荣革命彻底废除了国王以及君主制度的继续存在与延续', '彻底确立了民主共和的政治制度体制架构', '和平结束君主专制，确立议会主权，为君主立宪奠基', '标志着工业革命时代的正式开始到来开启'], ans:2, explain:'“光荣革命”以近乎无冲突的方式推翻詹姆士二世，随后《权利法案》规定国王未经议会同意不得征税、立法等，议会成为国家权力中心，英国君主立宪制由此逐步确立。', src:'综合提升·模拟训练'},
{id:'z16-64', lesson:16, diff:6, stem:'英国资产阶级革命历经内战、共和、复辟、政变，最终确立君主立宪制。这一曲折过程说明（ ）', opts:['革命必须通过一次斗争就取得成功胜利结果', '英国革命本身没有任何的进步意义可言，完全是倒退的行为罢了', '君主立宪制是封建制度的复辟倒退倾向', '新旧制度交替充满曲折，先进阶级与封建势力反复较量'], ans:3, explain:'英国革命长达近半个世纪，新旧势力反复斗争，最终以议会与国王妥协的方式确立君主立宪制，说明社会变革的长期性、曲折性，也体现了英国政治智慧与渐进传统。', src:'综合提升·模拟训练'},
{id:'z17-63', lesson:17, diff:6, stem:'1787年美国宪法确立“三权分立”原则。其直接目的是（ ）', opts:['通过分权制衡防止专权，维护资产阶级民主制度', '三权分立是为了恢复封建时代的等级制度与统治秩序', '三权分立取消了联邦政府的设立', '三权分立是为了加强国王的统治权力'], ans:0, explain:'1787年宪法规定立法、行政、司法三权分立并相互制衡，总统、国会、最高法院各司其职，旨在防止权力过度集中，保障资产阶级共和制度，对近代政治文明影响深远。', src:'综合提升·模拟训练'},
{id:'z17-64', lesson:17, diff:6, stem:'《独立宣言》宣称“人人生而平等”，但当时的美国依然存在奴隶制，妇女和印第安人也没有平等权利。这一现象说明（ ）', opts:['《独立宣言》没有任何进步意义可言之处了了', '宣言的平等有时代和阶级局限，主要指资产阶级内部平等', '美国独立后便立即废除了奴隶制度体系制度', '《独立宣言》完全否定了天赋人权的思想主张体系'], ans:1, explain:'《独立宣言》第一次以政治纲领形式宣布天赋人权，具有重大历史进步性；但独立后的美国保留奴隶制，说明其平等观念受时代与阶级局限，应从历史角度辩证评价。', src:'综合提升·模拟训练'},
{id:'z18-63', lesson:18, diff:6, stem:'法国大革命期间颁布的《人权宣言》宣称“法律面前人人平等，私有财产神圣不可侵犯”。对此理解正确的是（ ）', opts:['它废除了包括私有财产在内的一切政治经济制度体系', '它实现了社会各阶级之间的完全平等状态秩序', '它否定封建特权并维护资产阶级利益，把财产权置于首位', '它确立了社会主义性质的社会制度体制框架'], ans:2, explain:'《人权宣言》确立自由平等、天赋人权、法律面前人人平等等原则，是反封建的进步文献；同时强调私有财产神圣不可侵犯，本质是维护资产阶级所有制，具有阶级局限。', src:'综合提升·模拟训练'},
{id:'z18-64', lesson:18, diff:6, stem:'拿破仑颁布《民法典》（《拿破仑法典》），后被欧洲多国沿用。这部法典的历史地位在于（ ）', opts:['它是欧洲封建法典的集大成之作，集中了封建法律的成果', '只在法国境内短期时间内适用有效', '它的内容完全照搬罗马法的规定内容', '确立资本主义立法规范，是近代欧洲民法典的蓝本'], ans:3, explain:'《拿破仑法典》确认了自由平等、私有财产不可侵犯、契约自由等资产阶级民法原则，体系完备，被许多国家直接采用或借鉴，被称为“典型的资产阶级社会的法典”。', src:'综合提升·模拟训练'},
{id:'z19-63', lesson:19, diff:6, stem:'瓦特改良蒸汽机后，工厂不必再依水而建，纷纷迁往城市。这一变化说明（ ）', opts:['蒸汽机摆脱自然限制，推动工厂制度和城市化进程', '蒸汽机只被用于棉纺织业的生产领域，其他行业完全不用', '蒸汽机使工厂的工人数量大大减少降低', '蒸汽机使农村经济更加繁荣发展兴旺'], ans:0, explain:'改良蒸汽机使机器动力从人力、水力转变为蒸汽动力，工厂选址不再受河流限制，集中到城市，工厂制度确立，城市化进程加快，社会生产力获得巨大飞跃。', src:'综合提升·模拟训练'},
{id:'z19-64', lesson:19, diff:6, stem:'第一次工业革命最先发生在英国，其根本前提是（ ）', opts:['英国煤炭资源丰富是工业革命的根本前提', '英国确立资本主义制度，为工业革命提供政治保障', '英国气候适宜是工业革命的根本前提', '英国人口最多是工业革命的根本前提'], ans:1, explain:'英国较早确立资本主义制度，通过殖民掠夺、圈地运动和奴隶贸易积累大量资本与劳动力，市场需求旺盛，技术革新因此率先在英国展开，政治制度变革是其深层前提。', src:'综合提升·模拟训练'},
{id:'z20-63', lesson:20, diff:6, stem:'《共产党宣言》指出：“让统治阶级在共产主义革命面前发抖吧。无产者在这个革命中失去的只是锁链，他们获得的将是整个世界。”这段话表明（ ）', opts:['马克思主义主张和平改良资本主义制度', '马克思主义反对一切形式的革命斗争', '马克思主义号召无产阶级用革命推翻资产阶级统治', '无产阶级将永远默默忍受资产阶级的剥削与压迫统治'], ans:2, explain:'《共产党宣言》系统阐述阶级斗争理论，公开宣布无产阶级的历史使命是推翻资产阶级统治、建立无产阶级政权，标志着马克思主义诞生，为无产阶级革命提供科学理论指导。', src:'综合提升·模拟训练'},
{id:'z20-64', lesson:20, diff:6, stem:'马克思主义诞生的历史条件不包括（ ）', opts:['马克思、恩格斯批判继承前人思想成果', '工业革命后资本主义弊端暴露，无产阶级与资产阶级矛盾激化', '三大工人运动表明无产阶级登上历史舞台', '巴黎公社革命提供了丰富的实践经验'], ans:3, explain:'马克思主义诞生于1848年，巴黎公社革命发生于1871年，晚于其诞生，不能作为其诞生的历史条件；其他三项均是推动马克思主义创立的客观与主观条件。', src:'综合提升·模拟训练'},
{id:'z21-63', lesson:21, diff:6, stem:'巴黎公社在政权建设上实行普选制，公职人员可随时撤换，薪金不得超过熟练工人。这些措施说明（ ）', opts:['巴黎公社是无产阶级首次建政，具有人民民主与公仆性质', '巴黎公社已经完全实现了共产主义的理想目标追求', '巴黎公社建立了君主立宪制的政治体制框架', '巴黎公社取消了全部政府管理机构设置部门'], ans:0, explain:'巴黎公社打碎旧的国家机器，建立人民政权，公职人员由普选产生并接受监督，是新型无产阶级政权的雏形，被马克思高度评价，为国际工人运动提供了宝贵经验。', src:'综合提升·模拟训练'},
{id:'z21-64', lesson:21, diff:6, stem:'巴黎公社仅存在两个多月便告失败，其失败的根本原因是（ ）', opts:['外国反动军队的力量过于强大无比雄厚', '当时资本主义仍处上升期，无产阶级革命条件尚不成熟', '公社缺乏广大人民群众的支持拥护基础', '公社缺乏广大人民群众的支持拥护基础'], ans:1, explain:'19世纪70年代法国资本主义尚未充分发展，无产阶级力量弱小、缺乏科学理论指导和成熟政党领导，建立无产阶级政权的历史条件不成熟，这是公社失败的根本原因。', src:'综合提升·模拟训练'},
{id:'n1-1', lesson:1, diff:2, stem:'“露西”化石的发现地是（　）', opts:['亚洲的印度河流域', '欧洲的希腊半岛', '非洲的埃塞俄比亚', '非洲的尼罗河三角洲'], ans:2, explain:'“露西”化石1974年发现于东非埃塞俄比亚，距今约300万年，能直立行走。', src:'综合提升·模拟训练'},
{id:'n1-2', lesson:1, diff:2, stem:'旧石器时代人类使用的主要工具是（　）', opts:['磨制石器', '青铜工具', '铁制工具', '打制石器'], ans:3, explain:'旧石器时代使用打制石器，新石器时代才使用磨制石器。', src:'综合提升·模拟训练'},
{id:'n1-3', lesson:1, diff:2, stem:'原始社会实行“共同劳动、共同分配”，其根本原因是（　）', opts:['生产力水平低下', '首领公平无私', '人们道德高尚', '人口数量稀少'], ans:0, explain:'原始社会生产力低下，个人无法独立生存，只能集体劳动、平均分配，这是生产力决定的。', src:'综合提升·模拟训练'},
{id:'n1-4', lesson:1, diff:2, stem:'原始社会末期私有制产生的直接前提是（　）', opts:['文字的发明', '剩余产品的出现', '国家的建立', '阶级的产生'], ans:1, explain:'生产力提高后出现剩余产品，才可能被私人占有，进而产生私有制；阶级和国家是私有制之后才出现的。', src:'综合提升·模拟训练'},
{id:'n1-5', lesson:1, diff:2, stem:'促使人类从“旧石器时代”迈向“新石器时代”的关键因素是（　）', opts:['部落联盟的建立', '火的使用', '工具制作技术的进步', '语言的产生'], ans:2, explain:'新石器时代以磨制石器为标志，是工具技术进步的体现；火的使用早于新石器时代。', src:'综合提升·模拟训练'},
{id:'n1-6', lesson:1, diff:2, stem:'迄今已知最早的奴隶制小国出现于（　）', opts:['遥远的印度河流域', '古代黄河流域', '希腊半岛', '两河流域南部和尼罗河流域'], ans:3, explain:'约公元前3500年，两河流域南部和尼罗河流域出现最早一批奴隶制小国，人类进入文明时代。', src:'综合提升·模拟训练'},
{id:'n1-7', lesson:1, diff:2, stem:'下列属于原始社会特征的是（　）', opts:['生产资料公有', '私有制盛行', '阶级对立严重', '国家机器完备'], ans:0, explain:'原始社会生产资料公有、共同劳动、平均分配，没有阶级和国家。', src:'综合提升·模拟训练'},
{id:'n1-8', lesson:1, diff:2, stem:'关于火的使用，说法正确的是（　）', opts:['使人类彻底摆脱了自然环境', '改善了远古先民的生存条件', '直接导致了国家的产生', '首先出现在新石器时代'], ans:1, explain:'火可以取暖、照明、驱兽、熟食，改善了生存条件；它不能“彻底”摆脱自然，也不会直接导致国家产生。', src:'综合提升·模拟训练'},
{id:'n1-9', lesson:1, diff:2, stem:'考古学家判断“露西”属于人类化石的主要依据是（　）', opts:['会制造金属工具', '已经掌握文字', '能直立行走', '大脑与现代人完全一样'], ans:2, explain:'直立行走是从猿到人转变的重要标志；“露西”已能直立行走，所以被归入人类发展阶段。', src:'综合提升·模拟训练'},
{id:'n1-10', lesson:1, diff:2, stem:'原始社会末期贫富分化加剧的直接表现是（　）', opts:['人人拥有相同财产', '部落首领废除私有', '国家颁布均田法令', '墓葬随葬品出现明显差异'], ans:3, explain:'随葬品的多寡差异直接反映私有制和贫富分化的出现。', src:'综合提升·模拟训练'},
{id:'n1-11', lesson:1, diff:2, stem:'国家与原始部落联盟的本质区别在于（　）', opts:['国家是阶级统治的工具', '国家人口更多', '国家有首领', '国家有集体劳动'], ans:0, explain:'国家是阶级矛盾不可调和的产物，本质是维护阶级统治的暴力机器，这与按血缘组织的部落联盟根本不同。', src:'综合提升·模拟训练'},
{id:'n1-12', lesson:1, diff:2, stem:'原始先民创作的早期艺术形式有（　）', opts:['用楔形文字记录宗教祭祀和账目往来', '岩画、骨雕、陶器纹饰', '刻写在龟甲兽骨上的甲骨文字', '铸造用于祭祀和礼仪活动的青铜礼器'], ans:1, explain:'原始社会末期出现岩画、骨雕、陶器纹饰等艺术萌芽；楔形文字、甲骨文属于文明时代。', src:'综合提升·模拟训练'},
{id:'n1-13', lesson:1, diff:2, stem:'“刀耕火种”到“石器农具”的变化，本质上反映了（　）', opts:['私有制的瓦解', '阶级的消灭', '生产力水平的提高', '国家的消亡'], ans:2, explain:'工具的改进是生产力进步的标志，推动社会向前发展。', src:'综合提升·模拟训练'},
{id:'n1-14', lesson:1, diff:2, stem:'原始社会末期奴隶的主要来源是（　）', opts:['自愿出卖者', '被判刑的贵族', '外邦移民', '战俘和无力还债的人'], ans:3, explain:'早期奴隶主要来自战争俘虏和债务奴隶，他们丧失人身自由，成为奴隶主剥削的对象。', src:'综合提升·模拟训练'},
{id:'n1-15', lesson:1, diff:2, stem:'古猿演化成人的决定性因素是（　）', opts:['劳动', '气候变化', '基因突变', '居住地改变'], ans:0, explain:'恩格斯指出“劳动创造了人本身”，劳动在从猿到人的转变中起决定性作用。', src:'综合提升·模拟训练'},
{id:'n1-16', lesson:1, diff:2, stem:'下列哪一过程符合人类社会发展的一般顺序（　）', opts:['私有制→剩余产品→国家→阶级', '剩余产品→私有制→阶级→国家', '阶级→剩余产品→私有制→国家', '国家→阶级→私有制→剩余产品'], ans:1, explain:'生产力提高→剩余产品→私有制→贫富分化→阶级→国家，这是人类社会演进的基本链条。', src:'综合提升·模拟训练'},
{id:'n1-17', lesson:1, diff:2, stem:'原始社会后期出现“生产资料私有”的直接原因是（　）', opts:['外来部落的入侵打破了原有的公有秩序', '氏族首领颁布法令强制推行生产资料私有', '剩余产品被少数人占有', '频繁发生的自然灾害使人们开始积蓄私有财产'], ans:2, explain:'剩余产品出现后，氏族首领等少数人将其据为己有，私有制由此产生。', src:'综合提升·模拟训练'},
{id:'n1-18', lesson:1, diff:2, stem:'从社会发展阶段看，人类进入文明时代的标志是（　）', opts:['私有制的萌芽', '青铜器的普及', '部落联盟的建立', '最早奴隶制小国的出现'], ans:3, explain:'约公元前3500年最早奴隶制小国出现，标志着人类从原始社会迈入文明时代。', src:'综合提升·模拟训练'},
{id:'o1-19', lesson:1, diff:3, stem:'恩格斯说：“劳动是整个人类生活的第一个基本条件……劳动创造了人本身。”对这句话理解正确的是（　）', opts:['劳动在从猿到人的转变中起决定性作用', '只有体力劳动才是创造人的唯一方式和途径', '劳动作为一种社会现象，出现的时间早于人类自身的产生', '劳动是与生俱来的本能，无需后天学习和掌握'], ans:0, explain:'恩格斯强调劳动是人区别于猿的关键活动，在人类形成过程中起决定性作用，但劳动是人类产生之后才有的活动。', src:'综合提升·模拟训练'},
{id:'o1-20', lesson:1, diff:3, stem:'“露西”化石能直立行走，北京人已会使用打制石器和火。据此判断（　）', opts:['露西会制造石器，北京人仅能直立行走，露西更先进', '露西属于人类演化早期阶段，北京人处于更晚的阶段', '两者都处于同一演化阶段，不存在先后之分', '北京人会使用火，因此比露西更原始、更接近猿类'], ans:1, explain:'直立行走出现于人类演化早期，会制造和使用工具、用火则出现更晚，北京人处于更晚的阶段。', src:'综合提升·模拟训练'},
{id:'o1-21', lesson:1, diff:3, stem:'有同学认为“原始社会人人平等，没有剥削，是最好的社会”。这一观点（　）', opts:['说明原始社会已经消灭了私有制', '完全正确，符合史实', '忽视了原始社会生产力极度低下的客观现实', '表明原始社会后期依然人人平等'], ans:2, explain:'原始社会虽无剥削，但生产力极端低下，生存艰难；评价历史应实事求是，不能用“最好”简单定性。', src:'综合提升·模拟训练'},
{id:'o1-22', lesson:1, diff:3, stem:'考古发掘证明，某遗址既有打制石器又有磨制石器共存。这最可能说明（　）', opts:['当地文明已经高度发达，进入了成熟的文明阶段', '当地始终只存在一种固定不变的生产方式', '当地已经进入铁器时代并普遍使用铁制农具', '当地正处于旧石器向新石器过渡时期'], ans:3, explain:'两类石器共存表明处于工具技术转型期，即从旧石器时代向新石器时代过渡。', src:'综合提升·模拟训练'},
{id:'o1-23', lesson:1, diff:3, stem:'原始社会末期，氏族首领利用职权把公共产品据为己有，由此（　）', opts:['产生私有制和贫富分化', '出现人人平等的局面', '国家自然消亡', '消灭了阶级差别'], ans:0, explain:'公共产品被少数人占有导致私有制出现，贫富分化加剧，进而形成阶级对立。', src:'综合提升·模拟训练'},
{id:'o1-24', lesson:1, diff:3, stem:'关于“最早的文明”，下列说法正确的是（　）', opts:['文明诞生之前就已经出现完善的国家机构组织', '文明诞生的标志是奴隶制小国的出现', '世界上最早的文明出现在中国的黄河流域地区', '文明的诞生与阶级分化之间没有任何关联'], ans:1, explain:'公元前3500年前后两河流域南部和尼罗河流域出现最早奴隶制小国，这是文明诞生的标志；国家机构、阶级是文明时代的产物。', src:'综合提升·模拟训练'},
{id:'o1-25', lesson:1, diff:3, stem:'研究原始社会最可信的第一手史料是（　）', opts:['后世史学家在史书中所作的追述与记载', '各民族神话传说中口耳相传的记载', '考古发掘的遗骨、工具与遗迹', '现代学者凭借想象进行的复原与推测'], ans:2, explain:'原始社会无文字记载，考古实物是第一手史料，可信度最高；传说、后世记载与想象均为间接材料。', src:'综合提升·模拟训练'},
{id:'p1-26', lesson:1, diff:4, stem:'综合来看，国家产生的历史条件包括（　）', opts:['文字和历法的发明运用', '部落首领的个人威望高低', '对外战争的需要', '生产力的发展、私有制的出现与阶级对立'], ans:3, explain:'国家是生产力发展→剩余产品→私有制→阶级对立的结果，是阶级矛盾不可调和的产物。', src:'综合提升·模拟训练'},
{id:'p1-27', lesson:1, diff:4, stem:'对原始社会进行历史评价，下列认识最全面的是（　）', opts:['它既无剥削，又极端落后，两者并存', '它是人类历史上最美好最理想的黄金时代', '它已经建立起一套完整成熟的成文法律制度', '它在文化方面完全没有任何值得称道的成就'], ans:0, explain:'原始社会没有剥削压迫，但生产力极低、生活艰难；评价应一分为二，不能美化也不能全盘否定。', src:'综合提升·模拟训练'},
{id:'p1-28', lesson:1, diff:4, stem:'下列材料中最能直接证明原始人已使用火的证据是（　）', opts:['后世文献的记载', '遗址中出土的烧骨与灰烬层', '神话中的火神传说', '学者对用火场景的复原图'], ans:1, explain:'烧骨和灰烬是考古实物证据，直接可靠；文献、神话与复原图都带有间接或推测性质。', src:'综合提升·模拟训练'},
{id:'p1-29', lesson:1, diff:4, stem:'古埃及、两河流域、古印度等早期文明都兴起于大河流域，其共同原因是（　）', opts:['大河流域降水充沛、气候湿润，无需发展灌溉农业', '大河周边草原广阔，游牧经济是早期文明的主要形态', '大河流域水土肥沃，利于农耕，为文明发展提供物质基础', '大河流域地势平坦开阔，便于军事扩张和征服他族'], ans:2, explain:'大河定期泛滥带来肥沃土壤，农业发达，人口聚居，孕育出早期文明；这是大河文明的共同特征。', src:'综合提升·模拟训练'},
{id:'q1-30', lesson:1, diff:5, stem:'用历史唯物主义的观点分析“国家”的出现，正确认识是（　）', opts:['国家由原始社会的部落联盟直接演化而来，与阶级的出现并无关联', '国家是人类文明发展中的偶然产物，没有普遍的发展规律可言', '国家不过是统治者个人意志的体现，可以随意建立和废除', '国家是阶级矛盾不可调和的产物，是社会发展到一定阶段的必然结果'], ans:3, explain:'马克思主义认为国家不是神造的，也不是永恒的，而是生产力发展、阶级对立出现后的产物，将随阶级的消亡而消亡。', src:'综合提升·模拟训练'},
{id:'q1-31', lesson:1, diff:5, stem:'“文明产生的同时，阶级压迫也随之而来。”对这一历史现象评价正确的是（　）', opts:['文明的进步与阶级压迫相伴，应辩证看待其历史进步性与局限性', '文明与压迫之间没有任何关联，两者只是时间上的偶然巧合', '文明的出现就必然导致压迫，应当彻底否定一切文明成果', '压迫是推动文明发展的唯一动力，没有压迫文明便无法取得进步'], ans:0, explain:'奴隶制的出现虽有残酷压迫的一面，但它使脑体分工、文化发展、国家治理成为可能，是历史进步的表现，需辩证评价。', src:'综合提升·模拟训练'},
{id:'r1-32', lesson:1, diff:6, stem:'要研究原始社会时期人类的生产生活状况，下列史料价值最高的是（　）', opts:['后世史学家撰写的通史著作', '考古发掘的原始人遗骨与石器', '神话传说中关于造人的故事', '近代学者对原始社会的想象复原图'], ans:1, explain:'原始社会没有文字记载，考古发掘的地下遗存是第一手实物史料，可信度最高；后世著作、神话传说和想象复原都属间接或口述性资料，价值低于实物证据。', src:'综合提升·模拟训练'},
{id:'r1-33', lesson:1, diff:6, stem:'从“氏族”到“部落”再到“部落联盟”直至“国家”，社会组织形态演进的根本动力是（　）', opts:['人口的不断减少', '气候的周期性变化', '生产力的发展', '宗教信仰的改变'], ans:2, explain:'生产力发展引起剩余产品、私有制与阶级出现，使血缘组织逐渐被地域性的国家组织取代，这是组织形态演进的根源。', src:'综合提升·模拟训练'},
{id:'n2-34', lesson:2, diff:2, stem:'两河流域文明主要由哪个民族创造（　）', opts:['阿卡德人', '波斯人', '希伯来人', '苏美尔人'], ans:3, explain:'约公元前3500年，苏美尔人在两河流域南部建立小国，是两河流域文明的主要创造者。', src:'综合提升·模拟训练'},
{id:'n2-35', lesson:2, diff:2, stem:'楔形文字的特点与地位是（　）', opts:['迄今已知世界上最早的文字之一', '世界上第一种拼音文字', '由古埃及人创造', '由中国人创造'], ans:0, explain:'苏美尔人创造的楔形文字是迄今已知世界上最早的文字之一；拼音文字、古埃及象形文字均非楔形文字。', src:'综合提升·模拟训练'},
{id:'n2-36', lesson:2, diff:2, stem:'《汉谟拉比法典》是（　）', opts:['世界上迄今发现最早的青铜铸造的器物', '迄今已知世界上第一部较为完整的成文法典', '古希腊城邦公民共同制定的法律条文', '古代埃及法老颁布的成文法令的汇编'], ans:1, explain:'《汉谟拉比法典》颁布于公元前18世纪，是迄今已知世界上第一部较为完整的成文法典。', src:'综合提升·模拟训练'},
{id:'n2-37', lesson:2, diff:2, stem:'古巴比伦王国的统一者是（　）', opts:['美尼斯', '阿育王', '汉谟拉比', '屋大维'], ans:2, explain:'约公元前18世纪，汉谟拉比统一两河流域，建立中央集权的君主专制国家。', src:'综合提升·模拟训练'},
{id:'n2-38', lesson:2, diff:2, stem:'“新月沃地”指的是（　）', opts:['尼罗河流域地区', '恒河流域地区', '黄河流域地区', '幼发拉底河与底格里斯河流域'], ans:3, explain:'两河之间的地带形似新月且土壤肥沃，被称为“新月沃地”。', src:'综合提升·模拟训练'},
{id:'n2-39', lesson:2, diff:2, stem:'《汉谟拉比法典》维护的阶级利益是（　）', opts:['奴隶主阶级', '自由农民', '手工业者', '奴隶阶级'], ans:0, explain:'法典规定奴隶打自由民要受严惩，明显维护奴隶主阶级的利益。', src:'综合提升·模拟训练'},
{id:'n2-40', lesson:2, diff:2, stem:'两河流域在天文历法上的突出成就是（　）', opts:['制定太阳历', '创制60进位制', '发明十二铜表法', '修建金字塔'], ans:1, explain:'苏美尔人发明60进位制，在天文历法上也有建树；太阳历是古埃及的，十二铜表法、金字塔分别是罗马、埃及的。', src:'综合提升·模拟训练'},
{id:'n2-41', lesson:2, diff:2, stem:'《吉尔伽美什史诗》反映了（　）', opts:['古埃及的宗教信仰', '古希腊的民主生活', '两河流域的文学成就', '古印度的种姓制度'], ans:2, explain:'《吉尔伽美什史诗》是两河流域的英雄叙事史诗，迄今已知最早的英雄叙事史诗之一。', src:'综合提升·模拟训练'},
{id:'n2-42', lesson:2, diff:2, stem:'古巴比伦国王自称“巴比伦之太阳”，意在表明（　）', opts:['国王体恤百姓', '国王信奉太阳神', '国王是平民选举产生', '国王拥有至高无上的权力'], ans:3, explain:'自称“巴比伦之太阳”是神化王权的表现，反映古巴比伦实行中央集权的君主专制。', src:'综合提升·模拟训练'},
{id:'n2-43', lesson:2, diff:2, stem:'《汉谟拉比法典》的内容不包括（　）', opts:['民主选举制度', '社会结构', '婚姻债务', '奴隶买卖'], ans:0, explain:'法典涉及社会结构、婚姻、债务、奴隶买卖等，唯独不可能规定民主选举——古巴比伦是君主专制国家。', src:'综合提升·模拟训练'},
{id:'n2-44', lesson:2, diff:2, stem:'研究古代两河流域社会状况最重要的史料是（　）', opts:['《荷马史诗》', '《汉谟拉比法典》', '《十二铜表法》', '《罗马民法大全》'], ans:1, explain:'《汉谟拉比法典》条文详细记载社会等级、经济关系，是研究两河流域社会的重要史料。', src:'综合提升·模拟训练'},
{id:'n2-45', lesson:2, diff:2, stem:'楔形文字使用的书写材料通常是（　）', opts:['纸草', '羊皮纸', '泥板', '竹简'], ans:2, explain:'苏美尔人用芦苇杆在湿泥板上刻写楔形文字，泥板干燥后即保存下来。', src:'综合提升·模拟训练'},
{id:'n2-46', lesson:2, diff:2, stem:'两河流域文明兴起于（　）', opts:['东亚', '南亚', '北非', '西亚'], ans:3, explain:'两河流域位于西亚，是人类文明最早的发源地之一。', src:'综合提升·模拟训练'},
{id:'n2-47', lesson:2, diff:2, stem:'“以眼还眼，以牙还牙”的惩罚原则出自（　）', opts:['《汉谟拉比法典》', '《十二铜表法》', '《罗马民法大全》', '《独立宣言》'], ans:0, explain:'《汉谟拉比法典》保留“同态复仇”原则，同时不同等级处罚不同，体现阶级性。', src:'综合提升·模拟训练'},
{id:'n2-48', lesson:2, diff:2, stem:'关于古巴比伦社会，下列说法正确的是（　）', opts:['人人完全平等', '存在严格的等级差异', '没有奴隶阶层', '法律面前人人平等'], ans:1, explain:'古巴比伦社会分为自由民与奴隶等不同等级，法典对不同等级处罚不同，社会并不平等。', src:'综合提升·模拟训练'},
{id:'n2-49', lesson:2, diff:2, stem:'楔形文字对后世文明的主要贡献是（　）', opts:['取代了所有古老文字', '直接演变出拉丁字母', '记录和传承人类文明', '仅用于宗教祭祀'], ans:2, explain:'楔形文字记录了苏美尔人的经济、法律、文学等内容，对文明传承贡献重大；它不是拉丁字母的直接来源。', src:'综合提升·模拟训练'},
{id:'n2-50', lesson:2, diff:2, stem:'汉谟拉比法典石柱上方的浮雕是（　）', opts:['农民在田间劳作', '国王主持民主会议', '士兵凯旋归来', '国王接受太阳神授予权杖'], ans:3, explain:'石柱上方浮雕描绘汉谟拉比从太阳神沙马什手中接受权杖，象征王权神授。', src:'综合提升·模拟训练'},
{id:'n2-51', lesson:2, diff:2, stem:'与古埃及相比，两河流域文明（　）', opts:['政治上有较强的城邦分立传统', '从未出现过统一国家', '完全没有文字', '没有法律'], ans:0, explain:'两河流域长期城邦林立，汉谟拉比虽统一一时，但分立传统较强；说其“从未统一”“没有文字法律”不符合史实。', src:'综合提升·模拟训练'},
{id:'o2-52', lesson:2, diff:3, stem:'《汉谟拉比法典》规定：自由民伤害同等地位自由民之眼，“以眼还眼”；伤害奴隶之眼仅赔偿白银。这说明（　）', opts:['法典主张同态复仇，说明法律面前人人平等', '法典维护奴隶主利益，具有鲜明的等级性与阶级性', '法典鼓励商品经济发展，促进了社会各阶层流动', '法典废除了奴隶制度，保障了社会的基本公平'], ans:1, explain:'同一伤害行为因对象等级不同处罚迥异，说明法典公开维护奴隶主和自由民利益，法律带有阶级性。', src:'综合提升·模拟训练'},
{id:'o2-53', lesson:2, diff:3, stem:'从“楔形文字”与“甲骨文”的比较看，下列说法正确的是（　）', opts:['两者都已是成熟的拼音文字体系，具有完整的表音功能', '楔形文字晚于甲骨文出现，受甲骨文直接影响', '两者都源于图画符号，都是研究各自文明的第一手史料', '两者都产生于青铜时代，属于同一文字系统'], ans:2, explain:'楔形文字与甲骨文均由图画符号演变而来，都是早期文字的典型代表，是研究各自文明的第一手史料。', src:'综合提升·模拟训练'},
{id:'o2-54', lesson:2, diff:3, stem:'有学者认为“两河流域文明对世界的影响，远大于它在历史上留下的国名”。这一观点强调（　）', opts:['两河流域从来没有产生过真正意义上的国家', '两河流域的文明成果已经彻底消亡不复存在', '两河流域的文明从未对其他地区产生过影响', '两河流域的制度与文化成就惠及后世'], ans:3, explain:'60进位制、法律传统、文字等两河文明成果被后世继承，其影响超越具体朝代与国家。', src:'综合提升·模拟训练'},
{id:'o2-55', lesson:2, diff:3, stem:'《汉谟拉比法典》把奴隶视同财产，允许买卖与继承。这说明（　）', opts:['法典确认并维护奴隶制度', '法典保护奴隶权益', '古巴比伦没有奴隶', '法典已经废除私有制'], ans:0, explain:'法典将奴隶物化，允许买卖继承，公开确认奴隶制度合法，维护奴隶主利益。', src:'综合提升·模拟训练'},
{id:'o2-56', lesson:2, diff:3, stem:'材料：汉谟拉比法典第196条“若自由民毁坏另一自由民的眼睛，则应毁其眼”。第199条“若毁坏奴隶的眼睛，则赔偿其主人白银”。对比两条可知（　）', opts:['法典实现了完全的公平正义', '法典对不同等级实行不同处罚，并非真正公平', '奴隶与自由民享有同等权利', '法典不涉及人身伤害'], ans:1, explain:'两条对比可见法典按社会等级区别对待，公平只是形式，实质维护等级秩序。', src:'综合提升·模拟训练'},
{id:'o2-57', lesson:2, diff:3, stem:'楔形文字与甲骨文在文明史上的共同价值是（　）', opts:['两种文字都直接发展演变出了拉丁字母', '两种文字都产生于公元前18世纪前后', '记录了早期文明的政治、经济与文化', '两种文字都只用于记录宗教神话和传说故事'], ans:2, explain:'两者都是早期文明记录社会生活的成熟文字系统，是研究文明史的关键史料；它们并未发展出拉丁字母。', src:'综合提升·模拟训练'},
{id:'o2-58', lesson:2, diff:3, stem:'两河流域的“60进位制”今天仍应用于（　）', opts:['地图的绘制以及方位角度的精确计算与标注', '古代建筑的尺度设计与长度的精确测量计算', '黄金交易中的称重计量与各种换算单位', '时间的计算（1小时60分钟）'], ans:3, explain:'60进位制至今仍用于时间和角度的计量（60分、60秒、360度），可见其影响深远。', src:'综合提升·模拟训练'},
{id:'p2-59', lesson:2, diff:4, stem:'综合评价《汉谟拉比法典》，正确的是（　）', opts:['它是系统成文法的开端，也固化了社会等级压迫', '它是纯粹的宗教文献，与世俗立法没有关联', '它彻底废除了同态复仇，确立了近代刑法原则', '它与后世法律完全无关，没有被任何国家借鉴'], ans:0, explain:'法典首开成文法系统化先河，为后世立法提供参考；但它确认奴隶制、等级差异，体现阶级压迫。', src:'综合提升·模拟训练'},
{id:'p2-60', lesson:2, diff:4, stem:'两河流域、尼罗河流域都形成了中央集权的君主专制，而早期希腊城邦实行民主制。造成这种差异的主要原因是（　）', opts:['两河居民实行君主专制，希腊人天生崇尚自由平等', '大河农业需要统一管理，希腊商业城邦孕育公民集体', '希腊城邦规模太小，所以只能实行君主专制', '大河文明缺乏文字系统，无法实行民主制度'], ans:1, explain:'大河农业需要兴修水利、统一调度，催生集权；希腊多山近海、商业发达，形成小国寡民的城邦与公民政治。', src:'综合提升·模拟训练'},
{id:'p2-61', lesson:2, diff:4, stem:'考古学家在两河流域发掘出大量泥板文书，涉及借贷、租佃、买卖契约。这些文物直接证明（　）', opts:['两河流域始终没有形成统一的国家政权', '两河流域的经济活动完全由国家统一计划安排', '两河流域商品经济与契约观念发达', '泥板文书是当时唯一使用的书写记录载体'], ans:2, explain:'大量契约文书说明两河流域存在活跃的商品交换与契约传统，是文明发达的重要证据。', src:'综合提升·模拟训练'},
{id:'p2-62', lesson:2, diff:4, stem:'从“王权神授”浮雕到“以眼还眼”法条，可以看出古巴比伦政治的特点是（　）', opts:['古巴比伦实行民主共和，王权受到公民监督', '古巴比伦实行政教分离，王权与神权互不干涉', '法律面前人人平等，王权同样受法律约束', '君权借助神权强化，法律维护等级秩序'], ans:3, explain:'王权神授强化君主权威，法典按等级量刑，二者共同塑造了君主专制的等级社会。', src:'综合提升·模拟训练'},
{id:'q2-63', lesson:2, diff:5, stem:'比较《汉谟拉比法典》与《十二铜表法》，正确的是（　）', opts:['前者是两河流域成文法的代表，后者是罗马第一部成文法', '前者是古巴比伦法典，后者是希腊城邦的公民法', '两者都是近代资本主义国家的根本大法', '两者都废除了奴隶制度，确立了人人平等原则'], ans:0, explain:'《汉谟拉比法典》与《十二铜表法》分属两河与罗马，都是早期成文法代表；它们都维护奴隶主利益而非废除奴隶制。', src:'综合提升·模拟训练'},
{id:'q2-64', lesson:2, diff:5, stem:'马克思说：“法典是写在羊皮纸上的阶级斗争。”用这一视角分析《汉谟拉比法典》（　）', opts:['它是古代法律文化的杰作，反映人民意志的体现', '它本质上是维护奴隶主统治、镇压被剥削者的工具', '它废除了阶级差别，是社会走向平等的开端', '它只是记录习惯法的文献，没有阶级属性可言'], ans:1, explain:'法典确立等级差异、确认奴隶制度，是奴隶主阶级意志的法律化，印证法律作为阶级统治工具的本质。', src:'综合提升·模拟训练'},
{id:'r2-65', lesson:2, diff:6, stem:'材料：法典第14条“拐带自由民之幼子者处死”；第15条“自由民将宫廷之奴隶带出城门外者处死”。两条连读最能说明（　）', opts:['法典保护奴隶的自由，禁止一切奴隶买卖行为', '法典反对私有制，禁止自由民拥有私人财产', '法典既保护自由民人身，又维护奴隶主财产权', '法典废除了奴隶制度，确立人人平等的原则'], ans:2, explain:'对拐带自由民和带出奴隶都处死，说明法典双管齐下保护自由民人身权利与奴隶主财产权，维护既有等级秩序。', src:'综合提升·模拟训练'},
{id:'r2-66', lesson:2, diff:6, stem:'楔形文字与埃及象形文字、中国甲骨文都属“象形—表意”文字体系，但楔形文字后来演变成音节文字。这说明（　）', opts:['所有文字都必然演变为拼音文字，这是普遍规律', '文字演变完全由社会发展决定，与文明交流无关', '楔形文字是世界上唯一发生过演变的古老文字体系', '文字演变路径多样，各文明文字独立发展又相互影响'], ans:3, explain:'世界文字由图画符号向表意、音节、字母方向多元演变，反映各文明独立发展又彼此交流的复杂历程。', src:'综合提升·模拟训练'},
{id:'n3-67', lesson:3, diff:2, stem:'古埃及文明发源于（　）', opts:['尼罗河流域', '两河流域', '恒河流域', '黄河流域'], ans:0, explain:'古埃及位于非洲东北部的尼罗河流域，尼罗河是古埃及文明的摇篮。', src:'综合提升·模拟训练'},
{id:'n3-68', lesson:3, diff:2, stem:'“埃及是尼罗河的赠礼”，这句话强调的是（　）', opts:['尼罗河文明完全依靠外力输入', '尼罗河为古埃及农业和文明发展提供了条件', '古埃及人没有任何自己的创造', '尼罗河是世界第一长河'], ans:1, explain:'尼罗河定期泛滥带来沃土，滋养了农业与国家，是文明产生的重要自然条件；但文明成就仍是古埃及人创造的。', src:'综合提升·模拟训练'},
{id:'n3-69', lesson:3, diff:2, stem:'初步统一古埃及、建立统一国家的国王是（　）', opts:['阿育王', '汉谟拉比', '美尼斯', '图特摩斯'], ans:2, explain:'约公元前3100年，美尼斯初步统一埃及，建立世界上最早的统一国家之一。', src:'综合提升·模拟训练'},
{id:'n3-70', lesson:3, diff:2, stem:'古埃及文明的象征是（　）', opts:['帕特农神庙', '大竞技场', '圣索菲亚大教堂', '金字塔'], ans:3, explain:'金字塔是法老的陵墓，是古埃及文明的象征；其余分别属于希腊、罗马、拜占庭。', src:'综合提升·模拟训练'},
{id:'n3-71', lesson:3, diff:2, stem:'胡夫金字塔之所以著名，是因为（　）', opts:['规模最大', '保存最完整', '是唯一方形金字塔', '历史最早'], ans:0, explain:'胡夫金字塔是埃及最大的金字塔，是古埃及建筑成就的巅峰代表。', src:'综合提升·模拟训练'},
{id:'n3-72', lesson:3, diff:2, stem:'古埃及的象形文字对下列哪一文字的形成影响较大（　）', opts:['楔形文字', '腓尼基字母', '甲骨文', '拉丁文'], ans:1, explain:'古埃及象形文字对腓尼基字母的形成有重要影响，腓尼基字母又是希腊、拉丁字母的源头。', src:'综合提升·模拟训练'},
{id:'n3-73', lesson:3, diff:2, stem:'古埃及人创制的历法是（　）', opts:['太阴历', '儒略历', '太阳历', '格里高利历'], ans:2, explain:'古埃及人根据尼罗河水涨落规律创制太阳历，是儒略历的蓝本。', src:'综合提升·模拟训练'},
{id:'n3-74', lesson:3, diff:2, stem:'法老在古埃及的地位是（　）', opts:['仅负责宗教祭祀', '由公民大会选举产生', '与平民地位相同', '集军、政、财、神权于一身'], ans:3, explain:'法老是最高统治者，集军政财神大权于一身，被视为神在人间的代表。', src:'综合提升·模拟训练'},
{id:'n3-75', lesson:3, diff:2, stem:'对金字塔的历史评价，正确的是（　）', opts:['既是古埃及人智慧的结晶，也是法老奴役人民的见证', '它是外星人建造的，与古埃及人民的劳动无关', '它只是普通的坟墓，没有任何历史研究价值', '它的修建证明了古埃及没有阶级压迫和剥削'], ans:0, explain:'金字塔反映古埃及高超的建筑数学水平，也体现法老动用民力修筑陵墓的压迫性，应一分为二。', src:'综合提升·模拟训练'},
{id:'n3-76', lesson:3, diff:2, stem:'古埃及文明被称为四大文明古国中“历史最悠久的文明之一”的主要依据是（　）', opts:['最早发明并普遍使用了铁器冶炼与铸造技术', '公元前3100年已形成统一国家', '最早发明并使用纸币进行商品流通与交换', '最早建立了成熟的民主政治制度体系'], ans:1, explain:'公元前3100年古埃及已形成统一国家，与两河流域同为最早进入文明时代的地区。', src:'综合提升·模拟训练'},
{id:'n3-77', lesson:3, diff:2, stem:'狮身人面像象征的是（　）', opts:['劳动人民的自由', '民主制度的胜利', '法老的威严与权力', '宗教的平等'], ans:2, explain:'狮身人面像（斯芬克斯）守卫在金字塔前，象征法老的威严与权力。', src:'综合提升·模拟训练'},
{id:'n3-78', lesson:3, diff:2, stem:'古埃及在数学方面的重要成就包括（　）', opts:['最早发明了0的概念', '创立了系统代数学', '发明微积分', '几何学（测算土地与金字塔）'], ans:3, explain:'古埃及为丈量土地发展出几何学，用于修建金字塔等工程；0的概念与代数学是印度与阿拉伯的贡献。', src:'综合提升·模拟训练'},
{id:'n3-79', lesson:3, diff:2, stem:'尼罗河定期泛滥为古埃及带来的直接好处是（　）', opts:['留下肥沃的淤泥', '提供海上航线', '带来丰富铁矿', '形成天然屏障'], ans:0, explain:'尼罗河每年泛滥留下肥沃淤泥，利于耕作，被埃及人视为“馈赠”。', src:'综合提升·模拟训练'},
{id:'n3-80', lesson:3, diff:2, stem:'古埃及的“法老”一词本义是（　）', opts:['被视为太阳神在人间的化身', '大房子（指王宫）', '统率军队的最高军事将领', '主持宗教祭祀的最高祭司'], ans:1, explain:'“法老”原指王宫，后成为古埃及国王的尊称，被神化为人间之神。', src:'综合提升·模拟训练'},
{id:'n3-81', lesson:3, diff:2, stem:'古埃及人在医学上的成就表现为（　）', opts:['最早发明了用于外科手术的麻醉药剂', '最早成功实施了人体器官的移植手术', '制作木乃伊积累了解剖与防腐知识', '最早建立起近代意义上的医院医疗体系'], ans:2, explain:'木乃伊制作使古埃及人掌握了人体解剖与防腐技术，推动医学发展；其余说法均不符合史实。', src:'综合提升·模拟训练'},
{id:'n3-82', lesson:3, diff:2, stem:'太阳历的“蓝本”地位指的是（　）', opts:['太阳历用于航海', '太阳历完全照搬儒略历', '太阳历晚于儒略历', '儒略历以太阳历为基础编制'], ans:3, explain:'古埃及太阳历一年365天、分12月，成为后来儒略历的蓝本，影响延续至今。', src:'综合提升·模拟训练'},
{id:'n3-83', lesson:3, diff:2, stem:'金字塔的建造者是（　）', opts:['古埃及的劳动者（奴隶与农民）', '古希腊雇佣军建造', '罗马军团远征建造', '罗马军团'], ans:0, explain:'金字塔由古埃及人民（主要是奴隶、农民）在法老组织下建造，是古埃及人集体智慧的结晶。', src:'综合提升·模拟训练'},
{id:'n3-84', lesson:3, diff:2, stem:'与两河流域文明相比，古埃及文明的政治特点是（　）', opts:['始终处于城邦分立、各自为政的状态', '统一时间早且长期相对稳定', '长期实行民主共和的政治制度', '从未形成过中央集权的国家政权'], ans:1, explain:'古埃及自公元前3100年统一后，长期保持统一与中央集权，政治稳定性强于两河流域。', src:'综合提升·模拟训练'},
{id:'o3-85', lesson:3, diff:3, stem:'古埃及人修建金字塔动用数十万人力、历时数百年。对这一历史现象最全面的评价是（　）', opts:['它纯粹是浪费民力的工程，是法老昏庸无能的集中体现', '它是外星文明的杰作，展现了超越时代的科技', '它是法老专制与奴隶制经济的产物，也凝结了人民的智慧', '它证明了古埃及没有阶级压迫，人人平等劳动'], ans:2, explain:'金字塔的修建依赖中央集权调动民力，反映压迫；其建筑成就又体现智慧，必须辩证看待。', src:'综合提升·模拟训练'},
{id:'o3-86', lesson:3, diff:3, stem:'材料：希罗多德说“埃及是尼罗河的赠礼”。结合史实理解，最准确的是（　）', opts:['埃及文明完全由尼罗河自动生成，与埃及人的劳动创造没有任何关系', '尼罗河文明晚于两河流域，是两河文明的翻版', '尼罗河只是提供水源，对埃及文明发展没有影响', '尼罗河的自然条件催生了埃及文明，但文明成就归功于埃及人'], ans:3, explain:'尼罗河提供农业基础，是文明产生的自然条件；文明成果（文字、历法、建筑）仍由埃及人创造，不能夸大“赠礼”。', src:'综合提升·模拟训练'},
{id:'o3-87', lesson:3, diff:3, stem:'古埃及象形文字、太阳历、几何学等成就的共同点是（　）', opts:['都与农业和统治需要密切相关', '它们都产生于罗马帝国统治时期', '它们都来自古希腊文明向埃及的传播', '它们的产生都服务于商业贸易的需要'], ans:0, explain:'尼罗河涨落催生历法，丈量土地催生几何，记录赋税催生文字，这些成就服务于农业与国家管理。', src:'综合提升·模拟训练'},
{id:'o3-88', lesson:3, diff:3, stem:'考古学家研究金字塔内部结构时发现大量测量痕迹。这说明（　）', opts:['金字塔是古代工匠随意堆砌而成的建筑', '古埃及人已掌握较高的数学与工程水平', '古埃及人已经掌握较高的数学与工程水平', '金字塔是依靠机械装置自动建造完成的'], ans:1, explain:'精确的测量痕迹证明古埃及人在几何、天文学上达到很高水平，金字塔是精心设计的工程。', src:'综合提升·模拟训练'},
{id:'o3-89', lesson:3, diff:3, stem:'法老死后被制成木乃伊并放入金字塔，这一做法反映（　）', opts:['古埃及人崇尚火葬并普遍实行这种葬法', '法老想借此机会逃避繁重的体力劳动', '古埃及人相信灵魂永生，重视来世', '古埃及人没有任何宗教信仰和崇拜对象'], ans:2, explain:'制作木乃伊体现古埃及“灵魂不死、来世再生”的宗教信仰，金字塔正是这种信仰的物化。', src:'综合提升·模拟训练'},
{id:'o3-90', lesson:3, diff:3, stem:'“尼罗河的赠礼”与“新月沃地”两种称呼的共同点是（　）', opts:['两种称呼都指向欧洲地区文明的发展进程', '两种称呼都说明文明的产生与河流没有关联', '两种称呼都特指中国境内黄河流域的文明', '都强调大河流域对文明形成的滋养'], ans:3, explain:'埃及与两河文明都以大河为依托，河流泛滥带来的沃土是农业与文明发展的自然基础。', src:'综合提升·模拟训练'},
{id:'o3-91', lesson:3, diff:3, stem:'关于古埃及的统一，下列说法正确的是（　）', opts:['美尼斯统一埃及后建立中央集权国家', '埃及在历史上从未实现过国家的统一', '埃及实现统一后立即实行了民主政治制度', '埃及实现统一的时间晚于罗马帝国的建立'], ans:0, explain:'公元前3100年美尼斯统一埃及，此后长期实行中央集权君主专制；统一远早于罗马。', src:'综合提升·模拟训练'},
{id:'p3-92', lesson:3, diff:4, stem:'综合比较古埃及与两河流域文明，下列说法正确的是（　）', opts:['两河流域发明了太阳历', '都产生于大河流域，都创造了文字与法典', '两者都实行了城邦民主', '两者都实行城邦民主'], ans:1, explain:'两者都是大河文明，都有文字；太阳历属埃及，楔形文字属两河，两者均为君主专制而非民主城邦。', src:'综合提升·模拟训练'},
{id:'p3-93', lesson:3, diff:4, stem:'从“金字塔由谁建造”的争论看，最符合史实的结论是（　）', opts:['由外星人借助超时代科技建造，非人力所能完成', '由古希腊奴隶建造，反映的是希腊的建筑成就', '由古埃及人民建造，是集体劳动与智慧的成果', '由罗马帝国军队建造，是罗马征服的产物'], ans:2, explain:'考古证据显示金字塔是古埃及人在法老组织下使用人力建造的，是古埃及文明的成就。', src:'综合提升·模拟训练'},
{id:'p3-94', lesson:3, diff:4, stem:'古埃及文明长期繁荣又最终被外族征服。对其历史命运的分析正确的是（　）', opts:['埃及人自愿放弃文明', '被征服后文明完全消失殆尽', '被征服后文明完全消失', '文明成果被征服者继承，但文明延续遭到破坏'], ans:3, explain:'波斯、亚历山大、罗马先后征服埃及，但埃及的宗教、文字等文化仍在延续；征服打断了其独立发展。', src:'综合提升·模拟训练'},
{id:'p3-95', lesson:3, diff:4, stem:'法老宣称自己是太阳神之子，其政治目的是（　）', opts:['借助神权强化王权的合法性与威严', '借宣扬神权来推动科学文化知识的传播', '发展雅典式的民主政治制度来限制王权', '推动当时兴起的宗教改革运动开展'], ans:0, explain:'把王权与神权结合，使臣民服从法老如同服从神灵，这是古埃及巩固专制统治的手段。', src:'综合提升·模拟训练'},
{id:'q3-96', lesson:3, diff:5, stem:'马克思说“埃及是尼罗河的赠礼”，但又说“埃及人创造了埃及”。对这两句话的正确理解是（　）', opts:['河流直接创造了文明，与人的劳动没有关系', '自然条件提供可能，人的劳动创造现实，二者相辅相成', '人的劳动创造了文明的一切，自然条件则无足轻重', '两句话相互矛盾对立，其中必定有一句是错误的'], ans:1, explain:'自然条件是文明产生的物质基础，人的创造性劳动把可能变为现实，两者并不矛盾。', src:'综合提升·模拟训练'},
{id:'q3-97', lesson:3, diff:5, stem:'从文明交流的角度看，古埃及对世界的主要贡献是（　）', opts:['最早发明了书写用纸张', '建立了完善的民主制度', '太阳历、几何学与象形文字等文化遗产', '发明了系统的字母文字'], ans:2, explain:'太阳历影响后世历法，几何学服务工程，象形文字影响字母起源，这些构成古埃及对世界的文明贡献。', src:'综合提升·模拟训练'},
{id:'r3-98', lesson:3, diff:6, stem:'研究古埃及社会的“双重证据”最合理的组合是（　）', opts:['教科书结论与网络资料', '神话传说与小说记载', '后世油画与近代游记', '金字塔遗址与象形文字铭文'], ans:3, explain:'考古遗址（实物）与同时代文字（文献）相互印证，构成可信的双重证据；后世创作与二手资料不能直接作证。', src:'综合提升·模拟训练'},
{id:'r3-99', lesson:3, diff:6, stem:'古埃及金字塔与玛雅阶梯金字塔在形制、功能上都有差异，但都反映（　）', opts:['统治者借宗教权威组织大规模工程，神权与王权结合', '金字塔只是商贸活动的场所，与宗教没有关联', '两大文明完全一致，金字塔形制与功能完全相同', '两地建筑技术来自同一来源，是文化传播的结果'], ans:0, explain:'两类金字塔都是神权王权结合的产物，体现统治者动员社会组织大型工程的能力，但两者各自独立发展。', src:'综合提升·模拟训练'},
{id:'n4-1', lesson:4, diff:2, stem:'古印度文明发源于（　）', opts:['恒河三角洲', '印度河流域', '尼罗河流域', '湄公河流域'], ans:1, explain:'古印度文明最早发源于南亚的印度河流域，约公元前2500年出现早期文明。', src:'综合提升·模拟训练'},
{id:'n4-2', lesson:4, diff:2, stem:'古印度早期城市文明的代表性遗址是（　）', opts:['美洲阿兹特克文明的中心特诺奇蒂特兰', '非洲西部的商业城市廷巴克图', '哈拉帕和摩亨佐·达罗', '希腊雅典的帕特农神庙建筑'], ans:2, explain:'哈拉帕、摩亨佐·达罗遗址规划整齐、有排水系统，是古印度早期城市文明的见证。', src:'综合提升·模拟训练'},
{id:'n4-3', lesson:4, diff:2, stem:'古代印度的种姓制度中，掌管祭祀的等级是（　）', opts:['刹帝利', '吠舍', '首陀罗', '婆罗门'], ans:3, explain:'婆罗门是祭司阶层，地位最高，掌管宗教祭祀。', src:'综合提升·模拟训练'},
{id:'n4-4', lesson:4, diff:2, stem:'种姓制度中“刹帝利”的主要职责是（　）', opts:['掌管军事与行政（国王、武士）', '专职服侍高等种姓', '专门从事手工业劳动', '主要从事农耕与经商'], ans:0, explain:'刹帝利包括国王和武士，掌握军事行政权力，是世俗统治者。', src:'综合提升·模拟训练'},
{id:'n4-5', lesson:4, diff:2, stem:'种姓制度的实质是（　）', opts:['人人平等的社会制度', '维护奴隶主贵族特权的等级制度', '实行自由贸易的制度', '自由贸易制度'], ans:1, explain:'种姓制度世代相袭、贵贱分明，本质是维护婆罗门、刹帝利等奴隶主贵族特权的等级制度。', src:'综合提升·模拟训练'},
{id:'n4-6', lesson:4, diff:2, stem:'佛教的创立者是（　）', opts:['阿育王', '汉谟拉比', '乔达摩·悉达多', '查士丁尼'], ans:2, explain:'公元前6世纪，乔达摩·悉达多（释迦牟尼）创立佛教。', src:'综合提升·模拟训练'},
{id:'n4-7', lesson:4, diff:2, stem:'佛教的基本主张是（　）', opts:['人人生而自由', '职业世袭', '法律面前人人平等', '众生平等'], ans:3, explain:'佛教主张“众生平等”，反对种姓制度的不平等，因此得到下层群众支持。', src:'综合提升·模拟训练'},
{id:'n4-8', lesson:4, diff:2, stem:'“阿拉伯数字”的发明者是（　）', opts:['古代印度人', '古代中国人', '古希腊人', '古代阿拉伯人'], ans:0, explain:'0—9计数法由古代印度人发明，经阿拉伯人改造传播到欧洲，才被称为“阿拉伯数字”。', src:'综合提升·模拟训练'},
{id:'n4-9', lesson:4, diff:2, stem:'印度历史上第一个统一王朝是（　）', opts:['汉王朝', '孔雀王朝', '贵霜帝国', '波斯帝国'], ans:1, explain:'约公元前4世纪后期，孔雀王朝的阿育王统一印度大部分地区，是印度第一个统一王朝。', src:'综合提升·模拟训练'},
{id:'n4-10', lesson:4, diff:2, stem:'种姓制度的消极影响是（　）', opts:['促进了各等级通婚', '缩小了社会差距', '严重阻碍了印度社会发展', '推动了民主进程'], ans:2, explain:'种姓制度使低等级世代受压迫，内部通婚，阻碍社会流动与进步。', src:'综合提升·模拟训练'},
{id:'n4-11', lesson:4, diff:2, stem:'关于种姓制度，下列说法正确的是（　）', opts:['等级仅按财富划分', '各等级可以自由通婚', '低等级可以晋升高等级', '各等级世代相袭、贵贱分明'], ans:3, explain:'种姓按出身划分，世代相袭、内部通婚，贵贱分明，财富不能改变等级。', src:'综合提升·模拟训练'},
{id:'n4-12', lesson:4, diff:2, stem:'佛教后来成为世界性宗教，主要因为（　）', opts:['主张众生平等，教义易于传播，得到统治者支持', '主张消灭一切阶级差别，推翻现存的国家政权', '佛教是印度国教，只允许印度人信仰和传播', '佛教与政治完全无关，不参与任何社会事务'], ans:0, explain:'佛教教义温和、众生平等，受到下层群众和部分统治者支持，广泛传播于亚洲。', src:'综合提升·模拟训练'},
{id:'n4-13', lesson:4, diff:2, stem:'孔雀王朝时期印度社会进入鼎盛，主要表现是（　）', opts:['实行民主制度', '国家统一、经济繁荣', '废除种姓制度', '建立共和国'], ans:1, explain:'阿育王时期统一大部分印度，社会安定经济繁荣，佛教也得到大力弘扬。', src:'综合提升·模拟训练'},
{id:'n4-14', lesson:4, diff:2, stem:'首陀罗在种姓制度中的地位是（　）', opts:['掌管军政大权的刹帝利武士阶层', '地位最高、掌管祭祀的婆罗门祭司阶层', '最底层，多为被征服者与奴隶', '从事工商业的吠舍阶层成员'], ans:2, explain:'首陀罗是第四等级，多为被征服者、奴隶和穷苦劳动者，地位最低。', src:'综合提升·模拟训练'},
{id:'n4-15', lesson:4, diff:2, stem:'吠舍阶层主要包括（　）', opts:['完全没有人身自由的奴隶阶层成员', '专门掌管宗教祭祀的婆罗门祭司阶层', '掌管军事和政务的国王与武士阶层', '农民、牧民、商人与手工业者'], ans:3, explain:'吠舍是第三等级，包括农民、牧民、商人、手工业者等普通劳动者。', src:'综合提升·模拟训练'},
{id:'n4-16', lesson:4, diff:2, stem:'佛教产生于何时（　）', opts:['公元前6世纪', '公元前18世纪', '公元6世纪', '公元19世纪'], ans:0, explain:'佛教创立于公元前6世纪，与孔子大致同时代。', src:'综合提升·模拟训练'},
{id:'n4-17', lesson:4, diff:2, stem:'古印度文化对世界影响最广的成就是（　）', opts:['两河流域发明的楔形文字体系', '0—9计数法与佛教', '罗马早期颁布的《十二铜表法》', '古埃及人创制的太阳历法'], ans:1, explain:'印度人发明的计数法与佛教都传播到世界各地，影响深远。', src:'综合提升·模拟训练'},
{id:'n4-18', lesson:4, diff:2, stem:'关于古印度文明，下列说法正确的是（　）', opts:['古印度从未出现统一国家', '古印度没有宗教信仰', '种姓制度严重阻碍了社会进步', '古印度人不会建造城市'], ans:2, explain:'古印度有统一王朝、宗教与城市文明，但种姓制度是阻碍社会进步的沉重枷锁。', src:'综合提升·模拟训练'},
{id:'o4-19', lesson:4, diff:3, stem:'材料：种姓制度规定“婆罗门出生即最高贵，首陀罗世代为奴”。这说明种姓制度（　）', opts:['按照才能选拔人才', '促进社会阶层流动', '实现了人人完全平等', '按出身固定身份，维护等级特权'], ans:3, explain:'种姓制度把出身作为等级依据，世代固定，本质上是用制度固化阶级特权。', src:'综合提升·模拟训练'},
{id:'o4-20', lesson:4, diff:3, stem:'佛教主张“众生平等”，却未彻底否定种姓制度。对此理解正确的是（　）', opts:['佛教的平等是宗教意义上的平等，未触及世俗等级', '佛教完全支持种姓制度，维护婆罗门的特权', '佛教废除了种姓制度，实现彻底的社会平等', '佛教主张各等级可以互换，种姓失去意义'], ans:0, explain:'佛教在宗教层面提倡灵魂平等，但未直接推翻世俗等级制度，因此能与种姓社会共存。', src:'综合提升·模拟训练'},
{id:'o4-21', lesson:4, diff:3, stem:'“阿拉伯数字”名称的由来最能说明（　）', opts:['阿拉伯人发明了这套数字体系，印度人只是被动的使用者', '文化传播往往经由中间人，名称反映传播路径而非发明者', '印度人从未使用过这套数字，名称纯属误会', '欧洲人发明了这套数字，并把它传到了东方'], ans:1, explain:'数字由印度发明，经阿拉伯传入欧洲，欧洲人按传播者命名，说明文明传播中的“中间人”作用。', src:'综合提升·模拟训练'},
{id:'o4-22', lesson:4, diff:3, stem:'阿育王大力宣扬佛教并建寺立塔，其政治意图是（　）', opts:['排斥其他宗教信仰', '发展繁荣商业经济', '利用佛教缓和阶级矛盾、巩固统一', '排斥其他宗教'], ans:2, explain:'阿育王以佛教为工具安抚被征服地区民众，借宗教强化统治合法性。', src:'综合提升·模拟训练'},
{id:'o4-23', lesson:4, diff:3, stem:'对比古印度与古埃及的社会制度，两者共同点是（　）', opts:['两国都没有形成自己的宗教信仰体系', '两国都实行公民广泛参与的民主制度', '两国都彻底废除了奴隶制度的存在', '都存在森严的等级与君主专制'], ans:3, explain:'古印度的种姓制度与古埃及的阶级等级都体现奴隶社会的不平等，且都实行君主专制。', src:'综合提升·模拟训练'},
{id:'o4-24', lesson:4, diff:3, stem:'摩亨佐·达罗遗址的“大浴池”与完善排水系统说明（　）', opts:['古印度城市已有较高的公共卫生意识', '该城市是纯粹军事要塞', '古印度人完全不会游泳', '该文明没有阶级'], ans:0, explain:'城市规划与排水设施反映古印度城市文明发达、管理有序，是早期文明的标志。', src:'综合提升·模拟训练'},
{id:'o4-25', lesson:4, diff:3, stem:'有学者称种姓制度是“印度的痼疾”。其依据是（　）', opts:['它带来了民主政治，促进了印度的社会进步', '它固化等级、阻碍社会流动与经济发展', '它推动了科技进步，带动了古代印度的繁荣', '它促进了民族融合，使印度实现长期统一稳定'], ans:1, explain:'种姓制度使社会僵化，人才被出身禁锢，是印度长期发展缓慢的重要原因之一。', src:'综合提升·模拟训练'},
{id:'p4-26', lesson:4, diff:4, stem:'综合分析佛教兴起的背景，正确的是（　）', opts:['佛教由婆罗门祭司创立，专用于维护种姓制度', '佛教反对一切宗教，是彻底的无神论思想体系', '种姓压迫使下层寻求精神慰藉，统治者也需要统治工具', '佛教产生于印度统一之后，是孔雀王朝的官方宗教'], ans:2, explain:'种姓压迫催生对“平等”的渴望，刹帝利与吠舍也受婆罗门压制，佛教因而兴起；它诞生于公元前6世纪，早于孔雀王朝统一。', src:'综合提升·模拟训练'},
{id:'p4-27', lesson:4, diff:4, stem:'“0”的发明对数学的意义在于（　）', opts:['使数字不再需要进位，计算体系发生根本改变', '只方便了记账，对数学研究没有任何意义', '使数学的发展出现倒退，运算变得更加复杂', '完善了十进位制计数体系，使运算更加简便'], ans:3, explain:'“0”的出现补全了位值制计数法，极大方便了运算，是数学史上的里程碑。', src:'综合提升·模拟训练'},
{id:'p4-28', lesson:4, diff:4, stem:'从文明交流看，“阿拉伯数字”的传播路线是（　）', opts:['印度→阿拉伯→欧洲', '中国→印度→欧洲', '欧洲→阿拉伯→印度', '阿拉伯→印度→中国'], ans:0, explain:'印度人发明→阿拉伯人改造并传播→欧洲人采用，体现文明经由“中间地带”传递的典型路径。', src:'综合提升·模拟训练'},
{id:'p4-29', lesson:4, diff:4, stem:'阿育王时期的“达摩（法）统治”政策最能反映（　）', opts:['印度进入民主社会形态', '统治者将宗教教义与治国方略结合', '佛教被彻底完全废除', '佛教被完全废除'], ans:1, explain:'阿育王以佛教“法”治国，建柱立碑、设置官员弘扬教义，宗教服务于统一国家治理。', src:'综合提升·模拟训练'},
{id:'q4-30', lesson:4, diff:5, stem:'比较种姓制度与雅典民主制度，最恰当的结论是（　）', opts:['种姓制度比雅典民主更加民主，因为等级划分更细致', '两者都实现了真正的人人平等，没有任何阶级差别存在过', '种姓按出身固定等级，雅典民主仅限少数公民，两者都有局限', '两者完全相同，都是少数人统治多数人的制度'], ans:2, explain:'种姓制度以出身定终身，雅典民主也只属于成年男性公民，二者都是特定历史条件下具有局限性的制度。', src:'综合提升·模拟训练'},
{id:'q4-31', lesson:4, diff:5, stem:'佛教与儒家的比较中，下列认识正确的是（　）', opts:['两者都主张推翻君主专制制度，建立人人平等的理想社会', '两者都创立于印度，同属东方宗教思想的思想体系', '两者都不关注现实人生，只追求超脱世俗的解脱境界', '都产生于公元前6世纪左右，都关注人的处境，但路径不同'], ans:3, explain:'佛教、儒家都诞生于轴心时代，佛教重解脱、儒家重秩序，是东方两大思想源流。', src:'综合提升·模拟训练'},
{id:'r4-32', lesson:4, diff:6, stem:'考古学上常把“排水系统是否完善”作为判断城市文明的重要指标，摩亨佐·达罗因此被视为早期文明城市。这体现的研究方法是（　）', opts:['以考古实物作为衡量文明发展水平的证据', '以文献记载推测古代文明', '以神话传说判断文明', '以宗教经典认定文明'], ans:0, explain:'实物遗存（排水系统等）直接反映社会组织与管理能力，考古证据是判断古代城市文明程度的第一手依据。', src:'综合提升·模拟训练'},
{id:'r4-33', lesson:4, diff:6, stem:'关于“阿拉伯数字”的命名，最符合史实的说法是（　）', opts:['数字体系由阿拉伯人发明，印度人只是这套数字的使用者', '数字由印度人发明，阿拉伯人改造传播，欧洲人误以其名命名', '数字由欧洲人发明，后经印度商人传入阿拉伯世界', '数字由中国人发明，经丝绸之路传入印度与欧洲'], ans:1, explain:'史实是印度发明、阿拉伯传播；名称反映传播链条而非发明权，避免混淆发明者与传播者。', src:'综合提升·模拟训练'},
{id:'n5-34', lesson:5, diff:2, stem:'古希腊进入城邦时代的时间是（　）', opts:['约公元前18世纪', '约公元8世纪', '约公元前8世纪', '约公元前2世纪'], ans:2, explain:'约公元前8世纪起希腊进入城邦时代，最重要的城邦是雅典与斯巴达。', src:'综合提升·模拟训练'},
{id:'n5-35', lesson:5, diff:2, stem:'古希腊城邦的基本特点是（　）', opts:['地大物博、人口众多', '商业发达、一城一国', '高度统一、中央集权', '小国寡民、独立自治'], ans:3, explain:'希腊城邦以城市为中心，小国寡民、独立自治，长期未形成统一大国。', src:'综合提升·模拟训练'},
{id:'n5-36', lesson:5, diff:2, stem:'雅典民主政治达到全盛是在（　）', opts:['伯里克利时期', '梭伦时期', '亚历山大时期', '屋大维时期'], ans:0, explain:'伯里克利执政时期（约前5世纪中后期），雅典民主政治发展到高峰。', src:'综合提升·模拟训练'},
{id:'n5-37', lesson:5, diff:2, stem:'雅典的最高权力机关是（　）', opts:['元老院', '公民大会', '五百人议事会', '最高法院'], ans:1, explain:'公民大会是雅典最高权力机关，成年男性公民均可参加，决定国家大事。', src:'综合提升·模拟训练'},
{id:'n5-38', lesson:5, diff:2, stem:'雅典官职的主要产生方式是（　）', opts:['世袭继承', '君主任命', '抽签产生', '贵族选举'], ans:2, explain:'伯里克利时期，多数官职由公民抽签产生，体现了人民主权的理念。', src:'综合提升·模拟训练'},
{id:'n5-39', lesson:5, diff:2, stem:'雅典民主政治的局限性在于（　）', opts:['城邦中的全体成员人人享有民主权利', '奴隶和外邦人同样可以参与城邦政治', '雅典妇女同样拥有参与选举的权利', '仅限成年男性公民享有民主'], ans:3, explain:'雅典民主把妇女、外邦人、奴隶排除在外，是少数成年男性公民的民主。', src:'综合提升·模拟训练'},
{id:'n5-40', lesson:5, diff:2, stem:'《荷马史诗》相传由谁整理（　）', opts:['荷马', '亚里士多德', '苏格拉底', '柏拉图'], ans:0, explain:'《荷马史诗》相传由盲诗人荷马整理，包括《伊利亚特》和《奥德赛》。', src:'综合提升·模拟训练'},
{id:'n5-41', lesson:5, diff:2, stem:'《荷马史诗》的历史价值在于（　）', opts:['它是雅典城邦颁布的法律汇编', '是了解早期希腊社会的主要文献', '它是亚历山大东征过程的详细记录', '它详细记载了罗马建城的历史'], ans:1, explain:'《荷马史诗》反映早期希腊的社会风貌，是研究古希腊社会的重要文献。', src:'综合提升·模拟训练'},
{id:'n5-42', lesson:5, diff:2, stem:'亚历山大帝国地跨（　）', opts:['亚、非、澳三洲', '欧、美、非三洲', '欧、亚、非三洲', '欧、亚、美三洲'], ans:2, explain:'亚历山大东征建立了地跨欧亚非三洲的大帝国，促进东西方文化交流。', src:'综合提升·模拟训练'},
{id:'n5-43', lesson:5, diff:2, stem:'亚历山大东征的历史影响是（　）', opts:['在当地建立起了民主共和的制度体系', '完全消灭了东方文明的成果与成就', '使希腊各城邦陷入分裂混乱的状态', '促进东西方文化交流，也伴随暴力掠夺'], ans:3, explain:'东征把希腊文化带到东方，东方文化也传入希腊，客观上促进交流；但战争带来破坏与掠夺。', src:'综合提升·模拟训练'},
{id:'n5-44', lesson:5, diff:2, stem:'古代奥林匹克运动会发源于（　）', opts:['希腊的奥林匹亚', '古希腊的雅典城邦地区', '古希腊的斯巴达城邦地区', '古罗马的罗马城及其周边地区'], ans:0, explain:'古代奥运会起源于希腊奥林匹亚，是现代奥运会的精神源头。', src:'综合提升·模拟训练'},
{id:'n5-45', lesson:5, diff:2, stem:'帕特农神庙位于（　）', opts:['罗马广场', '雅典卫城', '君士坦丁堡', '斯巴达城区'], ans:1, explain:'帕特农神庙坐落在雅典卫城，是古希腊建筑艺术的典范。', src:'综合提升·模拟训练'},
{id:'n5-46', lesson:5, diff:2, stem:'雅典民主政治中“陶片放逐法”的作用是（　）', opts:['推行世袭制', '限制公民权利', '防止个人专权', '发展贵族政治'], ans:2, explain:'陶片放逐法允许公民投票放逐威胁民主的人，防止僭主专权。', src:'综合提升·模拟训练'},
{id:'n5-47', lesson:5, diff:2, stem:'斯巴达与雅典的最大不同在于（　）', opts:['城邦高度重视文学艺术事业', '城邦长期实行民主政治制度', '城邦大力发展工商业经济', '崇尚武力、实行军事化管理'], ans:3, explain:'斯巴达以军事立国，强调服从与尚武；雅典重视民主与工商业文化。', src:'综合提升·模拟训练'},
{id:'n5-48', lesson:5, diff:2, stem:'希腊城邦中“小国寡民”特征的主要影响是（　）', opts:['使公民政治成为可能', '导致人口爆炸', '促成帝国形成', '消灭了奴隶制'], ans:0, explain:'小国寡民使公民能直接参与政治，为民主制度提供了土壤。', src:'综合提升·模拟训练'},
{id:'n5-49', lesson:5, diff:2, stem:'伯里克利说“我们的制度是别人的模范”，这里的“制度”指（　）', opts:['君主专制', '奴隶主民主政治', '军事独裁', '贵族寡头政治'], ans:1, explain:'伯里克利自豪的正是雅典的民主制度，但其本质是奴隶主阶级的民主。', src:'综合提升·模拟训练'},
{id:'n5-50', lesson:5, diff:2, stem:'古希腊文化对后世影响最深远的是（　）', opts:['两河的楔形文字', '印度的种姓制度', '民主政治、哲学与文学艺术', '楔形文字'], ans:2, explain:'希腊的民主理念、哲学思想（苏格拉底、柏拉图、亚里士多德）和文艺成就是西方文明的源头。', src:'综合提升·模拟训练'},
{id:'n5-51', lesson:5, diff:2, stem:'亚历山大帝国虽短暂，但深远影响在于（　）', opts:['统一了希腊半岛', '建立了永久的世界帝国', '消灭了罗马', '促进了希腊文化与东方文化的交融'], ans:3, explain:'帝国虽短命，但希腊化时代使东西方文化深度交融，影响地中海世界数百年。', src:'综合提升·模拟训练'},
{id:'o5-52', lesson:5, diff:3, stem:'材料：伯里克利说“政权是在全体公民手中，而不是在少数人手中”。但奴隶、妇女被排除在外。这说明（　）', opts:['雅典民主是少数成年男性公民的民主，具有阶级局限性', '雅典废除了奴隶制度，实现了人人权利平等', '伯里克利主张全体居民一律平等地参与政治', '雅典实现了全民民主，所有居民都参与政治生活'], ans:0, explain:'“全体公民”指雅典成年男性公民，奴隶、妇女、外邦人不在此列，民主实质是奴隶主阶级的民主。', src:'综合提升·模拟训练'},
{id:'o5-53', lesson:5, diff:3, stem:'《荷马史诗》虽属文学作品，却是研究早期希腊的重要史料。这说明（　）', opts:['文学作品完全不可信，不能作为历史研究的依据', '文学作品中可能保存真实历史信息，需与考古互证', '史诗比实物史料更可靠，应作为唯一依据', '所有史料都源于神话传说，历史研究无法进行'], ans:1, explain:'史诗包含历史记忆，但需考古印证，不能全信也不能全否。', src:'综合提升·模拟训练'},
{id:'o5-54', lesson:5, diff:3, stem:'亚历山大东征使“希腊人把火种撒向东方”。对“火种”理解正确的是（　）', opts:['亚历山大发明了火药', '希腊人把民主制带到全亚洲', '希腊的文化、科学、艺术传播到东方', '东方文明因此消失'], ans:2, explain:'希腊化时代希腊文化广泛传播于东方世界，促进学术交流；说“民主制带到全亚洲”言过其实。', src:'综合提升·模拟训练'},
{id:'o5-55', lesson:5, diff:3, stem:'比较雅典与斯巴达两个城邦，正确的是（　）', opts:['雅典完全否定了军事建设的作用', '两者都实行了较为民主的政治制度体制', '两者都以农业为本并轻视文化发展', '雅典重民主文化，斯巴达重军事纪律'], ans:3, explain:'两者城邦特色迥异：雅典民主工商业发达，斯巴达军事化农耕社会。', src:'综合提升·模拟训练'},
{id:'o5-56', lesson:5, diff:3, stem:'从“伯里克利改革”到“帕特农神庙”，最能体现雅典社会的特点是（　）', opts:['民主政治与文化繁荣相互促进', '雅典长期陷入连绵不断的战争之中', '雅典的经济发展水平十分落后', '雅典完全排斥外邦文化的影响'], ans:0, explain:'民主政治带来文化繁荣，文化成就又彰显城邦自豪，两者相辅相成。', src:'综合提升·模拟训练'},
{id:'o5-57', lesson:5, diff:3, stem:'希腊文明与埃及、两河文明的不同在于（　）', opts:['希腊没有文字，文明发展程度远低于东方文明', '希腊以城邦公民政治为特色，东方以君主专制为特色', '东方文明出现的时间比希腊文明更晚许多', '希腊完全孤立，与其他文明没有任何交流往来'], ans:1, explain:'地理与历史条件不同：希腊多山近海、城邦林立，形成公民政治；东方大河流域形成集权国家。', src:'综合提升·模拟训练'},
{id:'o5-58', lesson:5, diff:3, stem:'“陶片放逐法”的实行需要大量公民出席投票。这从侧面说明（　）', opts:['雅典人口众多', '雅典实行君主制', '雅典公民政治参与度高', '陶片是货币'], ans:2, explain:'放逐投票需公民集体参与，反映雅典民主的运作依赖公民政治热情与制度设计。', src:'综合提升·模拟训练'},
{id:'p5-59', lesson:5, diff:4, stem:'综合雅典民主制度的得失，正确的评价是（　）', opts:['它是人类历史上最完美的政治制度，无可挑剔', '它使奴隶获得解放，实现了真正的平等自由', '它没有任何缺陷，值得一切国家完全照搬借鉴', '它开了西方民主政治先河，但只是奴隶主阶级的民主'], ans:3, explain:'雅典民主首创人民主权与轮番而治，是西方民主源头；但公民范围狭窄，实质是阶级统治。', src:'综合提升·模拟训练'},
{id:'p5-60', lesson:5, diff:4, stem:'从“荷马史诗中的英雄”到“帕特农神庙的雅典娜”，可以看出希腊文化（　）', opts:['以人为中心，崇尚智慧与美', '希腊文化完全轻视理性思辨的作用价值', '希腊文化完全排斥艺术创造活动的开展', '希腊文化完全否定了神明的存在'], ans:0, explain:'希腊神话与建筑都体现人文色彩，肯定人的价值与美的追求，为文艺复兴提供了思想资源。', src:'综合提升·模拟训练'},
{id:'p5-61', lesson:5, diff:4, stem:'亚历山大东征客观上促进文明交流，但也被称为“毁灭者”。这启示我们评价历史事件应（　）', opts:['评价历史事件只需看军事上的成败得失', '一分为二，既看积极影响也看消极后果', '应完全否定东征，因为它破坏巨大', '只需关注文化传播，其他影响都不重要'], ans:1, explain:'历史评价要坚持两点论，东征促进交流的同时带来破坏，两者并存。', src:'综合提升·模拟训练'},
{id:'p5-62', lesson:5, diff:4, stem:'雅典民主、罗马共和与东方君主专制差异的根源在于（　）', opts:['不同人种之间天生的优劣差异', '各地文字体系之间的根本差异', '地理环境与经济基础的不同', '各地宗教信仰和崇拜对象的不同'], ans:2, explain:'海洋商业环境塑造城邦公民政治，大河农业环境塑造中央集权，经济地理基础是根本原因。', src:'综合提升·模拟训练'},
{id:'q5-63', lesson:5, diff:5, stem:'比较雅典民主与近代欧美民主，正确的是（　）', opts:['雅典民主的参与范围远比近代欧美民主的参与范围要广泛得多', '两者完全一样，都是全体公民直接参与决策的民主制度', '近代民主比雅典民主落后，其适用范围也更加狭窄', '前者直接民主、范围有限，后者代议制、范围更广，有继承有发展'], ans:3, explain:'雅典是公民直接参政的小国民主，近代民主是代议制、范围扩大，制度演进体现继承与发展。', src:'综合提升·模拟训练'},
{id:'q5-64', lesson:5, diff:5, stem:'“光荣属于希腊，伟大属于罗马。”对这句名言的理解是（　）', opts:['希腊贡献民主与文化艺术，罗马贡献法律与工程，各擅胜场', '罗马没有文化，其成就全部来自对希腊文明的继承', '希腊的成就远远高于罗马，罗马的历史完全不值得一提', '希腊与罗马都没有成就，这句名言纯属艺术夸张'], ans:0, explain:'希腊的哲学、民主、艺术与罗马的法律、建筑共同构成西方文明的古典根基，各具贡献。', src:'综合提升·模拟训练'},
{id:'r5-65', lesson:5, diff:6, stem:'材料：雅典公民大会“任何人不能同时担任两个公职，多数官职任期一年且不得连任”。这反映雅典民主（　）', opts:['这一制度鼓励培养职业化的政治家群体', '通过轮换与限任防止权力垄断', '这一制度支持官员的终身执政地位', '这一制度否定了公民的参政权利'], ans:1, explain:'轮番而治、限制连任正是雅典防止专权的制度设计，体现“主权在民、轮番执政”原则。', src:'综合提升·模拟训练'},
{id:'r5-66', lesson:5, diff:6, stem:'关于“希腊文明是欧洲文明之源”的说法，最有力的史实支撑是（　）', opts:['希腊曾依靠强大武力统一了整个欧洲大陆地区', '希腊发明了字母，欧洲各国文字体系都直接源自于希腊文', '希腊哲学、民主思想、文学艺术被罗马继承并传入欧洲后世', '希腊建立了欧洲各国，各国制度皆模仿希腊模式'], ans:2, explain:'罗马人继承希腊文化并传播到欧洲，文艺复兴更直接复兴古典文化，希腊文明是欧洲文化源头。', src:'综合提升·模拟训练'},
{id:'n6-67', lesson:6, diff:2, stem:'罗马共和国建立的时间是（　）', opts:['公元前27年', '公元395年', '公元476年', '公元前509年'], ans:3, explain:'公元前509年罗马建立共和国；前27年进入帝国时代。', src:'综合提升·模拟训练'},
{id:'n6-68', lesson:6, diff:2, stem:'罗马共和国中拥有否决权的官员是（　）', opts:['保民官', '监察官', '执政官', '独裁官'], ans:0, explain:'保民官有权否决不利于平民的决议，保护平民利益。', src:'综合提升·模拟训练'},
{id:'n6-69', lesson:6, diff:2, stem:'罗马第一部成文法是（　）', opts:['《汉谟拉比法典》', '《十二铜表法》', '《罗马民法大全》', '《权利法案》'], ans:1, explain:'公元前450年左右颁布的《十二铜表法》是罗马第一部成文法。', src:'综合提升·模拟训练'},
{id:'n6-70', lesson:6, diff:2, stem:'《十二铜表法》颁布的意义是（　）', opts:['法典的颁布废除了奴隶制度', '法典的颁布确立了民主制度', '限制了贵族随意解释法律', '法典统一了整个欧洲的法律'], ans:2, explain:'成文法公布后，量刑有了明文依据，限制了贵族对法律的随意解释。', src:'综合提升·模拟训练'},
{id:'n6-71', lesson:6, diff:2, stem:'罗马进入帝国时代的标志是（　）', opts:['罗马共和国的正式成立', '罗马统帅凯撒自称皇帝', '君士坦丁将首都迁往东方', '屋大维实行“元首制”'], ans:3, explain:'公元前27年屋大维首创“元首制”，罗马进入帝国时代。', src:'综合提升·模拟训练'},
{id:'n6-72', lesson:6, diff:2, stem:'2世纪时被称为罗马“内湖”的是（　）', opts:['地中海', '红海', '黑海', '波罗的海'], ans:0, explain:'罗马帝国鼎盛时地中海成为其内湖，帝国进入黄金时期。', src:'综合提升·模拟训练'},
{id:'n6-73', lesson:6, diff:2, stem:'罗马处理外来人口法律问题而颁布的法律是（　）', opts:['公民法', '万民法', '自然法', '《十二铜表法》'], ans:1, explain:'随着帝国扩张，罗马颁布万民法处理外来人口的法律问题。', src:'综合提升·模拟训练'},
{id:'n6-74', lesson:6, diff:2, stem:'“被征服的希腊人征服了征服者”这句话表明（　）', opts:['希腊被罗马完全消灭', '罗马文化一无是处', '罗马文化吸收了希腊文化', '希腊征服了罗马'], ans:2, explain:'罗马在军事上征服希腊，文化上却被希腊文化征服，大量吸收希腊文明成果。', src:'综合提升·模拟训练'},
{id:'n6-75', lesson:6, diff:2, stem:'罗马帝国分裂为东西两部分的时间是（　）', opts:['476年', '公元前27年', '1453年', '395年'], ans:3, explain:'395年罗马帝国分裂为东罗马和西罗马；476年西罗马灭亡。', src:'综合提升·模拟训练'},

{id:'n6-77', lesson:6, diff:2, stem:'凯撒编制的历法是（　）', opts:['太阳历', '儒略历', '格里高利历', '太阴历'], ans:1, explain:'凯撒命人以太阳历为蓝本编制儒略历，成为后世公历的基础。', src:'综合提升·模拟训练'},

{id:'n6-81', lesson:6, diff:2, stem:'罗马法对后世最重要的影响是（　）', opts:['使罗马帝国永存', '成为近代西方法律体系的重要源头', '消灭了基督教', '统一了世界法律'], ans:1, explain:'罗马法体系完备，成为近代欧洲各国法律的重要基础。', src:'综合提升·模拟训练'},
{id:'n6-82', lesson:6, diff:2, stem:'罗马帝国黄金时期对应的朝代是（　）', opts:['罗马共和国统治时期', '西罗马帝国的晚期阶段', '屋大维至安敦尼王朝', '拜占庭帝国的早期阶段'], ans:2, explain:'2世纪罗马帝国疆域最大、经济繁荣，地中海成内湖，是帝国黄金时代。', src:'综合提升·模拟训练'},
{id:'n6-83', lesson:6, diff:2, stem:'关于《十二铜表法》，下列说法正确的是（　）', opts:['法典废除了债务奴役制度', '法典给予奴隶以自由身份', '法典完全保护平民的利益', '它是平民与贵族斗争的结果'], ans:3, explain:'《十二铜表法》是平民斗争迫使贵族让步的成果，但它仍维护奴隶主利益。', src:'综合提升·模拟训练'},
{id:'n6-84', lesson:6, diff:2, stem:'罗马由共和国向帝国转变的根本原因是（　）', opts:['奴隶制经济发展与阶级矛盾激化', '元老院主动让权所致', '皇帝个人野心膨胀', '皇帝个人野心'], ans:0, explain:'共和国后期奴隶起义、扩张需要，使权力向军事统帅集中，最终走向帝国。', src:'综合提升·模拟训练'},
{id:'o6-85', lesson:6, diff:3, stem:'材料：《十二铜表法》“债权人可拘禁债务人，但须给予基本人道对待”。这反映（　）', opts:['法律完全废除了债务，债务人不再受任何追讨', '法律既维护债权利益，也有限制暴行的萌芽', '法律完全偏袒债务人，债权人的利益受损害', '罗马根本不存在债务纠纷，此条文纯属空文'], ans:1, explain:'该条文在维护债权的同时对人道对待作出规定，体现早期成文法的进步性与局限性并存。', src:'综合提升·模拟训练'},
{id:'o6-86', lesson:6, diff:3, stem:'比较《十二铜表法》与《汉谟拉比法典》（　）', opts:['两者完全相同、毫无差别', '后者是民主性质的法律', '两者都维护奴隶主利益，都按等级量刑', '两者完全相同'], ans:2, explain:'两部法典都是奴隶制社会的成文法，维护奴隶主利益，只是分属罗马与两河。', src:'综合提升·模拟训练'},
{id:'o6-87', lesson:6, diff:3, stem:'罗马万民法与公民法的关系是（　）', opts:['公民法的适用范围更广', '两者内容完全相同', '万民法完全废除了公民法', '万民法适用范围更广，处理外邦人事务'], ans:3, explain:'公民法适用于罗马公民，万民法适用于帝国境内各族，随扩张而产生。', src:'综合提升·模拟训练'},
{id:'o6-88', lesson:6, diff:3, stem:'“罗马不是一天建成的”，从制度史看这句话的含义是（　）', opts:['罗马制度在长期实践中逐步完善', '罗马从来未曾衰落', '罗马毫无制度可言', '罗马无制度可言'], ans:0, explain:'从共和到帝国，从公民法到万民法，罗马政治法律体系经历了漫长演进。', src:'综合提升·模拟训练'},
{id:'o6-89', lesson:6, diff:3, stem:'罗马大竞技场能容纳数万观众且结构稳固，这说明（　）', opts:['罗马城的人口数量十分稀少', '罗马建筑技术与工程管理发达', '罗马的建筑纯粹服务于军事目的', '罗马民众普遍缺乏娱乐活动'], ans:1, explain:'大竞技场体现罗马高超的拱券与混凝土技术，也反映城市公共生活的繁荣。', src:'综合提升·模拟训练'},
{id:'o6-90', lesson:6, diff:3, stem:'西罗马帝国灭亡后，西欧进入中世纪。对此理解正确的是（　）', opts:['西欧很快进入工业时代，生产力获得飞速发展', '罗马文明完全消失，其文化成果荡然无存', '古代奴隶制文明在西欧终结，新的封建社会逐渐形成', '中世纪比罗马更加繁荣，文明继续高速进步'], ans:2, explain:'476年后西欧形成封建制度，进入中世纪；罗马文化并未全消失，教会保存了部分遗产。', src:'综合提升·模拟训练'},
{id:'o6-91', lesson:6, diff:3, stem:'“罗马法的影响超过罗马帝国的疆域”，这句话强调（　）', opts:['罗马帝国统一了整个世界', '罗马法只在本国范围内发生影响', '法律与帝国的兴衰没有关系', '罗马法的法律原则惠及后世'], ans:3, explain:'罗马法的私法体系、法治观念被近代欧洲继承，影响远超帝国本身。', src:'综合提升·模拟训练'},
{id:'p6-92', lesson:6, diff:4, stem:'综合罗马兴衰史，下列说法正确的是（　）', opts:['奴隶制经济的危机贯穿始终，帝国在内忧外患中灭亡', '罗马因文化落后而亡，没有继承希腊的文化成果', '罗马因民主过度而亡，民主制度是其败亡的根源', '罗马从未衰落，其帝国延续至今未曾中断过'], ans:0, explain:'罗马靠奴隶制扩张繁荣，也因奴隶制危机、蛮族入侵与内乱而衰亡，其兴衰根植于制度矛盾。', src:'综合提升·模拟训练'},
{id:'p6-93', lesson:6, diff:4, stem:'罗马法从公民法到万民法再到《罗马民法大全》，这一历程体现（　）', opts:['法律从制定起就一成不变', '法律随社会发展不断调整完善', '法律只为少数贵族阶层服务', '法律完全由平民阶层制定'], ans:1, explain:'法律适应疆域扩张与社会变化而演进，最终在东罗马集大成。', src:'综合提升·模拟训练'},
{id:'p6-94', lesson:6, diff:4, stem:'从“元老院”到“元首制”，罗马政体的变化实质是（　）', opts:['罗马从专制走向民主，权力逐渐分散到人民', '罗马从帝国走向共和，恢复了城邦民主制度', '从贵族共和走向个人独裁，但保留共和外衣', '罗马权力更加分散，各机构相互制约平衡'], ans:2, explain:'屋大维用“元首”称号保留共和形式，实权集于一身，是披着共和外衣的君主制。', src:'综合提升·模拟训练'},
{id:'p6-95', lesson:6, diff:4, stem:'罗马帝国分裂与灭亡的内外因素包括（　）', opts:['罗马出现了严重的文化断层现象', '罗马的经济发展速度过快', '罗马的民主制度完全崩溃瓦解', '奴隶起义、社会矛盾与蛮族入侵'], ans:3, explain:'帝国后期奴隶制危机、贫富分化、军镇割据与日耳曼人入侵共同导致帝国瓦解。', src:'综合提升·模拟训练'},
{id:'q6-96', lesson:6, diff:5, stem:'比较罗马法与近代欧洲法律，正确的结论是（　）', opts:['罗马法的体系、概念与原则为近代欧洲立法奠定基础', '近代法律与罗马法完全无关，是独立发展的结果', '罗马法只影响教会法，与世俗立法没有关联', '近代法律与罗马法完全对立，没有任何继承关系'], ans:0, explain:'《拿破仑法典》等近代立法直接继承罗马法体系，法学家常用罗马法概念，影响深远。', src:'综合提升·模拟训练'},
{id:'q6-97', lesson:6, diff:5, stem:'“希腊人的智慧、罗马人的法律”这一组合说明（　）', opts:['希腊与罗马互不相关，文明各自独立发展', '希腊与罗马的成就互补，共同构成古典文明', '法律制度源于希腊，哲学智慧源于罗马', '希腊与罗马都无成就，这句名言纯属虚构'], ans:1, explain:'希腊长于哲学文艺，罗马长于法律工程，共同奠定西方文明基础。', src:'综合提升·模拟训练'},
{id:'r6-98', lesson:6, diff:6, stem:'材料：罗马法学家盖尤斯说“法学是关于正义与非正义的科学”。结合罗马法内容，正确的理解是（　）', opts:['罗马法完全实现了正义，保障了人人平等自由', '罗马法否定一切权利，人民毫无自由可言', '罗马法在形式上追求正义，实质维护奴隶主等级利益', '法学家主张废除法律，以实现绝对的自由'], ans:2, explain:'罗马法提出正义理念，但其内容确认奴隶制与等级差异，形式正义与实质不平等并存。', src:'综合提升·模拟训练'},
{id:'r6-99', lesson:6, diff:6, stem:'从制度创新看，罗马对世界最重要的贡献是（　）', opts:['行省管理制度的创立与推行', '民主选举制度的创新与完善', '对不同宗教的宽容与包容政策', '成文法体系与法治传统'], ans:3, explain:'罗马成文法（十二铜表法→万民法→民法大全）开创系统的法治传统，是后世法治文明的源头。', src:'综合提升·模拟训练'},

{id:'n7-4', lesson:7, diff:2, stem:'843年查理曼帝国分裂后形成的三个国家雏形是（　）', opts:['英、法、德', '西罗马、东罗马、拜占庭', '法、西、葡', '法兰西、德意志、意大利'], ans:3, explain:'843年帝国一分为三，成为法、德、意三国的雏形。', src:'综合提升·模拟训练'},
{id:'n7-5', lesson:7, diff:2, stem:'西欧封建等级制度的形成与哪一制度直接相关（　）', opts:['封君封臣制（土地分封）', '民主选举产生的官员制度', '选拔人才的科举考试制度', '手工业者的行会组织制度'], ans:0, explain:'8世纪前期法兰克改革土地分封，形成封君与封臣关系，构成封建等级金字塔。', src:'综合提升·模拟训练'},
{id:'n7-6', lesson:7, diff:2, stem:'“我的附庸的附庸不是我的附庸”反映的西欧封建特征是（　）', opts:['人人平等制度', '层层分封，等级隶属关系复杂', '民主自治制度', '民主自治'], ans:1, explain:'西欧封建关系层层分封，封臣只对直接封君效忠，王权难以直达底层，权力分散。', src:'综合提升·模拟训练'},

{id:'n7-11', lesson:7, diff:2, stem:'西欧封建等级金字塔中，处于塔尖的是（　）', opts:['教皇', '骑士', '国王', '农奴'], ans:2, explain:'国王是封建等级金字塔的最高点，其下为公爵、伯爵、骑士等各级封臣。', src:'综合提升·模拟训练'},

{id:'n7-13', lesson:7, diff:2, stem:'基督教在西欧封建社会中的地位是（　）', opts:['精神支柱，拥有巨大影响力', '基督教被社会完全排斥', '基督教只影响平民阶层', '基督教没有任何社会地位'], ans:0, explain:'基督教成为西欧封建社会的精神支柱，教会拥有土地与思想控制权。', src:'综合提升·模拟训练'},

{id:'n7-17', lesson:7, diff:2, stem:'西欧封建社会与东方君主专制的最大区别是（　）', opts:['王权有限、等级隶属关系复杂', '西欧社会没有等级差别', '西欧的中央集权十分强大', '西欧社会人人平等，毫无等级差别'], ans:0, explain:'西欧王权受封臣关系与教会制约，权力分散；东方君主专制权力高度集中。', src:'综合提升·模拟训练'},
{id:'n7-18', lesson:7, diff:2, stem:'采邑制度下，土地的实际占有关系是（　）', opts:['采邑土地全部归国王所有', '层层分封，土地层层占有', '采邑土地实行公有制度', '采邑土地归属教会管理'], ans:1, explain:'土地由国王层层分封，各级封臣在自己领地内拥有实际权力。', src:'综合提升·模拟训练'},
{id:'o7-19', lesson:7, diff:3, stem:'材料：查理曼把帝国土地分封给贵族，贵族宣誓效忠并出兵。这说明（　）', opts:['国王没有任何实际权力', '贵族完全独立于国王之外', '土地是维系封建关系的纽带', '封建关系依靠血缘维系'], ans:2, explain:'土地（采邑）是封君封臣关系的核心纽带，兵役义务是其代价。', src:'综合提升·模拟训练'},
{id:'o7-20', lesson:7, diff:3, stem:'“我的附庸的附庸不是我的附庸”揭示的西欧政治特点是（　）', opts:['王权集中', '人人平等', '等级森严但王权强大', '王权分散，难以形成中央集权'], ans:3, explain:'层层分封使封臣只效忠直接封君，国王不能直接支配隔层封臣，政治权力分散。', src:'综合提升·模拟训练'},
{id:'o7-21', lesson:7, diff:3, stem:'比较西欧庄园与中国古代农村，正确的是（　）', opts:['庄园自给自足且有法庭，中国农村受国家官僚体系管理', '两者完全相同，都是独立自治的经济政治单位实体', '中国古代农村也有独立于国家之外的庄园法庭', '西欧庄园没有私有土地，所有土地一律公有'], ans:0, explain:'西欧庄园相对自治独立，中国农村处于国家行政体系之下，两者社会结构不同。', src:'综合提升·模拟训练'},
{id:'o7-22', lesson:7, diff:3, stem:'克洛维皈依基督教对西欧历史的深远影响是（　）', opts:['基督教被彻底消灭，西欧从此失去精神支柱', '教会与王权结合，基督教成为封建统治的精神支柱', '教会完全失去权力，王权独揽一切大权', '王国更加民主，普通民众权利获得扩大'], ans:1, explain:'皈依后教会支持王权，王权保护教会，基督教遂成西欧封建社会的精神支柱。', src:'综合提升·模拟训练'},
{id:'o7-23', lesson:7, diff:3, stem:'从“法兰克王国”到“查理曼帝国”再到三国鼎立，这一过程说明（　）', opts:['西欧很快实现了统一，建立起中央集权国家', '查理曼帝国一直保持统一，从来没有分裂过', '西欧没有形成长期统一的大帝国，封建割据成为常态', '欧洲的国家数量越来越少，日趋走向大一统格局'], ans:2, explain:'查理曼帝国短暂统一后迅速分裂，西欧长期处于封建割据状态。', src:'综合提升·模拟训练'},
{id:'o7-24', lesson:7, diff:3, stem:'庄园法庭虽由领主主持，但判决需依据惯例。这说明（　）', opts:['庄园法庭的判决完全随意', '领主在庄园内无法无天', '庄园之内不存在任何法律', '庄园存在一定的习惯法传统'], ans:3, explain:'庄园法庭依照世代相传的习惯审理，体现中世纪法律的惯例特征。', src:'综合提升·模拟训练'},
{id:'o7-25', lesson:7, diff:3, stem:'骑士阶层形成的社会基础是（　）', opts:['封君封臣制度', '民主制度', '科举制度', '商业行会'], ans:0, explain:'骑士是封臣体系中的低级贵族，以服骑兵役换取采邑。', src:'综合提升·模拟训练'},
{id:'p7-26', lesson:7, diff:4, stem:'综合西欧封建社会的特征，下列概括最准确的是（　）', opts:['中央集权、商品经济、思想自由', '封君封臣、庄园经济、教会至上三位一体', '王权至上、奴隶经济', '民主法治、人人平等'], ans:1, explain:'西欧中世纪由封建等级关系、庄园经济与教会精神统治共同支撑，这是其基本特征。', src:'综合提升·模拟训练'},
{id:'p7-27', lesson:7, diff:4, stem:'分析克洛维皈依基督教的动机与影响，正确的判断是（　）', opts:['克洛维皈依纯粹出于宗教信仰的需要，没有任何政治方面的考量', '皈依的影响是教会衰落，王权完全摆脱了宗教束缚', '动机是政治需要，影响是教会与王权互相利用，巩固封建统治', '皈依的动机是发展经济，与权力争夺没有关系'], ans:2, explain:'皈依是巩固权力的政治选择，教会获得世俗保护，王权获得神权加持，双赢互惠。', src:'综合提升·模拟训练'},
{id:'p7-28', lesson:7, diff:4, stem:'西欧封建等级制度与印度种姓制度的区别是（　）', opts:['两者都固定不变，等级身份终身无法改变', '前者比后者更加封闭，社会流动性也要差得多', '后者比前者更加开放，允许各等级自由流动', '前者以上地为纽带可因军功变动，后者以出身定终身'], ans:3, explain:'封君封臣关系以土地和效忠为纽带，有相对流动性；种姓制度出身决定终身，更为封闭。', src:'综合提升·模拟训练'},
{id:'p7-29', lesson:7, diff:4, stem:'“黑暗的中世纪”说法并不全面，因为（　）', opts:['中世纪虽有等级压迫，但也孕育了庄园经济、城市与大学', '中世纪毫无成就，是彻底的黑暗时代', '中世纪社会非常繁荣，超过一切历史时期', '中世纪没有阶级压迫，实现了人人平等'], ans:0, explain:'中世纪确实压抑人性，但城市兴起、大学诞生、文化传承也为近代文明准备了条件，需辩证评价。', src:'综合提升·模拟训练'},
{id:'q7-30', lesson:7, diff:5, stem:'比较西欧封建制与中国西周分封制，正确的是（　）', opts:['两者完全相同，都导致地方长期割据与分裂局面', '两者都以分封维系等级，中国走向中央集权，西欧走向割据', '两者都实行民主政治，国家权力最终全部归于广大民众之手', '两者都废除了土地私有，全面实行土地国有制度'], ans:1, explain:'西周分封制后来被郡县制取代走向集权；西欧封君封臣关系却强化了割据，走向不同方向。', src:'综合提升·模拟训练'},
{id:'q7-31', lesson:7, diff:5, stem:'恩格斯说“中世纪把意识形态的一切形式都合并到神学中”。这说明（　）', opts:['中世纪的文化完全空白，没有任何知识成果', '神学与哲学完全无关，两者各自独立发展', '中世纪文化受教会神学统摄，但并非毫无创造', '教会从不控制思想，人们享有充分的言论自由'], ans:2, explain:'神学笼罩中世纪一切思想领域，但经院哲学、大学教育仍孕育了新的知识萌芽。', src:'综合提升·模拟训练'},
{id:'r7-32', lesson:7, diff:6, stem:'史料辨析：关于法兰克王国的记载，下列可信度最高的是（　）', opts:['后世小说中的描写，生动具体，可信度最高', '近代影视剧的演绎，经过艺术加工，最为可信', '口头传说世代相传，保留了真实的历史细节', '《法兰克人史》等同时代文献与考古发现互证'], ans:3, explain:'同时代文献与考古实物相互印证是研究早期中世纪最可靠的方法；后世创作仅供参考。', src:'综合提升·模拟训练'},
{id:'r7-33', lesson:7, diff:6, stem:'从社会形态演进看，西欧“采邑—封臣”制度与罗马“奴隶制大庄园”的根本区别是（　）', opts:['劳动者身份由奴隶变为依附农奴，人身依附关系缓和', '两者完全相同，劳动者都处于绝对奴役的压迫状态之中', '采邑制比罗马庄园更加残酷，压迫更加深重', '罗马时代没有庄园，因此这种比较无法成立'], ans:0, explain:'中世纪农奴相对奴隶有一定权利（份地、惯例保护），体现奴隶制向封建制转变的历史进步。', src:'综合提升·模拟训练'},
{id:'n8-34', lesson:8, diff:2, stem:'西欧城市重新兴起于（　）', opts:['5世纪', '10世纪', '14世纪', '18世纪'], ans:1, explain:'10世纪起，随着农业技术提高与工商业发展，西欧城市重新兴起。', src:'综合提升·模拟训练'},
{id:'n8-35', lesson:8, diff:2, stem:'西欧城市兴起的中心是（　）', opts:['军事防御', '宗教朝圣', '手工业和商业', '行政管理'], ans:2, explain:'新兴城市以手工业和商业为中心，市民多为手工业者和商人。', src:'综合提升·模拟训练'},
{id:'n8-36', lesson:8, diff:2, stem:'“城市的空气使人自由”反映的是（　）', opts:['城市实现了人人平等', '城市实现了完全自治', '市民免除了全部赋税', '农奴在城市住满一年零一天即获自由'], ans:3, explain:'中世纪谚语指农奴逃到城市住满一年零一天可成为自由民。', src:'综合提升·模拟训练'},
{id:'n8-37', lesson:8, diff:2, stem:'市民争取城市自治的两种主要方式是（　）', opts:['金钱赎买与武装斗争', '选举改革与法律诉讼', '宗教祈祷', '和平请愿与外交谈判'], ans:0, explain:'市民通过金钱赎买、武装斗争获得城市自治权，特许状是法律保障。', src:'综合提升·模拟训练'},
{id:'n8-38', lesson:8, diff:2, stem:'特许状的性质是（　）', opts:['国王颁发的任命文书', '城市自由与自治的法律保障', '普通的贸易合同文书凭证', '教会颁发的许可证件'], ans:1, explain:'特许状由国王或领主颁发，确认城市权利，是自治的凭证。', src:'综合提升·模拟训练'},
{id:'n8-39', lesson:8, diff:2, stem:'市民阶层中分化出的新兴社会力量是（　）', opts:['封建贵族', '农奴', '早期资产阶级', '教士'], ans:2, explain:'工商业者与市民中的富裕阶层逐渐形成早期资产阶级。', src:'综合提升·模拟训练'},
{id:'n8-40', lesson:8, diff:2, stem:'被称为中世纪教育“最美好的花朵”的是（　）', opts:['行会', '修道院', '骑士学校', '大学'], ans:3, explain:'12世纪兴起的大学被称为中世纪教育“最美好的花朵”。', src:'综合提升·模拟训练'},
{id:'n8-41', lesson:8, diff:2, stem:'中世纪大学开设的专业课程有（　）', opts:['法学、医学、神学', '金融、管理、营销', '物理、化学、生物', '体育、音乐、美术'], ans:0, explain:'大学开设文法、逻辑等基础课与法学、医学、神学等专业课程。', src:'综合提升·模拟训练'},
{id:'n8-42', lesson:8, diff:2, stem:'巴黎圣母院属于哪种建筑风格（　）', opts:['罗马式', '哥特式', '巴洛克式', '现代主义'], ans:1, explain:'巴黎圣母院是哥特式建筑，尖塔高耸、彩窗斑斓。', src:'综合提升·模拟训练'},
{id:'n8-43', lesson:8, diff:2, stem:'城市兴起对封建制度的客观影响是（　）', opts:['巩固了封建庄园', '消灭了商品经济', '促进了封建制度的瓦解', '加强了农奴制'], ans:2, explain:'城市商品经济发展冲击庄园自然经济，市民阶层成为瓦解封建制度的新力量。', src:'综合提升·模拟训练'},
{id:'n8-44', lesson:8, diff:2, stem:'西欧大学兴起的历史条件包括（　）', opts:['国王颁布法令禁止办学', '农业经济全面衰退所造成的', '教会长期垄断一切文化教育', '城市经济的繁荣与知识的需求'], ans:3, explain:'城市工商业发展需要知识与人才，大学应运而生。', src:'综合提升·模拟训练'},
{id:'n8-45', lesson:8, diff:2, stem:'中世纪行会的职责是（　）', opts:['规范手工业生产与学徒制度', '负责管理国家的军队事务组织', '负责审判各类刑事案件', '负责征收国家的赋税'], ans:0, explain:'行会管理手工业者的生产、质量与学徒晋升，维护行业秩序。', src:'综合提升·模拟训练'},
{id:'n8-46', lesson:8, diff:2, stem:'哥特式教堂的典型特征是（　）', opts:['采用巨大的圆顶穹隆结构', '尖塔高耸、彩色玻璃窗', '全部采用木质结构建造', '建造在地下的建筑形式'], ans:1, explain:'哥特建筑以尖拱、飞扶壁、彩窗著称，体现中世纪建筑艺术成就。', src:'综合提升·模拟训练'},
{id:'n8-47', lesson:8, diff:2, stem:'市民阶层的历史地位是（　）', opts:['它是封建统治的支柱力量之一', '它是农奴利益的代言人群体', '为资本主义萌芽准备了阶级条件', '它是教会的主要支持者与追随者'], ans:2, explain:'市民中的富裕者转化为早期资产阶级，是资本主义萌芽的阶级基础。', src:'综合提升·模拟训练'},
{id:'n8-48', lesson:8, diff:2, stem:'“城市自治”中市民追求的核心权利是（　）', opts:['宗教信仰自由', '选举国王', '土地分配', '财产权与人身自由'], ans:3, explain:'市民争取的主要是财产权、人身自由与自治权。', src:'综合提升·模拟训练'},
{id:'n8-49', lesson:8, diff:2, stem:'大学兴起对后世的影响是（　）', opts:['推动了文化教育发展，为文艺复兴做了准备', '大学阻碍了思想传播，知识只局限于少数人', '大学完全服从教会，没有任何独立的精神', '大学导致城市衰落，经济重心转向乡村地区'], ans:0, explain:'大学培养人才、传承知识，孕育人文主义思想，是文艺复兴的准备。', src:'综合提升·模拟训练'},
{id:'n8-50', lesson:8, diff:2, stem:'关于中世纪城市，下列说法正确的是（　）', opts:['市民都是农奴', '市民享有较多自由与权利', '城市完全没有法律', '城市经济完全自给'], ans:1, explain:'中世纪城市市民相对自由，有特许状保障权利，城市经济以工商业为本。', src:'综合提升·模拟训练'},
{id:'n8-51', lesson:8, diff:2, stem:'从“庄园”到“城市”的变化说明（　）', opts:['农业在这一过程中完全消失', '人口数量出现急剧的减少', '商品经济发展、社会分工深化', '封建制度反而得到加强巩固'], ans:2, explain:'城市兴起是农业剩余产品与手工业分工发展的结果，标志西欧经济重心转移。', src:'综合提升·模拟训练'},
{id:'o8-52', lesson:8, diff:3, stem:'材料：“农奴逃进城，住满一年零一天，即可获得自由。”这体现（　）', opts:['农奴永远无法自由', '国王禁止农奴进城', '城市废除私有制', '城市为农奴提供了人身解放的机会'], ans:3, explain:'城市凭借自由传统吸纳农奴，冲击庄园人身依附关系，推动封建制度松动。', src:'综合提升·模拟训练'},
{id:'o8-53', lesson:8, diff:3, stem:'特许状对城市与王权关系的影响是（　）', opts:['城市获得自治权，王权相对受到制约', '城市被国王完全吞并', '王权完全消失殆尽', '两者毫无关系'], ans:0, explain:'特许状确认城市权利，使城市成为相对独立的共同体，改变西欧权力格局。', src:'综合提升·模拟训练'},
{id:'o8-54', lesson:8, diff:3, stem:'从“大学”课程设置看，中世纪教育与古希腊罗马教育最大的不同是（　）', opts:['课程设置完全一模一样', '增加了神学等课程，与教会关系密切', '大学只教授神学课程', '取消了所有课程设置'], ans:1, explain:'中世纪大学在古典课程外增设神学，并受教会支持，反映时代特色。', src:'综合提升·模拟训练'},
{id:'o8-55', lesson:8, diff:3, stem:'哥特式教堂高耸的尖塔与彩窗，其文化内涵是（　）', opts:['哥特教堂是纪念商人的建筑，歌颂商业繁荣', '哥特建筑主要展示军事力量，体现尚武精神', '追求向上接近上帝，同时展现技艺与财富', '哥特教堂用于庆祝丰收，是农业文化的象征'], ans:2, explain:'哥特建筑既表达宗教虔诚，也是城市财富与工匠技艺的炫耀。', src:'综合提升·模拟训练'},
{id:'o8-56', lesson:8, diff:3, stem:'城市行会与庄园法庭的共同点是（　）', opts:['都选举国王', '都管理国家外交', '都废除私有制', '都规范特定群体的生产生活秩序'], ans:3, explain:'行会规范手工业，庄园法庭规范庄园事务，都是中世纪自组织秩序的一部分。', src:'综合提升·模拟训练'},
{id:'o8-57', lesson:8, diff:3, stem:'市民阶层与早期资产阶级的关系是（　）', opts:['前者是后者的前身与来源', '两者无关', '前者晚于后者', '资产阶级是贵族转化而来'], ans:0, explain:'富裕市民投资工商业，逐渐演变为早期资产阶级。', src:'综合提升·模拟训练'},
{id:'o8-58', lesson:8, diff:3, stem:'“城市的空气使人自由”与“农奴制”的关系表明（　）', opts:['农奴制度反而更加巩固', '城市的发展正在瓦解庄园农奴制', '城市的发展反而帮助领主巩固统治', '自由与农奴制可以并存不悖'], ans:1, explain:'城市自由吸引农奴逃离庄园，庄园劳动力流失，农奴制逐渐松动瓦解。', src:'综合提升·模拟训练'},
{id:'p8-59', lesson:8, diff:4, stem:'综合分析城市、大学与文艺复兴的关系，正确的是（　）', opts:['大学阻碍了文艺复兴，禁锢了人们的思想解放运动', '城市、大学与文艺复兴三者互不相关，各自独立发展演变', '城市经济繁荣滋养大学，大学传播人文知识，为文艺复兴准备了条件', '城市经济的发展导致文艺复兴运动最终彻底地以失败而告终'], ans:2, explain:'城市经济是基础，大学是知识摇篮，人文主义在两者共同滋养下兴起，逻辑链完整。', src:'综合提升·模拟训练'},
{id:'p8-60', lesson:8, diff:4, stem:'中世纪城市自治权与近代公民权的区别是（　）', opts:['两者完全相同，都是普遍性的权利保障制度', '前者比后者更加普遍，覆盖的范围也更广', '后者只限于城市居民，农村人口无权享有', '前者是特定城市特权，后者是普遍公民权利'], ans:3, explain:'自治权是封建特权式的局部自由，近代公民权是普遍性的法律权利，性质不同。', src:'综合提升·模拟训练'},
{id:'p8-61', lesson:8, diff:4, stem:'“城市是中世纪的黑洞，也是新世界的摇篮。”对这句话理解正确的是（　）', opts:['城市打破庄园封闭，孕育新的生产方式与阶级力量', '城市毫无贡献，只是封建领主聚敛财富的工具', '城市导致中世纪毁灭，西欧从此陷入长期黑暗', '城市与近代文明无关，是孤立的历史现象而已'], ans:0, explain:'城市瓦解封建经济，孕育资产阶级与人文主义，是近代资本主义兴起的温床。', src:'综合提升·模拟训练'},
{id:'p8-62', lesson:8, diff:4, stem:'比较中世纪大学与古代稷下学宫（中国），正确的是（　）', opts:['两者完全相同，都是官方主办的传播知识的教育机构', '两者都是知识传播机构，但大学受教会影响，学宫受诸侯支持', '中世纪大学没有正式课程，学宫教学内容更丰富', '学宫出现的时间比大学更晚，是模仿大学而设的'], ans:1, explain:'中西方都有官方与民间办学传统，但中世纪大学依托教会与城市自治，形成独特制度。', src:'综合提升·模拟训练'},
{id:'q8-63', lesson:8, diff:5, stem:'用唯物史观分析西欧城市的兴起，根本原因是（　）', opts:['人口自然快速增长', '教会鼓励人们经商致富', '农业生产力提高、手工业与商业的发展', '人口自然增长'], ans:2, explain:'剩余农产品与手工业分工是城市兴起的物质基础，生产力发展是根本原因。', src:'综合提升·模拟训练'},
{id:'q8-64', lesson:8, diff:5, stem:'评价中世纪城市的历史地位，最恰当的是（　）', opts:['它是封建统治的支柱，全力维护庄园经济秩序', '它毫无历史作用，只是人口聚集的场所而已', '它使封建制度更加巩固，加强了领主统治权力', '它是封建社会的异己力量，为资本主义准备了经济与阶级条件'], ans:3, explain:'城市商品货币关系冲击封建自然经济，市民阶级壮大，城市成为瓦解封建制的突破口。', src:'综合提升·模拟训练'},
{id:'r8-65', lesson:8, diff:6, stem:'史料辨析：研究巴黎圣母院历史，下列史料价值最高的是（　）', opts:['中世纪建筑档案与考古修复记录', '雨果所著的小说《巴黎圣母院》', '现代电影中出现的剧照画面', '旅游景点发放的宣传手册资料'], ans:0, explain:'档案与考古资料是第一手证据；小说、电影、宣传品是文艺作品，需谨慎引用。', src:'综合提升·模拟训练'},
{id:'r8-66', lesson:8, diff:6, stem:'从“行会”到“工场手工业”再到“机器工厂”，生产组织演进的动力是（　）', opts:['行会垄断了生产，阻碍了生产组织的变革', '生产力发展推动分工深化与规模扩大', '政府强制改革推动了生产组织的不断演进', '人口下降导致生产组织不得不持续调整'], ans:1, explain:'生产组织随生产力发展不断变革：行会→手工工场→工厂，体现经济形态的升级。', src:'综合提升·模拟训练'},
{id:'n9-67', lesson:9, diff:2, stem:'拜占庭帝国是下列哪一帝国的延续（　）', opts:['亚历山大帝国', '西罗马帝国', '东罗马帝国', '波斯帝国'], ans:2, explain:'395年罗马分裂后，东罗马帝国因都城君士坦丁堡旧名拜占庭而称拜占庭帝国。', src:'综合提升·模拟训练'},
{id:'n9-68', lesson:9, diff:2, stem:'拜占庭帝国都城是（　）', opts:['罗马', '雅典', '耶路撒冷', '君士坦丁堡'], ans:3, explain:'拜占庭帝国以君士坦丁堡为都，扼守欧亚要冲。', src:'综合提升·模拟训练'},
{id:'n9-69', lesson:9, diff:2, stem:'查士丁尼组织编纂的法典是（　）', opts:['《罗马民法大全》', '《汉谟拉比法典》', '《十二铜表法》', '《拿破仑法典》'], ans:0, explain:'527年查士丁尼即位后组织编纂《罗马民法大全》，奠定欧洲民法基础。', src:'综合提升·模拟训练'},
{id:'n9-70', lesson:9, diff:2, stem:'《罗马民法大全》不包括下列哪一部（　）', opts:['《查士丁尼法典》', '《十二铜表法》', '《法学汇纂》', '《新法典》'], ans:1, explain:'《罗马民法大全》含《查士丁尼法典》《法学汇纂》《法理概要》《新法典》，不含《十二铜表法》。', src:'综合提升·模拟训练'},
{id:'n9-71', lesson:9, diff:2, stem:'《罗马民法大全》的历史地位是（　）', opts:['第一部资产阶级宪法', '世界上第一部成文法', '奠定了欧洲民法的基础', '废除奴隶制的法令'], ans:2, explain:'《罗马民法大全》系统整理罗马法，成为近代欧洲民法的基础。', src:'综合提升·模拟训练'},
{id:'n9-72', lesson:9, diff:2, stem:'1453年攻陷君士坦丁堡、灭亡拜占庭的是（　）', opts:['阿拉伯帝国', '蒙古帝国', '法兰克王国', '奥斯曼帝国'], ans:3, explain:'1453年奥斯曼帝国攻陷君士坦丁堡，千年拜占庭帝国终结。', src:'综合提升·模拟训练'},
{id:'n9-73', lesson:9, diff:2, stem:'拜占庭文化最突出的特点是（　）', opts:['对东西方文化兼收并蓄', '只保留基督教文化', '全盘伊斯兰化', '完全排斥希腊文化'], ans:0, explain:'拜占庭地跨欧亚非，保存并融合希腊罗马与东方文化，兼收并蓄。', src:'综合提升·模拟训练'},
{id:'n9-74', lesson:9, diff:2, stem:'拜占庭保存大量希腊罗马古籍，其深远影响是（　）', opts:['这一举动使古希腊文化消失', '为文艺复兴提供了精神营养', '这一举动与欧洲毫无关系', '这一举动直接导致帝国强盛'], ans:1, explain:'文艺复兴时期欧洲人重新发现拜占庭保存的古典文献，获得思想资源。', src:'综合提升·模拟训练'},
{id:'n9-75', lesson:9, diff:2, stem:'圣索菲亚大教堂的建筑特点是（　）', opts:['纯粹的东方建筑风格特色', '以纯木质结构为主的建筑形式风格', '融合东西方建筑风格，穹顶宏伟', '采用地下宫殿式的建筑布局'], ans:2, explain:'圣索菲亚大教堂融合东西方风格，是拜占庭文化兼收并蓄的象征。', src:'综合提升·模拟训练'},
{id:'n9-76', lesson:9, diff:2, stem:'《罗马民法大全》对奴隶制的态度是（　）', opts:['与奴隶无关', '扩大了奴隶制范围', '与奴隶毫无关系', '仍承认奴隶制，但改善了奴隶地位'], ans:3, explain:'法典承认奴隶制，但规定改善奴隶处境，体现时代局限与进步性并存。', src:'综合提升·模拟训练'},
{id:'n9-77', lesson:9, diff:2, stem:'拜占庭帝国长期存在的政治原因包括（　）', opts:['地处欧亚交通要冲，工商业发达', '长期处于与世隔绝状态', '与世隔绝', '没有外敌'], ans:0, explain:'拜占庭凭地理优势发展工商业与外交，维持千年国祚。', src:'综合提升·模拟训练'},
{id:'n9-78', lesson:9, diff:2, stem:'拜占庭对斯拉夫世界的影响主要体现在（　）', opts:['向斯拉夫世界输出民主制度', '传播基督教（东正教）与文化', '把中国的科举取士制度传入斯拉夫世界', '从阿拉伯引进货币体系'], ans:1, explain:'拜占庭向东欧斯拉夫民族传播东正教、文字与文化，影响深远。', src:'综合提升·模拟训练'},
{id:'n9-79', lesson:9, diff:2, stem:'拜占庭帝国灭亡后，其法律与文化影响（　）', opts:['其影响范围仅限于亚洲地区', '其影响已经完全消失殆尽', '延续至今，影响欧洲法制', '其影响被后世彻底遗忘'], ans:2, explain:'《罗马民法大全》被近代欧洲继承，拜占庭文化也影响后世。', src:'综合提升·模拟训练'},
{id:'n9-80', lesson:9, diff:2, stem:'查士丁尼编纂法典的主要目的是（　）', opts:['发展商业', '讨好教皇势力', '发展商业经济', '巩固帝国统治、稳定社会秩序'], ans:3, explain:'整理法律旨在统一司法、强化皇权，维护帝国统治。', src:'综合提升·模拟训练'},
{id:'n9-81', lesson:9, diff:2, stem:'“千年帝国”常被用来指代（　）', opts:['拜占庭帝国', '罗马共和国', '奥斯曼帝国', '查理曼帝国'], ans:0, explain:'拜占庭帝国存在约一千年（395—1453），故称千年帝国。', src:'综合提升·模拟训练'},
{id:'n9-82', lesson:9, diff:2, stem:'拜占庭文化的载体主要是（　）', opts:['中国商代的甲骨文材料', '希腊语与拉丁语文献', '两河流域的楔形文字材料', '阿拉伯语的诗歌作品'], ans:1, explain:'拜占庭以希腊语为主、拉丁语为辅，保存大量古典文献。', src:'综合提升·模拟训练'},
{id:'n9-83', lesson:9, diff:2, stem:'关于《罗马民法大全》，下列说法正确的是（　）', opts:['它完全推翻了罗马法，另起炉灶重新立法', '它只涉及刑法，不涉及民法的相关内容', '它保留了罗马法精华，适应了当时社会需要', '它与后世法律完全无关，影响十分有限'], ans:2, explain:'法典对财产、契约等作出规定，继承并发展罗马法，影响后世。', src:'综合提升·模拟训练'},
{id:'n9-84', lesson:9, diff:2, stem:'拜占庭帝国与西罗马帝国灭亡命运的不同在于（　）', opts:['两者同时灭亡', '西罗马延续更久', '拜占庭更早灭亡', '拜占庭多延续了近千年'], ans:3, explain:'西罗马476年亡，拜占庭延续至1453年，多存续近千年。', src:'综合提升·模拟训练'},
{id:'o9-85', lesson:9, diff:3, stem:'材料：查士丁尼说“皇帝的威严光荣不但依靠兵器，而且须用法律来巩固”。这说明（　）', opts:['皇帝重视用法律维护统治', '皇帝放弃军事', '法律与皇权无关', '拜占庭是法治国家'], ans:0, explain:'查士丁尼意识到法律对巩固皇权的作用，故编纂法典，法律成为统治工具。', src:'综合提升·模拟训练'},
{id:'o9-86', lesson:9, diff:3, stem:'《罗马民法大全》承认奴隶制但改善奴隶地位。对此认识正确的是（　）', opts:['法典废除了奴隶制度，实现了人人平等自由', '法典维护奴隶制本质，局部改善体现时代进步', '法典使奴隶地位彻底改变，不再受到任何压迫', '法典维护奴隶制本质，没有任何进步性可言'], ans:1, explain:'法典仍把奴隶当财产，只是限制部分虐待行为，进步有限，本质未变。', src:'综合提升·模拟训练'},
{id:'o9-87', lesson:9, diff:3, stem:'比较拜占庭帝国与西罗马帝国的命运，启示在于（　）', opts:['只要军事力量强大，国家就可以永远保持长治久安的局面', '文化事业毫无用处，不能维系国家的统治', '经济繁荣与制度韧性决定国运，封闭僵化导致衰亡', '外敌入侵决定国家兴衰，内因并不重要'], ans:2, explain:'拜占庭凭借工商业与法律维持千年，但后期僵化保守、内忧外患而亡；西罗马奴隶制危机速亡。', src:'综合提升·模拟训练'},
{id:'o9-88', lesson:9, diff:3, stem:'圣索菲亚大教堂后来被改为清真寺的历史，反映（　）', opts:['当地的宗教信仰完全消灭', '这一建筑没有任何价值可言', '拜占庭文化从此完全消失', '文明在征服与交融中传承演变'], ans:3, explain:'教堂改清真寺说明奥斯曼征服后文化载体发生演变，但建筑遗产仍存续。', src:'综合提升·模拟训练'},
{id:'o9-89', lesson:9, diff:3, stem:'拜占庭保存古典文献对西方文明的意义是（　）', opts:['使古典文化得以传承，成为文艺复兴的资料来源', '拜占庭保存文化导致西方文化出现断层', '拜占庭的保存使古典文化被彻底埋没失传', '拜占庭的保存只影响了东方文明的发展'], ans:0, explain:'文艺复兴学者从拜占庭手稿中复兴古典，其保存之功不可没。', src:'综合提升·模拟训练'},
{id:'o9-90', lesson:9, diff:3, stem:'从《罗马民法大全》到《拿破仑法典》，可以看出（　）', opts:['欧洲的法律与罗马法无关', '罗马法是欧洲民法体系的源头', '拿破仑凭一己之力自创法律', '民法只存在于罗马时代'], ans:1, explain:'《拿破仑法典》直接继承罗马法传统，体现罗马法对近代欧洲的深远影响。', src:'综合提升·模拟训练'},
{id:'o9-91', lesson:9, diff:3, stem:'拜占庭帝国灭亡后，俄罗斯自称“第三罗马”，这说明（　）', opts:['俄罗斯征服了拜占庭帝国', '拜占庭帝国已经完全消失', '拜占庭文化与正统延续到东欧', '罗马的传统彻底终结'], ans:2, explain:'莫斯科公国继承拜占庭东正教与文化传统，自居罗马正统继承者。', src:'综合提升·模拟训练'},
{id:'p9-92', lesson:9, diff:4, stem:'综合拜占庭千年兴衰，下列认识最全面的是（　）', opts:['拜占庭没有影响后世，只留下了一些建筑遗迹', '拜占庭毫无成就可言，只是罗马帝国的简单延续而已', '拜占庭只因外敌入侵而灭亡，与自身无关', '它传承古典文明有功，但长期保守僵化，最终被历史淘汰'], ans:3, explain:'拜占庭保存古典、影响东欧有功；但固守传统、不思变革，加之内乱外侵，终于覆灭。', src:'综合提升·模拟训练'},
{id:'p9-93', lesson:9, diff:4, stem:'《罗马民法大全》的“大全”含义是（　）', opts:['系统汇总历代罗马法令与法学家著作', '地位超过一切法典', '只指某一部法律', '包含世界上所有国家的法律'], ans:0, explain:'“大全”汇编《查士丁尼法典》《法学汇纂》等，系统集成罗马法成果。', src:'综合提升·模拟训练'},
{id:'p9-94', lesson:9, diff:4, stem:'分析拜占庭帝国长期延续的原因，包括（　）', opts:['拜占庭完全封闭，拒绝与外界的一切交往', '优越的地理位置、发达的经济与灵活的外交', '拜占庭人口稀少，国家规模十分有限', '拜占庭没有军队，完全依靠宗教维系统治'], ans:1, explain:'君士坦丁堡扼守商路、经济繁荣、外交灵活，是帝国存续近千年的重要条件。', src:'综合提升·模拟训练'},
{id:'p9-95', lesson:9, diff:4, stem:'从“拜占庭文化”看东西方文明交流，正确的结论是（　）', opts:['拜占庭拒绝一切交流', '东西方无交流', '拜占庭是东西方文明的桥梁与蓄水池', '交流只限于军事'], ans:2, explain:'拜占庭地处欧亚交汇，输入东方丝绸珍宝，输出古典文献与宗教，是文明交流枢纽。', src:'综合提升·模拟训练'},
{id:'q9-96', lesson:9, diff:5, stem:'比较罗马帝国与拜占庭帝国，正确的是（　）', opts:['两者同时灭亡，帝国历史命运完全相同', '两者都城相同，都以罗马城为统治中心', '拜占庭帝国比西罗马帝国灭亡得更早', '罗马以罗马城为中心，拜占庭以君堡为中心'], ans:3, explain:'西罗马476年灭亡，拜占庭延续至1453年，国祚远超西罗马。', src:'综合提升·模拟训练'},
{id:'q9-97', lesson:9, diff:5, stem:'“拜占庭是文明的蓄水池，也是文明的输出港。”对此理解正确的是（　）', opts:['它保存古典文化并向外传播，发挥了传承枢纽作用', '拜占庭没有保存文化，其文化全部是自创的', '拜占庭只进不出，只保存而不向外传播文化', '拜占庭只输出武力，文化贡献可以忽略不计'], ans:0, explain:'拜占庭收藏古籍、传布宗教与文化，兼具蓄存与输出功能，是文明传承的枢纽。', src:'综合提升·模拟训练'},
{id:'r9-98', lesson:9, diff:6, stem:'史料辨析：关于《查士丁尼法典》的条文，研究时应优先采用（　）', opts:['后世法学家的注释', '法典抄本（原始文献）', '现代教材的概括', '影视作品情节'], ans:1, explain:'法典抄本是第一手原始文献，注释与教材是二手研究，影视属创作，原始文本最可靠。', src:'综合提升·模拟训练'},
{id:'r9-99', lesson:9, diff:6, stem:'从“君士坦丁堡”改名为“伊斯坦布尔”这一史实，可以看出（　）', opts:['城市名称改变说明其历史完全断裂重来', '名称的变化与城市历史没有任何关联', '征服带来城市文化更迭，但历史层累依然存在', '伊斯坦布尔之名使拜占庭文明消失殆尽'], ans:2, explain:'1453年奥斯曼征服后城市更名，但建筑、文献等历史层累仍在，文明并未彻底断绝。', src:'综合提升·模拟训练'},

{id:'o10-19', lesson:10, diff:3, stem:'材料：大化改新诏书“废除贵族私有土地，土地一律收归国有”。这说明（　）', opts:['改新继续实行土地私有', '改新建立土地国有制，加强中央集权', '贵族势力大大加强', '土地归农民所有'], ans:1, explain:'土地国有化削弱贵族经济基础，强化中央权力，是集权改革的核心。', src:'综合提升·模拟训练'},
{id:'o10-20', lesson:10, diff:3, stem:'比较日本大化改新与中国隋唐制度，正确的是（　）', opts:['日本完全照搬隋唐制度，没有任何改动', '日本独立创造了全部制度，与隋唐无关', '日本仿效隋唐但不完全照搬，结合国情调整', '日本与隋唐制度互不影响，各自独立发展'], ans:2, explain:'日本引进均田、科举等制度时结合本国实际，如班田制有别于均田制。', src:'综合提升·模拟训练'},
{id:'o10-21', lesson:10, diff:3, stem:'日本从“大化改新”到“幕府统治”的转变说明（　）', opts:['日本确立了民主制度，天皇权力不断加强', '日本天皇加强集权，建立统一的中央政权', '日本被外族统治，幕府属于外来政权性质', '封建制度内部权力结构发生变化，武士集团崛起'], ans:3, explain:'班田制瓦解后庄园兴起，武士集团壮大，幕府取代天皇实权，封建政治格局重塑。', src:'综合提升·模拟训练'},
{id:'o10-22', lesson:10, diff:3, stem:'武士道精神的形成背景是（　）', opts:['庄园武士集团效忠主君的需求', '由中国传入', '天皇大力提倡', '佛教要求'], ans:0, explain:'地方庄园主豢养武士，武士以效忠主君为信条，武士道由此形成。', src:'综合提升·模拟训练'},
{id:'o10-23', lesson:10, diff:3, stem:'大化改新成功的关键因素是（　）', opts:['单纯模仿外来制度', '全面学习先进制度与本国执行有力', '完全排斥外来文化', '排斥外来文化'], ans:1, explain:'积极学习隋唐制度并有效推行，改革才能成功，体现开放学习与本国落实的结合。', src:'综合提升·模拟训练'},
