{id:'p10-28', lesson:10, diff:4, stem:'大化改新与明治维新的区别在于（　）', opts:['两者完全相同，改革的性质内容基本一致', '明治维新比大化改新发生得更早', '前者从奴隶制走向封建制，后者从封建制走向资本主义', '大化改新学习欧美，明治维新学习唐朝制度'], ans:2, explain:'646年改新确立封建制，1868年明治维新学习西方确立资本主义，方向与时代不同。', src:'综合提升·模拟训练'},
{id:'p10-29', lesson:10, diff:4, stem:'日本学习中国文化的“选择性”体现在（　）', opts:['日本只学军事技术，其他一概不予采纳', '日本完全复制中国文化，不加以任何改变', '日本什么文化都不学，保持固有传统不变', '吸收制度与佛教，但不照搬全部中国习俗'], ans:3, explain:'日本有选择地吸收有利于集权的制度与宗教文化，体现文化传播中的本土化。', src:'综合提升·模拟训练'},
{id:'q10-30', lesson:10, diff:5, stem:'比较日本大化改新与西欧采邑改革，正确的是（　）', opts:['日本走向中央集权，西欧走向封建割据，方向相反', '两者都走向封建割据，王权日益衰落', '两者都走向中央集权，不断加强君主的专制统治权力', '两者互不相关，没有任何相似之处'], ans:0, explain:'大化改新强化中央集权，西欧采邑制却导致权力分散，同属封建化但路径迥异。', src:'综合提升·模拟训练'},
{id:'q10-31', lesson:10, diff:5, stem:'用唯物史观分析大化改新的根本动力是（　）', opts:['大化改新完全由天皇个人的喜好决定，与日本国情毫无关系', '日本社会内部矛盾（部民制危机）与外部先进制度示范', '大化改新是唐朝强推的结果，日本被迫改革', '大化改新源于自然灾害，与制度矛盾无关'], ans:1, explain:'部民制危机与集权需要是内因，隋唐制度是外因，内外结合推动改革。', src:'综合提升·模拟训练'},
{id:'r10-32', lesson:10, diff:6, stem:'史料辨析：研究大化改新的措施，最可信的史料是（　）', opts:['现代教科书中的内容转述', '后世创作的小说《源氏物语》', '《日本书纪》等同时代文献', '影视剧中的艺术演绎情节'], ans:2, explain:'《日本书纪》成书于8世纪初，距改新较近，是基本史料；文学作品与现代转述可靠性递减。', src:'综合提升·模拟训练'},
{id:'r10-33', lesson:10, diff:6, stem:'“仿唐而不唐化”用来概括日本文化特征，其含义是（　）', opts:['日本完全变成唐朝，两国文化完全一致', '日本拒绝一切唐朝文化输入，保持固有文化的纯正性', '日本文化毫无特色，全盘照搬外来文化成果', '日本吸收唐朝文化并加以本土化改造，形成自身特色'], ans:3, explain:'日本学习唐朝文字、制度、宗教，又发展出假名、武士道等本国文化，是文化交流的典型。', src:'综合提升·模拟训练'},

{id:'o12-85', lesson:12, diff:3, stem:'材料：廷巴克图“大学与图书馆林立，学者云集”。这说明（　）', opts:['廷巴克图是军事要塞', '非洲没有文化', '马里帝国是欧洲殖民地', '西非曾存在发达的文化教育中心'], ans:3, explain:'廷巴克图的学校与图书馆证明西非文明程度很高，颠覆“非洲无文明”偏见。', src:'综合提升·模拟训练'},

{id:'o12-87', lesson:12, diff:3, stem:'印加人用结绳记事而不使用文字，这说明（　）', opts:['印加文明十分落后，完全不会使用文字来记录历史', '印加通过其他方式管理庞大帝国，文明形态多样', '印加没有建立国家，处于原始部落阶段', '印加人不会计数，数学水平十分低下'], ans:1, explain:'结绳记事可记录人口、税收等信息，是适应帝国的管理技术，文明不唯文字论。', src:'综合提升·模拟训练'},
{id:'o12-88', lesson:12, diff:3, stem:'美洲作物对世界的贡献是（　）', opts:['导致欧洲出现粮食饥荒危机', '严重破坏了全球的生态环境', '极大丰富人类食物来源', '与人类社会发展毫无关系'], ans:2, explain:'玉米马铃薯等传入欧亚，养活大量人口，是“哥伦布大交换”的重要部分。', src:'综合提升·模拟训练'},
{id:'o12-89', lesson:12, diff:3, stem:'“哥伦布大交换”指的是（　）', opts:['哥伦布大交换是指哥伦布的政治制度改革', '哥伦布大交换是指欧洲各国之间的贸易往来', '哥伦布大交换是指非洲人口向美洲的大规模迁移', '新旧大陆之间作物、动物、疾病与文化的交流'], ans:3, explain:'新航路开辟后，美洲与欧亚非之间发生物种文化大交换，影响深远。', src:'综合提升·模拟训练'},

{id:'q12-96', lesson:12, diff:5, stem:'比较中古非洲与中世纪西欧，正确的是（　）', opts:['非洲完全落后，没有任何文明成果可言', '西欧没有文明，处于完全的蛮荒状态', '非洲有帝国商贸，西欧有庄园城市，并行发展', '两者完全相同，社会发展水平基本一致'], ans:2, explain:'中世纪各大洲文明并行发展，各有特色，不能以欧洲为中心衡量。', src:'综合提升·模拟训练'},

{id:'o13-20', lesson:13, diff:3, stem:'比较文艺复兴与中世纪的“人性观”，正确的是（　）', opts:['文艺复兴与中世纪关于人性的观点完全相同没有差别', '文艺复兴肯定现世人生，中世纪强调禁欲来世', '文艺复兴比中世纪更加提倡禁欲主义', '中世纪比文艺复兴更重视人的价值'], ans:1, explain:'中世纪以神为本、压抑欲望，文艺复兴肯定人的欲望与现世幸福，是思想解放。', src:'综合提升·模拟训练'},

{id:'o13-24', lesson:13, diff:3, stem:'“文艺复兴三杰”与“美术三杰”的区别是（　）', opts:['文学三杰与美术三杰其实是完全相同的同一批杰出人物群体而已', '前者指文学三杰（但丁、彼特拉克、薄伽丘），后者指美术三杰', '文学三杰活跃于法国，美术三杰活跃于德国地区一带', '美术三杰主要活动于德国地区，而非意大利本土'], ans:1, explain:'文学三杰是但丁、彼特拉克、薄伽丘；美术三杰是达·芬奇、米开朗琪罗、拉斐尔。', src:'综合提升·模拟训练'},

{id:'o16-21', lesson:16, diff:3, stem:'比较“光荣革命”与英国内战，正确的是（　）', opts:['光荣革命与英国内战两者完全相同，没有任何的区别可言', '前者不流血妥协，后者激烈内战，都是革命进程', '光荣革命比英国内战更加暴力激烈', '英国内战比光荣革命更加温和缓和'], ans:1, explain:'革命经历了暴力与妥协交替，光荣革命以妥协实现政权更替。', src:'综合提升·模拟训练'},

  {t:'种姓制度', b:'社会分为四个等级：<b>婆罗门</b>（祭司）、<b>刹帝利</b>（武士和国王）、<b>吠舍</b>（农民、商人）、<b>首陀罗</b>（被征服者、奴隶）。<span class="st-tag">特征</span>世代相袭、内部通婚、贵贱分明。<b class="neg">严重阻碍了印度社会发展</b>。'},
  {t:'孔雀王朝', b:'约<b>公元前4世纪后期</b>，<b>阿育王</b>时期统一印度大部分地区，是印度历史上第一个统一王朝。<span class="st-tag">地位</span>古印度文明进入鼎盛。'},
  {t:'佛教的创立', b:'<b>公元前6世纪</b>，<b>乔达摩·悉达多</b>（释迦牟尼）创立佛教，主张<b>“众生平等”</b>。<span class="st-tag">地位</span>后来成为世界三大宗教之一，广泛传播于亚洲。'},
  {t:'计数法的发明', b:'古代印度人发明<b>0—9计数法</b>，后经<b>阿拉伯人</b>改造传入欧洲，被称为<b>“阿拉伯数字”</b>。<span class="st-tag">地位</span>对世界数学发展贡献巨大。'},
  {t:'消极影响', b:'种姓制度<b class="neg">维护奴隶主贵族特权</b>，使低等级人群世代受压迫，阻碍社会进步。'},
  {t:'城市遗址', b:'印度河流域的<b>哈拉帕、摩亨佐·达罗</b>遗址规划整齐、有排水系统，<span class="st-tag">地位</span>是古印度早期城市文明的见证。'}
]},
/* ===== 第二单元 ===== */
{ id:5, unit:2, title:'古代希腊文明', period:'约公元前8世纪—公元前4世纪', know:[
  {t:'城邦时代', b:'约<b>公元前8世纪</b>起，希腊进入城邦时代，最重要的城邦是<b>雅典</b>与<b>斯巴达</b>。城邦特点是<b>小国寡民</b>、独立自治。<span class="st-tag">结论</span>希腊始终停留在“城邦”阶段，不同于埃及、印度等地域国家。'},
  {t:'雅典民主政治', b:'<b>伯里克利</b>时期（约前5世纪中后期）雅典民主政治达到<b>全盛</b>：<b>公民大会</b>是最高权力机关，官职<b>抽签</b>产生。<span class="st-tag">地位</span>是古代世界典型的民主政治。'},
  {t:'民主的局限', b:'雅典民主<b class="neg">仅限成年男性公民</b>，妇女、外邦人、奴隶被排除在外。<span class="st-tag">结论</span>是少数人的民主，实质是奴隶主阶级的民主。'},
  {t:'《荷马史诗》', b:'相传由<b>荷马</b>整理，包括《伊利亚特》《奥德赛》，是<b>了解早期希腊社会的主要文献</b>。<span class="st-tag">地位</span>古希腊文化的瑰宝。'},
  {t:'亚历山大帝国', b:'<b>公元前334年</b>，<b>亚历山大</b>东征，建立<b>地跨欧亚非</b>三洲的大帝国。<b class="pos">促进了东西方文化交流</b>，但也<b class="neg">伴随暴力征服与掠夺</b>。'},
  {t:'奥林匹克运动', b:'古代奥林匹克运动会发源于希腊<b>奥林匹亚</b>，是现代奥运会的源头。<span class="st-tag">地位</span>古希腊体育文化的象征。'},
  {t:'帕特农神庙', b:'雅典卫城上的<b>帕特农神庙</b>是古希腊<b>建筑与艺术的典范</b>，柱式优美、比例和谐。<span class="st-tag">地位</span>体现希腊古典文化的高度成就。'}
]},
{ id:6, unit:2, title:'古代罗马文明', period:'公元前509年—公元476年', know:[
  {t:'罗马共和国', b:'<b>公元前509年</b>罗马建立共和国。设<b>执政官</b>（行政）、<b>元老院</b>（决策）、<b>公民大会</b>（形式上的最高权力机关）、<b>保民官</b>（否决权）。'},
  {t:'《十二铜表法》', b:'<b>公元前450年左右</b>颁布，是<b>罗马第一部成文法</b>，<span class="st-tag">地位</span>是罗马法制建设的<b>第一步</b>，限制了贵族随意解释法律。'},
  {t:'罗马帝国', b:'<b>公元前27年</b>，<b>屋大维</b>首创<b>“元首制”</b>，罗马进入帝国时代。<span class="st-tag">地位</span>2世纪时地中海成为它的“内湖”，进入黄金时期。'},
  {t:'罗马法的发展', b:'随着帝国扩张，罗马颁布<b>万民法</b>处理外来人口的法律问题。<span class="st-tag">结论</span>罗马法对近代西方<b>法律体系影响深远</b>。'},
  {t:'文化成就', b:'罗马<b class="pos">吸收了希腊文化</b>（“被征服的希腊人征服了征服者”），使用<b>拉丁语</b>，凯撒编制<b>儒略历</b>。'},
  {t:'罗马的灭亡', b:'<b>395年</b>帝国分裂为东西两部分；<b>476年西罗马帝国灭亡</b>，<span class="st-tag">地位</span>西欧由此进入中世纪。'},
  {t:'建筑与工程成就', b:'罗马人建造<b>大竞技场、万神庙、高架引水渠</b>，并发明<b>混凝土</b>建筑技术。<span class="st-tag">地位</span>罗马建筑宏伟实用，对后世建筑影响深远。'}
]},
/* ===== 第三单元 ===== */
{ id:7, unit:3, title:'法兰克王国与西欧封建社会', period:'481年—843年', know:[
  {t:'法兰克王国', b:'<b>481年</b>，<b>克洛维</b>建立法兰克王国，并<b>皈依基督教</b>。<span class="st-tag">影响</span>基督教成为西欧封建社会的精神支柱。'},
  {t:'查理曼帝国', b:'<b>800年</b>，<b>查理曼</b>被教皇加冕称帝，法兰克王国成为<b>查理曼帝国</b>。<b>843年</b>帝国分裂，形成<b>法、德、意</b>的雏形。'},
  {t:'封君封臣制', b:'8世纪前期，法兰克王国改革<b>土地分封</b>制度，形成<b>封君与封臣</b>关系：封臣宣誓效忠、服兵役，封君授予土地。<span class="st-tag">特征</span>“<b>我的附庸的附庸不是我的附庸</b>”。'},
  {t:'封建等级金字塔', b:'国王—公爵—伯爵—骑士……形成<b>金字塔式</b>的封建等级关系。<span class="st-tag">结论</span>封君封臣制以<b>土地为纽带</b>，层层分封，等级森严。'},
  {t:'庄园经济', b:'西欧中世纪社会的基础是<b>庄园</b>。<span class="st-tag">特征</span>庄园是<b>自给自足</b>的经济单位：有耕地、牧场、林地，很少对外交换。'},
  {t:'庄园的阶级关系', b:'庄园里有<b>领主</b>与<b>佃户</b>（自由农民与农奴），还有<b>庄园法庭</b>维护秩序。<b class="neg">农奴负担沉重</b>，依附于领主。'},
  {t:'骑士阶层', b:'封君封臣制下形成<b>骑士阶层</b>与<b>骑士精神</b>（忠诚、尚武、保护封君）。<span class="st-tag">结论</span>骑士是西欧封建等级体系中重要的一环。'}
]},
{ id:8, unit:3, title:'西欧庄园、城市与大学的兴起', period:'10世纪—13世纪', know:[
  {t:'城市的兴起', b:'<b>10世纪</b>起，西欧城市重新兴起，以<b>手工业和商业</b>为中心。<span class="st-tag">原因</span>农业技术提高、手工业分工、商品经济发展。'},
  {t:'“城市的空气使人自由”', b:'城市市民享有<b>财产权</b>、人身自由；农奴在城市住满<b>一年零一天</b>即可获得自由。<span class="st-tag">地位</span>城市是西欧中世纪新的政治力量。'},
  {t:'城市自治', b:'市民通过<b>金钱赎买</b>、<b>武装斗争</b>争取自治，<b>特许状</b>是城市自由与自治的法律保障。'},
  {t:'市民阶层', b:'手工业者、商人形成<b>市民阶层</b>，后来分化出<b>早期资产阶级</b>。<span class="st-tag">影响</span>为资本主义萌芽准备了阶级条件。'},
  {t:'大学的兴起', b:'<b>12世纪</b>，<b>大学</b>兴起，被称为中世纪教育<b>“最美好的花朵”</b>。开设文法、逻辑、算术等基础课程与法学、医学、神学等专业课程。'},
  {t:'历史影响', b:'城市的兴起<b class="pos">促进了西欧封建制度的瓦解</b>；大学<b class="pos">推动了文化教育发展</b>，为文艺复兴做了准备。'},
  {t:'哥特式建筑', b:'12—13世纪西欧流行<b>哥特式教堂</b>（如巴黎圣母院），尖塔高耸、彩窗斑斓。<span class="st-tag">地位</span>是中世纪欧洲建筑艺术的杰出代表。'}
]},
{ id:9, unit:3, title:'拜占庭帝国与《罗马民法大全》', period:'395年—1453年', know:[
  {t:'拜占庭帝国', b:'<b>395年</b>罗马帝国分裂后形成<b>东罗马帝国</b>，因都城<b>君士坦丁堡</b>（原希腊殖民城市拜占庭）而得名。'},
  {t:'查士丁尼与法典', b:'<b>527年</b>查士丁尼即位，组织编纂<b>《罗马民法大全》</b>（含《查士丁尼法典》《法学汇纂》《法理概要》《新法典》）。<span class="st-tag">地位</span><b>奠定了欧洲民法的基础</b>。'},
  {t:'法典的内容', b:'法典<b class="neg">仍承认奴隶制</b>，但一定程度上<b class="pos">改善了奴隶地位</b>，对财产、买卖、契约等作出明确规定。'},
  {t:'文化兼收并蓄', b:'拜占庭帝国<b>地跨欧亚非</b>，对东西方文化<b>兼收并蓄</b>，<b class="pos">保存了大量希腊罗马古籍</b>，为<b>文艺复兴</b>提供了丰富的精神营养。'},
  {t:'帝国的灭亡', b:'<b>1453年</b>，<b>奥斯曼帝国</b>攻陷君士坦丁堡，拜占庭帝国灭亡。<span class="st-tag">结论</span>千年帝国终结，但其法律与文化影响深远。'},
  {t:'历史影响', b:'拜占庭<b class="pos">传承了古典文明</b>，<b class="pos">影响了周边斯拉夫世界</b>；<b>《罗马民法大全》</b>成为近代欧洲各国法律的重要来源。'},
  {t:'圣索菲亚大教堂', b:'都城君士坦丁堡的<b>圣索菲亚大教堂</b>融合<b>东西方建筑风格</b>，穹顶宏伟。<span class="st-tag">地位</span>是拜占庭文化兼收并蓄的象征。'}
]},
/* ===== 第四单元 ===== */
{ id:10, unit:4, title:'日本大化改新与幕府统治', period:'646年—19世纪中期', know:[
  {t:'大化改新', b:'<b>646年</b>，<b>孝德天皇</b>仿效<b>隋唐制度</b>进行改革。<span class="st-tag">背景</span>受中国留学生影响，革新派发动宫廷政变后推行。'},
  {t:'改新内容', b:'政治上：建立<b>中央集权</b>体制，废除贵族世袭特权；经济上：<b>班田收授法</b>（土地国有、按人口分田）、实行<b>租庸调</b>。'},
  {t:'改新的意义', b:'<span class="st-tag">地位</span>使日本从<b>奴隶社会</b>过渡到<b>封建社会</b>，成为<b>中央集权制的封建国家</b>。<b class="pos">促进日本社会发展</b>。'},
  {t:'吸收中国文化', b:'日本大量学习中国的<b>文字、建筑、佛教</b>等文化。<span class="st-tag">结论</span>大化改新是日本主动学习先进文化的典范。'},
  {t:'幕府统治', b:'<b>12世纪晚期</b>，<b>源赖朝</b>建立<b>镰仓幕府</b>，日本进入<b>幕府统治时期</b>。<span class="st-tag">特征</span>幕府将军掌握实权，<b class="neg">天皇形同虚设</b>。'},
  {t:'武士道', b:'幕府统治时期形成<b>武士道</b>精神（效忠主公）。<span class="st-tag">结论</span>武士阶层成为幕府统治的社会基础。'},
  {t:'仿唐都城', b:'日本仿照唐朝长安营建<b>平城京</b>（今奈良），并引入<b>汉字、佛教、茶道、建筑</b>。<span class="st-tag">结论</span>唐代文化对日本影响深远。'}
]},
{ id:11, unit:4, title:'阿拉伯帝国与伊斯兰文化', period:'610年—8世纪中期', know:[
  {t:'伊斯兰教的创立', b:'<b>610年</b>，<b>穆罕默德</b>在<b>麦加</b>创立<b>伊斯兰教</b>；622年迁往<b>麦地那</b>（伊斯兰教历元年）；630年重返麦加。<span class="st-tag">地位</span>后来成为世界性宗教。'},
  {t:'阿拉伯帝国', b:'<b>8世纪中期</b>，阿拉伯帝国成为<b>地跨亚欧非三洲</b>的大帝国，是当时世界上疆域最大的帝国之一。'},
  {t:'文化的保存者', b:'阿拉伯人通过<b>翻译运动</b>保存了<b>希腊罗马古典文化</b>。<span class="st-tag">地位</span>是古典文化的重要传承者与传播者。'},
  {t:'数学与科技成就', b:'阿拉伯人<b class="pos">改造并传播“阿拉伯数字”</b>（0—9计数法原为印度发明），创立<b>代数学</b>。<span class="st-tag">地位</span>对世界数学发展贡献巨大。'},
  {t:'文学成就', b:'阿拉伯文学瑰宝<b>《天方夜谭》</b>（《一千零一夜》）流传世界。'},
  {t:'东西方交流的使者', b:'中国的<b>造纸术、指南针、火药</b>和印度的棉花、食糖等经<b>阿拉伯人</b>传入欧洲。<span class="st-tag">结论</span>阿拉伯人在<b class="pos">沟通东西方文化</b>方面发挥了桥梁作用。'},
  {t:'医学与科学成就', b:'阿拉伯的<b>医学</b>（拉齐斯《医学集成》）、<b>天文学</b>、<b>光学</b>（伊本·海赛姆）成就卓著。<span class="st-tag">地位</span>阿拉伯科学居于当时世界前列。'}
]},
{ id:12, unit:4, title:'中古时期的非洲与美洲', period:'8世纪—16世纪', know:[
  {t:'西非文明', b:'西非先后兴起<b>加纳、马里、桑海</b>等帝国，黄金贸易繁荣。<b>马里</b>帝国的<b>廷巴克图</b>是<b>西非文化学术中心</b>，清真寺与学校众多。'},
  {t:'东非与南非', b:'东非沿海有阿克苏姆等国家；<b>大津巴布韦</b>是南部非洲的代表性文明遗址。<span class="st-tag">结论</span>非洲文明独立发展，成就独特。'},
  {t:'玛雅文明', b:'位于中美洲。成就：<b>阶梯金字塔</b>、<b>象形文字</b>、<b>太阳历</b>、<b>20进位制</b>。<span class="st-tag">地位</span>美洲最早文明之一。'},
  {t:'阿兹特克文明', b:'<b>14世纪</b>兴起于今墨西哥地区，建都<b>特诺奇蒂特兰</b>。<span class="st-tag">特征</span>农业以<b>“浮动园地”</b>著称，建筑宏伟。'},
  {t:'印加文明', b:'南美洲最强大的文明。<span class="st-tag">特征</span>用<b>结绳记事</b>（基普）记录信息，修<b>完善的道路系统</b>。'},
  {t:'文明评价', b:'中古非洲与美洲文明<b class="pos">独立发展、各具特色</b>，是世界文明多样性的体现。<b class="neg">可惜欧洲殖民扩张打断了其独立进程</b>。'},
  {t:'农作物的世界贡献', b:'美洲先民<b class="pos">培育出玉米、马铃薯、番茄、辣椒、烟草</b>等作物，后经新航路传播到世界各地。<span class="st-tag">贡献</span>极大丰富了人类的食物来源。'}
]},
/* ===== 第五单元 ===== */
{ id:13, unit:5, title:'文艺复兴运动', period:'14世纪—16世纪', know:[
  {t:'兴起背景', b:'<b>14世纪</b>兴起于<b>意大利</b>。<span class="st-tag">根本原因</span><b>资本主义萌芽</b>的产生与发展，新兴资产阶级要求思想解放。'},
  {t:'核心思想', b:'<b>人文主义</b>：<b class="pos">以人为中心</b>，肯定人的价值与尊严，反对神权至上。<span class="st-tag">实质</span>借复兴古希腊罗马文化宣传资产阶级新思想。'},
  {t:'先驱：但丁', b:'意大利诗人<b>但丁</b>，代表作<b>《神曲》</b>，抨击教会腐败，是文艺复兴<b>先驱</b>。'},
  {t:'艺术巨匠：达·芬奇', b:'意大利<b>达·芬奇</b>，代表作<b>《蒙娜丽莎》</b>、<b>《最后的晚餐》</b>，体现人性之美。'},
  {t:'文学巨匠：莎士比亚', b:'英国<b>莎士比亚</b>，代表作<b>《哈姆雷特》</b>、<b>《罗密欧与朱丽叶》</b>，讴歌人的情感与理性。'},
  {t:'历史影响', b:'<span class="st-tag">地位</span>文艺复兴是<b>资产阶级思想解放运动</b>，<b class="pos">为欧洲资本主义社会的产生奠定了思想文化基础</b>。'},

/* ================= 工具函数 ================= */
function $(s){return document.querySelector(s);}
function el(html){var d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function shuffle(a){var b=a.slice();for(var i=b.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=b[i];b[i]=b[j];b[j]=t;}return b;}
function pickRandom(arr,n){return shuffle(arr).slice(0,n);}
function uid(){return 'u'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);}
function diffName(d){return {1:'基础巩固',2:'课时训练',3:'单元检测',4:'阶段测评',5:'水平提高',6:'拔高冲刺'}[d]||'';}
function typeName(t){return {lesson:'课时练习',unit:'单元测试',mid:'期中测评',final:'期末测评',boost:'水平提高卷',elite:'拔高测试卷'}[t]||t;}
function scopeName(type,scope){
  if(type==='lesson'){var L=findLesson(scope);return L?L.title:('第'+scope+'课');}
  if(type==='unit'){var U=findUnit(scope);return U?U.title:('第'+scope+'单元');}
  if(type==='mid')return '期中测评';
  if(type==='final')return '期末测评';
  if(type==='boost')return '水平提高卷';
  if(type==='elite')return '拔高测试卷';
  return '';
}
function findLesson(id){for(var i=0;i<LESSONS.length;i++)if(LESSONS[i].id===id)return LESSONS[i];return null;}
function findUnit(id){for(var i=0;i<UNITS.length;i++)if(UNITS[i].id===id)return UNITS[i];return null;}
function findQ(id){for(var i=0;i<QUESTIONS.length;i++)if(QUESTIONS[i].id===id)return QUESTIONS[i];return null;}
function lessonUnit(lid){var L=findLesson(lid);return L?L.unit:1;}
function qOfLesson(lid,diffMin,diffMax){var r=[];for(var i=0;i<QUESTIONS.length;i++){var q=QUESTIONS[i];if(q.lesson===lid&&q.diff>=diffMin&&(diffMax==null||q.diff<=diffMax))r.push(q);}return r;}

/* ================= 本地存储 ================= */
var LSKEY='yacc-h9-v2';
function loadDB(){
  try{var s=localStorage.getItem(LSKEY);if(s)return JSON.parse(s);}catch(e){}
  return {users:{},usedKeys:[],current:null,theme:'dark'};
}
function saveDB(){try{localStorage.setItem(LSKEY,JSON.stringify(DB));}catch(e){}}
var DB=loadDB();
function curUser(){return DB.current?DB.users[DB.current]:null;}
function curData(){var u=curUser();return u?u.data:null;}
function defaultData(){return {done:{},wrong:{},first:{},hist:{},exams:[],volUsed:{},lessonState:{},learned:{}};}

/* ================= 主题 ================= */
function applyTheme(){
  document.documentElement.setAttribute('data-theme',DB.theme||'dark');
  var b=$('#themeBtn');if(b)b.innerHTML=(DB.theme==='dark')?'<span class="tb-ico">☀</span>':'<span class="tb-ico">☾</span>';
}
function toggleTheme(){DB.theme=(DB.theme==='dark')?'light':'dark';saveDB();applyTheme();}

/* ================= 模态 ================= */
var modalStack=0;
function openModal(html){
  $('#modalCard').innerHTML=html;
  $('#modalMask').classList.add('show');
  modalStack++;
  document.body.style.overflow='hidden';
}
function closeModal(){
  if(modalStack<=0)return;
  modalStack--;
  if(modalStack===0){$('#modalMask').classList.remove('show');document.body.style.overflow='';}
}
function confirmBox(title,msg,onOk,okText){
  openModal(
    '<h3>'+esc(title)+'</h3>'+
    '<div class="m-sub">'+esc(msg)+'</div>'+
    '<div class="confirm-row">'+
      '<button class="btn ghost" data-action="closeModal">取消</button>'+
      '<button class="btn danger" data-action="confirmOk">'+esc(okText||'确认')+'</button>'+
    '</div>');
  window.__confirmOk=onOk;
}

/* ================= 卷子 ================= */
function paperPool(type,scope){
  /* 难度门槛：课时≥2(但优先取2)、单元≥3、期中期末≥4、水平提高≥5、拔高≥6 —— 巩固题(diff1)永不进练习卷 */
  var MIN={lesson:2,unit:3,mid:4,final:4,boost:5,elite:6};
  function tier(fn){var r=[];for(var i=0;i<QUESTIONS.length;i++){var q=QUESTIONS[i];if(q.diff<MIN[type]||q.diff<2)continue;if(fn(q))r.push(q);}return r;}
  var pools=[];
  if(type==='lesson'){
    var U=findLesson(scope);U=U?U.unit:0;
    pools.push(tier(function(q){return q.lesson===scope;}));
    if(U)pools.push(tier(function(q){return q.lesson!==scope&&lessonUnit(q.lesson)===U;}));
    pools.push(tier(function(q){return q.lesson!==scope&&(!U||lessonUnit(q.lesson)!==U);}));
  }else if(type==='unit'){
    pools.push(tier(function(q){return lessonUnit(q.lesson)===scope;}));
    pools.push(tier(function(q){return lessonUnit(q.lesson)!==scope;}));
  }else if(type==='mid'){
    pools.push(tier(function(q){return lessonUnit(q.lesson)<=4;}));
    pools.push(tier(function(q){return lessonUnit(q.lesson)>4;}));
  }else{
    pools.push(tier(function(){return true;}));
  }
  var want={lesson:2,unit:3,mid:4,final:4,boost:5,elite:6}[type];
  /* 每层内部再按 want/>/< 排序，保持"同层同难度优先" */
  var sorted=[];
  pools.forEach(function(p){
    sorted=sorted.concat(p.filter(function(q){return q.diff===want;}))
               .concat(p.filter(function(q){return q.diff>want;}))
               .concat(p.filter(function(q){return q.diff<want;}));
  });
  return {tiers:pools.map(function(p){
    return p.filter(function(q){return q.diff===want;})
            .concat(p.filter(function(q){return q.diff>want;}))
            .concat(p.filter(function(q){return q.diff<want;}));
  }), flat:sorted};
}
function nextVol(type,scope){
  var d=curData();
  var vols=d.exams.filter(function(e){return e.type===type&&e.scope===scope;});
  var maxV=0;vols.forEach(function(v){if(v.vol>maxV)maxV=v.vol;});
  return maxV+1;
}
function startPaper(type,scope){
  if(!needLogin())return;
  var d=curData();
  var pp=paperPool(type,scope);
  /* 逐层洗牌取样：本课/同单元等优先层先取满，保持内容相关性，同时各层内部随机 */
  var picked=[];
  pp.tiers.forEach(function(t){
    if(picked.length>=25)return;
    var avail=t.filter(function(q){return !d.volUsed[q.id];});
    picked=picked.concat(shuffle(avail).slice(0,25-picked.length));
  });
  if(!picked.length){alert('该范围暂无可抽取的题目，请先完成其他练习。');return;}
  var qs=picked.slice(0,25);
  var vol=nextVol(type,scope);
  var key=type+'-'+scope+'-v'+vol;
  d.exams.push({key:key,type:type,scope:scope,vol:vol,qs:qs.map(function(q){return q.id;}),picked:{},score:0,ts:Date.now(),done:false});
  saveDB();
  enterExam(key);
}
function getExam(key){var d=curData();for(var i=0;i<d.exams.length;i++)if(d.exams[i].key===key)return d.exams[i];return null;}
function enterExam(key){currentPage='exam';curExamKey=key;examIdx=0;render();}
function paperScore(exam){var n=exam.qs.length;var ok=0;Object.keys(exam.picked).forEach(function(q){if(exam.picked[q]===findQ(q).ans)ok++;});return {ok:ok,n:n,score:Math.round(ok/n*100)};}

function summaryPoints(L){
  var pts=[];
  L.know.forEach(function(k){
    var txt=k.b.replace(/<[^>]+>/g,'').replace(/["""]/g,'');
    if(txt.indexOf('地位')>=0||txt.indexOf('结论')>=0||txt.indexOf('意义')>=0||txt.indexOf('影响')>=0||txt.indexOf('作用')>=0||k.t.indexOf('意义')>=0||k.t.indexOf('影响')>=0||k.t.indexOf('地位')>=0){
      var tag='';
      var m=txt.match(/(地位|结论|意义|影响|作用)[^，。;；]*/);
      if(m)tag=m[0];
      pts.push('<b>'+esc(k.t)+'</b>：'+esc(txt)+(tag?' <span style="color:var(--accent);font-size:12px;">· '+esc(tag)+'</span>':''));
    }
  });
  if(pts.length<3){
    L.know.forEach(function(k){
      if(pts.length>=5)return;
      pts.push('<b>'+esc(k.t)+'</b>：'+esc(k.b.replace(/<[^>]+>/g,'').replace(/["""]/g,'')));

function renderWrong(){

  var d=curData();
  if(!d.hist)d.hist={};
  var wrongIds=Object.keys(d.wrong);
  var fixedIds=Object.keys(d.hist).filter(function(q){return !(q in d.wrong);});
  var html='<div class="page-head"><h1>错题本</h1><div class="meta">错题自动收录 · 永久保留 · 随时复习</div></div>';
  if(!wrongIds.length&&!fixedIds.length){
    html+='<div class="glass" style="text-align:center;padding:44px 30px;"><div style="font-size:42px;margin-bottom:12px;">🎉</div><h2>暂无错题</h2><p class="sub">做错的题会自动收录并永久保留，修正后转入已修正区。</p></div>';
    $('#app').innerHTML=html;return;
  }
  function groupSort(ids){
    ids.sort(function(a,b){return (d.hist[b]||d.wrong[b]||0)-(d.hist[a]||d.wrong[a]||0);});
    var groups={};
    ids.forEach(function(q){
      var unit=lessonUnit(findQ(q).lesson);
      (groups[unit]=groups[unit]||[]).push(q);
    });
    var unitOrder=Object.keys(groups).map(Number).sort(function(a,b){return a-b;});
    return unitOrder.map(function(u){return {unit:u,list:groups[u]};});
  }
  /* 待修正区 */
  if(wrongIds.length){
    html+='<div class="wrong-sec"><div class="ws-title">待修正<span class="ws-badge">'+wrongIds.length+'题</span></div>';
    groupSort(wrongIds).forEach(function(g){
      var U=findUnit(g.unit);
      html+='<div class="wrong-group"><div class="wg-title">'+esc(U.title)+'<span class="wg-badge">'+g.list.length+'题</span></div>';
      g.list.forEach(function(q){
        var Q=findQ(q),times=d.wrong[q]||1;
        html+='<div class="wrong-item"><span class="w-badge">×'+times+'</span>'+
          '<span class="w-t"><b>'+esc(Q.stem)+'</b><small>'+esc(U.title)+' · '+diffName(Q.diff)+' · 答错'+times+'次</small></span>'+
          '<button class="btn sm ghost" data-action="wrongRe" data-q="'+q+'">重练</button></div>';
      });
      html+='</div>';
    });
    html+='</div>';
  }
  /* 历史错题区（永久保留） */
  if(fixedIds.length){
    html+='<div class="wrong-sec"><div class="ws-title">历史错题<span class="ws-badge">'+fixedIds.length+'题</span></div>';
    groupSort(fixedIds).forEach(function(g){
      var U=findUnit(g.unit);
      html+='<div class="wrong-group"><div class="wg-title">'+esc(U.title)+'<span class="wg-badge">'+g.list.length+'题</span></div>';
      g.list.forEach(function(q){
        var Q=findQ(q),times=d.hist[q]||1;
        html+='<div class="wrong-item"><span class="w-badge fixed">已修正</span>'+
          '<span class="w-t"><b>'+esc(Q.stem)+'</b><small>'+esc(U.title)+' · '+diffName(Q.diff)+' · 累计答错'+times+'次</small></span>'+
          '<button class="btn sm ghost" data-action="wrongRe" data-q="'+q+'">复习</button></div>';
      });
      html+='</div>';
    });
    html+='</div>';
  }
  $('#app').innerHTML=html;
}
function wrongRe(qid){
  var Q=findQ(qid);
  openModal(
    '<button class="card-x" data-action="closeModal" aria-label="关闭"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>'+
    '<h3>错题重练</h3>'+
    '<div class="m-sub">作答后更新掌握情况与正确率统计</div>'+
    renderQCard(Q,1,false,undefined)+
    '<div style="margin-top:14px;"><button class="btn" style="width:100%;" data-action="wrongSubmit" data-q="'+qid+'">提交答案</button></div>');
}
function wrongSubmit(qid){
  var d=curData();
  var pick=d.__wrongPick;
  if(pick==null){alert('请先选择一个选项');return;}
  var Q=findQ(qid);
  var ok=pick===Q.ans;
  recordAnswer(qid,ok);
  /* 更新模态内容为结果 */
  $('#modalCard').innerHTML=
    '<h3>重练结果</h3>'+
    renderQCard(Q,1,true,pick)+
    '<div style="margin-top:14px;display:flex;gap:10px;">'+
      (ok?'<button class="btn" style="flex:1;" data-action="wrongDone">完成</button>':'<button class="btn ghost" style="flex:1;" data-action="wrongRe" data-q="'+qid+'">再练一次</button>')+
      '<button class="btn ghost" style="flex:1;" data-action="wrongDone">关闭</button>'+
    '</div>';
  if(ok){/* 已移出错题本 */}
}

/* ================= 关于 ================= */
function renderAbout(){

/* ================= 事件委托 ================= */
document.addEventListener('click',function(ev){
  var t=ev.target;
  while(t&&t!==document.body&&!t.getAttribute('data-action')){t=t.parentElement;}
  if(!t||!t.getAttribute('data-action'))return;
  var act=t.getAttribute('data-action');
  /* 模态内选择 */
  if(t.getAttribute('data-q')&&!t.getAttribute('data-l')){
    if(act==='pickQ'&&!curUser()){openAuth();return;}
  }
  /* 账号灵动岛：点击岛外任意处收起 */
  var islandEl=$('#accountIsland');
  if(islandEl&&!islandEl.hidden&&act!=='openAccountCard'){
    var inside=islandEl.contains(t)||(t.closest&&t.closest('.user-chip'));
    if(!inside)closeAccountCard();
  }
  switch(act){
    case 'closeModal':closeModal();break;
    case 'confirmOk':if(window.__confirmOk){var f=window.__confirmOk;window.__confirmOk=null;closeModal();f();}break;
    case 'openAuth':closeAccountCard();openAuth();break;
    case 'authTab':showAuthTab(t.getAttribute('data-t'));break;
    case 'doLogin':doLogin();break;
    case 'doRegister':doRegister();break;
    case 'toggleTheme':toggleTheme();break;
    case 'openAccCard':openAccCard();break;
    case 'openAccountCard':if(curUser())openAccountCard();else openAuth();break;
    case 'closeIsland':closeAccountCard();break;
    case 'openScoreCard':openScoreCard();break;
    case 'changePwd':if(curUser())changePwd();break;
    case 'doChangePwd':doChangePwd();break;
    case 'askLogout':
      confirmBox('退出登录','确定退出当前学习ID吗？退出后需要重新登录。',function(){closeModal();DB.current=null;saveDB();showLoggedOutCard();},'退出');
      break;
    case 'askDelete':
      confirmBox('删除数据','将删除当前学习ID及其全部数据（含做题记录、成绩、错题本），且不可恢复。确定删除吗？',function(){
        closeAccountCard();var id=DB.current;delete DB.users[id];DB.current=null;saveDB();render();
      },'永久删除');
      break;
    case 'openLesson':renderLesson(parseInt(t.getAttribute('data-l'),10));break;
    case 'renderUnits':renderUnits();break;
    case 'goWrong':renderWrong();break;
    case 'clearLessonState':
      confirmBox('删除测试结果','将清除本课巩固练习记录的上次作答结果（初始正确率仍永久保留）。确定吗？',function(){
        delete curData().lessonState[t.getAttribute('data-l')];saveDB();render();
      },'删除');
      break;
    case 'pickQ':
      if(!needLogin())return;
      (function(){
        var qid=t.getAttribute('data-q'),i=parseInt(t.getAttribute('data-i'),10),Q=findQ(qid);
        if(t.closest('#modalMask')){
          var dd=curData();dd.__wrongPick=i;saveDB();
          return;
        }
        var st=curData().lessonState[Q.lesson]=(curData().lessonState[Q.lesson]||{});
        st[qid]=i;saveDB();
        var ok=i===Q.ans;recordAnswer(qid,ok);
        renderLesson(Q.lesson,true);
      })();
      break;
    case 'pickScope':pickScope(t.getAttribute('data-type'),parseInt(t.getAttribute('data-scope'),10));break;
    case 'startPaper':startPaper(t.getAttribute('data-type'),parseInt(t.getAttribute('data-scope'),10));break;
    case 'enterExam':enterExam(t.getAttribute('data-key'));break;
    case 'examJump':examIdx=parseInt(t.getAttribute('data-i'),10);renderExam();break;
    case 'examPrev':if(examIdx>0){examIdx--;renderExam();}break;
    case 'examNext':if(examIdx<getExam(curExamKey).qs.length-1){examIdx++;renderExam();}break;
    case 'examPick':examPick(t.getAttribute('data-q'),parseInt(t.getAttribute('data-i'),10));break;
    case 'submitExam':submitExam();break;
    case 'redoPaper':{
      var key=t.getAttribute('data-key');var e=getExam(key);
      if(e)startPaper(e.type,e.scope);
      break;}
    case 'reviewPaper':reviewPaper(t.getAttribute('data-key'));break;
    case 'askDelPaper':
      confirmBox('删除测试结果','删除该卷成绩后，该卷题目将可重新抽取。确定删除吗？',function(){deletePaper(t.getAttribute('data-key'));},'删除');
      break;
    case 'wrongRe':wrongRe(t.getAttribute('data-q'));break;
    case 'wrongSubmit':wrongSubmit(t.getAttribute('data-q'));break;
    case 'wrongDone':closeModal();if(currentPage==='wrong')renderWrong();else render();break;
    case 'renderPractice':renderPractice();break;
    case 'renderHome':renderHome();break;
    case 'renderAbout':renderAbout();break;
  }
});

/* 选项选择（模态内的错题重练记录） */
document.addEventListener('click',function(ev){
  var t=ev.target;
  while(t&&t!==document.body&&!t.getAttribute('data-action')){t=t.parentElement;}
  if(!t||!t.getAttribute('data-action'))return;
  if(t.getAttribute('data-action')==='pickQ'&&!curUser())return;
  if(t.getAttribute('data-action')==='pickQ'&&curUser()&&t.closest('#modalMask')){
    var qid=t.getAttribute('data-q'),i=parseInt(t.getAttribute('data-i'),10);
    var d=curData();d.__wrongPick=i;saveDB();
    var box=t.parentElement;
    box.querySelectorAll('.opt').forEach(function(o){o.classList.remove('picked');});
    t.classList.add('picked');
  }
});

/* ================= Dock：主站液态玻璃 ================= */
var NAVS=['home','units','exam','wrong','about'];
var currentPage='home';
var dockTimer=null;
function setDock(){
  var ind=$('#dockIndicator');
  if(!ind)return;
  var btn=$('.dock-item[data-target="'+currentPage+'"]');
  if(!btn)return;
  var rect=btn.getBoundingClientRect();
  var dockRect=$('#dockNav').getBoundingClientRect();
  var left=rect.left-dockRect.left;
  ind.style.left=left+'px';
  ind.style.width=rect.width+'px';
  ind.classList.add('ready');
  btn.classList.add('active');
  NAVS.forEach(function(n){if(n!==currentPage){var b=$('.dock-item[data-target="'+n+'"]');if(b)b.classList.remove('active');}});
}
document.addEventListener('click',function(ev){
  var t=ev.target;
  while(t&&t!==document.body&&!t.getAttribute('data-target')){t=t.parentElement;}
  if(!t||!t.getAttribute('data-target'))return;
  var target=t.getAttribute('data-target');
  if(NAVS.indexOf(target)<0)return;
  if(target==='exam'||target==='wrong'){if(!needLogin()){return;}}
  currentPage=target;
  var ind=$('#dockIndicator');
  if(ind){
    ind.classList.remove('bounce','moving','sliding','shape-shift','pop-in','settle');
    ind.classList.add('shape-shift');
    clearTimeout(dockTimer);
    dockTimer=setTimeout(function(){
      ind.classList.remove('shape-shift');
      ind.classList.add('moving');
      setTimeout(function(){
        ind.classList.remove('moving');
        ind.classList.add('settle');
        setTimeout(function(){ind.classList.remove('settle');},480);
      },520);
    },70);
  }
  var fns={home:renderHome,units:renderUnits,exam:renderPractice,wrong:renderWrong,about:renderAbout};
  fns[target]();
  setTimeout(setDock,60);
  if(ev&&ev.preventDefault)ev.preventDefault();
});
window.addEventListener('resize',function(){setTimeout(setDock,80);});
window.addEventListener('scroll',function(){
  var ind=$('#dockIndicator');
  if(!ind||ind.classList.contains('moving'))return;
  ind.classList.add('sliding');
  clearTimeout(dockTimer);
  dockTimer=setTimeout(function(){ind.classList.remove('sliding');},420);
},{passive:true});

/* ================= 顶栏 ================= */
function renderTopbar(){
  var u=curUser();
  var html='<div class="userbar"><div class="brand">历史复习-九年级</div></div>';
  html+='<div class="userbar-fixed">';
  html+='<button class="icon-btn" id="themeBtn" data-action="toggleTheme" aria-label="切换深浅色模式"><span class="tb-ico">☀</span></button>';
  if(u){
    html+='<button class="user-chip" data-action="openAccountCard" style="border:0;"><span class="avatar">'+esc(u.id.slice(0,1).toUpperCase())+'</span><span class="uid">'+esc(u.id)+'</span></button>';
  }else{
    html+='<button class="ghost-chip" data-action="openAuth">登录 / 创建ID</button>';
  }
  html+='</div>';
  var w=$('#topbarSlot');if(w)w.innerHTML=html;
}

/* ================= 主渲染入口 ================= */
function render(){
  var isl=$('#accountIsland');
  if(isl&&!isl.hidden){if(isl._anim)isl._anim.cancel();isl.hidden=true;isl.style.transform='';isl.style.opacity='';isl.classList.remove('open');}
  renderTopbar();
  applyTheme();
  var fns={home:renderHome,units:renderUnits,exam:renderExam,wrong:renderWrong,about:renderAbout};
  if(fns[currentPage])fns[currentPage]();
  else renderHome();
  setTimeout(setDock,60);
}
(function(){
  applyTheme();
  render();
})();
