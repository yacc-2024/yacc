<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>九年级历史 · 学习工坊</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='18' fill='%231c1c22'/%3E%3Cpath d='M14 18h20v8H22v6h11v8H22v6h12v8H14zM44 18h8v28h-8z' fill='%23ffd60a'/%3E%3C/svg%3E">
<style>
/* ============ YACC 主站同款设计语言 ============ */
:root{
  color-scheme:dark;
  --bg:#141519; --bg-grad:linear-gradient(160deg,#141519 0%,#12141D 45%,#17161A 100%);
  --surface:#1D1F26; --ink:#F1EFEA; --ink-2:#C2BEB6; --muted:#8E8A82;
  --line:rgba(255,255,255,.09);
  --accent:#ffd60a; --ok:#30d158; --bad:#ff453a; --blue:#6E8BE8;
  --shadow-sm:0 2px 8px rgba(20,20,20,.08),0 4px 12px rgba(20,20,20,.04);
  --shadow-md:0 3px 10px rgba(20,20,20,.10),0 8px 24px rgba(20,20,20,.05);
  --shadow-lg:0 4px 12px rgba(20,20,20,.10),0 16px 40px rgba(20,20,20,.06);
  --r-lg:48px; --r-md:30px; --r-sm:22px;
  --ease-snap:cubic-bezier(.16,1,.3,1); --ease-smooth:cubic-bezier(.2,.8,.4,1);
  --sans:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --serif:"Noto Serif SC","Songti SC","SimSun",serif;
  --maxw:1120px;
  --card-glass:linear-gradient(150deg,rgba(255,255,255,.20),rgba(255,255,255,.10));
  --card-solid:#23252D; --card-solid-2:#1A1C22;
  --glass-bg:linear-gradient(158deg,rgba(255,255,255,.10),rgba(255,255,255,.02) 40%,rgba(255,255,255,.05) 62%,rgba(255,255,255,.01)),linear-gradient(160deg,rgba(35,37,45,.52),rgba(26,28,34,.44));
  --accent-ui:#6E8BE8;
  --nav-bg:rgba(20,21,25,.32); --backdrop:rgba(8,9,12,.6);
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#F3F2EE; --bg-grad:linear-gradient(160deg,#F3F2EE 0%,#EDEFF5 45%,#F6F1E9 100%);
  --surface:#FFFFFF; --ink:#1E1D1A; --ink-2:#4B4942; --muted:#78746C;
  --line:rgba(25,25,22,.12); --accent:#b8860b;
  --shadow-sm:0 2px 8px rgba(25,25,22,.06),0 4px 12px rgba(25,25,22,.04);
  --shadow-md:0 3px 10px rgba(25,25,22,.08),0 8px 24px rgba(25,25,22,.05);
  --shadow-lg:0 4px 12px rgba(25,25,22,.08),0 16px 40px rgba(25,25,22,.05);
  --card-glass:linear-gradient(150deg,rgba(255,255,255,.72),rgba(255,255,255,.46));
  --card-solid:#FFFFFF; --card-solid-2:#F2F1EC;
  --glass-bg:linear-gradient(150deg,rgba(255,255,255,.60),rgba(255,255,255,.40));
  --accent-ui:#5E7BD6; --nav-bg:rgba(255,255,255,.48); --backdrop:rgba(25,25,22,.32);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{min-height:100%;}
body{
  font-family:var(--sans); background:var(--bg-grad) fixed; color:var(--ink);
  -webkit-font-smoothing:antialiased; overflow-x:hidden;
  transition:background .5s ease,color .3s ease; padding-bottom:120px;
}
a{color:inherit;text-decoration:none;} button{font-family:inherit;cursor:pointer;border:0;}
input{font-family:inherit;}
.orb{position:fixed;border-radius:50%;filter:blur(70px);opacity:.5;z-index:0;pointer-events:none;transition:opacity .6s ease;}
.orb-a{width:480px;height:480px;background:rgba(255,214,10,.14);top:-160px;right:-120px;}
.orb-b{width:420px;height:420px;background:rgba(90,140,255,.13);bottom:-140px;left:-120px;}
.orb-c{width:320px;height:320px;background:rgba(255,120,200,.08);top:40%;left:-160px;}
[data-theme="light"] .orb-a{background:rgba(255,200,60,.30);}
[data-theme="light"] .orb-b{background:rgba(90,140,255,.20);}
.wrap{position:relative;z-index:1;max-width:var(--maxw);margin:0 auto;padding:0 24px;}

/* ============ 顶栏 ============ */
.userbar{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 20px;}
.userbar .brand{font-family:var(--serif);font-size:20px;font-weight:700;letter-spacing:.06em;}
.userbar .brand b{color:var(--accent);}
/* 账号与主题：悬浮右上角（液态玻璃胶囊） */
.userbar-fixed{
  position:fixed; top:16px; right:20px; z-index:210;
  display:flex; align-items:center; gap:10px;
}
@media (max-width:560px){
  .userbar-fixed{top:12px; right:12px; gap:8px;}
  .userbar .brand{font-size:17px;}
}
.top-tools{display:flex;align-items:center;gap:12px;}
.icon-btn{
  width:40px;height:40px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;
  background:var(--glass-bg);border:1.5px solid rgba(255,255,255,.22);color:var(--ink-2);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:var(--shadow-md);transition:transform .25s var(--ease-snap),color .3s,border-color .3s;
}
.icon-btn:hover{transform:scale(1.06);color:var(--ink);border-color:rgba(255,214,10,.45);}
.icon-btn .tb-ico{font-size:15px;line-height:1;color:var(--accent);transition:transform .4s var(--ease-snap);}
.icon-btn:hover .tb-ico{transform:rotate(25deg);}
.user-chip{
  display:inline-flex;align-items:center;gap:10px;max-width:100%;
  padding:7px 16px 7px 8px;border-radius:999px;
  background:var(--glass-bg);border:1.5px solid rgba(255,255,255,.22);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:var(--shadow-md);font-size:13.5px;cursor:pointer;
  transition:transform .25s var(--ease-snap),border-color .3s;
}
.user-chip:hover{transform:scale(1.03);border-color:rgba(255,214,10,.45);}
.user-chip .uid{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px;font-weight:600;}
.avatar{
  width:30px;height:30px;border-radius:10px;flex:0 0 auto;
  background:linear-gradient(145deg,rgba(255,214,10,.28),rgba(255,160,10,.22));
  color:var(--accent);display:flex;align-items:center;justify-content:center;
  font-weight:800;font-size:13px;border:1px solid rgba(255,214,10,.35);
}
.ghost-chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;
  background:var(--glass-bg);border:1.5px solid rgba(255,255,255,.22);color:var(--ink-2);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  font-size:13px;box-shadow:var(--shadow-sm);transition:transform .25s var(--ease-snap),color .3s;
}
.ghost-chip:hover{transform:scale(1.04);color:var(--ink);}
.page-head{margin:6px 0 22px;}
.page-head h1{font-size:26px;letter-spacing:.02em;}
.page-head .meta{color:var(--muted);font-size:13px;margin-top:6px;}

/* ============ 玻璃卡片 ============ */
.glass{
  background:var(--glass-bg);border:1.5px solid rgba(255,255,255,.16);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-radius:var(--r-md);box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.18);
  padding:26px;margin-bottom:20px;
}
[data-theme="light"] .glass{border-color:rgba(25,25,22,.10);box-shadow:0 3px 10px rgba(25,25,22,.06),0 8px 24px rgba(25,25,22,.04), inset 0 1px 0 rgba(255,255,255,.8);}
.glass h2{font-size:20px;margin-bottom:8px;letter-spacing:.02em;}
.glass .sub{color:var(--ink-2);font-size:13.5px;line-height:1.7;}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:6px;
  padding:11px 24px;border-radius:999px;font-size:14px;font-weight:600;
  color:#141519;background:linear-gradient(145deg,#ffd60a,#ffb40a);
  box-shadow:0 4px 14px rgba(255,214,10,.25),inset 0 1px 0 rgba(255,255,255,.5);
  transition:transform .2s var(--ease-snap),box-shadow .3s;min-height:44px;
}
.btn:hover{transform:translateY(-1px) scale(1.02);}
.btn:active{transform:scale(.96);}
.btn.ghost{
  color:var(--ink-2);background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.2);
  box-shadow:none;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
}
.btn.ghost:hover{color:var(--ink);border-color:rgba(255,255,255,.4);}
.btn.sm{padding:7px 16px;font-size:12.5px;min-height:36px;}
.btn.danger{background:linear-gradient(145deg,#ff453a,#ff6b47);color:#fff;box-shadow:0 4px 14px rgba(255,69,58,.25);}
.btn.danger.ghost{background:rgba(255,69,58,.12);color:#ff6b5e;border-color:rgba(255,69,58,.4);}
/* 浅色主题：白色系按钮补细黑边，避免白底白边看不清边缘 */
[data-theme="light"] .btn.ghost{
  background:rgba(255,255,255,.92);border-color:rgba(25,25,22,.18);color:#4B4942;
  box-shadow:0 1px 2px rgba(25,25,22,.05), inset 0 1px 0 rgba(255,255,255,.95);
}
[data-theme="light"] .btn.ghost:hover{border-color:rgba(25,25,22,.36);color:#1E1D1A;}
[data-theme="light"] .ghost-chip{
  background:rgba(255,255,255,.88);border-color:rgba(25,25,22,.16);color:#4B4942;
  box-shadow:0 1px 2px rgba(25,25,22,.05);
}
[data-theme="light"] .ghost-chip:hover{color:#1E1D1A;border-color:rgba(25,25,22,.34);}
[data-theme="light"] .icon-btn{
  background:rgba(255,255,255,.88);border-color:rgba(25,25,22,.16);color:#4B4942;
  box-shadow:0 2px 8px rgba(25,25,22,.08);
}
[data-theme="light"] .user-chip{
  background:rgba(255,255,255,.88);border-color:rgba(25,25,22,.16);
  box-shadow:0 2px 8px rgba(25,25,22,.08);
}
[data-theme="light"] .card-x{
  background:rgba(255,255,255,.94);border-color:rgba(25,25,22,.16);color:#4B4942;
  box-shadow:0 2px 6px rgba(25,25,22,.10), inset 0 1px 0 rgba(255,255,255,.95);
}
[data-theme="light"] .card-x:hover{background:#FFFFFF;border-color:rgba(25,25,22,.34);}


/* ============ 首页 ============ */
.h-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-bottom:20px;}
.h-stat{
  position:relative;background:var(--glass-bg);border:1.5px solid rgba(255,255,255,.16);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-radius:var(--r-md);box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.18);
  padding:24px 22px;cursor:pointer;overflow:hidden;
  transition:transform .25s var(--ease-snap),border-color .3s;
}
[data-theme="light"] .h-stat{border-color:rgba(25,25,22,.12);}
.h-stat:hover{transform:translateY(-3px);border-color:rgba(255,214,10,.45);}
.h-stat.no-click{cursor:default;}
.h-stat .k{font-size:12.5px;color:var(--muted);letter-spacing:.06em;}
.h-stat .v{font-size:34px;font-weight:800;margin-top:8px;line-height:1.1;}
.h-stat .v small{font-size:13px;font-weight:400;color:var(--muted);}
.h-stat .hint{position:absolute;right:18px;top:22px;font-size:11px;color:var(--muted);opacity:.8;}
.h-stat .go{
  display:inline-flex;align-items:center;gap:4px;margin-top:14px;
  font-size:12.5px;font-weight:600;color:var(--accent);
}
.h-stat .go svg{width:14px;height:14px;}
.h-stat .bar{margin-top:14px;height:7px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
[data-theme="light"] .h-stat .bar{background:rgba(0,0,0,.08);}
.h-stat .bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#ffd60a,#ff9f0a);}
.score-panel .score-line{display:flex;flex-wrap:wrap;gap:10px;}
.score-chip{
  display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;
  background:rgba(255,255,255,.08);border:1.5px solid rgba(255,255,255,.16);font-size:12.5px;color:var(--ink-2);
  cursor:pointer;transition:transform .2s var(--ease-snap),border-color .3s;
}
.score-chip:hover{transform:scale(1.05);border-color:rgba(255,214,10,.5);}
.score-chip b{color:var(--ink);font-size:14px;margin-left:2px;}
.score-chip.perfect{border-color:rgba(255,214,10,.7);background:linear-gradient(145deg,rgba(255,214,10,.20),rgba(255,190,10,.12));}
.score-chip.perfect b{color:var(--accent);}
.score-chip.low{border-color:rgba(255,69,58,.45);background:rgba(255,69,58,.10);}
.score-chip.low b{color:#ff6b5e;}
.score-chip.low{color:#ff8a7a;}
.score-chip small{font-size:11px;color:var(--muted);}

/* ============ 单元进度条 ============ */
.unit-acc{display:grid;gap:10px;}
.ua-row{display:flex;align-items:center;gap:12px;font-size:13px;}
.ua-row .ua-name{width:88px;flex:0 0 auto;color:var(--ink-2);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ua-row .ua-bar{flex:1;height:9px;border-radius:999px;background:rgba(255,255,255,.12);overflow:hidden;}
[data-theme="light"] .ua-row .ua-bar{background:rgba(0,0,0,.08);}
.ua-row .ua-bar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#6E8BE8,#9BBBF4);transition:width .6s var(--ease-snap);}
.ua-row .ua-val{width:46px;text-align:right;font-weight:700;color:var(--ink);flex:0 0 auto;}

/* ============ 课程页 ============ */
.crumb{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);margin-bottom:18px;flex-wrap:wrap;}
.crumb button{background:none;border:0;color:var(--accent);font-size:13px;cursor:pointer;padding:4px;}
.crumb .sep{opacity:.5;}
.crumb .now{color:var(--ink-2);}
.lesson-banner{
  border-radius:var(--r-lg);padding:30px 30px 26px;margin-bottom:22px;position:relative;overflow:hidden;
  background:linear-gradient(150deg,rgba(255,214,10,.16),rgba(110,139,232,.14) 55%,rgba(255,120,200,.10));
  border:1.5px solid rgba(255,255,255,.18);
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.2);
}
.lesson-banner .lb-emoji{font-size:44px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.3));}
.lesson-banner h2{font-size:26px;margin-top:12px;letter-spacing:.02em;}
.lesson-banner .lb-period{display:inline-block;margin-top:10px;font-size:12px;color:var(--ink-2);background:rgba(255,255,255,.10);border:1px solid rgba(255,255,255,.2);padding:4px 14px;border-radius:999px;}
.know-grid{display:grid;gap:14px;}
.know{
  background:var(--glass-bg);border:1.5px solid rgba(255,255,255,.16);
  backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border-radius:var(--r-sm);box-shadow:var(--shadow-sm),inset 0 1px 0 rgba(255,255,255,.18);
  padding:20px 22px;
}
[data-theme="light"] .know{border-color:rgba(25,25,22,.12);}
.know .kt{display:flex;align-items:center;gap:10px;font-size:15.5px;font-weight:700;margin-bottom:10px;}
.know .kt .dot{width:9px;height:9px;border-radius:50%;background:linear-gradient(145deg,#ffd60a,#ff9f0a);flex:0 0 auto;}
.know .kb{font-size:14px;line-height:1.9;color:var(--ink-2);}
.know .kb b{color:var(--ink);}
.know .kb .pos{color:#30d158;}
.know .kb .neg{color:#ff6b5e;}
.know .kb .st-tag{
  display:inline-block;font-size:11px;font-weight:700;letter-spacing:.08em;color:#141519;
  background:linear-gradient(145deg,#ffd60a,#ffb40a);border-radius:999px;padding:2px 9px;margin:0 4px;vertical-align:1px;
}
[data-theme="light"] .know .kb .st-tag{color:#fff;}
.summary-box{
  border-radius:var(--r-md);padding:24px 26px;margin-bottom:22px;
  background:linear-gradient(150deg,rgba(110,139,232,.14),rgba(255,214,10,.10));
  border:1.5px solid rgba(255,214,10,.35);
  box-shadow:var(--shadow-md),inset 0 1px 0 rgba(255,255,255,.2);
}
.summary-box h3{display:flex;align-items:center;gap:10px;font-size:18px;margin-bottom:14px;}
.summary-box h3 svg{width:20px;height:20px;color:var(--accent);}
.summary-box ul{margin:0;padding:0;list-style:none;display:grid;gap:10px;}
.summary-box li{position:relative;padding-left:20px;font-size:13.5px;line-height:1.8;color:var(--ink-2);}
.summary-box li::before{content:"";position:absolute;left:2px;top:10px;width:7px;height:7px;border-radius:50%;background:linear-gradient(145deg,#ffd60a,#ff9f0a);}
.summary-box li b{color:var(--ink);}
.lesson-nav{display:flex;gap:14px;margin:26px 0 6px;}
.lesson-nav .btn{flex:1;}

/* ============ 题目 ============ */
.q-card .q-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
.q-card .tag{font-size:11px;font-weight:700;letter-spacing:.1em;color:#141519;background:linear-gradient(145deg,#ffd60a,#ffb40a);border-radius:999px;padding:3px 10px;}
[data-theme="light"] .q-card .tag{color:#fff;}
.q-card .tag.diff2{background:linear-gradient(145deg,#6E8BE8,#9BBBF4);}
.q-card .tag.diff3{background:linear-gradient(145deg,#8BC8EA,#A3D5E8);}
.q-card .tag.diff4{background:linear-gradient(145deg,#94D8C3,#A2DDAA);}
.q-card .tag.diff5{background:linear-gradient(145deg,#E1B98F,#F4B393);}
.q-card .tag.diff6{background:linear-gradient(145deg,#C9A7E8,#DEBEF8);}
.q-card .tag.miss{background:linear-gradient(145deg,#ff453a,#ff6b47);color:#fff;box-shadow:0 2px 8px rgba(255,69,58,.3);}
[data-theme="light"] .q-card .tag.miss{color:#fff;}
.opt.miss-opt{border-color:rgba(255,69,58,.45);}
.q-card .q-n{font-size:12px;color:var(--muted);}
.q-card .q-stem{font-size:15.5px;line-height:1.8;margin-bottom:16px;}
.q-card .opts{display:grid;gap:11px;}
.opt{
  display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.14);
  cursor:pointer;font-size:14px;line-height:1.55;color:var(--ink-2);
  transition:border-color .2s,background .2s,transform .15s,box-shadow .2s;
  position:relative;min-height:48px;
}
[data-theme="light"] .opt{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.12);}
.opt:hover{border-color:rgba(255,255,255,.35);}
.opt .letter{
  width:26px;height:26px;border-radius:9px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:rgba(255,255,255,.10);font-size:12.5px;font-weight:800;color:var(--ink-2);
  transition:background .2s,color .2s;
}
[data-theme="light"] .opt .letter{background:rgba(0,0,0,.08);}
/* 选中态：明显高亮 */
.opt.picked{
  border-color:var(--accent);background:linear-gradient(145deg,rgba(255,214,10,.16),rgba(255,190,10,.08));
  box-shadow:0 0 0 1px rgba(255,214,10,.4),0 6px 18px rgba(255,214,10,.12);
  color:var(--ink);transform:scale(1.015);
}
.opt.picked .letter{background:linear-gradient(145deg,#ffd60a,#ffb40a);color:#141519;}
 .opt.picked::after{
  content:"✓";margin-left:auto;flex:0 0 auto;
  font-weight:900;color:var(--accent);font-size:16px;
}
.opt.right{border-color:var(--ok);background:rgba(48,209,88,.12);color:var(--ink);}
.opt.right .letter{background:linear-gradient(145deg,#30d158,#34c759);color:#fff;}
.opt.right::after{content:"✓";margin-left:auto;flex:0 0 auto;font-weight:900;color:var(--ok);font-size:16px;}
.opt.right.miss-right{border-color:var(--ok);background:rgba(48,209,88,.10);}
.opt.right.miss-right::after{content:"正确答案";margin-left:auto;flex:0 0 auto;white-space:nowrap;font-size:11px;font-weight:700;color:var(--ok);border:1px solid rgba(48,209,88,.55);border-radius:999px;padding:2px 8px;background:rgba(255,255,255,.5);}
.opt.wrong{border-color:var(--bad);background:rgba(255,69,58,.14);color:var(--ink);}
.opt.wrong .letter{background:linear-gradient(145deg,#ff453a,#ff6b47);color:#fff;}
.opt.wrong::after{content:"✕";margin-left:auto;flex:0 0 auto;font-weight:900;color:var(--bad);font-size:16px;}
.opt.dim{opacity:.5;}
.opt.locked{cursor:default;}
.q-explain{display:none;margin-top:16px;padding:16px 18px;border-radius:var(--r-sm);background:rgba(110,139,232,.10);border:1px solid rgba(110,139,232,.3);font-size:13.5px;line-height:1.8;color:var(--ink-2);}
[data-theme="light"] .q-explain{background:rgba(110,139,232,.08);}
.q-explain.show{display:block;}
.q-explain b{color:var(--blue);}
.q-explain .q-src{margin-top:8px;font-size:12px;color:var(--muted);}

/* ============ 答题页 ============ */
.exam-progress{font-size:13px;color:var(--ink-2);}
.exam-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
.exam-grid button{
  width:30px;height:30px;border-radius:9px;font-size:12px;font-weight:600;
  background:rgba(255,255,255,.07);border:1.5px solid rgba(255,255,255,.12);color:var(--muted);
  cursor:pointer;transition:all .2s;
}
.exam-grid button.done{background:rgba(48,209,88,.16);border-color:rgba(48,209,88,.5);color:#30d158;}
.exam-grid button.cur{background:linear-gradient(145deg,#ffd60a,#ffb40a);border-color:transparent;color:#141519;transform:scale(1.08);}
[data-theme="light"] .exam-grid button.cur{color:#fff;}
.exam-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:16px;flex-wrap:wrap;}

/* ============ 练习页 ============ */
.pick-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;}
.pick-btn{
  display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px 18px;border-radius:var(--r-sm);
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.14);color:var(--ink-2);
  cursor:pointer;font-size:14px;transition:transform .2s var(--ease-snap),border-color .3s,background .3s;min-height:44px;
}
[data-theme="light"] .pick-btn{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.12);}
.pick-btn:hover{transform:translateY(-2px);border-color:rgba(255,214,10,.5);background:rgba(255,214,10,.06);}
.pick-btn .pb-badge{font-size:11px;font-weight:700;letter-spacing:.1em;color:var(--accent);}
.pick-btn .pb-t{font-weight:600;color:var(--ink);}
.pick-btn .pb-s{font-size:12px;color:var(--muted);}
.vol-list{display:grid;gap:10px;}
.vol-item{
  display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  background:var(--glass-bg);border:1.5px solid rgba(255,255,255,.16);
  border-radius:var(--r-sm);padding:14px 18px;font-size:13.5px;
}
[data-theme="light"] .vol-item{border-color:rgba(25,25,22,.10);}
.vol-item .vi-name{font-weight:700;color:var(--ink);}
.vol-item .vi-meta{color:var(--muted);font-size:12.5px;}
.vol-item .vi-score{margin-left:auto;font-weight:800;font-size:16px;}
.vol-item .vi-score.perfect{color:var(--accent);}
.vol-item .vi-score.low{color:#ff6b5e;}
.vol-item .vi-actions{display:flex;gap:8px;}
.vol-empty{color:var(--muted);font-size:13px;padding:8px 0;}

/* ============ 错题本 ============ */
.wrong-sec{margin-bottom:26px;}
.wrong-sec .ws-title{
  display:flex;align-items:center;gap:10px;font-size:16px;font-weight:800;margin-bottom:14px;color:var(--ink);
}
.wrong-sec .ws-title .ws-badge{
  font-size:11px;font-weight:700;letter-spacing:.1em;color:#141519;
  background:linear-gradient(145deg,#ffd60a,#ffb40a);border-radius:999px;padding:2px 10px;
}
[data-theme="light"] .wrong-sec .ws-title .ws-badge{color:#fff;}
.wrong-group{margin-bottom:16px;}
.wrong-group .wg-title{
  display:flex;align-items:center;gap:10px;font-size:14px;font-weight:700;margin-bottom:10px;color:var(--ink);
}
.wrong-group .wg-title .wg-badge{
  font-size:11px;font-weight:700;letter-spacing:.1em;color:#141519;
  background:linear-gradient(145deg,#ffd60a,#ffb40a);border-radius:999px;padding:2px 9px;
}
[data-theme="light"] .wrong-group .wg-title .wg-badge{color:#fff;}
.wrong-item{
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  background:var(--glass-bg);border:1.5px solid rgba(255,255,255,.16);
  border-radius:var(--r-sm);padding:15px 18px;margin-bottom:10px;font-size:13.5px;
}
[data-theme="light"] .wrong-item{border-color:rgba(25,25,22,.12);}
.wrong-item .w-badge{
  width:40px;height:40px;border-radius:12px;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  background:rgba(255,69,58,.14);border:1px solid rgba(255,69,58,.4);color:#ff6b5e;font-weight:800;font-size:14px;
}
.wrong-item .w-badge.fixed{
  width:auto;padding:0 12px;font-size:12px;border-radius:999px;
  background:rgba(48,209,88,.12);border:1px solid rgba(48,209,88,.4);color:#30d158;font-weight:700;
}
.wrong-item .w-t{flex:1;min-width:0;line-height:1.6;}
.wrong-item .w-t small{display:block;color:var(--muted);font-size:12px;}

/* ============ 模态 ============ */
.modal-mask{
  position:fixed;inset:0;z-index:300;display:none;align-items:center;justify-content:center;padding:20px;
  background:var(--backdrop);backdrop-filter:blur(10px) saturate(140%);-webkit-backdrop-filter:blur(10px) saturate(140%);
  opacity:0;transition:opacity .3s ease;
}
.modal-mask.show{display:flex;opacity:1;}
.modal-card{
  width:min(460px,100%);max-height:82vh;overflow-y:auto;
  background:var(--card-solid-grad,linear-gradient(155deg,#23252D,#1A1C22));
  border:1.5px solid rgba(255,255,255,.18);border-radius:var(--r-lg);
  box-shadow:var(--shadow-lg),inset 0 1px 0 rgba(255,255,255,.2);
  padding:58px 28px 28px;transform:translateY(16px) scale(.97);transition:transform .35s var(--ease-snap);
}
[data-theme="light"] .modal-card{background:linear-gradient(155deg,#FFFFFF,#F2F1EC);border-color:rgba(25,25,22,.14);}
.modal-mask.show .modal-card{transform:translateY(0) scale(1);}
.modal-card h3{font-size:19px;margin-bottom:6px;}
.modal-card .m-sub{color:var(--muted);font-size:12.5px;margin-bottom:20px;}
.acc-hero{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px;}

/* 主站同款箭头退出按钮（左上角圆形玻璃） */
.card-x{
  position:absolute; top:12px; left:12px;
  width:32px; height:32px; border-radius:50%;
  display:flex; align-items:center; justify-content:center;
  padding:0; border:1px solid rgba(255,255,255,.4);
  color:var(--ink-2);
  background:rgba(255,255,255,.24);
  backdrop-filter:saturate(170%) blur(16px);
  -webkit-backdrop-filter:saturate(170%) blur(16px);
  box-shadow:0 6px 18px rgba(0,0,0,.14), inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 0 rgba(255,255,255,.15);
  cursor:pointer; z-index:12;
  transition:transform .2s var(--ease-snap), background .2s ease, box-shadow .2s ease;
}
.card-x:hover{
  transform:scale(1.12) rotate(-6deg);
  background:rgba(255,255,255,.38);
  box-shadow:0 10px 26px rgba(0,0,0,.2), inset 0 1px 0 rgba(255,255,255,.6);
}
.card-x:active{transform:scale(.9);}
[data-theme="dark"] .card-x{
  background:rgba(255,255,255,.14);
  border-color:rgba(255,255,255,.26);
  color:var(--ink);
}
[data-theme="dark"] .card-x:hover{background:rgba(255,255,255,.26);}

/* 账号灵动岛：从右上角 chip 锚点放大展开 / 收缩收回（主站同款动效） */
#accountIsland{
  position:fixed; top:72px; right:16px; width:min(322px,calc(100vw - 32px));
  border-radius:26px; padding:58px 20px 20px; box-sizing:border-box;
  background:linear-gradient(150deg,rgba(255,255,255,.16),rgba(255,255,255,.07));
  backdrop-filter:blur(24px) saturate(180%);
  -webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:0 24px 60px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.22);
  z-index:220; opacity:0; pointer-events:none;
  transition:transform .5s cubic-bezier(.22,.61,.36,1), opacity .4s ease;
  will-change:transform, opacity;
}
[data-theme="light"] #accountIsland{
  background:linear-gradient(150deg,rgba(255,255,255,.86),rgba(255,255,255,.72));
  border-color:rgba(0,0,0,.1);
  box-shadow:0 24px 60px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.9);
}
#accountIsland.open{opacity:1; pointer-events:auto;}
#accountIsland .acc-head{display:flex; align-items:center; gap:12px;}
#accountIsland .acc-id{font-size:16px; font-weight:700; letter-spacing:.3px;}
#accountIsland .acc-sub{font-size:11.5px; color:var(--muted); margin-top:2px;}

.acc-hero .ah{background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.14);border-radius:var(--r-sm);padding:18px;text-align:center;}
[data-theme="light"] .acc-hero .ah{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.12);}
.acc-hero .ah .ah-k{font-size:12px;color:var(--muted);}
.acc-hero .ah .ah-v{font-size:30px;font-weight:800;margin-top:6px;color:var(--accent);}
.acc-hero .ah .ah-v small{font-size:12px;color:var(--muted);font-weight:400;}
.confirm-row{display:flex;gap:12px;margin-top:24px;}
.confirm-row .btn{flex:1;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:8px;font-weight:600;}
.field input{
  width:100%;padding:13px 16px;border-radius:var(--r-sm);font-size:14px;color:var(--ink);
  background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.18);outline:none;
  transition:border-color .3s;
}
[data-theme="light"] .field input{background:rgba(0,0,0,.04);border-color:rgba(0,0,0,.15);}
.field input:focus{border-color:var(--accent);}
.auth-err{color:#ff6b5e;font-size:13px;margin-top:12px;display:none;}
.auth-err.show{display:block;}
.m-list{display:grid;gap:10px;}
.m-row{
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
  background:rgba(255,255,255,.05);border:1.5px solid rgba(255,255,255,.12);
  border-radius:var(--r-sm);padding:14px 16px;font-size:13.5px;
}
[data-theme="light"] .m-row{background:rgba(0,0,0,.03);border-color:rgba(0,0,0,.12);}
.m-row .mr-l{color:var(--ink);font-weight:600;}
.m-row .mr-r{color:var(--ink-2);}

/* ============ 关于 ============ */
.about-body{text-align:center;padding:10px 0;}
.about-body .logo{
  width:74px;height:74px;margin:6px auto 18px;border-radius:22px;
  background:linear-gradient(145deg,rgba(255,214,10,.25),rgba(255,160,10,.18));
  border:1px solid rgba(255,214,10,.4);color:var(--accent);
  display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:34px;font-weight:900;
}
.about-body h2{font-size:22px;margin-bottom:12px;}
.about-body p{color:var(--ink-2);font-size:14px;line-height:1.9;max-width:520px;margin:0 auto;}

/* ============ Dock：主站液态玻璃胶囊（样式对齐主站） ============ */
.dock{
  position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:200;display:flex;align-items:center;gap:3px;padding:3px;
  border-radius:999px;overflow:visible;
  background:linear-gradient(180deg,rgba(255,255,255,.30) 0%,rgba(255,255,255,.16) 55%,rgba(255,255,255,.12) 100%);
  border:1.5px solid rgba(255,255,255,.30);
  box-shadow:0 12px 40px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.45);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
}
[data-theme="light"] .dock{
  background:linear-gradient(180deg,rgba(255,255,255,.62) 0%,rgba(255,255,255,.46) 55%,rgba(255,255,255,.40) 100%);
  border-color:rgba(255,255,255,.82);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:0 12px 40px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.85);
}
[data-theme="dark"] .dock{
  background:rgba(26,28,36,.42);
  border-color:rgba(255,255,255,.14);
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:0 12px 40px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.10);
}
.dock-item{
  position:relative;z-index:1;border:0;cursor:pointer;font-family:inherit;font-size:12.5px;letter-spacing:.02em;
  color:var(--ink-2);padding:0 17px;border-radius:999px;white-space:nowrap;height:40px;
  display:inline-flex;align-items:center;justify-content:center;background:transparent;
  transition:background .3s var(--ease-snap),color .3s,transform .25s var(--ease-snap);
}
@media (hover:hover){
  .dock-item:hover{background:rgba(255,255,255,.2);color:var(--ink);transform:scale(1.05);}
  [data-theme="light"] .dock-item:hover{background:rgba(0,0,0,.08);}
}
.dock-item:active{transform:scale(.92);}
.dock-item.active{color:#fff;font-weight:700;background:transparent;border:0;box-shadow:none;}
[data-theme="light"] .dock-item.active{color:#111;}
/* 选中滑块：静止时纯灰底，滑动/放大时玻璃+高光+折射（主站同款） */
.dock-indicator{
  position:absolute;top:3px;bottom:3px;left:0;width:0;opacity:0;border-radius:999px;
  background:rgba(120,120,120,.55);border:1px solid transparent;box-shadow:none;
  backdrop-filter:none;-webkit-backdrop-filter:none;
  transition:left .5s cubic-bezier(.25,1,.35,1),width .5s cubic-bezier(.25,1,.35,1),
    top .3s ease,bottom .3s ease,border-radius .35s ease,
    transform .4s cubic-bezier(.34,1.56,.64,1),opacity .35s ease,
    background .25s ease,backdrop-filter .25s ease,border-color .25s ease,box-shadow .25s ease;
  pointer-events:none;z-index:0;will-change:transform,left,width;
}
.dock-indicator.ready{opacity:1;}
@keyframes dockBounce{
  0%{transform:scale(1,1);opacity:1;}
  18%{transform:scale(1.12,.80) translateY(3px);opacity:.92;}
  42%{transform:scale(1.20,1.20);opacity:.5;}
  68%{transform:scale(1.06,1.06);opacity:.82;}
  100%{transform:scale(1,1);opacity:1;}
}
.dock-indicator.bounce{animation:dockBounce .6s cubic-bezier(.34,1.56,.64,1);}
.dock-indicator.shape-shift{transform:scale(0.82,1.22);}
.dock-indicator.moving{
  transform:scale(1.28,1.5);opacity:.7;
  transition:left .3s ease-out,width .3s ease-out,transform .12s cubic-bezier(.25,.46,.45,.94),opacity .2s ease;
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.22) 100%);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1.5px solid rgba(255,255,255,.5);
  box-shadow:0 6px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.55);
}
.dock-indicator.moving::before{
  content:"";position:absolute;inset:0;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.08) 40%,transparent 65%);
  pointer-events:none;
}
.dock-indicator.moving::after{display:none;}
.dock-indicator.sliding{
  transform:scale(1);opacity:1;
  transition:left .45s cubic-bezier(.25,1,.35,1),width .45s cubic-bezier(.25,1,.35,1),
    background .25s ease,backdrop-filter .25s ease,border-color .25s ease,box-shadow .25s ease;
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.22) 100%);
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  border:1.5px solid rgba(255,255,255,.5);
  box-shadow:0 6px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.55);
}
.dock-indicator.sliding::before{
  content:"";position:absolute;inset:0;border-radius:999px;
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.08) 40%,transparent 65%);
  pointer-events:none;
}
.dock-indicator.sliding::after{display:none;}
[data-theme="light"] .dock-indicator{background:rgba(120,120,120,.55);border-color:transparent;box-shadow:none;}
[data-theme="light"] .dock-indicator.moving,
[data-theme="light"] .dock-indicator.sliding{
  background:linear-gradient(180deg,rgba(255,255,255,.72) 0%,rgba(255,255,255,.50) 45%,rgba(255,255,255,.58) 100%);
  border-color:rgba(255,255,255,.9);
  box-shadow:0 6px 24px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.95),
    inset 0 -1px 0 rgba(0,0,0,.06),0 0 18px rgba(255,255,255,.3);
}
[data-theme="dark"] .dock-indicator{background:rgba(120,120,120,.55);border-color:transparent;box-shadow:none;}
[data-theme="dark"] .dock-indicator.moving,
[data-theme="dark"] .dock-indicator.sliding{
  background:linear-gradient(180deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,.15) 50%,rgba(255,255,255,.22) 100%);
  border-color:rgba(255,255,255,.5);
  box-shadow:0 6px 24px rgba(0,0,0,.2),inset 0 1px 0 rgba(255,255,255,.55);
}
/* 长按放大时的 Q 弹跳入动效 */
@keyframes dockPopIn{
  0%{transform:scale(1);opacity:1;}
  45%{transform:scale(1.3,1.55);opacity:.35;}
  75%{transform:scale(1.14,1.34);opacity:.45;}
  100%{transform:scale(1.2,1.42);opacity:.42;}
}
.dock-indicator.pop-in{animation:dockPopIn .4s cubic-bezier(.34,1.56,.64,1);}
/* 回弹结束 */
@keyframes dockSettle{
  0%{transform:scale(1.2,1.42);opacity:.42;}
  45%{transform:scale(.95);opacity:1;}
  75%{transform:scale(1.02);}
  100%{transform:scale(1);opacity:1;}
}
.dock-indicator.settle{animation:dockSettle .45s cubic-bezier(.34,1.56,.64,1);}
.dock::-webkit-scrollbar{display:none;}
@media (max-width:640px){
  .h-stat .hint{display:none;}
  .h-stat .go{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .dock-item{padding:0 13px;font-size:12px;height:38px;}
  .h-stats{grid-template-columns:1fr 1fr;}
  .lesson-banner{padding:22px 20px;}
   .modal-card{padding:60px 20px 22px;}
}
</style>
</head>
<body>
<div class="orb orb-a"></div><div class="orb orb-b"></div><div class="orb orb-c"></div>
<div class="wrap">
  <div id="topbarSlot"></div>
  <div id="app"></div>
</div>
<nav class="dock" id="dockNav" aria-label="底部导航">
  <span class="dock-indicator" id="dockIndicator" aria-hidden="true"></span>
  <button class="dock-item" type="button" data-target="home">首页</button>
  <button class="dock-item" type="button" data-target="units">课程</button>
  <button class="dock-item" type="button" data-target="exam">练习</button>
  <button class="dock-item" type="button" data-target="wrong">错题本</button>

</nav>
<div class="account-island" id="accountIsland" hidden></div>
<div class="modal-mask" id="modalMask"><div class="modal-card" id="modalCard"></div></div>
<script>

var QUESTIONS=[
/* ==== 第1课 ==== */
{id:'l1-1', lesson:1, diff:1, stem:'1974年在东非发现的"露西"化石距今约300万年，已经能够直立行走。该化石发现于（ ）', opts:['亚洲中国', '欧洲希腊', '美洲墨西哥', '非洲埃塞俄比亚'], ans:3, explain:'教材第一课：1974年在埃塞俄比亚发现的"露西"化石，表明人类起源阶段已能直立行走。', src:'教材知识点'},
{id:'l1-2', lesson:1, diff:1, stem:'原始社会后期，随着生产力的提高出现私有制和阶级，人类由此进入（ ）', opts:['原始社会', '奴隶社会', '封建社会', '资本主义社会'], ans:1, explain:'私有制和阶级的出现，标志着人类进入奴隶社会，国家随之产生。', src:'教材知识点'},
{id:'l1-3', lesson:1, diff:1, stem:'约公元前3500年，下列地区最早出现奴隶制小国的是（ ）', opts:['遥远的印度河流域', '两河流域南部和尼罗河流域', '偏远的西欧地区', '西欧地区'], ans:1, explain:'约前3500年，两河流域南部与尼罗河流域率先出现最早的奴隶制小国。', src:'教材知识点'},
/* ==== 第2课 ==== */
{id:'l2-1', lesson:2, diff:1, stem:'迄今已知世界上第一部较为完整的成文法典是（ ）', opts:['《十二铜表法》', '《汉谟拉比法典》', '《查士丁尼法典》', '《拿破仑法典》'], ans:1, explain:'教材地位性结论：古巴比伦《汉谟拉比法典》是迄今已知世界上第一部较为完整的成文法典。', src:'2022年天津中考真题'},
{id:'l2-2', lesson:2, diff:1, stem:'《汉谟拉比法典》规定：拐带奴隶、帮助奴隶逃跑或窝藏奴隶者都要被处死；奴隶打自由民的嘴巴要被处以割耳之刑。这反映出该法典（ ）', opts:['维护了全体公民的利益', '确立了自由平等原则', '维护了奴隶主阶级的利益', '保护奴隶的基本权利'], ans:2, explain:'从"拐带奴隶处死、奴隶受割耳之刑"可见法典公开维护奴隶主对奴隶的占有与压迫，是奴隶社会阶级本质的体现。', src:'2025年重庆中考一模'},
{id:'l2-3', lesson:2, diff:1, stem:'某法典序言称法典制定者为"巴比伦之太阳"，目的是使"公道与正义流传国境"。这部法典是（ ）', opts:['《十二铜表法》', '《汉谟拉比法典》', '《查士丁尼法典》', '《拿破仑法典》'], ans:1, explain:'"巴比伦之太阳"正是古巴比伦国王汉谟拉比的自称，法典即《汉谟拉比法典》。', src:'2025年江苏苏州中考真题'},
{id:'l2-4', lesson:2, diff:1, stem:'楔形文字与《汉谟拉比法典》石柱这两项代表性文明成果的发源地是（ ）', opts:['两河流域', '黄河流域', '尼罗河流域', '印度河流域'], ans:0, explain:'楔形文字由苏美尔人创造，《汉谟拉比法典》属古巴比伦，二者都出自两河流域。', src:'2025年山东烟台中考真题'},
/* ==== 第3课 ==== */
{id:'l3-1', lesson:3, diff:1, stem:'象形文字对腓尼基字母的形成有重要影响，太阳历成为儒略历的蓝本。这些文明成果属于（ ）', opts:['古埃及', '古巴比伦', '古印度', '古希腊'], ans:0, explain:'象形文字、太阳历都是古埃及的典型成就，"儒略历蓝本"再次指向埃及。', src:'2023年山东青岛中考真题'},
{id:'l3-2', lesson:3, diff:1, stem:'某文明创立了太阳历和象形文字，数学、医学成就很高，并建造了规模宏大、数量众多的金字塔。该文明产生于（ ）', opts:['西亚的两河流域', '南亚的印度河流域', '中国的黄河长江流域', '北非的尼罗河流域'], ans:3, explain:'太阳历＋象形文字＋金字塔＝古埃及文明的标志组合，古埃及位于北非尼罗河流域。', src:'2025年四川泸州中考真题'},
{id:'l3-3', lesson:3, diff:1, stem:'古埃及在天文学方面的突出成就是（ ）', opts:['《大明历》', '太阳历', '《授时历》', '儒略历'], ans:1, explain:'古埃及人创制太阳历，是现存最早的天文历法之一；儒略历是罗马人制定的。', src:'2025年黑龙江绥化中考真题'},
{id:'l3-4', lesson:3, diff:1, stem:'古埃及许多法老在神庙等大型纪念物上刻铭记功，戏剧化地夸张其个人才能和功绩。法老这一做法旨在（ ）', opts:['发展经济', '完善法律', '强化王权', '传承文字'], ans:2, explain:'法老通过刻铭记功宣扬个人权威，目的是强化王权、巩固君主专制统治。', src:'2025年广州中考真题'},
/* ==== 第4课 ==== */
{id:'l4-1', lesson:4, diff:1, stem:'《婆罗门法典》规定：人分四个等级，世代相袭、内部通婚、贵贱分明。这一规定表明其反映的制度（ ）', opts:['注重平等', '等级森严', '结构复杂', '内容单一'], ans:1, explain:'四个等级世代相袭、贵贱分明，正体现古印度种姓制度等级森严的特征。', src:'2025年江苏连云港中考真题'},
{id:'l4-2', lesson:4, diff:1, stem:'把握关键词是历史学习的有效方法。"孔雀王朝""种姓制度""创立佛教"这些关键词体现的是（ ）', opts:['古埃及文明', '古巴比伦文明', '古罗马文明', '古印度文明'], ans:3, explain:'孔雀王朝是印度统一王朝，种姓制度与佛教都产生于古印度。', src:'2024年天津部分区二模'},
{id:'l4-3', lesson:4, diff:1, stem:'0到9的计数法最初是由谁发明的（ ）', opts:['阿拉伯人', '古代埃及人', '古代印度人', '古希腊人'], ans:2, explain:'0—9计数法由古代印度人发明，经阿拉伯人改造并传入欧洲，因此被称为"阿拉伯数字"。', src:'教材知识点'},
/* ==== 第5课 ==== */
{id:'l5-1', lesson:5, diff:1, stem:'古代文明普遍经历了由"城"为中心的政治体向地域国家转变的过程，但也有始终停留在"城邦"阶段的特例。下列属于这种特例的是（ ）', opts:['古代埃及', '古代希腊', '古代印度', '古代中国'], ans:1, explain:'古希腊以众多城邦并立为特征，长期停留在"城邦"阶段（小国寡民、独立自治）。', src:'2025年内蒙古中考真题'},
{id:'l5-2', lesson:5, diff:1, stem:'伯里克利时代，雅典执政官等官职对每个等级的公民开放，可通过抽签当选，公民大会是最高权力机构。据此可知，当时雅典实行（ ）', opts:['民主政治', '元首政治', '权力制衡', '等级选举'], ans:0, explain:'"官职开放、抽签当选、公民大会最高"共同指向雅典的民主政治。', src:'2025年四川德阳中考真题'},
{id:'l5-3', lesson:5, diff:1, stem:'根据同学们整理的"城邦""抽签""公民大会""陪审法庭"等关键词，可以推断他们的学习内容是（ ）', opts:['雅典的民主政治', '等级森严的种姓制度', '西欧的封君封臣制度', '日本的大化改新'], ans:0, explain:'城邦、抽签选举、公民大会、陪审法庭都是雅典民主政治的典型特征。', src:'2025年云南中考真题'},
{id:'l5-4', lesson:5, diff:1, stem:'了解早期希腊社会的主要文献是（ ）', opts:['《荷马史诗》', '《十二铜表法》', '《查士丁尼法典》', '《哈姆雷特》'], ans:0, explain:'《荷马史诗》（含《伊利亚特》《奥德赛》）相传由荷马整理，反映早期希腊社会，是研究早期希腊社会的主要文献。', src:'2025年黑龙江绥化中考真题'},
{id:'l5-5', lesson:5, diff:1, stem:'奥林匹克运动因举办地在奥林匹亚而得名。该项运动发源于（ ）', opts:['古代罗马', '古代巴比伦', '古代印度', '古代希腊'], ans:3, explain:'古代奥林匹克运动会发源于古希腊的奥林匹亚，是古希腊体育文化的代表。', src:'2024年天津河东区二模'},
{id:'l5-6', lesson:5, diff:1, stem:'亚历山大东征建立了地跨欧亚非的大帝国。这一历史事件产生的影响是（ ）', opts:['促进东西方之间文化交流', '推动西方民主政治产生', '开创了亚非海上交通线', '世界开始连为一个整体'], ans:0, explain:'亚历山大东征把希腊文明传播到东方，也吸收了东方文化，促进了东西方文化大交汇；"世界连为一体"是新航路开辟的影响。', src:'2025年山东泰安中考真题'},
/* ==== 第6课 ==== */
{id:'l6-1', lesson:6, diff:1, stem:'罗马共和国建立的时间是公元前509年。这一时间还可以表述为（ ）', opts:['公元前6世纪初期', '公元前4世纪初期', '公元前4世纪末期', '公元前6世纪末期'], ans:3, explain:'世纪换算：年份前两位＋1为世纪数，前509年属公元前6世纪；509更靠近500，故为"公元前6世纪末期"。', src:'2025年天津中考真题'},
{id:'l6-2', lesson:6, diff:1, stem:'在罗马共和国，形式上最高权力机关是（ ）', opts:['元老院', '执政官', '保民官', '公民大会'], ans:3, explain:'罗马共和国设执政官（行政）、元老院（决策）、公民大会（形式上的最高权力机关）与保民官（否决权）。', src:'2023年四川凉山中考真题'},
{id:'l6-3', lesson:6, diff:1, stem:'罗马诗人贺拉斯写道："被征服的希腊人，诱使征服者成为俘虏。"这句话说明（ ）', opts:['希腊文化其实是源自于罗马文化', '罗马深受希腊文化艺术成就的影响', '罗马彻底消灭了希腊的文化艺术', '罗马与希腊文化之间互不相关'], ans:1, explain:'罗马以武力征服希腊，却在文化上被希腊文明征服——建筑、文学、哲学大量吸收希腊成果。', src:'2023年天津中考真题'},
{id:'l6-4', lesson:6, diff:1, stem:'"无论是对中世纪和近现代的西方法学，还是对亚非拉国家的现行法律体制，罗马法都有不可磨灭的贡献。"罗马法制建设的第一步是（ ）', opts:['《汉谟拉比法典》', '《查士丁尼法典》', '《十二铜表法》', '《罗马民法大全》'], ans:2, explain:'前450年左右颁布的《十二铜表法》是罗马第一部成文法，是罗马法制建设的第一步。', src:'2024年天津南开区一模'},
{id:'l6-5', lesson:6, diff:1, stem:'随着帝国扩张和商业发展，罗马缺乏适用于外来人口及其与本地人口关系的法律。针对这一情况，罗马帝国（ ）', opts:['推行了万民法', '颁布了成文法', '建立了元首制', '编制了儒略历'], ans:0, explain:'罗马帝国时期为处理外来人口的法律问题推行"万民法"，与适用于罗马公民的"公民法"相区别。', src:'2024年天津河北区二模'},
{id:'l6-6', lesson:6, diff:1, stem:'公元前27年，罗马共和国演变为罗马帝国。这一转变的标志性事件是（ ）', opts:['罗马颁布了《十二铜表法》', '屋大维首创"元首制"', '罗马独裁官凯撒遇刺身亡', '西罗马帝国的最终灭亡'], ans:1, explain:'公元前27年屋大维建立元首制，罗马进入帝国时期；395年帝国分裂，476年西罗马帝国灭亡。', src:'教材知识点'},
/* ==== 第7课 ==== */
{id:'l7-1', lesson:7, diff:1, stem:'中世纪是欧洲的重要历史时期，将欧洲带入中世纪的是（ ）', opts:['苏美尔人', '日耳曼人', '印第安人', '斯巴达人'], ans:1, explain:'西罗马帝国灭亡后，日耳曼人在其废墟上建立许多王国（如克洛维481年建立法兰克王国），欧洲由此进入中世纪。', src:'2025年广州中考真题'},
{id:'l7-2', lesson:7, diff:1, stem:'课本剧中：人物1解下武器、脱帽、下跪，双手合拢宣誓效忠；人物2拉起他、亲吻脸颊，宣誓保护并交给他宝剑。据此判断（ ）', opts:['人物正式结成契约关系', '人物分别是领主、佃户', '人物关系以血缘为纽带', '场景出现在罗马共和国'], ans:0, explain:'"臣服礼"与"授职礼"是封君封臣关系形成的标志性仪式，双方以土地封赐为纽带结成契约关系。', src:'2025年新疆中考真题'},
{id:'l7-3', lesson:7, diff:1, stem:'9至10世纪的西欧形成了一种金字塔式的封建等级关系。构成这种"金字塔式的封建等级关系"的是（ ）', opts:['庄园与法庭', '教会与大学', '封君与封臣', '富农与市民'], ans:2, explain:'封君封臣制层层分封，等级森严，"我的附庸的附庸不是我的附庸"。', src:'2024年天津南开区二模'},
{id:'l7-4', lesson:7, diff:1, stem:'中世纪欧洲的庄园有公共牧场、草场、林地供全体佃户使用，拥有绝大多数的农具和牲畜，很少需要对外交换。这体现庄园经济的特征是（ ）', opts:['流通自由', '精耕细作', '商业发达', '自给自足'], ans:3, explain:'"很少对外交换""自备生产工具"说明庄园内生产基本满足自身需要，是自给自足的经济单位。', src:'2024年天津滨海新区二模'},
/* ==== 第8课 ==== */
{id:'l8-1', lesson:8, diff:1, stem:'12世纪，被认为是欧洲中世纪教育"最美好的花朵"的是（ ）', opts:['城市的兴起', '庄园的出现', '大学的兴起', '行会的出现'], ans:2, explain:'教材原文：12世纪大学的兴起被认为是欧洲中世纪教育"最美好的花朵"。', src:'2024年天津南开区二模'},
{id:'l8-2', lesson:8, diff:1, stem:'12世纪的西欧城市里，市民享有财产权，领主不得任意征税；逃亡到城市的农奴只要住满一年零一天就可获得自由人身份。下列表述与这些现象相符的是（ ）', opts:['"我的附庸的附庸不是我的附庸"', '西欧庄园是自给自足的经济单位', '"城市的空气使人自由"', '大学是"中世纪最美好的花朵"'], ans:2, explain:'城市中人身相对自由、农奴住满一年零一天即获自由，正是"城市的空气使人自由"的含义。', src:'2024年天津西青区二模'},
{id:'l8-3', lesson:8, diff:1, stem:'13世纪，西欧市民将领主颁发的"特许状"镌刻在城市重要场所或锁进保险柜。如果领主违反特许状，市民可凭它反抗。由此可见特许状（ ）', opts:['明确了领主对市民的土地分封', '使市民完全摆脱了领主控制', '是城市自由和自治权的保障', '是市民在庄园法庭维权的依据'], ans:2, explain:'特许状以法律形式确认城市自治权，是城市自由与自治的保障。', src:'2025年江苏苏州中考真题'},
{id:'l8-4', lesson:8, diff:1, stem:'11世纪后，随着西欧城市兴起和发展，社会对法律、医学等专门人才的需求大增，越来越多的世俗君主或城市开办大学，开设算术、医学、法学、神学等课程培养实用人才。这说明大学（ ）', opts:['成为了国家学术研究中心', '摆脱了神学的影响', '拥有了免赋税特权', '适应了经济社会发展需求'], ans:3, explain:'大学的兴起与课程设置都是适应城市经济发展和人才需求的产物。', src:'2025年湖北中考真题'},
/* ==== 第9课 ==== */
{id:'l9-1', lesson:9, diff:1, stem:'"它地跨欧亚非三大洲""它对东西方文化兼收并蓄""它为后来的文艺复兴提供丰富的精神营养"。"它"是（ ）', opts:['拜占庭帝国', '亚历山大帝国', '罗马帝国', '阿拉伯帝国'], ans:0, explain:'拜占庭帝国保存大量希腊罗马古籍并融合东方文化，这些典籍为文艺复兴提供了精神营养。', src:'2024年天津部分区二模'},
{id:'l9-2', lesson:9, diff:1, stem:'某法典仍承认奴隶制，但一定程度上改善了奴隶地位，在财产、买卖、债务、契约关系等方面作出明确规定，奠定了欧洲民法的基础。这部法典是（ ）', opts:['《汉谟拉比法典》', '《罗马民法大全》', '《拿破仑法典》', '《解放黑人奴隶宣言》'], ans:1, explain:'查士丁尼组织编纂的《罗马民法大全》集罗马法之大成，"奠定欧洲民法基础"是教材对它的地位表述。', src:'2025年山西中考真题'},
{id:'l9-3', lesson:9, diff:1, stem:'1453年，攻陷君士坦丁堡、灭亡拜占庭帝国的政权是（ ）', opts:['阿拉伯帝国', '奥斯曼帝国', '亚历山大帝国', '波斯帝国'], ans:1, explain:'1453年奥斯曼帝国攻陷君士坦丁堡，拜占庭帝国灭亡，君士坦丁堡改名伊斯坦布尔。', src:'教材知识点'},
/* ==== 第10课 ==== */
{id:'l10-1', lesson:10, diff:1, stem:'日本曾长期吸收中国文化，它仿效唐朝的典章制度进行的改革是（ ）', opts:['新经济政策', '明治维新', '大化改新', '罗斯福新政'], ans:2, explain:'646年孝德天皇推行"大化改新"，仿效隋唐制度建立中央集权；明治维新是19世纪学习西方。', src:'2025年龙东中考真题'},
{id:'l10-2', lesson:10, diff:1, stem:'646年，在从中国留学归国的革新派推动下，日本进行了划时代意义的变革，成功移植中国的典章制度。由此，日本（ ）', opts:['依靠贵族基本实现了全国统一', '进入近700年的幕府统治时期', '开始跻身资本主义强国之列', '成为中央集权制的封建国家'], ans:3, explain:'大化改新建立中央集权体制（班田收授、租庸调），日本进入封建社会；幕府统治始于12世纪晚期。', src:'2025年山东烟台中考真题'},
{id:'l10-3', lesson:10, diff:1, stem:'12世纪晚期，日本进入幕府统治时期。开创这一局面、建立镰仓幕府的是（ ）', opts:['孝德天皇', '织田信长', '德川家康', '源赖朝'], ans:3, explain:'12世纪晚期武士集团兴起，源赖朝建立镰仓幕府，日本进入幕府统治时期，天皇渐成虚位。', src:'教材知识点'},
/* ==== 第11课 ==== */
{id:'l11-1', lesson:11, diff:1, stem:'西欧古典希腊罗马文化在中世纪初期已被摧毁殆尽，正是通过阿拉伯人的翻译才保留下来并传回欧洲。由此可见阿拉伯人（ ）', opts:['保存和传播了古代欧洲文化', '批判了封建道德伦理观念', '用理性之光驱散了愚昧黑暗', '创造了有自己特色的文化'], ans:0, explain:'阿拉伯人通过翻译运动保存了希腊罗马典籍并把它们传回欧洲，是"保存和传播古代文化"的使者。', src:'2025年新疆中考真题'},
{id:'l11-2', lesson:11, diff:1, stem:'改造古印度人从0到9的计数法，并创造了完整的代数学的是（ ）', opts:['斯巴达人', '阿拉伯人', '罗马人', '日耳曼人'], ans:1, explain:'阿拉伯人改造0—9计数法并创立完整代数学，"阿拉伯数字"因此得名；发明者是印度人，改造传播者是阿拉伯人。', src:'2025年吉林中考真题'},
{id:'l11-3', lesson:11, diff:1, stem:'中国的造纸术、指南针、火药等重大发明和印度的棉花、食糖等，都是由阿拉伯人传入欧洲的。这表明阿拉伯人（ ）', opts:['担当了沟通东西方文化的角色', '建立了地跨亚欧非三洲的大帝国', '创造了独具特色的阿拉伯文化', '传播了欧洲文明的成果'], ans:0, explain:'材料主旨是阿拉伯人在中西文化传播中的桥梁作用，他们是"东西方文化交流的使者"。', src:'2024年天津西青区二模'},
{id:'l11-4', lesson:11, diff:1, stem:'阿拉伯帝国地跨亚欧非三大洲，将埃及、波斯等古代文明地区统一到一个政权之下，并与中国、印度、拜占庭等文化昌盛的国家相毗邻。这一局面有利于（ ）', opts:['罗马法典的编撰', '多元文明的交融', '伊斯兰教的产生', '创造0到9计数法'], ans:1, explain:'地跨三洲的帝国版图与多文明毗邻，客观上促进了不同文明的交流融合。', src:'2025年重庆中考真题'},
{id:'l11-5', lesson:11, diff:1, stem:'伊斯兰教的创立时间和地点是（ ）', opts:['622年，迁徙到麦地那之时', '610年，阿拉伯半岛的麦加', '646年，日本的大化改新时期', '8世纪中期，定都巴格达之后'], ans:1, explain:'610年穆罕默德在麦加创立伊斯兰教，622年迁居麦地那（伊斯兰教历元年），8世纪中期帝国达到极盛。', src:'教材知识点'},
/* ==== 第12课 ==== */
{id:'l12-1', lesson:12, diff:1, stem:'14世纪，这里清真寺与学校众多，是西非的文化学术中心。这座城市是（ ）', opts:['廷巴克图', '开罗', '君士坦丁堡', '特诺奇蒂特兰'], ans:0, explain:'马里帝国的廷巴克图是西非文化学术中心，清真寺与学校众多。', src:'教材知识点'},
{id:'l12-2', lesson:12, diff:1, stem:'玛雅文明的成就包括（ ）', opts:['阶梯金字塔', '象形文字与太阳历', '以上都是', '20进位制'], ans:2, explain:'玛雅文明在建筑（阶梯金字塔）、文字（象形文字）、历法（太阳历）、数学（20进位制）方面均有突出成就。', src:'教材知识点'},
{id:'l12-3', lesson:12, diff:1, stem:'阿兹特克人建立的都城是（ ）', opts:['马丘比丘', '廷巴克图', '特诺奇蒂特兰', '亚历山大'], ans:2, explain:'阿兹特克人14世纪在今墨西哥地区兴起，建都特诺奇蒂特兰（今墨西哥城）。', src:'教材知识点'},
{id:'l12-4', lesson:12, diff:1, stem:'印加帝国用"结绳记事"的方法记录信息，这种绳结被称为（ ）', opts:['甲骨', '纸草', '泥版', '基普'], ans:3, explain:'印加人用"基普"（结绳）记录信息，是印加文明的独特成就。', src:'教材知识点'},
/* ==== 第13课 ==== */
{id:'l13-1', lesson:13, diff:1, stem:'文艺复兴期间，工匠不再受到鄙视，人们重视纺织、制陶、制玻璃以及冶金方面的实用技术。这一现象（ ）', opts:['改变了农村的土地关系', '导致了欧洲城市的衰落', '推动了西欧大学的兴起', '体现对人的价值的尊重'], ans:3, explain:'工匠与实用技术受到重视，说明人的劳动与价值得到肯定，是人文主义精神的体现。', src:'2024年重庆A卷中考真题'},
{id:'l13-2', lesson:13, diff:1, stem:'意大利各地举行纪念某位著名人物逝世700周年系列活动，演员在线朗诵其代表作品《神曲》片段。这位人物是（ ）', opts:['薄伽丘', '彼特拉克', '莎士比亚', '但丁'], ans:3, explain:'但丁是文艺复兴的先驱，代表作《神曲》抨击教会腐败，表达市民阶层的情感与理想。', src:'2021年重庆A卷中考真题'},
{id:'l13-3', lesson:13, diff:1, stem:'某文艺复兴巨匠逝世500周年纪念展在法国卢浮宫举行，因参观人数过多未展出其作品《蒙娜丽莎》。这位巨匠是（ ）', opts:['但丁', '米开朗琪罗', '莎士比亚', '达·芬奇'], ans:3, explain:'《蒙娜丽莎》《最后的晚餐》是达·芬奇的绘画代表作；但丁代表作《神曲》，莎士比亚是英国戏剧家。', src:'2021年重庆B卷中考真题'},
{id:'l13-4', lesson:13, diff:1, stem:'在中世纪，雕塑只为教堂神龛和大门作装饰；文艺复兴时期，矗立在城市广场上的雕像充满动感，可供人欣赏人体之美和人的力量之美。这实质上反映了（ ）', opts:['雕塑使用范围扩大', '宗教退出人们生活', '雕塑装饰功能增强', '人文主义思想流行'], ans:3, explain:'"欣赏人体之美和人的力量之美"正是人文主义（以人为中心、肯定人的价值）的体现。', src:'2023年重庆A卷中考真题'},
{id:'l13-5', lesson:13, diff:1, stem:'文艺复兴时期的戏剧《罗密欧与朱丽叶》反映爱情理想与封建伦理的冲突，赞美青年的纯真爱情。这部戏剧的作者是（ ）', opts:['莎士比亚', '薄伽丘', '但丁', '达·芬奇'], ans:0, explain:'莎士比亚是文艺复兴时期英国文学巨匠，代表作有《哈姆雷特》《罗密欧与朱丽叶》等。', src:'2023年广西中考真题'},
{id:'l13-6', lesson:13, diff:1, stem:'文艺复兴运动兴起的根本原因是（ ）', opts:['基督教会的精神统治', '古希腊罗马文化的复兴', '资本主义萌芽的产生', '大学的普遍兴起'], ans:2, explain:'14、15世纪西欧资本主义萌芽产生并发展，新兴资产阶级需要思想解放，这是文艺复兴兴起的根本原因。', src:'教材知识点'},
/* ==== 第14课 ==== */
{id:'l14-1', lesson:14, diff:1, stem:'哥伦布发现美洲后，美洲的玉米、可可和马铃薯由西班牙人带回欧洲后传遍世界；小麦、水稻等随欧洲移民进入美洲。材料表明，新航路的开辟（ ）', opts:['促进了物种交流', '证实了地圆学说的正确', '引发了殖民掠夺', '确立了西班牙霸主地位'], ans:0, explain:'材料只讲动植物品种跨洲传播，直接对应"促进物种交流"；证实地圆学说的是麦哲伦船队环球航行。', src:'2022年重庆A卷中考真题'},
{id:'l14-2', lesson:14, diff:1, stem:'1500年到1800年间，刮起了以玉米、马铃薯、马等动植物为代表的洲际物种交流之风。这一交流之风开始出现的前提是（ ）', opts:['垦殖运动的出现', '资产阶级革命爆发', '工业革命兴起', '新航路的开辟'], ans:3, explain:'1492年哥伦布到达美洲后，新旧大陆的动植物开始跨洲传播，前提正是新航路的开辟。', src:'2021年重庆B卷中考真题'},
{id:'l14-3', lesson:14, diff:1, stem:'1492年，横渡大西洋、到达美洲的航海家是（ ）', opts:['迪亚士', '哥伦布', '达·伽马', '麦哲伦'], ans:1, explain:'1492年哥伦布横渡大西洋到达美洲（今巴哈马群岛），误以为到达印度。', src:'教材知识点'},
{id:'l14-4', lesson:14, diff:1, stem:'人类历史上第一次完成环球航行、用实践证实"地圆学说"的是（ ）', opts:['麦哲伦船队', '迪亚士船队', '哥伦布船队', '达·伽马船队'], ans:0, explain:'1519—1522年麦哲伦船队完成环球航行，证明了地圆学说的正确。', src:'教材知识点'},
{id:'l14-5', lesson:14, diff:1, stem:'15、16世纪以来常用"哥伦布发现美洲"的提法；1984年部分拉美学者倡议改称"美洲发现——两个文明汇合"。这一变化（ ）', opts:['突出美洲文明优于欧洲文明', '更加肯定哥伦布的历史功绩', '强调欧美文明的平等交流', '批判哥伦布带来的殖民扩张'], ans:3, explain:'改称"两个文明汇合"是对欧洲中心论"发现"提法的反思，认识到哥伦布航行开启了欧洲对美洲的殖民。', src:'2025年重庆二模'},
/* ==== 第15课 ==== */
{id:'l15-1', lesson:15, diff:1, stem:'"三角贸易"中，欧洲殖民者将非洲黑人奴隶贩卖到美洲，这一行程是三角贸易的（ ）', opts:['出程', '中程', '归程', '全程'], ans:1, explain:'三角贸易分三段：出程（欧洲—非洲运火器等）、中程（非洲—美洲贩卖黑奴）、归程（美洲—欧洲运金银蔗糖）。', src:'教材知识点'},
{id:'l15-2', lesson:15, diff:1, stem:'18世纪中期，先后打败荷兰、法国等竞争对手，自诩"日不落帝国"的是（ ）', opts:['葡萄牙', '西班牙', '荷兰', '英国'], ans:3, explain:'英国通过一系列殖民战争打败竞争对手，到18世纪中期成为世界上最大的殖民国家，被称为"日不落帝国"。', src:'教材知识点'},
/* ==== 第16课 ==== */
{id:'l16-1', lesson:16, diff:1, stem:'1689年，英国议会通过文件，规定国王不经议会许可不能随意废除法律、征收捐税。该文件颁布后，英国开始确立的政治体制是（ ）', opts:['封建专制制度', '民主共和制', '君主立宪制', '联邦制'], ans:2, explain:'《权利法案》以法律形式限制王权、确立议会主权，英国君主立宪制逐渐形成。', src:'2025年重庆中考一模'},
{id:'l16-2', lesson:16, diff:1, stem:'英国资产阶级革命中，"议会主权"得到确认的法律文件是（ ）', opts:['《大宪章》', '《王位继承法》', '《人权宣言》', '《权利法案》'], ans:3, explain:'1689年《权利法案》是英国资产阶级革命的重要成果，确立了"议会至上"的原则。', src:'2025年重庆中考一模'},
{id:'l16-3', lesson:16, diff:1, stem:'英国资产阶级革命开始的标志是（ ）', opts:['1649年处死查理一世', '1688年"光荣革命"', '1640年议会重新召开', '1689年颁布《权利法案》'], ans:2, explain:'1640年查理一世重新召开议会，议会与国王矛盾激化，革命爆发。', src:'教材知识点'},
/* ==== 第17课 ==== */
{id:'l17-1', lesson:17, diff:1, stem:'美国独立战争进程示意图中，c处对应的事件及其意义是（ ）', opts:['a处：莱克星顿枪声，战争爆发', 'c处：《独立宣言》发表，宣告美国诞生', 'b处：萨拉托加大捷，战争转折', 'd处：1787年宪法制定，联邦成立'], ans:1, explain:'1776年《独立宣言》宣告北美13个殖民地脱离英国独立，"美国诞生"由此而来；按时间线定位：莱克星顿（1775）→《独立宣言》（1776）→萨拉托加（1777）→1787宪法。', src:'2025年重庆中考一模'},
{id:'l17-2', lesson:17, diff:1, stem:'美国独立战争的转折点是（ ）', opts:['莱克星顿枪声', '约克镇战役', '萨拉托加大捷', '《独立宣言》发表'], ans:2, explain:'1777年萨拉托加大捷是美国独立战争的转折点，此后法国等开始公开援助美国。', src:'教材知识点'},
{id:'l17-3', lesson:17, diff:1, stem:'1787年美国宪法确立的政体特点是（ ）', opts:['君主立宪制', '三权分立与联邦制', '君主专制', '邦联制'], ans:1, explain:'1787年宪法确立联邦制，立法（国会）、行政（总统）、司法（最高法院）三权分立、相互制衡，是世界上第一部资产阶级成文宪法。', src:'教材知识点'},
/* ==== 第18课 ==== */
{id:'l18-1', lesson:18, diff:1, stem:'法国1799—1815年的发展阶段示意图中，F1是发展的动力。其中F1最有可能的是（ ）', opts:['巴黎民众攻占巴士底狱', '路易十六被送上断头台', '制宪议会通过《人权宣言》', '《拿破仑法典》的颁布'], ans:3, explain:'1799—1815年是拿破仑执政时期，1804年颁布的《拿破仑法典》巩固统治、推动资本主义发展，是这一阶段的动力；其余三项发生在1789—1793年。', src:'2025年重庆二模'},
{id:'l18-2', lesson:18, diff:1, stem:'法国大革命开始的标志是（ ）', opts:['1793年处死路易十六', '1799年拿破仑"雾月政变"', '1789年巴黎人民攻占巴士底狱', '1815年滑铁卢战役'], ans:2, explain:'1789年7月14日巴黎人民攻占巴士底狱，法国大革命爆发。', src:'教材知识点'},
{id:'l18-3', lesson:18, diff:1, stem:'《人权宣言》宣告的核心内容是（ ）', opts:['君权神授的专制主义思想观念', '三权分立的制度设计原则', '天赋人权神圣不可侵犯的原则', '自由、平等，法律面前人人平等'], ans:3, explain:'《人权宣言》宣告自由、平等、博爱，法律面前人人平等，体现了启蒙思想，是法国大革命的纲领性文件。', src:'教材知识点'},
/* ==== 第19课 ==== */
{id:'l19-1', lesson:19, diff:1, stem:'工业革命时期，英国贵族和富裕乡绅收入大幅增长，而手工工人和农民的实际收入却不断下降，贫富差距拉大。这一现象说明工业革命（ ）', opts:['创造了巨大财富', '加剧了社会贫富分化', '改善了工人生活', '推动了城市化进程'], ans:1, explain:'材料对比贵族与工人的收入变化，主旨是工业革命加剧贫富分化。', src:'2025年重庆中考一模'},
{id:'l19-2', lesson:19, diff:1, stem:'1765年，发明珍妮纺纱机、标志工业革命开始的发明家是（ ）', opts:['凯伊', '瓦特', '斯蒂芬森', '哈格里夫斯'], ans:3, explain:'1765年哈格里夫斯发明珍妮机，大大提高了纺纱效率，工业革命首先在英国棉纺织业开始。', src:'教材知识点'},
{id:'l19-3', lesson:19, diff:1, stem:'瓦特改良蒸汽机并投入使用后，人类进入（ ）', opts:['"电气时代"', '"信息时代"', '"铁器时代"', '"蒸汽时代"'], ans:3, explain:'1785年瓦特改良的蒸汽机投入使用，为工业生产提供了新动力，人类进入"蒸汽时代"；"电气时代"是第二次工业革命。', src:'教材知识点'},
{id:'l19-4', lesson:19, diff:1, stem:'1825年，发明蒸汽机车、开启铁路时代的发明家是（ ）', opts:['瓦特', '哈格里夫斯', '斯蒂芬森', '富尔顿'], ans:2, explain:'1825年斯蒂芬森设计的蒸汽机车试车成功，标志着铁路时代的开始。', src:'教材知识点'},
{id:'l19-5', lesson:19, diff:1, stem:'工业革命首先开始的部门和最早发生国是（ ）', opts:['冶铁业，法国', '交通运输业，美国', '机器制造业，德国', '棉纺织业，英国'], ans:3, explain:'18世纪60年代，工业革命首先从英国棉纺织业开始，后扩展到其他行业。', src:'教材知识点'},
/* ==== 第20课 ==== */
{id:'l20-1', lesson:20, diff:1, stem:'下列对史事时间和空间表述完整的是（ ）', opts:['重庆发现了多座石阙，其中在忠县有三座', '1914年6月，奥匈帝国皇储被刺杀，成为第一次世界大战的导火索', '1848年，马克思、恩格斯在伦敦发表《共产党宣言》', '八路军办事处迁到红岩嘴13号'], ans:2, explain:'B项"1848年（时间）＋伦敦（空间）＋发表《共产党宣言》（事件）"要素完整；A、D缺时间，C缺空间，考查"时空观念"素养。', src:'2023年重庆A卷中考真题'},
{id:'l20-2', lesson:20, diff:1, stem:'下列表述中，属于"历史解释"的是（ ）', opts:['1848年马克思、恩格斯发表《共产党宣言》', '《共产党宣言》发表，推动了国际共产主义运动兴起发展', '1789年巴黎人民攻占巴士底狱，法国大革命爆发', '1871年巴黎公社建立并存在了七十二天'], ans:1, explain:'历史史实是客观叙述（A、C、D），历史解释是以史料为依据的分析评判（B）。', src:'2024年重庆A卷中考真题'},
{id:'l20-3', lesson:20, diff:1, stem:'马克思主义诞生的标志是（ ）', opts:['1864年第一国际成立', '1871年巴黎公社建立', '1867年《资本论》出版', '1848年《共产党宣言》的发表'], ans:3, explain:'1848年马克思、恩格斯在伦敦发表《共产党宣言》，标志着马克思主义的诞生。', src:'教材知识点'},
/* ==== 第21课 ==== */
{id:'l21-1', lesson:21, diff:1, stem:'历史现象是通过多个历史人物活动或多个历史事件呈现的历史过程或发展趋势。据此判断，下列属于历史现象的是（ ）', opts:['秦始皇', '国际共产主义运动', '彼得格勒武装起义', '五四运动的爆发'], ans:1, explain:'国际共产主义运动是贯穿多个事件与人物的发展趋势，属"历史现象"；A是人物，C、D是具体事件。', src:'2021年重庆B卷中考真题'},
{id:'l21-2', lesson:21, diff:1, stem:'关于巴黎公社，下列说法正确的是（ ）', opts:['1871年建立，是无产阶级建政的第一次伟大尝试', '1864年成立，是国际工人组织', '1871年建立，标志着马克思主义诞生', '1864年成立，是第一个无产阶级国家'], ans:0, explain:'1871年巴黎公社建立，是无产阶级建立政权的第一次伟大尝试；马克思主义诞生标志是1848年《共产党宣言》。', src:'教材知识点'},
{id:'l21-3', lesson:21, diff:1, stem:'《国际歌》的词作者是（ ）', opts:['欧仁·鲍狄埃', '马克思', '恩格斯', '贝多芬'], ans:0, explain:'巴黎公社失败后，欧仁·鲍狄埃写下《国际歌》歌词，成为激励无产阶级的战歌。', src:'教材知识点'},
/* ==== 高难度综合题（期中/期末测评专用） ==== */
{id:'h-1', lesson:1, diff:3, stem:'西亚、北非、南亚的早期文明都产生于大河流域。其共同的根本原因是（ ）', opts:['大河流域水源充足、土地肥沃，利于农业生产', '大河流域地势平坦开阔，交通便利，便于进行军事扩张活动', '大河流域气候温暖湿润，动植物资源丰富，十分适宜人类居住生活', '大河流域河网密布，形成天然屏障，有利于抵御外来部落的入侵'], ans:0, explain:'早期文明都诞生于大河流域，根本原因在于大河流域水源充足、土地肥沃，适宜农业生产，能支撑较多人口聚居，从而为文明的产生奠定物质基础；其余选项不是根本原因。', src:'教材知识点·能力提升'},
{id:'h-2', lesson:2, diff:3, stem:'《汉谟拉比法典》规定：奴隶打自由民的嘴巴要被割耳；理发师未获主人允许剃掉奴隶的发型标记要被砍断手指。这些条文反映出法典的实质是（ ）', opts:['维护奴隶主阶级的利益', '保护全体公民的平等权利', '调解自由民之间的纠纷', '提倡人人平等的法律精神'], ans:0, explain:'法典条文明显偏袒奴隶主一方，对奴隶、平民处罚严苛，说明它本质上是维护奴隶主阶级利益、巩固君主专制的工具，是公开的阶级压迫的法律体现。', src:'教材知识点·能力提升'},
{id:'h-3', lesson:3, diff:3, stem:'历史上有两种对金字塔的评价：一是"古代世界七大奇迹之首、古埃及人智慧的结晶"；二是"法老奴役人民的见证、劳动人民苦难的纪念碑"。对此理解正确的是（ ）', opts:['两种评价都正确，应辩证看待', '前者完全正确，后者则完全错误不足为信', '后者完全正确，前者则完全错误不足为信', '两种评价都是错误的，应当全部予以否定'], ans:0, explain:'金字塔既是古埃及人民勤劳智慧的结晶，又是在法老专制统治下大规模役使民力修建的，两种评价从不同角度揭示了同一历史现象的两个侧面，应当一分为二、辩证地看待。', src:'教材知识点·能力提升'},
{id:'h-4', lesson:4, diff:3, stem:'古代印度的种姓制度与古希腊雅典的民主政治相比，其共同本质是（ ）', opts:['两者都真正实现了人与人之间的完全平等', '都是少数人享有政治特权的制度', '两者都彻底废除了世袭的等级制度', '两者都充分保障了妇女的各项权利'], ans:1, explain:'种姓制度按等级世代相袭、贵贱分明，是奴隶主贵族的特权制度；雅典民主也仅限成年男性公民，妇女、外邦人、奴隶被排除在外，实质都是少数人（奴隶主阶级）享有政治特权的制度。', src:'教材知识点·能力提升'},
{id:'h-5', lesson:5, diff:3, stem:'伯里克利在演说中说："我们的制度之所以被称为民主政治，因为政权掌握在全体公民手中。"对这一言论的正确理解是（ ）', opts:['雅典的公民包括全体居民，奴隶与妇女也享有充分的政治权利', '公民仅指成年男性雅典自由民，奴隶、妇女、外邦人被排除在外', '雅典民主是全体居民的民主，真正实现了全民共同参与', '伯里克利的主张说明雅典民主已经做到了人人权利平等'], ans:1, explain:'雅典"公民"有严格限定，仅指成年男性雅典自由民，占雅典人口多数的奴隶、妇女、外邦人不属于公民，无政治权利，故伯里克利所说的"全体公民"并非全体居民，雅典民主是少数人的民主。', src:'教材知识点·能力提升'},
{id:'h-6', lesson:5, diff:3, stem:'亚历山大东征历时十年，建立了地跨欧亚非三洲的帝国。对亚历山大东征的评价，最全面的是（ ）', opts:['既带来暴力征服与掠夺，又促进了东西方文化交流', '完全是罪恶的侵略战争，毫无积极意义', '促进了东西方文化交流，应予全盘肯定', '只对希腊文化有利，对其他文明不利'], ans:0, explain:'亚历山大东征具有双重影响：一方面伴随暴力征服、掠夺和破坏，给被征服地区带来灾难；另一方面，东征促进了东西方文化交汇，希腊文化与东方文化相互交融，故应辩证评价。', src:'教材知识点·能力提升'},
{id:'h-7', lesson:6, diff:3, stem:'从《十二铜表法》到万民法，罗马法不断完善。罗马法对后世最重要的影响是（ ）', opts:['成为欧洲多国法律的基础，其中"人人平等"等原则影响深远', '罗马法确立了君主专制制度，成为后世专制统治的工具', '罗马法创立了世界上第一部成文宪法，确立了分权原则', '罗马法直接确立了近代民主共和制度，是民主政治源头'], ans:0, explain:'罗马法是古代世界最完备的法律体系，其"法律面前人人平等""私有财产神圣不可侵犯"等原则，成为近代欧洲资产阶级法律的重要依据，是近代西方法律制度的渊源。', src:'教材知识点·能力提升'},
{id:'h-8', lesson:7, diff:3, stem:'中世纪西欧流行一句话："我的附庸的附庸不是我的附庸。"它反映的封君封臣关系的突出特征是（ ）', opts:['各级封臣都直接效忠国王，全国由此形成统一的等级体系秩序', '封君与封臣之间地位完全平等，不存在隶属关系', '层层分封，各级封君封臣之间只与直接分封者发生权利义务关系', '封臣只对封君的土地有使用权，不承担任何义务'], ans:2, explain:'西欧封君封臣制以土地为纽带层层分封，封臣只对自己的直接封君宣誓效忠、承担义务，并不直接效忠更上级的封君或国王，因此"附庸的附庸"不是更高层封君的附庸，等级关系层层错落。', src:'教材知识点·能力提升'},
{id:'h-9', lesson:8, diff:3, stem:'12世纪，西欧大学兴起，被誉为中世纪教育"最美好的花朵"。大学兴起对西欧历史发展的深层意义是（ ）', opts:['大学使神学成为唯一教学内容，思想完全被禁锢', '大学直接推翻了封建制度，加速西欧社会的转型', '培养文化人才、推动教育发展，为文艺复兴准备了条件', '大学使普通农民都能接受高等教育，人人都有学上'], ans:2, explain:'大学兴起推动了西欧文化教育的发展，培养了大量知识人才，传播了古典文化与理性精神，客观上为后来的文艺复兴和思想解放准备了人才与思想条件。', src:'教材知识点·能力提升'},
{id:'h-10', lesson:9, diff:3, stem:'拜占庭帝国灭亡后，大批希腊罗马古典文献传入西欧，促进了当地文化的发展。拜占庭在文化传承方面的独特贡献是（ ）', opts:['拜占庭创造了全新的文字体系，独立发展出独具特色的文化形态', '保存了大量希腊罗马古典文化遗产，为文艺复兴提供了精神营养', '拜占庭发明了印刷术，推动了欧洲出版业的迅速发展', '拜占庭建立了世界上最早的大学，在文化上领先欧洲'], ans:1, explain:'拜占庭帝国对东西方文化兼收并蓄，保存了大量希腊罗马古典文献与法律成果；其灭亡后典籍西传，为西欧文艺复兴提供了丰富的精神营养，这是拜占庭在文化传承上最独特的贡献。', src:'教材知识点·能力提升'},
{id:'h-11', lesson:10, diff:3, stem:'日本大化改新与近代明治维新都推动了日本社会的转型。就大化改新而言，其学习借鉴的主要对象是（ ）', opts:['隋唐时期的中国制度', '欧洲的资产阶级制度', '美国的三权分立体制', '阿拉伯帝国的伊斯兰文化'], ans:0, explain:'646年大化改新是仿效中国隋唐时期的政治经济制度进行的，如建立中央集权体制、实行班田收授法与租庸调制，使日本从奴隶社会过渡到封建社会。', src:'教材知识点·能力提升'},
{id:'h-12', lesson:11, diff:3, stem:'中国的造纸术、指南针、火药等经阿拉伯人传入欧洲，印度的棉花、食糖也经阿拉伯人西传。据此可知，阿拉伯人的历史贡献主要在于（ ）', opts:['独立创造发展了世界文明', '在东西方文化交流中发挥了桥梁作用', '最早发明了四大发明', '垄断了世界贸易'], ans:1, explain:'阿拉伯人通过翻译运动保存古典文化，并把东方科技成果、物产传入西方，又把西方文明传向东方，是东西方文化交流的桥梁和使者。', src:'教材知识点·能力提升'},
{id:'h-13', lesson:12, diff:3, stem:'美洲的玛雅、阿兹特克、印加文明独立发展，创造了辉煌成就，但后来大多中断。导致其发展进程被打断的主要原因是（ ）', opts:['频繁自然灾害的毁灭性打击', '各部落之间激烈的宗教纷争', '落后的农业生产方式的制约', '欧洲殖民者的入侵与破坏'], ans:3, explain:'16世纪起，西班牙等欧洲殖民者入侵美洲，通过征服、屠杀和掠夺打断了玛雅、阿兹特克、印加等美洲文明独立发展的进程，造成其衰落与中断。', src:'教材知识点·能力提升'},
{id:'h-14', lesson:13, diff:4, stem:'文艺复兴运动借助复兴古希腊罗马文化来宣传新思想。有学者认为，文艺复兴"并不是对古典文化的简单复兴，而是借复古之名，行创新之实"。其"创新"的实质是（ ）', opts:['宣扬资产阶级的人文主义新思想', '恢复古希腊罗马的奴隶制民主', '复兴基督教的神权统治', '传播东方文化'], ans:0, explain:'文艺复兴表面复兴古希腊罗马文化，实质是新兴资产阶级借助古典文化的外衣，宣传以人为中心的人文主义新思想，为资本主义发展提供思想武器，是一场资产阶级思想解放运动。', src:'教材知识点·能力提升'},
{id:'h-15', lesson:14, diff:4, stem:'新航路的开辟使世界开始连为一个整体。下列对新航路开辟影响的表述，最全面的是（ ）', opts:['新航路开辟只促进了欧洲资本主义发展，对世界影响很小', '新航路开辟只给亚非拉地区带来灾难，毫无积极作用', '新航路开辟的全部意义仅在于证明了地圆学说', '既促进世界联系与世界市场雏形形成，也开启殖民掠夺带来灾难'], ans:3, explain:'新航路开辟的影响具有双重性：积极方面，世界开始连为一个整体，促进了物种交流、贸易发展和世界市场雏形形成；消极方面，西欧国家随之走上殖民掠夺道路，给亚非拉人民带来深重灾难。', src:'教材知识点·能力提升'},
{id:'h-16', lesson:15, diff:4, stem:'欧洲—非洲—美洲之间的"三角贸易"持续了数百年。下列对三角贸易影响的表述，不正确的是（ ）', opts:['给非洲带来深重灾难，造成非洲人口锐减', '为欧洲资本主义发展积累了原始资本', '使非洲迅速实现了工业化', '促进了美洲开发，但伴随黑奴的悲惨遭遇'], ans:2, explain:'三角贸易中，非洲损失了大量青壮年劳动力，人口锐减，社会经济遭到严重破坏；欧洲则获取了巨额利润，积累了大量原始资本；美洲开发也建立在黑人奴隶的血泪之上。说"非洲迅速实现工业化"与史实不符。', src:'教材知识点·能力提升'},
{id:'h-17', lesson:16, diff:4, stem:'1215年《大宪章》确立"王权有限"原则，1689年《权利法案》限制王权、确立议会主权。两者相比，《权利法案》的本质不同在于（ ）', opts:['《权利法案》不过是一部普通的成文法律文件而已，并无特殊之处罢了', '它确立议会至上的君主立宪制，使国家权力重心从国王转移到议会', '《权利法案》在欧洲首次提出自由平等的原则主张体系', '《权利法案》直接废除了英国的国王和君主制度体制'], ans:1, explain:'《大宪章》是封建贵族与国王斗争的产物，仍属封建法律；《权利法案》则以法律形式确立了议会主权，限制王权，是资产阶级革命成果，使英国开始确立君主立宪制，两者性质根本不同。', src:'教材知识点·能力提升'},
{id:'h-18', lesson:17, diff:4, stem:'《独立宣言》宣称"人人生而平等"，但1787年美国宪法却保留了奴隶制，还规定黑人和印第安人按比例折算计入人口。这反映了（ ）', opts:['美国宪法完全没有进步性可言之处', '美国建国初期理想的进步性与现实局限性的并存', '《独立宣言》宣称的内容全部都是谎言与虚构的杜撰', '奴隶制在美国从未受到质疑批判挑战'], ans:1, explain:'《独立宣言》宣扬天赋人权、人人生而平等，具有历史进步性；但制宪会议在奴隶制等现实利益问题上妥协，保留了奴隶制，说明美国建国初期自由平等的理想与制度现实之间存在明显矛盾，需辩证看待。', src:'教材知识点·能力提升'},
{id:'h-19', lesson:18, diff:4, stem:'拿破仑战争多次打败反法联盟，又不断对外扩张。对拿破仑战争最恰当的评价是（ ）', opts:['既捍卫大革命成果、传播自由平等思想，又奴役掠夺被占领国家', '拿破仑战争是维护法国利益的完全正义的战争行为，应当全面肯定', '拿破仑战争是完全非正义的侵略扩张战争活动行为', '拿破仑战争与法国大革命之间没有任何关系可言之处'], ans:0, explain:'拿破仑战争具有双重性：对内巩固并传播了大革命成果（如《拿破仑法典》），多次粉碎反法联盟的干涉；对外又征服、奴役欧洲各国人民，激起当地反抗，因此应一分为二地评价。', src:'教材知识点·能力提升'},
{id:'h-20', lesson:19, diff:4, stem:'工业革命创造了巨大生产力，也使工人生活日益贫困，环境遭到破坏。这说明（ ）', opts:['工业革命带来的弊端远大于利益，应该从根本上加以彻底的否定批判', '工业革命既推动社会进步，也带来贫富分化、环境污染等社会问题', '工业革命利大于弊，负面问题完全可以忽略不计不管', '应完全否定工业革命，回到手工工场的时代里去生活'], ans:1, explain:'工业革命极大地提高了生产力，推动城市化与社会进步，是历史进步的主流；同时带来贫富分化加剧、工人阶级境况恶化、环境污染等社会问题，说明技术进步是一把"双刃剑"，应辩证评价。', src:'教材知识点·能力提升'},
{id:'h-21', lesson:21, diff:4, stem:'巴黎公社是无产阶级建立政权的第一次伟大尝试，但它存在仅两个多月便失败了。公社的失败说明（ ）', opts:['无产阶级在当时完全没有必要发动任何革命斗争', '工人阶级在任何条件下都不可能通过革命方式取得政权', '当时缺乏成熟无产阶级政党的领导与科学理论的充分指导', '巴黎公社的失败说明公社运动没有任何意义可言'], ans:2, explain:'巴黎公社失败的重要原因之一是缺乏成熟的无产阶级政党的领导，也未能充分运用马克思主义科学理论的指导，其教训反衬出科学理论对无产阶级革命的重要性；公社的实践也为后来革命提供了宝贵经验，丰富了马克思主义。', src:'教材知识点·能力提升'},
/* ==== 第1课 人类的起源与发展 ==== */
{id:'t1-1', lesson:1, diff:2, stem:'考古学家在非洲发现了距今约300万年的"露西"化石，其能够直立行走。据此推断"露西"属于（ ）', opts:['猿人阶段', '南方古猿', '现代人', '早期智人'], ans:1, explain:'"露西"是南方古猿化石，表明人类从古猿分化出来、能够直立行走。', src:'教材知识点'},
{id:'t1-2', lesson:1, diff:2, stem:'人类进化历程中，从猿到人的演化过程中起决定作用的是（ ）', opts:['气候变化', '自然灾害', '劳动', '基因突变'], ans:2, explain:'恩格斯指出"劳动创造了人本身"，劳动在从猿到人转变过程中起决定作用。', src:'2025年湖南长沙中考真题'},
{id:'t1-3', lesson:1, diff:2, stem:'世界上最早的人类出现在约（ ）', opts:['100万年前', '50万年前', '1万年前', '300万年前'], ans:3, explain:'约300万年前人类形成，其早期代表即非洲的南方古猿。', src:'教材知识点'},
{id:'t1-4', lesson:1, diff:2, stem:'原始社会实行生产资料公有、共同劳动、平均分配的根本原因是（ ）', opts:['社会生产力水平低下', '人们思想觉悟高', '氏族首领开明', '自然资源充足'], ans:0, explain:'生产力水平低下是原始社会公有、平均分配的根本原因。', src:'教材知识点'},
{id:'t1-5', lesson:1, diff:2, stem:'按照血缘关系结成的原始社会基本单位是（ ）', opts:['部落', '氏族', '部落联盟', '国家'], ans:1, explain:'氏族是原始社会按血缘关系组成的基本单位。', src:'教材知识点'},
{id:'t1-6', lesson:1, diff:2, stem:'原始社会末期，出现私有制和阶级，根本原因是（ ）', opts:['战争频繁', '宗教出现', '生产力的发展', '首领权力扩大'], ans:2, explain:'生产力发展导致产品剩余，进而出现私有制和阶级。', src:'2025年河南郑州模拟'},
{id:'t1-7', lesson:1, diff:2, stem:'人类进入奴隶社会的标志是（ ）', opts:['文字的发明', '城市的出现', '青铜器的使用', '国家的产生'], ans:3, explain:'私有制和阶级出现后，国家产生，人类进入奴隶社会。', src:'教材知识点'},
{id:'t1-8', lesson:1, diff:2, stem:'下列关于早期人类社会的说法，正确的是（ ）', opts:['原始社会人人平等、没有剥削压迫', '奴隶社会在生产组织方面全面落后于原始社会', '人类最早的祖先出现在欧洲大陆并逐步向世界各地迁徙', '私有制是在国家政权建立之后才逐渐出现的'], ans:0, explain:'原始社会生产力低下，实行公有制，人人平等；奴隶社会是社会进步（生产力发展）的结果。', src:'教材知识点'},
{id:'t1-9', lesson:1, diff:2, stem:'从"打制石器"到"磨制石器"，反映了原始社会（ ）', opts:['战争频繁', '生产力不断提高', '阶级分化', '国家产生'], ans:1, explain:'石器的改进是生产力发展的表现，磨制石器是新石器时代的标志。', src:'教材知识点'},
{id:'t1-10', lesson:1, diff:2, stem:'研究人类起源最可靠的证据是（ ）', opts:['神话传说', '古代文献', '化石和考古发现', '学者推测'], ans:2, explain:'化石是研究人类起源与演化的直接、可靠证据。', src:'2024年天津河北区一模'},
{id:'t1-11', lesson:1, diff:2, stem:'下列关于"劳动"与人类进化关系的认识，正确的是（ ）', opts:['劳动这一行为是在农业产生之后才真正开始的', '劳动只是人类进化过程中的一个偶然附带现象而已', '只有进入文明时代的现代人才掌握劳动的能力', '劳动在从猿到人的演变中起决定作用'], ans:3, explain:'劳动使古猿直立行走、制造工具、产生语言，是人与动物的本质区别。', src:'教材知识点'},
{id:'t1-12', lesson:1, diff:2, stem:'人类社会进入文明时代的重要标志是（ ）', opts:['文字的发明', '火的使用', '语言的产生', '弓箭的发明'], ans:0, explain:'文字、国家等出现标志着人类进入文明时代。', src:'教材知识点'},
{id:'t1-13', lesson:1, diff:2, stem:'原始农业出现后，人类的主要生产活动是（ ）', opts:['依靠狩猎和采集自然界现成的食物为生', '种植农作物和饲养家畜', '在江河湖泊中捕鱼并在山林中进行打猎', '逐水草而居的游牧迁徙生活方式'], ans:1, explain:'原始农业和畜牧业产生后，人类由采集狩猎转向农耕定居。', src:'教材知识点'},
{id:'t1-14', lesson:1, diff:2, stem:'考古学家在北京周口店发现的早期人类是（ ）', opts:['元谋人', '山顶洞人', '北京人', '蓝田人'], ans:2, explain:'北京人发现于北京周口店龙骨山，距今约70万—20万年。', src:'教材知识点'},
{id:'t1-15', lesson:1, diff:2, stem:'判断早期人类"北京人"已经会使用和保存天然火的主要依据是（ ）', opts:['文献记载', '口头传说', '雕刻作品', '遗址中的灰烬层'], ans:3, explain:'周口店遗址发现大量灰烬层和烧骨，证明北京人已会用火。', src:'2023年天津中考真题'},
{id:'t1-16', lesson:1, diff:2, stem:'中国境内已确认的最早古人类是约170万年前的（ ）', opts:['元谋人', '山顶洞人', '北京人', '蓝田人'], ans:0, explain:'云南元谋人距今约170万年，是中国境内已知最早的古人类之一。', src:'教材知识点'},
{id:'s1-1', lesson:1, diff:3, stem:'有学者认为：劳动创造了人本身，从猿到人的转变，实现了从适应自然到改造自然的飞跃。下列史实最能印证"劳动创造人"的是（ ）', opts:['露西化石能够直立行走', '北京人使用打制石器', '山顶洞人掌握磨光和钻孔技术', '人类发明了文字'], ans:1, explain:'直立行走、制造和使用工具（劳动）是人与动物的本质区别，北京人打制石器即劳动行为。', src:'2025年山东潍坊中考真题'},
{id:'s1-2', lesson:1, diff:3, stem:'私有制、阶级、国家三者产生的先后顺序是（ ）', opts:['国家—阶级—私有制', '阶级—私有制—国家', '私有制—阶级—国家', '私有制—国家—阶级'], ans:2, explain:'生产力发展→产品剩余→私有制出现→贫富分化形成阶级→阶级矛盾不可调和产生国家。', src:'教材知识点'},
{id:'s1-3', lesson:1, diff:3, stem:'某原始部落遗址出土了大量磨制石器、陶器和炭化的稻谷，据此判断该部落已进入（ ）', opts:['旧石器时代', '青铜时代', '铁器时代', '新石器时代'], ans:3, explain:'磨制石器＋陶器＋稻谷，说明已进入新石器时代（原始农业产生）。', src:'教材知识点'},
{id:'s1-4', lesson:1, diff:3, stem:'"告别蒙昧、迈进文明"是人类历史的重要转折，其根本动力是（ ）', opts:['社会生产力的发展', '科学技术的进步', '思想文化的繁荣', '军事征服的扩大'], ans:0, explain:'生产力发展推动私有制、阶级和国家产生，是迈进文明的根本动力。', src:'2024年天津河东区期末'},
{id:'b1-1', lesson:1, diff:5, stem:'恩格斯说："第一次使人摆脱了动物界，第一次使人成为真正意义上的人，劳动是整个人类生活的第一个基本条件。"这里"第一次使人成为真正意义上的人"指的是（ ）', opts:['直立行走', '制造和使用工具', '语言的产生', '火的发现'], ans:1, explain:'制造和使用工具是人与动物的本质区别，标志着真正意义上"人"的形成。', src:'教材知识点·能力提升'},
{id:'e1-1', lesson:1, diff:6, stem:'关于人类起源问题，达尔文提出了"从猿到人"的进化论，恩格斯提出"劳动创造人"。两者关系认识正确的是（ ）', opts:['两种理论分属生物学与哲学范畴，各自独立成立，相互之间并无关联', '劳动论以进化论为生物学前提，但更强调人的主观能动性的发挥', '进化论讲生物演变，劳动论讲从猿到人的社会动力，二者互为补充', '进化论与劳动论相互否定、截然对立，研究时只能选取其中一种理论作为依据'], ans:2, explain:'达尔文进化论回答"人从哪里来"的生物问题，恩格斯的劳动论回答"怎样变成人"的社会动力问题，二者角度不同、互为补充。', src:'教材知识点·能力提升'},
/* ==== 第2课 古代两河流域 ==== */
{id:'t2-1', lesson:2, diff:2, stem:'两河流域文明最早由什么民族创造（ ）', opts:['阿卡德人', '腓尼基人', '希伯来人', '苏美尔人'], ans:3, explain:'苏美尔人是两河流域文明的创始者，创造了楔形文字和城邦。', src:'教材知识点'},
{id:'t2-2', lesson:2, diff:2, stem:'两河流域中下游的古代文明中心位于今天的（ ）', opts:['伊拉克', '埃及', '印度', '伊朗'], ans:0, explain:'两河流域即幼发拉底河与底格里斯河流域，主要在今伊拉克境内。', src:'教材知识点'},
{id:'t2-3', lesson:2, diff:2, stem:'苏美尔人发明的文字是（ ）', opts:['象形文字', '楔形文字', '甲骨文', '腓尼基字母'], ans:1, explain:'苏美尔人用削尖的芦苇秆在泥板上压出笔画像楔子，故名楔形文字。', src:'2025年天津部分区一模'},
{id:'t2-4', lesson:2, diff:2, stem:'两河流域苏美尔人根据月亮盈亏变化制定的历法是（ ）', opts:['太阳历', '农历', '阴历', '儒略历'], ans:2, explain:'苏美尔人制定阴历（一年354天），古埃及人创太阳历。', src:'教材知识点'},
{id:'t2-5', lesson:2, diff:2, stem:'古巴比伦王国建立于公元前18世纪强盛，其建立者是（ ）', opts:['萨尔贡', '居鲁士', '尼布甲尼撒', '汉谟拉比'], ans:3, explain:'公元前18世纪，汉谟拉比统一两河流域，建立中央集权的古巴比伦王国。', src:'教材知识点'},
{id:'t2-6', lesson:2, diff:2, stem:'《汉谟拉比法典》刻在（ ）', opts:['石柱上', '青铜鼎上', '竹简上', '泥板上'], ans:0, explain:'法典刻在黑色石柱上，石柱现藏于巴黎卢浮宫。', src:'2022年天津中考真题'},
{id:'t2-7', lesson:2, diff:2, stem:'《汉谟拉比法典》正文有约（ ）', opts:['120条', '282条', '200条', '300条'], ans:1, explain:'法典正文约282条，内容广泛，涉及诉讼、债务、婚姻、租赁等。', src:'教材知识点'},
{id:'t2-8', lesson:2, diff:2, stem:'《汉谟拉比法典》的实质是（ ）', opts:['法典的规定体现法律面前人人平等的原则', '法典的各项条文着重保护自由平民的利益', '维护奴隶主阶级的利益', '法典的颁布旨在削弱国王的专制权力'], ans:2, explain:'法典公开维护奴隶主阶级的利益，是奴隶制国家统治工具。', src:'2024年天津中考真题'},
{id:'t2-9', lesson:2, diff:2, stem:'苏美尔人在数学方面的突出成就是（ ）', opts:['发明0', '发明小数', '提出勾股定理', '采用60进制'], ans:3, explain:'苏美尔人采用60进制计数和计时，一直沿用至今。', src:'教材知识点'},
{id:'t2-10', lesson:2, diff:2, stem:'《汉谟拉比法典》中关于"以眼还眼、以牙还牙"的惩罚原则适用于（ ）', opts:['同等级的自由民之间', '外邦人之间', '奴隶之间', '所有阶层之间'], ans:0, explain:'法典同态复仇原则限于拥有公民权的同等自由民之间，不同等级处罚不同。', src:'教材知识点'},
{id:'t2-11', lesson:2, diff:2, stem:'汉谟拉比自称"众神之王"，神化自己，其根本目的是（ ）', opts:['借神化自身来推动宗教文化事业的发展', '加强中央集权统治', '通过神化自我形象来促进文化艺术的繁荣', '借助神的权威来推动商业贸易的发展繁荣'], ans:1, explain:'汉谟拉比借神权神化王权，目的是加强中央集权、巩固统治。', src:'教材知识点'},
{id:'t2-12', lesson:2, diff:2, stem:'两河流域的早期奴隶制小国出现于约（ ）', opts:['公元前2500年', '公元前1500年', '公元前3500年', '公元前500年'], ans:2, explain:'约公元前3500年，两河流域南部出现小国。', src:'教材知识点'},
{id:'t2-13', lesson:2, diff:2, stem:'两河流域文明产生和发展的有利条件是（ ）', opts:['气候寒冷干燥少雨', '森林茂密雨水充沛', '陆路交通十分发达', '地形平坦、水源充足、土壤肥沃'], ans:3, explain:'两河流域气候干旱但地势平坦、水源充足、土壤肥沃，适合农业发展，孕育文明。', src:'教材知识点'},
{id:'t2-14', lesson:2, diff:2, stem:'世界上第一部较为完整的成文法典出现于（ ）', opts:['古代两河流域', '古代埃及', '古代印度', '古代中国'], ans:0, explain:'《汉谟拉比法典》出自古代两河流域的古巴比伦王国。', src:'教材知识点'},
{id:'t2-15', lesson:2, diff:2, stem:'楔形文字书写的主要载体是（ ）', opts:['莎草纸', '泥板', '羊皮纸', '竹简'], ans:1, explain:'苏美尔人在泥板上刻写楔形文字，晒干后保存。', src:'教材知识点'},
{id:'t2-16', lesson:2, diff:2, stem:'古巴比伦王国的社会结构分为（ ）', opts:['自由民、奴隶和外邦人构成三个相互区别的社会等级', '婆罗门、刹帝利和吠舍构成三个不同的社会等级', '拥有公民权的自由民、无公民权的自由民和奴隶', '国王、官僚和祭司分别构成三个封闭的社会等级'], ans:2, explain:'古巴比伦社会分为拥有公民权的自由民、无公民权的自由民和奴隶三个严格社会等级。', src:'教材知识点'},
{id:'t2-17', lesson:2, diff:2, stem:'古巴比伦王国灭亡于（ ）', opts:['公元前1200年', '公元前800年', '公元前500年', '公元前1595年'], ans:3, explain:'公元前1595年，古巴比伦王国被外族灭亡。', src:'教材知识点'},
{id:'s2-1', lesson:2, diff:3, stem:'《汉谟拉比法典》序言写道："安努与恩利尔为人类福祉计……命我像太阳一样普照大地。"其宣扬的核心观念是（ ）', opts:['君权神授', '法律面前人人平等', '民主自由', '天人合一'], ans:0, explain:'法典序言借神名义赋予王权合法性，宣扬"君权神授"。', src:'2025年山东济南中考真题'},
{id:'s2-2', lesson:2, diff:3, stem:'古巴比伦法典中契约形式繁多，涉及租佃、债务、雇佣、合伙经营等。这反映了（ ）', opts:['古巴比伦法律制度完备', '古巴比伦商品经济较为活跃', '罗马法影响深远', '中央集权高度强化'], ans:1, explain:'众多经济契约条文说明古巴比伦商品（买卖、借贷）经济活跃。', src:'教材知识点'},
{id:'s2-3', lesson:2, diff:3, stem:'楔形文字、阴历、60进制等文明成果共同属于（ ）', opts:['古埃及文明', '古印度文明', '两河流域文明', '中华文明'], ans:2, explain:'三者都是苏美尔人（两河流域）的文明创造。', src:'教材知识点'},
{id:'s2-4', lesson:2, diff:3, stem:'历史学家认为《汉谟拉比法典》是"研究古巴比伦社会状况的珍贵史料"，主要依据是（ ）', opts:['法典的文字雕刻精美，具有很高的艺术价值', '法典产生年代久远，保存状况十分完好', '法典在历史上影响深远，被后世各国长期沿用', '法典内容广泛涉及社会各方面'], ans:3, explain:'法典282条涉及诉讼、财产、债务、婚姻、劳动等，是研究古巴比伦社会的第一手史料。', src:'教材知识点'},
{id:'b2-1', lesson:2, diff:5, stem:'有学者指出：《汉谟拉比法典》"使法律第一次成为人民的语言，从而在人类历史上谱写了法律文明的篇章"。对法典历史地位的正确评价是（ ）', opts:['它是迄今已知世界上第一部较为完整的成文法典', '它首次实现了法律面前人人平等，废除了等级差别', '它是世界上第一部法典，此后所有法律都以其为蓝本', '它是近代西方法律体系的直接源头，确立了分权原则'], ans:0, explain:'法典是迄今已知世界上第一部较为完整的成文法典，但非"世界上第一部法典"，也未实现平等，与近代立法无关。', src:'教材知识点·能力提升'},
{id:'e2-1', lesson:2, diff:6, stem:'比较《汉谟拉比法典》与后世《十二铜表法》，二者的共同之处是（ ）', opts:['都体现了人人平等原则', '都是成文法，都维护奴隶主阶级利益', '都废除了债务奴隶制度', '都废除债务奴隶制'], ans:1, explain:'两者都是早期成文法，都公开维护奴隶主/贵族的阶级利益；法典体现等级不平等而非人人平等。', src:'教材知识点·能力提升'},
/* ==== 第3课 古代埃及 ==== */
{id:'t3-1', lesson:3, diff:2, stem:'古埃及文明发源于（ ）', opts:['两河流域', '印度河流域', '尼罗河流域', '黄河长江流域'], ans:2, explain:'古埃及文明诞生于尼罗河流域，希罗多德称"埃及是尼罗河的赠礼"。', src:'教材知识点'},
{id:'t3-2', lesson:3, diff:2, stem:'古埃及的象形文字因形似什么而得名（ ）', opts:['方块', '楔子', '拼音字母', '图画'], ans:3, explain:'象形文字即"图画文字"，源于祭祀和日常生活记事。', src:'教材知识点'},
{id:'t3-3', lesson:3, diff:2, stem:'古埃及文明约出现于（ ）', opts:['公元前3100年', '公元前3500年', '公元前1500年', '公元前5000年'], ans:0, explain:'约公元前3100年，古埃及初步实现统一，建立奴隶制国家。', src:'教材知识点'},

{id:'t3-7', lesson:3, diff:2, stem:'古埃及的"木乃伊"与下列哪一领域直接相关（ ）', opts:['医学', '数学', '历法', '天文学'], ans:0, explain:'木乃伊制作推动了古埃及医学（解剖学、防腐技术）的发展。', src:'教材知识点'},
{id:'t3-8', lesson:3, diff:2, stem:'古埃及人建造了数量众多、规模宏大的金字塔，这反映出古埃及（ ）', opts:['古埃及建立了一套完备系统的成文法律体系', '国王权力至上、组织能力强大', '古埃及的对外商业贸易往来十分繁荣活跃', '古埃及的民主政治制度发展得相当完善'], ans:1, explain:'金字塔工程浩大，需要强有力中央集权组织动员，反映国王权力至上。', src:'教材知识点'},
{id:'t3-9', lesson:3, diff:2, stem:'古埃及国王被称为（ ）', opts:['哈里发', '沙皇', '法老', '天皇'], ans:2, explain:'古埃及国王称"法老"，集军、政、财、神大权于一身。', src:'教材知识点'},
{id:'t3-10', lesson:3, diff:2, stem:'尼罗河定期泛滥对古埃及文明的影响是（ ）', opts:['常常引发频繁的战争', '阻碍了统一', '阻碍了国家的统一进程', '带来肥沃土壤，利于农业发展'], ans:3, explain:'尼罗河泛滥带来肥沃淤泥，灌溉农业发达，孕育了古埃及文明。', src:'教材知识点'},

{id:'t3-12', lesson:3, diff:2, stem:'法老权力被神化，主要表现是（ ）', opts:['法老亲自下田劳动', '法老自称太阳神之子', '法老不干预政务', '法老由民众选举'], ans:1, explain:'法老自称"太阳神之子"，借神权神化王权，实行君主专制。', src:'教材知识点'},

{id:'t3-14', lesson:3, diff:2, stem:'狮身人面像位于（ ）', opts:['孟菲斯', '底比斯', '亚历山大', '吉萨'], ans:3, explain:'狮身人面像（斯芬克斯）矗立在吉萨，与胡夫金字塔为邻。', src:'教材知识点'},
{id:'t3-15', lesson:3, diff:2, stem:'古埃及使用的主要书写材料是（ ）', opts:['莎草纸', '泥板', '竹简', '羊皮纸'], ans:0, explain:'古埃及人用尼罗河三角洲的莎草制成"纸草"，是重要的书写材料。', src:'教材知识点'},

{id:'t3-17', lesson:3, diff:2, stem:'下列文明成果属于古埃及的是（ ）', opts:['种姓制度', '楔形文字', '金字塔', '阿拉伯数字'], ans:2, explain:'金字塔、象形文字、太阳历属古埃及；楔形文字属两河流域。', src:'教材知识点'},

{id:'s3-2', lesson:3, diff:3, stem:'尼罗河的定期泛滥使古埃及人"精确记录和计算"，从而发展了（ ）', opts:['几何学和天文学', '用于记录计算的象形文字体系', '治疗疾病的医学知识体系', '祭祀与庆典使用的音乐艺术'], ans:0, explain:'为丈量土地、预测泛滥，古埃及人发展了几何学与天文学（太阳历）。', src:'教材知识点'},
{id:'s3-3', lesson:3, diff:3, stem:'希罗多德说"埃及是尼罗河的赠礼"，其含义是（ ）', opts:['尼罗河流域的水产与物产十分丰富多样', '尼罗河为埃及提供了生存发展基础', '埃及是由尼罗河沿岸的居民建立起来的', '尼罗河是埃及境内唯一一条重要的河流'], ans:1, explain:'尼罗河灌溉农业为文明奠定物质基础，"赠礼"指文明源于河流恩赐。', src:'教材知识点'},
{id:'s3-4', lesson:3, diff:3, stem:'要研究古埃及历史，下列史料价值最高的是（ ）', opts:['《荷马史诗》', '后世游记', '金字塔等实物遗迹', '民间传说'], ans:2, explain:'金字塔、象形文字石碑等实物是第一手史料，价值最高。', src:'教材知识点'},
{id:'b3-1', lesson:3, diff:5, stem:'关于金字塔，有"古代世界奇迹"与"法老奴役人民的见证"两种评价。正确的历史认识是（ ）', opts:['只应肯定其文化价值，不应涉及压迫等负面内容', '只应看到金字塔的压迫实质，其文化价值则不值一提', '两种评价都失之片面，金字塔没有任何研究价值', '应全面辩证地看待，既肯定其文化价值又看到其压迫实质'], ans:3, explain:'金字塔既是人民智慧的结晶，又是残酷奴役的见证，需一分为二评价。', src:'教材知识点·能力提升'},
{id:'e3-1', lesson:3, diff:6, stem:'古埃及的象形文字、两河流域的楔形文字、中国的甲骨文、印度的印章文字，其共同本质是（ ）', opts:['人类早期文明多元发展的产物', '同一文字体系的不同分支', '都直接演变为字母文字', '都产生于同一时期'], ans:0, explain:'各文明独立创造文字，体现早期文明多元性、多样性。', src:'教材知识点·能力提升'},

{id:'t4-12', lesson:4, diff:2, stem:'古代印度文明在文学方面的代表是（ ）', opts:['《摩诃婆罗多》', '《罗摩衍那》', '《吉尔伽美什史诗》', '《荷马史诗》'], ans:0, explain:'《摩诃婆罗多》《罗摩衍那》是古代印度著名的史诗。', src:'教材知识点'},

{id:'e4-1', lesson:4, diff:6, stem:'有学者认为佛教"产生于种姓制度最严苛的北印度，却传播到整个亚洲"，其传播的根本原因是（ ）', opts:['商人沿商路广泛传播佛教文化', '统治者用行政命令强制推行', '教义符合广大下层民众摆脱压迫的愿望', '寺院经济发达'], ans:2, explain:'佛教教义（众生平等、忍耐顺从）契合苦难民众的精神需要，是广泛传播的根本原因。', src:'教材知识点·能力提升'},

{id:'t5-11', lesson:5, diff:2, stem:'亚历山大东征开始于（ ）', opts:['公元前300年', '公元前334年', '公元前250年', '公元前200年'], ans:1, explain:'公元前334年，亚历山大率军东征，历时10年。', src:'教材知识点'},
