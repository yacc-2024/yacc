name: 打包安卓 App

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 准备 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 检查安卓环境（runner 自带 SDK）
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" | head

      - name: 安装依赖
        run: |
          set +e
          OUT=$(pnpm install --no-frozen-lockfile --reporter=append-only 2>&1)
          CODE=$?
          echo "$OUT" | tail -40
          if [ $CODE -ne 0 ]; then
            if echo "$OUT" | grep -q "ERR_PNPM_IGNORED_BUILDS"; then
              echo "只有构建脚本告警，依赖已装好，继续"
              exit 0
            fi
            MSG=$(echo "$OUT" | tail -12 | tr '\n' '|')
            echo "::error title=pnpm-install-failed::$MSG"
            exit 1
          fi

      - name: 构建网页（接口指向线上）
        run: pnpm build:app

      - name: 生成安卓工程
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: 换掉安卓桌面图标
        run: |
          # 旧系统用的图标（各密度位图）
          for f in resources/android-icon/ic_launcher-*.png; do
            name=$(basename "$f" .png)
            density=${name#ic_launcher-}
            cp "$f" "android/app/src/main/res/mipmap-$density/ic_launcher.png"
            cp "$f" "android/app/src/main/res/mipmap-$density/ic_launcher_round.png"
          done
          # 安卓 8+ 用矢量前景，任何分辨率都不糊
          mkdir -p android/app/src/main/res/drawable
          cp resources/android-icon/ic_yacc_foreground.xml \
             android/app/src/main/res/drawable/ic_yacc_foreground.xml
          # 模板自带的 v24 前景会盖掉默认 drawable，这里一并替换掉
          mkdir -p android/app/src/main/res/drawable-v24
          cp resources/android-icon/ic_yacc_foreground.xml \
             android/app/src/main/res/drawable-v24/ic_launcher_foreground.xml
          cp resources/android-icon/ic_yacc_foreground.xml \
             android/app/src/main/res/drawable-v24/ic_yacc_foreground.xml
          cp resources/android-icon/ic_launcher_adaptive.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          cp resources/android-icon/ic_launcher_adaptive.xml \
             android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
          echo "桌面图标已替换（自适应用矢量）"

      - name: 换掉原生启动图
        run: |
          for f in resources/android-splash/*.png; do
            name=$(basename "$f" .png)
            if [ "$name" = "drawable" ]; then
              cp "$f" android/app/src/main/res/drawable/splash.png
            else
              cp "$f" "android/app/src/main/res/$name/splash.png"
            fi
          done
          echo "启动图已替换"

      - name: 支持侧滑/返回键返回上一页
        run: |
          FILE=$(find android/app/src/main/java -name MainActivity.java | head -1)
          echo "改写 $FILE"
          cat > "$FILE" <<'JAVA'
          package com.yacc.crew;

          import android.os.Bundle;
          import android.webkit.WebView;
          import androidx.activity.OnBackPressedCallback;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);

              getOnBackPressedDispatcher().addCallback(this, new OnBackPressedCallback(true) {
                @Override
                public void handleOnBackPressed() {
                  WebView webView = getBridge() != null ? getBridge().getWebView() : null;
                  if (webView != null && webView.canGoBack()) {
                    webView.goBack();
                  } else {
                    setEnabled(false);
                    getOnBackPressedDispatcher().onBackPressed();
                  }
                }
              });
            }

            @SuppressWarnings("deprecation")
            @Override
            public void onBackPressed() {
              WebView webView = getBridge() != null ? getBridge().getWebView() : null;
              if (webView != null && webView.canGoBack()) {
                webView.goBack();
              } else {
                super.onBackPressed();
              }
            }
          }
          JAVA

      - name: 打 debug 包
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: yacc-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 重命名安装包
        run: cp android/app/build/outputs/apk/debug/app-debug.apk yacc-android.apk

      # 同时放到网站里，从 yacc2026.pages.dev 也能下载（国内更快）
      - name: 发布到网站
        run: |
          mkdir -p public/apk
          cp yacc-android.apk public/apk/yacc-android.apk
          git config user.name "yacc bot"
          git config user.email "bot@yacc.local"
          git add public/apk/yacc-android.apk
          git commit -m "发布安卓安装包（自动）" || echo "没有变化"
          git pull --rebase origin main || true
          git push origin HEAD:main

      # 挂到 Release 上，给一个可以直接点开的下载直链
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 安卓安装包（最新）
          body: |
            直接下载：yacc-android.apk
            安装前需要在手机上允许「安装未知来源应用」。
          files: yacc-android.apk
          make_latest: true
