name: 打包安卓 App

on:
  workflow_dispatch:
  push:
    tags:
      - 'app-v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 准备 pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.28.5 --activate
          pnpm -v

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 检查安卓环境（runner 自带 SDK）
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}" | head

      - name: 安装依赖
        run: |
          set +e
          OUT=$(pnpm install --no-frozen-lockfile --reporter=append-only 2>&1)
          CODE=$?
          echo "$OUT" | tail -40
          if [ $CODE -ne 0 ]; then
            if echo "$OUT" | grep -q "ERR_PNPM_IGNORED_BUILDS"; then
              echo "只有构建脚本告警，依赖已装好，继续"
              exit 0
            fi
            MSG=$(echo "$OUT" | tail -12 | tr '\n' '|')
            echo "::error title=pnpm-install-failed::$MSG"
            exit 1
          fi

      - name: 构建网页（接口指向线上）
        run: pnpm build:app

      - name: 生成安卓工程
        run: |
          if [ ! -d android ]; then npx cap add android; fi
          npx cap sync android

      - name: 打 debug 包
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传安装包
        uses: actions/upload-artifact@v4
        with:
          name: yacc-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: 重命名安装包
        run: cp android/app/build/outputs/apk/debug/app-debug.apk yacc-android.apk

      # 挂到 Release 上，给一个可以直接点开的下载直链
      - name: 发布到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: 安卓安装包（最新）
          body: |
            直接下载：yacc-android.apk
            安装前需要在手机上允许「安装未知来源应用」。
          files: yacc-android.apk
          make_latest: true
