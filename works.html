<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>YACC 作品库</title>
<meta name="description" content="YACC 作品库，反校园霸凌短片全部作品收录。">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Noto+Serif+SC:wght@600;900&family=Caveat:wght@600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #141519;
    --bg-grad: linear-gradient(160deg, #141519 0%, #12141D 45%, #17161A 100%);
    --surface: #1D1F26;
    --ink: #F1EFEA;
    --ink-2: #C2BEB6;
    --muted: #8E8A82;
    --line: rgba(255,255,255,.09);
    --shadow-sm: 0 2px 8px rgba(20,20,20,.08), 0 4px 12px rgba(20,20,20,.04);
    --shadow-md: 0 3px 10px rgba(20,20,20,.10), 0 8px 24px rgba(20,20,20,.05);
    --shadow-lg: 0 4px 12px rgba(20,20,20,.10), 0 16px 40px rgba(20,20,20,.06);
    --r-lg: 44px; --r-md: 26px; --r-sm: 18px;
    --ease-snap: cubic-bezier(.16,1,.3,1);
    --ease-smooth: cubic-bezier(.2,.8,.4,1);
    --sans: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    --serif: "Noto Serif SC", "Songti SC", "SimSun", serif;
    --hand: "Caveat", "Segoe Script", "Bradley Hand", cursive;
    --maxw: 960px;
    --card-glass: linear-gradient(150deg, rgba(255,255,255,.20), rgba(255,255,255,.10));
    --glass-bg: linear-gradient(158deg, rgba(255,255,255,.11), rgba(255,255,255,.03) 40%, rgba(255,255,255,.06) 62%, rgba(255,255,255,.02)), linear-gradient(160deg, rgba(35,37,45,.88), rgba(26,28,34,.92));
    --backdrop: rgba(8,9,12,.6);
    --card-border: rgba(255,255,255,.26);
    --chip-bg: rgba(255,255,255,.08);
    --chip-bg-hi: rgba(255,255,255,.16);
    --hover-glow: rgba(255,255,255,.55);
    --accent-ui: #6E8BE8;
    --nav-bg: rgba(20,21,25,.55);
  }
  [data-theme="light"] {
    color-scheme: light;
    --bg: #F3F2EE;
    --bg-grad: linear-gradient(160deg, #F3F2EE 0%, #EDEFF5 45%, #F6F1E9 100%);
    --surface: #FFFFFF;
    --ink: #1E1D1A;
    --ink-2: #4B4942;
    --muted: #78746C;
    --line: rgba(25,25,22,.12);
    --shadow-sm: 0 2px 8px rgba(25,25,22,.06), 0 4px 12px rgba(25,25,22,.04);
    --shadow-md: 0 3px 10px rgba(25,25,22,.08), 0 8px 24px rgba(25,25,22,.05);
    --shadow-lg: 0 4px 12px rgba(25,25,22,.08), 0 16px 40px rgba(25,25,22,.05);
    --card-glass: linear-gradient(150deg, rgba(255,255,255,.94), rgba(255,255,255,.68));
    --glass-bg: linear-gradient(150deg, rgba(255,255,255,.96), rgba(255,255,255,.74));
    --backdrop: rgba(25,25,22,.32);
    --card-border: rgba(25,25,22,.14);
    --chip-bg: rgba(25,25,22,.05);
    --chip-bg-hi: rgba(25,25,22,.11);
    --hover-glow: rgba(255,255,255,.9);
    --accent-ui: #5E7BD6;
    --nav-bg: rgba(255,255,255,.72);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--sans);
    background: var(--bg-grad);
    background-attachment: fixed;
    color: var(--ink);
    line-height: 1.7;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }
  /* 三层背景 · 光斑层 */
  .bg-blobs { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
  .bg-blobs .blob { position: absolute; border-radius: 50%; will-change: transform; }
  .blob-a {
    width: 70vmax; height: 70vmax; left: -20vmax; top: -26vmax;
    background: radial-gradient(circle, rgba(64,110,220,.46) 0%, rgba(64,110,220,.16) 36%, transparent 62%);
  }
  .blob-b {
    width: 56vmax; height: 56vmax; right: -16vmax; top: 6vmax;
    background: radial-gradient(circle, rgba(118,86,224,.42) 0%, rgba(118,86,224,.14) 36%, transparent 62%);
  }
  .blob-c {
    width: 60vmax; height: 60vmax; left: 6vmax; bottom: -22vmax;
    background: radial-gradient(circle, rgba(64,110,220,.30) 0%, rgba(64,110,220,.10) 38%, transparent 62%);
  }
  [data-theme="light"] .blob-a {
    background: radial-gradient(circle, rgba(100,172,255,.5) 0%, rgba(100,172,255,.18) 40%, transparent 65%);
  }
  [data-theme="light"] .blob-b {
    background: radial-gradient(circle, rgba(0,179,81,.38) 0%, rgba(0,179,81,.14) 40%, transparent 65%);
  }
  [data-theme="light"] .blob-c {
    background: radial-gradient(circle, rgba(255,204,102,.4) 0%, rgba(255,204,102,.14) 42%, transparent 65%);
  }
  .glass-panel {
    position: relative;
    background: var(--glass-bg);
    backdrop-filter: saturate(150%) blur(8px);
    -webkit-backdrop-filter: saturate(150%) blur(8px);
    border: 2px solid var(--card-border);
    border-radius: var(--r-lg);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.16);
  }
  /* 顶部导航 */
  .nav {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    z-index: 100;
    display: flex; align-items: center; justify-content: space-between;
    width: min(var(--maxw), calc(100vw - 28px));
    padding: 10px 20px;
    border-radius: 999px;
    background: var(--nav-bg);
    backdrop-filter: saturate(150%) blur(8px);
    -webkit-backdrop-filter: saturate(150%) blur(8px);
    border: 1px solid var(--card-border);
    box-shadow: var(--shadow-md), inset 0 1px 0 rgba(255,255,255,.18);
  }
  .wordmark {
    font-family: var(--hand); font-size: 22px; font-weight: 700;
    color: var(--ink); text-decoration: none; letter-spacing: .02em;
    transition: transform .25s var(--ease-snap);
  }
  .wordmark:hover { transform: scale(1.05); }
  .nav .menu { display: flex; align-items: center; gap: 10px; }
  .nav a.nav-link {
    font-size: 13px; letter-spacing: .03em; color: var(--ink-2);
    text-decoration: none; padding: 8px 16px; border-radius: 999px;
    transition: background .25s var(--ease-snap), color .25s, transform .2s var(--ease-snap);
  }
  .nav a.nav-link:hover { background: var(--chip-bg-hi); color: var(--ink); transform: scale(1.05); }
  .nav-btn {
    width: 36px; height: 36px; border: 0; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    border-radius: 50%;
    background: var(--chip-bg);
    color: var(--ink-2);
    transition: background .25s, color .25s, transform .2s var(--ease-snap);
  }
  .nav-btn:hover { background: var(--chip-bg-hi); color: var(--ink); transform: scale(1.08); }
  .nav-btn:active { transform: scale(.88); }
  /* Hero */
  .hero {
    position: relative; z-index: 1;
    text-align: center;
    padding: 150px 20px 40px;
  }
  .hero .tag {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 11px; letter-spacing: .3em;
    color: var(--muted);
    margin-bottom: 18px;
  }
  .hero .tag .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent-ui);
    box-shadow: 0 0 12px var(--hover-glow);
    animation: dotPulse 2.6s ease-in-out infinite;
  }
  @keyframes dotPulse { 0%,100% { opacity: .5; } 50% { opacity: 1; } }
  .hero-title {
    display: inline-flex; align-items: center; gap: 16px;
    font-family: var(--sans); font-size: clamp(26px, 3.6vw, 38px);
    font-weight: 800; line-height: 1.1;
    letter-spacing: .18em;
    color: var(--ink);
    margin: 0;
  }
  .hero-title::before, .hero-title::after {
    content: ""; display: block;
    width: 30px; height: 1.5px;
    background: linear-gradient(90deg, transparent, var(--muted));
    border-radius: 2px;
  }
  .hero-title::after { background: linear-gradient(90deg, var(--muted), transparent); }
  .hero .sub {
    margin-top: 12px; font-size: 12.5px; letter-spacing: .34em;
    color: var(--muted); text-transform: uppercase;
  }
  /* 搜索区：固定顶部，下滑隐藏 */
  .search-sec {
    position: fixed; left: 50%; transform: translateX(-50%);
    top: 76px; z-index: 90;
    width: min(var(--maxw), calc(100vw - 32px));
    transition: transform .45s var(--ease-snap), opacity .35s ease;
  }
  .search-sec.hide { transform: translateX(-50%) translateY(-110%); opacity: 0; pointer-events: none; }
  .search-wrap { position: relative; }
  .settings-search {
    height: 52px;
    border-radius: 9999px;
    background: rgba(255,255,255,.5);
    border: 2px solid rgba(255,255,255,.3);
    box-shadow: var(--shadow-sm);
    display: flex;
    align-items: center;
    padding: 0 8px 0 20px;
    gap: 10px;
    transition: border-color .2s ease, box-shadow .3s ease;
  }
  [data-theme="dark"] .settings-search {
    background: rgba(30,32,40,.58);
    border-color: rgba(255,255,255,.18);
  }
  .settings-search:focus-within {
    border-color: rgba(162,206,255,.6);
    box-shadow: var(--shadow-md), 0 0 0 4px rgba(162,206,255,.14);
  }
  .search-icon { flex: none; color: var(--muted); }
  .settings-search-input {
    border: none; background: transparent; outline: none; flex: 1;
    font-family: inherit; font-size: 14.5px; color: var(--ink);
    height: 100%;
  }
  .settings-search-input::placeholder { color: var(--muted); }
  .search-clear {
    flex: none; width: 34px; height: 34px; border: 0; cursor: pointer;
    border-radius: 50%; background: transparent; color: var(--muted);
    display: none; align-items: center; justify-content: center;
    transition: background .2s, transform .2s var(--ease-snap);
  }
  .search-clear.show { display: inline-flex; }
  .search-clear:hover { background: var(--chip-bg-hi); transform: scale(1.08); }
  /* 搜索结果浮层 */
  .search-results {
    position: absolute; left: 0; right: 0; top: calc(100% + 8px);
    border-radius: 22px;
    background: var(--glass-bg);
    backdrop-filter: saturate(150%) blur(8px);
    -webkit-backdrop-filter: saturate(150%) blur(8px);
    border: 2px solid var(--card-border);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.16);
    padding: 6px;
    max-height: 320px;
    overflow-y: auto;
    display: none;
  }
  .search-results.show { display: block; animation: resIn .3s var(--ease-snap) both; }
  @keyframes resIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .search-result-item {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    width: 100%; padding: 11px 16px;
    border: none; background: transparent;
    font-family: inherit; font-size: 14px; color: var(--ink);
    border-radius: 16px; cursor: pointer;
    text-align: left;
    transition: background .15s ease, transform .15s var(--ease-snap);
  }
  .search-result-item:hover { background: var(--chip-bg-hi); transform: translateX(3px); }
  .search-result-item:active { transform: scale(.97); }
  .sr-name { font-weight: 600; }
  .sr-tag { font-size: 11.5px; letter-spacing: .06em; color: var(--muted); }
  .sr-tag.on { color: #34C759; }
  .search-results .sr-empty { padding: 18px 16px; font-size: 13px; color: var(--muted); text-align: center; }
  /* 选集：精简紧凑 */
  .library {
    position: relative; z-index: 1;
    width: min(var(--maxw), calc(100vw - 32px));
    margin: 30px auto 120px;
    display: flex; flex-direction: column; gap: 14px;
  }
  .season-row {
    position: relative;
    display: flex; align-items: center; gap: 16px;
    padding: 16px 20px;
    border-radius: var(--r-md);
    background: var(--glass-bg);
    backdrop-filter: saturate(150%) blur(8px);
    -webkit-backdrop-filter: saturate(150%) blur(8px);
    border: 2px solid var(--card-border);
    box-shadow: var(--shadow-sm), inset 0 1px 0 rgba(255,255,255,.14);
    animation: cardIn .5s var(--ease-snap) both;
    transition: box-shadow .3s ease;
  }
  @keyframes cardIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
  .season-name { font-family: var(--serif); font-size: 17px; font-weight: 900; white-space: nowrap; }
  .season-count { font-size: 11px; letter-spacing: .1em; color: var(--muted); white-space: nowrap; }
  .season-eps {
    display: flex; gap: 8px;
    overflow-x: auto;
    scroll-snap-type: x proximity;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    flex: 1;
    min-width: 0;
    padding: 2px 2px 8px;
  }
  .season-eps::-webkit-scrollbar { display: none; }
  .season-eps .ep-chip { flex-shrink: 0; scroll-snap-align: start; }
  .ep-chip {
    position: relative;
    min-width: 44px; height: 40px;
    padding: 0 14px;
    display: inline-flex; align-items: center; justify-content: center;
    border: 2px solid var(--card-border);
    border-radius: 999px;
    background: var(--chip-bg);
    color: var(--ink-2);
    font-family: inherit; font-size: 13px; font-weight: 600;
    cursor: pointer;
    transition: transform .25s var(--ease-snap), background .25s, border-color .25s, box-shadow .3s;
  }
  .ep-chip:hover { transform: scale(1.07); background: var(--chip-bg-hi); color: var(--ink); }
  .ep-chip:active { transform: scale(.88); }
  .ep-chip.soon { cursor: default; opacity: .5; }
  .ep-chip.soon:hover { transform: none; background: var(--chip-bg); color: var(--ink-2); }
  .ep-chip .play-dot {
    position: absolute; top: -2px; right: -2px;
    width: 8px; height: 8px; border-radius: 50%;
    border: 2px solid var(--surface);
    background: #34C759;
  }
  .ep-chip.match { border-color: var(--accent-ui); box-shadow: 0 0 0 4px color-mix(in srgb, var(--accent-ui) 20%, transparent); }
  .ep-chip.match.pulse { animation: matchPulse 1s ease 3; }
  @keyframes matchPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.12); } }
  /* 播放器弹层 */
  .modal {
    position: fixed; inset: 0; z-index: 200;
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
    opacity: 0; pointer-events: none;
    transition: opacity .3s ease;
  }
  .modal.open { opacity: 1; pointer-events: auto; }
  .modal[hidden] { display: none; }
  .modal-backdrop {
    position: absolute; inset: 0;
    background: var(--backdrop);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
  }
  .modal-card {
    position: relative; z-index: 1;
    width: min(900px, 100%);
    padding: 22px;
    border-radius: var(--r-lg);
    background: var(--glass-bg);
    backdrop-filter: saturate(150%) blur(8px);
    -webkit-backdrop-filter: saturate(150%) blur(8px);
    border: 2px solid var(--card-border);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.18);
    transform: scale(.9) translateY(20px);
    transition: transform .8s cubic-bezier(.34,1.56,.64,1);
  }
  .modal.open .modal-card { transform: scale(1) translateY(0); }
  .modal-close-hint {
    position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%);
    z-index: 2;
    font-size: 11.5px; letter-spacing: .1em; color: rgba(255,255,255,.7);
    background: rgba(0,0,0,.5); backdrop-filter: blur(6px);
    padding: 6px 14px; border-radius: 999px;
    pointer-events: none;
  }
  /* 播放器 */
  .player {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    border-radius: var(--r-md);
    overflow: hidden;
    background: #000;
    box-shadow: 0 30px 70px rgba(20,20,20,.16), 0 0 0 1px rgba(255,255,255,.4);
    transition: box-shadow .5s ease;
  }
  .player:hover { box-shadow: 0 36px 90px rgba(20,20,20,.2), 0 0 0 1.5px rgba(162,206,255,.45), 0 0 44px rgba(162,206,255,.22); }
  .player-buffering {
    position: absolute; inset: 0; z-index: 5;
    display: flex; align-items: center; justify-content: center;
    background: rgba(10,10,10,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
  }
  .buff-spinner {
    width: 44px; height: 44px; border-radius: 50%;
    border: 3px solid rgba(255,255,255,.22);
    border-top-color: #fff;
    animation: buffSpin .8s linear infinite;
  }
  @keyframes buffSpin { to { transform: rotate(360deg); } }
  .player.swapping { animation: swapIn .5s cubic-bezier(.22,.61,.36,1); }
  @keyframes swapIn { from { opacity: .4; transform: scale(.985); } to { opacity: 1; transform: scale(1); } }
  .player video { width: 100%; height: 100%; object-fit: contain; display: block; }
  .player-cover {
    position: absolute; inset: 0; z-index: 4;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(72% 72% at 50% 36%, rgba(255,255,255,.1), transparent 62%),
      linear-gradient(160deg, #181818 0%, #0B0B0B 62%, #131313 100%);
    overflow: hidden;
    cursor: pointer;
  }
  .player-cover::after {
    content: ""; position: absolute; top: 0; bottom: 0; left: -60%;
    width: 42%;
    background: linear-gradient(100deg, transparent, rgba(255,255,255,.07), transparent);
    transform: skewX(-18deg);
    animation: coverSweep 2.6s ease-in-out 1;
  }
  @keyframes coverSweep { 0% { left: -60%; } 60%, 100% { left: 135%; } }
  .cover-glow {
    position: absolute; top: 50%; left: 50%;
    width: 240px; height: 240px; margin: -120px 0 0 -120px;
    border-radius: 50%;
    background: radial-gradient(circle, rgba(255,255,255,.15), transparent 62%);
    animation: glowPulse 3.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes glowPulse { 0%,100% { transform: scale(1); opacity: .65; } 50% { transform: scale(1.22); opacity: 1; } }
  .cover-title { position: absolute; left: 22px; bottom: 18px; z-index: 2; text-align: left; color: #fff; pointer-events: none; }
  .cover-title .meta { font-size: 11px; letter-spacing: .22em; color: rgba(255,255,255,.55); }
  .cover-title h3 { font-family: var(--serif); font-size: 18px; font-weight: 900; margin-top: 6px; }
  .center-play {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
    width: 74px; height: 74px; border-radius: 50%;
    background: rgba(0,0,0,.45);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255,255,255,.5);
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: opacity .25s ease, transform .25s ease, background .2s;
    z-index: 5;
  }
  .center-play:hover { background: rgba(0,0,0,.6); transform: translate(-50%,-50%) scale(1.06); }
  .center-play.is-hidden { display: none; }
  .controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    padding: 14px 16px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.78));
  }
  .progress {
    position: relative; height: 18px;
    display: flex; align-items: center;
    cursor: pointer; touch-action: none;
  }
  .progress-track { position: relative; width: 100%; height: 5px; background: rgba(255,255,255,.28); border-radius: 999px; overflow: visible; }
  .progress-fill {
    position: absolute; left: 0; top: 0; bottom: 0; width: 0%;
    background: #fff; border-radius: 999px;
    box-shadow: 0 0 10px rgba(255,255,255,.45);
  }
  .progress-thumb {
    position: absolute; top: 50%; left: 0%;
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff; transform: translate(-50%,-50%);
    opacity: 0; transition: opacity .2s;
    box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .progress:hover .progress-thumb, .progress.dragging .progress-thumb { opacity: 1; }
  .ctrl-row { display: flex; align-items: center; gap: 6px; margin-top: 4px; }
  .ctrl-row .spacer { flex: 1; }
  .cbtn {
    width: 40px; height: 40px;
    border: none; background: transparent;
    color: #fff; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    cursor: pointer;
    transition: background .18s;
  }
  .cbtn:hover { background: rgba(255,255,255,.16); }
  .time { font-size: 12px; color: rgba(255,255,255,.9); font-variant-numeric: tabular-nums; letter-spacing: .02em; }
  .time-sep { color: rgba(255,255,255,.5); padding: 0 2px; }
  .vol-wrap { position: relative; display: flex; align-items: center; }
  .vol-slider {
    width: 0; opacity: 0;
    transition: width .25s ease, opacity .25s ease, margin .25s ease;
    margin-left: 0;
    -webkit-appearance: none; appearance: none;
    height: 4px; border-radius: 999px;
    background: rgba(255,255,255,.32);
    outline: none; cursor: pointer;
  }
  .vol-wrap:hover .vol-slider { width: 76px; opacity: 1; margin-left: 4px; }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 13px; height: 13px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.4);
  }
  .vol-slider::-moz-range-thumb { width: 13px; height: 13px; border: none; border-radius: 50%; background: #fff; }
  .set-wrap { position: relative; }
  .set-menu {
    position: absolute; right: 0; bottom: 46px;
    min-width: 168px;
    background: rgba(18,18,18,.94);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border: 1px solid var(--card-border);
    border-radius: 22px;
    padding: 8px;
    box-shadow: 0 18px 48px rgba(0,0,0,.4);
    z-index: 20;
  }
  .set-menu.is-hidden { display: none; }
  .set-title { font-size: 11px; letter-spacing: .14em; color: rgba(255,255,255,.55); padding: 6px 12px 8px; }
  .set-item {
    display: flex; align-items: center; justify-content: space-between;
    width: 100%; padding: 9px 12px;
    border: none; background: transparent;
    color: rgba(255,255,255,.92); font-size: 13px;
    border-radius: 16px; cursor: pointer;
    transition: background .15s;
  }
  .set-item:hover { background: rgba(255,255,255,.1); }
  .set-item .tick { color: #fff; opacity: 0; }
  .set-item.active .tick { opacity: 1; }
  .player-meta { margin-top: 18px; padding: 0 4px; }
  .player-meta .meta { font-size: 11px; letter-spacing: .2em; color: var(--muted); }
  .player-meta h3 { font-family: var(--serif); font-size: clamp(20px,2.6vw,26px); font-weight: 900; margin: 8px 0 4px; }
  .player-meta p { font-size: 13.5px; color: var(--muted); }
  .is-hidden { display: none !important; }
  /* 右键菜单（仿 PhasWer context-menu） */
  .context-menu {
    position: fixed; z-index: 400;
    min-width: 170px;
    padding: 6px;
    border-radius: 24px;
    background: rgba(255,255,255,.6);
    backdrop-filter: blur(8px) saturate(150%);
    -webkit-backdrop-filter: blur(8px) saturate(150%);
    border: 2px solid rgba(255,255,255,.3);
    box-shadow: 0 18px 48px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.5);
    transform: scale(.92);
    opacity: 0;
    transition: transform .15s cubic-bezier(.16,1,.3,1), opacity .15s ease;
  }
  .context-menu.show { transform: scale(1); opacity: 1; }
  [data-theme="dark"] .context-menu {
    background: rgba(30,32,40,.6);
    border-color: rgba(255,255,255,.18);
  }
  .context-item {
    display: flex; align-items: center; gap: 10px;
    width: 100%;
    padding: 9px 14px;
    border: none; background: transparent;
    font-family: inherit; font-size: 13.5px;
    color: var(--ink);
    border-radius: 16px;
    cursor: pointer;
    text-align: left;
    transition: background .15s ease;
  }
  .context-item:hover { background: rgba(0,0,0,.05); }
  [data-theme="dark"] .context-item:hover { background: rgba(255,255,255,.1); }
  .context-item:active { transform: scale(.96); }
  .ctx-sep { height: 1px; margin: 5px 8px; background: var(--line); }
  .ctx-icon { color: var(--muted); display: inline-flex; }
  /* 移动端 */
  /* 首屏播放器 */
  .watch {
    position: relative; z-index: 1;
    width: min(var(--maxw), calc(100vw - 32px));
    margin: 0 auto 0;
    padding: 22px;
    border-radius: var(--r-lg);
    background: var(--glass-bg);
    backdrop-filter: saturate(150%) blur(8px);
    -webkit-backdrop-filter: saturate(150%) blur(8px);
    border: 2px solid var(--card-border);
    box-shadow: var(--shadow-lg), inset 0 1px 0 rgba(255,255,255,.16);
  }
  .watch-title { display: flex; align-items: baseline; gap: 10px; margin-bottom: 16px; }
  .watch-title h2 { font-family: var(--serif); font-size: 22px; font-weight: 900; }
  .watch-title span { font-size: 11.5px; letter-spacing: .12em; color: var(--muted); }
  .ep-soon-tip {
    margin-top: 14px; text-align: center;
    font-size: 12.5px; letter-spacing: .08em; color: var(--muted);
  }
  /* 作品页更新日志 */
  .changelog-card { width: min(560px, 100%); padding: clamp(24px, 4vw, 36px); }
  .changelog-title {
    font-family: var(--sans); font-size: 20px; font-weight: 800;
    letter-spacing: .16em;
    display: flex; align-items: center; gap: 10px;
    margin-bottom: 24px;
  }
  .changelog-title::before {
    content: ""; width: 20px; height: 2px; border-radius: 2px;
    background: var(--accent-ui);
    box-shadow: 0 0 10px var(--hover-glow);
  }
  .cl-item {
    position: relative;
    padding: 14px 18px 14px 22px;
    border-radius: 18px;
    background: var(--chip-bg);
    border: 1px solid var(--card-border);
    margin-bottom: 10px;
    transition: transform .2s var(--ease-snap), background .2s;
  }
  .cl-item:hover { transform: translateX(3px); background: var(--chip-bg-hi); }
  .cl-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 6px; }
  .cl-ver { font-size: 13px; font-weight: 800; letter-spacing: .04em; color: var(--accent-ui); }
  .cl-date { font-size: 11px; letter-spacing: .1em; color: var(--muted); }
  .cl-title { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
  .cl-desc { font-size: 12.5px; line-height: 1.65; color: var(--muted); }

  @media (max-width: 760px) {
    .hero { padding-top: 118px; }
    .nav { padding: 8px 14px; }
    .search-sec { top: 72px; }
    .season-row { flex-direction: column; align-items: stretch; gap: 12px; padding: 16px; }
    .season-eps { justify-content: flex-start; }
    .watch { padding: 14px; }
    .watch-title { margin-bottom: 12px; }
  }
</style>
</head>

              <button class="set-item" data-speed="1.25"><span>1.25×</span><span class="tick"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>
              <button class="set-item" data-speed="1.5"><span>1.5×</span><span class="tick"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></button>

    </button>

<script>

  (function () {
    /* ===== 主题 ===== */
    var btn = document.getElementById("themeBtn");
    var mq = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
    function apply(t) {
      document.documentElement.setAttribute("data-theme", t);
      try { localStorage.setItem("yacc-theme", t); } catch (e) {}
    }
    var saved = null;
    try { saved = localStorage.getItem("yacc-theme"); } catch (e) {}
    if (!saved) saved = (mq && mq.matches) ? "dark" : "light";
    apply(saved === "light" ? "light" : "dark");
    if (btn) btn.addEventListener("click", function () {
      apply(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark");
    });

    /* ===== 选集数据（标题后续补充，搜索可命中） ===== */
    var EPISODES = [
      { s: "第一季", no: "01", code: "S1E01", title: "待公布", video: "video.mp4" },
      { s: "第一季", no: "花絮 01", code: "", title: "待公布", video: "" },
      { s: "第一季", no: "花絮 02", code: "", title: "待公布", video: "" },
      { s: "第二季", no: "01", code: "S2E01", title: "待公布", video: "" },
      { s: "第二季", no: "02", code: "S2E02", title: "待公布", video: "" },
      { s: "第二季", no: "03", code: "S2E03", title: "待公布", video: "" },
      { s: "第二季", no: "花絮 01", code: "", title: "待公布", video: "" },
      { s: "第二季", no: "花絮 02", code: "", title: "待公布", video: "" },
      { s: "番外", no: "01", code: "", title: "待公布", video: "" },
      { s: "番外", no: "02", code: "", title: "待公布", video: "" }
    ];
    var CN_NUM = ["零","一","二","三","四","五","六","七","八","九"];
    function cnNum(n) { return String(n).split("").map(function (c) { return CN_NUM[+c] || c; }).join(""); }
    function epAliases(ep) {
      var list = [ep.s, ep.no, ep.code, ep.title, ep.s + " " + ep.no];
      var m = ep.no.match(/^(\d+)$/);
      if (m) {
        list.push("第" + cnNum(+m[1]) + "集");
        list.push(m[1] + "集");
        list.push(ep.s + "第" + cnNum(+m[1]) + "集");
      }
      var sNum = ep.s.match(/^第([一二三四五六七八九\d]+)季/);
      if (sNum) {
        list.push(ep.s.replace(/^第[一二三四五六七八九\d]+季/, "") + "季" + (m ? cnNum(+m[1]) + "集" : ep.no));
      }
      return list.map(function (x) { return String(x).toLowerCase(); });
    }
    var GROUPS = ["第一季", "第二季", "番外"];
    function renderLibrary() {
      var list = document.getElementById("seasonList");
      list.innerHTML = GROUPS.map(function (g, gi) {
        var eps = EPISODES.filter(function (e) { return e.s === g; });
        var chips = eps.map(function (ep, ei) {
          var soon = ep.video ? "" : " soon";
          var dot = ep.video ? '<span class="play-dot" aria-hidden="true"></span>' : "";
          var label = ep.video && ep.code ? ep.code : ep.no;
          return '<button class="ep-chip' + soon + '" data-g="' + gi + '" data-i="' + ei + '"' + (ep.video ? '' : ' disabled') + '>' +
            dot +
            '<span>' + label + '</span>' +
          '</button>';
        }).join("");
        return '<div class="season-row" data-group="' + g + '" style="animation-delay:' + (gi * .08) + 's">' +
          '<div class="season-head"><span class="season-name">' + g + '</span><span class="season-count">' + eps.filter(function (e) { return e.video; }).length + ' / ' + eps.length + ' 已上线</span></div>' +
          '<div class="season-eps">' + chips + '</div>' +
        '</div>';
      }).join("");
    }
    renderLibrary();

    /* ===== 播放器（常驻） ===== */
    var video = document.getElementById("videoPlayer");
    var playerWrap = document.getElementById("playerWrap");
    var buffering = document.getElementById("playerBuffering");
    var cover = document.getElementById("playerCover");
    var coverMeta = document.getElementById("coverMeta");
    var coverTitle = document.getElementById("coverTitle");
    var centerPlay = document.getElementById("centerPlay");
    var controls = document.getElementById("controls");
    var timeCur = document.getElementById("timeCur");
    var timeDur = document.getElementById("timeDur");
    var progress = document.getElementById("progress");
    var progressFill = document.getElementById("progressFill");
    var progressThumb = document.getElementById("progressThumb");
    var btnPlay = document.getElementById("btnPlay");
    var icoPlay = document.getElementById("icoPlay");
    var icoPause = document.getElementById("icoPause");
    var btnVol = document.getElementById("btnVol");
    var icoVol = document.getElementById("icoVol");
    var icoMute = document.getElementById("icoMute");
    var volSlider = document.getElementById("volSlider");
    var btnSettings = document.getElementById("btnSettings");
    var setMenu = document.getElementById("setMenu");
    var btnFull = document.getElementById("btnFull");
    var hasVideo = false;
    function fmt(t) {
      if (!isFinite(t) || t < 0) t = 0;
      var m = Math.floor(t / 60), s = Math.floor(t % 60);
      return (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
    }
    function updatePlayUI() {
      icoPlay.classList.toggle("is-hidden", !video.paused && hasVideo);
      icoPause.classList.toggle("is-hidden", video.paused || !hasVideo);
    }
    function showCover(show, meta, title) {
      cover.classList.toggle("is-hidden", !show);
      centerPlay.classList.toggle("is-hidden", !show);
      if (show) { coverMeta.textContent = meta; coverTitle.textContent = title; }
    }
    function setEpisode(ep, scroll) {
      var soonTip = document.getElementById("soonTip");
      document.getElementById("watchMeta").textContent = ep.s + " · " + ep.no;
      document.getElementById("playerMeta").textContent = ep.s + " · " + ep.no;
      document.getElementById("playerTitle").textContent = ep.code ? "YACC · " + ep.code : "YACC · " + ep.s + " " + ep.no;
      document.getElementById("playerDesc").textContent = ep.title && ep.title !== "待公布" ? ep.title : "反对校园霸凌，人人有责。";
      soonTip.classList.add("is-hidden");
      hasVideo = !!ep.video;
      video.src = ep.video || "";
      buffering.classList.add("is-hidden");
      showCover(true, ep.s + " · " + ep.no, document.getElementById("playerTitle").textContent);
      controls.classList.add("is-hidden");
      video.classList.add("is-hidden");
      timeCur.textContent = "00:00"; timeDur.textContent = "00:00";
      progressFill.style.width = "0%"; progressThumb.style.left = "0%";
      video.load();
      updatePlayUI();
      if (!ep.video) soonTip.classList.remove("is-hidden");
      if (scroll !== false) document.getElementById("watch").scrollIntoView({ behavior: "smooth", block: "center" });
    }
    var epList = document.getElementById("seasonList");
    epList.addEventListener("click", function (e) {
      var chip = e.target.closest(".ep-chip");
      if (!chip || chip.disabled) return;
      var g = Number(chip.getAttribute("data-g"));
      var i = Number(chip.getAttribute("data-i"));
      var eps = EPISODES.filter(function (x) { return x.s === GROUPS[g]; });
      setEpisode(eps[i]);
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape") {
        if (!ctxMenu.hidden) hideCtx();
        if (setMenu && !setMenu.classList.contains("is-hidden")) setMenu.classList.add("is-hidden");
        hideResults();
      }
    });

    /* ===== 播放器控制 ===== */
    cover.addEventListener("click", function () {
      if (!hasVideo) return;
      cover.classList.add("is-hidden");
      centerPlay.classList.add("is-hidden");
      video.classList.remove("is-hidden");
      controls.classList.remove("is-hidden");
      video.play().catch(function () {});
    });
    centerPlay.addEventListener("click", function () {
      cover.click();
    });
    btnPlay.addEventListener("click", function () {
      if (video.paused) video.play(); else video.pause();
    });
    video.addEventListener("play", updatePlayUI);
    video.addEventListener("pause", updatePlayUI);
    video.addEventListener("waiting", function () { if (!video.paused) buffering.classList.remove("is-hidden"); });
    video.addEventListener("playing", function () { buffering.classList.add("is-hidden"); });
    video.addEventListener("timeupdate", function () {
      if (!video.duration) return;
      timeCur.textContent = fmt(video.currentTime);
      var p = video.currentTime / video.duration * 100;
      progressFill.style.width = p + "%";
      progressThumb.style.left = p + "%";
    });
    video.addEventListener("loadedmetadata", function () {
      timeDur.textContent = fmt(video.duration);
    });
    video.addEventListener("ended", function () { updatePlayUI(); });
    var dragging = false;
    function seekTo(clientX) {
      var r = progress.getBoundingClientRect();
      var p = Math.max(0, Math.min(1, (clientX - r.left) / r.width));
      if (video.duration) {
        video.currentTime = p * video.duration;
        progressFill.style.width = (p * 100) + "%";
        progressThumb.style.left = (p * 100) + "%";
      }
    }
    progress.addEventListener("pointerdown", function (e) {
      dragging = true;
      progress.classList.add("dragging");
      progress.setPointerCapture(e.pointerId);
      seekTo(e.clientX);
    });
    progress.addEventListener("pointermove", function (e) { if (dragging) seekTo(e.clientX); });
    progress.addEventListener("pointerup", function () { dragging = false; progress.classList.remove("dragging"); });
    progress.addEventListener("pointercancel", function () { dragging = false; progress.classList.remove("dragging"); });
    btnVol.addEventListener("click", function () {
      video.muted = !video.muted;
      icoVol.classList.toggle("is-hidden", video.muted);
      icoMute.classList.toggle("is-hidden", !video.muted);
      volSlider.value = video.muted ? 0 : video.volume;
    });
    volSlider.addEventListener("input", function () {
      video.volume = Number(volSlider.value);
      video.muted = video.volume === 0;
      icoVol.classList.toggle("is-hidden", video.muted);
      icoMute.classList.toggle("is-hidden", !video.muted);
    });
    btnSettings.addEventListener("click", function (e) {
      e.stopPropagation();
      setMenu.classList.toggle("is-hidden");
    });
    document.addEventListener("click", function (e) {
      if (setMenu && !setMenu.classList.contains("is-hidden") && !e.target.closest(".set-wrap")) setMenu.classList.add("is-hidden");
    });
    setMenu.addEventListener("click", function (e) {
      var it = e.target.closest(".set-item");
      if (!it) return;
      var sp = Number(it.getAttribute("data-speed"));
      if (sp) {
        video.playbackRate = sp;
        setMenu.querySelectorAll(".set-item").forEach(function (x) { x.classList.toggle("active", x === it); });
      }
    });
    btnFull.addEventListener("click", function () {
      if (document.fullscreenElement) document.exitFullscreen();
      else playerWrap.requestFullscreen && playerWrap.requestFullscreen();
    });

    /* ===== 搜索：结果浮层 ===== */
    var searchInput = document.getElementById("searchInput");
    var searchClear = document.getElementById("searchClear");
    var searchResults = document.getElementById("searchResults");
    var library = document.getElementById("library");
    var noResult = document.getElementById("noResult");
    var searchTimer = null;
    function renderResults(q) {
      var list = [];
      EPISODES.forEach(function (ep, idx) {
        if (epAliases(ep).some(function (a) { return a.indexOf(q) !== -1; })) list.push({ ep: ep, idx: idx });
      });
      if (list.length === 0) {
        searchResults.innerHTML = '<div class="sr-empty">没有找到相关内容，试试「第一集」「花絮」或集数编号</div>';
        searchResults.classList.add("show");
        return;
      }
      searchResults.innerHTML = list.map(function (r) {
        var ep = r.ep;
        var noTxt = ep.no.indexOf("花絮") !== -1 ? ep.no : "第" + cnNum(parseInt(ep.no, 10) || 0) + "集";
        var nm = ep.s + " · " + (ep.title && ep.title !== "待公布" ? ep.title : noTxt);
        var tag = ep.video ? '<span class="sr-tag on">' + (ep.code || "可播放") + '</span>' : '<span class="sr-tag">敬请期待</span>';
        return '<button class="search-result-item" data-idx="' + r.idx + '" role="option">' +
          '<span class="sr-name">' + nm + '</span>' + tag +
        '</button>';
      }).join("");
      searchResults.classList.add("show");
    }
    function hideResults() {
      searchResults.classList.remove("show");
    }
    searchInput.addEventListener("input", function () {
      var q = searchInput.value.trim().toLowerCase();
      searchClear.classList.toggle("show", q.length > 0);
      if (searchTimer) clearTimeout(searchTimer);
      if (!q) { hideResults(); return; }
      searchTimer = setTimeout(function () { renderResults(q); }, 220);
    });
    searchResults.addEventListener("click", function (e) {
      var it = e.target.closest(".search-result-item");
      if (!it) return;
      var ep = EPISODES[Number(it.getAttribute("data-idx"))];
      hideResults();
      setEpisode(ep);
    });
    document.addEventListener("click", function (e) {
      if (!e.target.closest(".search-wrap") && !e.target.closest("#ctxMenu")) hideResults();
    });
    searchClear.addEventListener("click", function () {
      searchInput.value = "";
      searchClear.classList.remove("show");
      hideResults();
      searchInput.focus();
    });

    /* ===== 搜索栏：下滑隐藏 ===== */
    var searchSec = document.querySelector(".search-sec");
    var lastY = window.scrollY || 0;
    var ticking = false;
    window.addEventListener("scroll", function () {
      if (ticking) return;
      ticking = true;
      requestAnimationFrame(function () {
        var y = window.scrollY || 0;
        if (y > lastY + 6) searchSec.classList.add("hide");
        else if (y < lastY - 6) searchSec.classList.remove("hide");
        lastY = y;
        ticking = false;
      });
    }, { passive: true });

    /* ===== 作品页更新日志 ===== */
    var WORKS_LOG = [
      { date: "2026.09.13", version: "v1.0.1", title: "界面与交互优化", desc: "优化界面显示UI，新增更新日志，简化集数显示。" },
      { date: "2026.09.13", version: "v1.0.0", title: "作品页独立", desc: "作品页独立，制作框架及UI，新增搜索栏，允许搜索所上传集数。" }
    ];
    var logModal = document.getElementById("logModal");
    function openWorksLog() {
      var list = document.getElementById("worksLogList");
      list.innerHTML = WORKS_LOG.map(function (item) {
        return '<div class="cl-item">' +
          '<div class="cl-head"><span class="cl-ver">' + item.version + '</span><span class="cl-date">' + item.date + '</span></div>' +
          '<div class="cl-title">' + item.title + '</div>' +
          '<div class="cl-desc">' + item.desc + '</div>' +
        '</div>';
      }).join("");
      logModal.hidden = false;
      logModal.classList.remove("open");
      void logModal.offsetWidth;
      requestAnimationFrame(function () { logModal.classList.add("open"); });
    }
    function closeWorksLog() {
      logModal.classList.remove("open");
      var t = setTimeout(function () { logModal.hidden = true; }, 300);
      if (logModal._timer) clearTimeout(logModal._timer);
      logModal._timer = t;
    }
    document.getElementById("worksLogBtn").addEventListener("click", openWorksLog);
    logModal.addEventListener("click", function (e) {
      if (e.target.closest("[data-close]")) closeWorksLog();
    });
    document.addEventListener("keydown", function (e) {
      if (e.key === "Escape" && !logModal.hidden) closeWorksLog();
    });

    /* ===== 右键菜单（仿 PhasWer context-menu） ===== */
    var ctxMenu = document.getElementById("ctxMenu");
    function showCtx(x, y) {
      ctxMenu.hidden = false;
      ctxMenu.classList.remove("show");
      requestAnimationFrame(function () {
        var r = ctxMenu.getBoundingClientRect();
        var px = Math.max(8, Math.min(x, window.innerWidth - r.width - 8));
        var py = Math.max(8, Math.min(y, window.innerHeight - r.height - 8));
        ctxMenu.style.left = px + "px";
        ctxMenu.style.top = py + "px";
        requestAnimationFrame(function () { ctxMenu.classList.add("show"); });
      });
    }
    function hideCtx() {
      ctxMenu.classList.remove("show");
      var t = setTimeout(function () { ctxMenu.hidden = true; }, 160);
      if (ctxMenu._timer) clearTimeout(ctxMenu._timer);
      ctxMenu._timer = t;
    }
    searchBox.addEventListener("contextmenu", function (e) {
      e.preventDefault();
      showCtx(e.clientX, e.clientY);
    });
    document.addEventListener("click", function (e) {
      if (!ctxMenu.hidden && !e.target.closest("#ctxMenu")) hideCtx();
    });
    document.addEventListener("contextmenu", function (e) {
      if (!ctxMenu.hidden && !e.target.closest("#ctxMenu") && !e.target.closest("#searchBox")) hideCtx();
    });
    ctxMenu.addEventListener("click", function (e) {
      var it = e.target.closest(".context-item");
      if (!it) return;
      var cmd = it.getAttribute("data-cmd");
      var inp = searchInput;
      if (cmd === "cut") { document.execCommand("cut"); }
      else if (cmd === "copy") { document.execCommand("copy"); }
      else if (cmd === "paste") { navigator.clipboard && navigator.clipboard.readText().then(function (t) { if (t) { inp.value = t; inp.dispatchEvent(new Event("input")); } }).catch(function () {}); }
      else if (cmd === "selectall") { inp.select(); }
      else if (cmd === "clear") { inp.value = ""; inp.dispatchEvent(new Event("input")); inp.focus(); }
      hideCtx();
    });

    /* 初始加载第一集 */
    setEpisode(EPISODES[0], false);
  })();
</script>
</body>
</html>
