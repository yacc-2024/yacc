<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>yacc · 离线</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        background: #fafafa;
        color: #16161a;
        padding: 24px;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #000; color: #f5f5f7; }
      }
      .box { text-align: center; max-width: 320px; }
      .brand { font-size: 30px; font-weight: 700; letter-spacing: -1.2px; }
      p { color: #8a8a8e; line-height: 1.6; font-size: 14px; }
      button {
        margin-top: 20px;
        padding: 12px 24px;
        border: 0;
        border-radius: 999px;
        background: #16161a;
        color: #fff;
        font-size: 15px;
        font-weight: 600;
      }
      @media (prefers-color-scheme: dark) {
        button { background: #f5f5f7; color: #000; }
      }
    </style>
  </head>
  <body>
    <div class="box">
      <div class="brand">yacc</div>
      <p>现在没有网络。已经看过页面还能翻，但评论和视频需要联网。</p>
      <button onclick="location.reload()">重试</button>
    </div>
  </body>
</html>
